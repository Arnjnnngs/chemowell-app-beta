<title>ChemoWell</title>
<!-- Capacitor bridge (native APK build only). On the web/PWA build these load a no-op JS-only
     fallback (Capacitor.isNativePlatform() === false) so nothing here changes web behavior at all
     — see isNativeApp() below. If blocked or offline, window.Capacitor stays undefined and every
     call site already guards for that, so the app degrades to normal web behavior either way. -->
<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@8.4.2/dist/capacitor.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/local-notifications@8.2.1/dist/plugin.js"></script>
<!-- v47 (Aaron-reported: exported CSV and the printable report went nowhere on the installed APK):
     browser-only download/print tricks (an <a download> click, window.open()+print()) don't reach
     Android's real file system or print pipeline from inside the native WebView -- these two bridge
     the same way notifications already do, letting export/print hand off to the OS's own native
     share sheet instead. Same no-op-on-web guarantee as the two plugins above (isNativeApp() gates
     every call site; the web/PWA build's behavior is untouched). -->
<!-- app-v51 fix (found by the Zero Day Auditor during app-v50's retroactive audit, root-caused and
     the fix pre-documented in BACKLOG.md before this): @capacitor/filesystem@8.1.2's own UMD bundle
     ends with `})({}, capacitorExports, synapse);`, referencing a bare `synapse` global that a plain
     CDN <script> include never provides -- this threw ReferenceError: synapse is not defined on every
     single page load and silently kept Filesystem out of window.Capacitor.Plugins entirely, which
     very plausibly regressed the app-v47 native CSV/PDF export share-sheet fix back to its original
     bug (fails closed via the app's own null-safe fallback, so no crash, no user-visible error --
     just silently not working). This shim must load BEFORE the filesystem script below. It's a no-op:
     exposeSynapse() only wires up a rarely-used synchronous native-bridge proxy that ordinary async
     Filesystem.writeFile()/Share.share() calls never touch. -->
<script>window.synapse = { exposeSynapse: function(){} };</script>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/filesystem@8.1.2/dist/plugin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/share@8.0.1/dist/plugin.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--safe-top:env(safe-area-inset-top,0px);}
html,body{height:100%;overscroll-behavior-y:none;}
body{-webkit-font-smoothing:antialiased;background:#FAF7F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;color:#2A2127;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none;}
button:active{transform:translateY(1px);}
input{-webkit-tap-highlight-color:transparent;font-family:inherit;}
input:focus{outline:2px solid #BF4C1A;outline-offset:0;border-color:#BF4C1A;}
/* v23 (Aaron-requested): native <select> elements weren't covered by the same font-family:inherit
   reset button/input already get, so every dropdown box silently fell back to the OS's default UI
   font instead of the app's own -- this one rule fixes that everywhere in one place. The rounded
   corners / light background / custom arrow (replacing the dark, square native one) are applied
   per-select via SELECT_ARROW_STYLE (see selectStyleFix helper) since those also need per-instance
   sizing, but the font fix belongs globally so no dropdown can be missed. */
select{font-family:inherit;-webkit-tap-highlight-color:transparent;}
select:focus{outline:2px solid #BF4C1A;outline-offset:0;border-color:#BF4C1A;}
button:focus-visible, [role="button"]:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #BF4C1A; outline-offset: 2px; }
::placeholder{color:#7A6E76 !important;opacity:1;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#root{min-height:100vh;}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes tourPulse{0%{outline-color:rgba(46,125,79,1)}50%{outline-color:rgba(46,125,79,0.75)}100%{outline-color:rgba(46,125,79,1)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important}}
</style>

<body>
<div id="root"></div>

<script type="module">

// ---------- On-device storage — no cloud, no accounts ----------
// All data lives in this device's localStorage. Nothing is ever sent to a server.
const TEST_MODE = true; // APP BETA — enables the date-override controls + simulated purchases

// ---- Optional "leave a tip" prompt (Owner-requested, app-v32) ----
// A quiet, dismissible card offering an optional one-time gift to the developer, shown at most once
// every 20 logged entries, never as a blocking modal, never repeated once someone opts out. See
// supportPromptDue()/renderToday() near the bottom of the Today section.
// v29 first shipped this framed as "help keep the app free and ad-free" — the Owner correctly
// flagged that as false and contradictory (ChemoWell already has paid Free/Plus/Pro tiers). This
// version keeps the same non-intrusive mechanics but drops every claim about "free," ads, or
// necessity — it's simply an optional way to say thanks, unrelated to the tiers and unrelated to
// whether the app keeps working either way.
// TODO(Aaron): replace with your real donation page link (Ko-fi, Stripe Payment Link, etc.).
// SUPPORT_LINK_READY derives off the URL itself (true once it no longer contains "REPLACE") rather
// than a second hand-maintained flag, so there's no way for the two to drift out of sync — the
// banner is safely disabled (never rendered, checked in supportPromptDue()) until this one line is
// swapped for a real link, then it turns on automatically with no other code change needed.
const SUPPORT_LINK = 'https://ko-fi.com/REPLACE_WITH_REAL_LINK';
const SUPPORT_LINK_READY = SUPPORT_LINK.indexOf('REPLACE') === -1;

// ---- Safe-area top (v15) ----
// Android WebViews (incl. the Capacitor shell on edge-to-edge devices) draw under the status bar
// but report env(safe-area-inset-top)=0. Probe env(); only when it measures 0 inside a WebView do
// we substitute a 28px literal. setProperty REPLACES the var — env and fallback never stack.
(function initSafeTop() {
  try {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;';
    document.documentElement.appendChild(probe);
    const measured = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    probe.remove();
    const isWebView = /; wv\)/.test(navigator.userAgent) || (typeof isNativeApp === 'function' && isNativeApp());
    if (isWebView && measured === 0) document.documentElement.style.setProperty('--safe-top', '28px');
  } catch (e) {}
})();
// See the toast's own comment in render(). Only FIXED-positioned furniture belongs here: this lifts
// the toast by a constant, which can clear an element whose position is also constant and cannot
// chase one that scrolls. Today that is one element, the Reports "Back" pill.
function toastNeedsLift() {
  return state.view === 'reports' && !!state.reportsView;
}
function safeTopPx() {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'));
  return isNaN(v) ? 0 : v;
}

// True only inside the Capacitor native shell (android/), never in the installed PWA or a plain
// browser tab. Gates every native-only code path (real local notifications) so the web build's
// behavior is byte-for-byte unchanged. Wrapped in try/catch: if the CDN bridge script above is
// blocked or hasn't loaded yet, this safely reports "not native" rather than throwing (v14).
function isNativeApp() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
  catch (e) { return false; }
}

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ---- Plans & licensing (Free / Plus / Pro) — device-wide, not per profile ----
const LICENSE_KEY = 'chemowell-app-license-v1';
function getLicense() { return loadJSON(LICENSE_KEY, { tier: 'free' }); }
function setLicense(patch) { saveJSON(LICENSE_KEY, { ...getLicense(), ...patch }); }
function tierLimit(tier) { return tier === 'pro' ? Infinity : tier === 'plus' ? 3 : 1; }
function tierLabel(tier) { return tier === 'pro' ? 'Pro' : tier === 'plus' ? 'Plus' : 'Free'; }

// ---- Profiles: each patient gets fully separate on-device storage ----
const PROFILES_KEY = 'chemowell-app-profiles-v1';
(function initProfiles() {
  if (loadJSON(PROFILES_KEY, null)) return;
  const ps = { list: [{ id: 'p1', name: '', createdAt: Date.now() }], activeId: 'p1' };
  // One-time migration of pre-profile (app-v1..v4) single-profile data into profile p1.
  const legacy = [
    ['chemowell-app-entries-v1', 'chemowell-app-p-p1-entries-v1'],
    ['chemowell-app-prefs-v1', 'chemowell-app-p-p1-prefs-v1'],
    ['chemowell-app-medication-config-v1', 'chemowell-app-p-p1-med-v1']
  ];
  for (const [oldKey, newKey] of legacy) {
    const v = localStorage.getItem(oldKey);
    if (v != null) { localStorage.setItem(newKey, v); localStorage.removeItem(oldKey); }
  }
  const migratedPrefs = loadJSON('chemowell-app-p-p1-prefs-v1', {});
  if (migratedPrefs.patientName) ps.list[0].name = migratedPrefs.patientName;
  saveJSON(PROFILES_KEY, ps);
})();
function profilesState() { return loadJSON(PROFILES_KEY, { list: [{ id: 'p1', name: '', createdAt: 0 }], activeId: 'p1' }); }
const ACTIVE_PROFILE_ID = (function () { const ps = profilesState(); return ps.list.some(p => p.id === ps.activeId) ? ps.activeId : ps.list[0].id; })();
let newProfileNameDraft = '';
// Deliberately WITHOUT the tier check in createProfile(). Free caps at one profile, and a restore
// that needs a second one would otherwise be blocked -- which means holding a person's own medical
// records hostage to a $4.99 upgrade. The cap governs CREATING profiles. It does not govern getting
// your own data back, and it never will.
function createProfileForRestore(name) {
  const ps = profilesState();
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  ps.list.push({ id: id, name: name || '', createdAt: Date.now() });
  saveJSON(PROFILES_KEY, ps);
  return id;
}

// Writes a bundle into ONE profile, by profile id, additively. Never deletes, never overwrites an
// existing record, and loading the same file twice is a no-op -- which is what makes it safe to
// hand someone a restore button at the worst moment of their week.
// The file input is created once and reused. Rebuilding it per tap loses the change listener on
// some Android webviews, which produced a picker that opened and then did nothing.
let cwBkInput = null;
function cwBkEnsureInput() {
  if (cwBkInput) return cwBkInput;
  cwBkInput = document.createElement('input');
  cwBkInput.type = 'file';
  cwBkInput.accept = 'application/json,.json';
  cwBkInput.style.display = 'none';
  cwBkInput.addEventListener('change', () => {
    const f = cwBkInput.files && cwBkInput.files[0];
    cwBkInput.value = '';                       // so choosing the SAME file twice still fires
    if (f) cwBkReadChosenFile(f);
  });
  document.body.appendChild(cwBkInput);
  return cwBkInput;
}
function cwBkPickFile() {
  if (state.bkBusy) return;
  setState({ bkNotice: null, bkPending: null, bkLocked: null, bkUnlockPw: '' });
  try { cwBkEnsureInput().click(); }
  catch (e) { setState({ bkNotice: { kind: 'bad', message: "This phone wouldn't open the file picker. Nothing was changed." } }); }
}
async function cwBkReadChosenFile(file) {
  setState({ bkBusy: true, bkNotice: null, bkPending: null, bkLocked: null });
  try {
    if (file && typeof file.size === 'number' && file.size > CW_BK_MAX_BYTES) {
      setState({ bkNotice: { kind: 'bad', message: 'That file is far too big to be a ChemoWell backup. Nothing was changed.' } });
      return;
    }
    let text = '';
    try { text = await file.text(); }
    catch (e) {
      setState({ bkNotice: { kind: 'bad', message: "Couldn't read that file. Nothing was changed — try choosing it again." } });
      return;
    }
    let parsed = null;
    try { parsed = JSON.parse(text); }
    catch (e) {
      setState({ bkNotice: { kind: 'bad', message: "That doesn't look like a ChemoWell backup. Choose the file whose name ends in .json — the CSV and the printable report can't be loaded back." } });
      return;
    }
    // A protected file cannot be inspected at all until it is opened, so the destination question
    // has to wait behind the password rather than being asked against a manifest that isn't
    // readable yet.
    if (cwBkIsEncrypted(parsed)) {
      setState({ bkLocked: { env: parsed, createdAt: Number(parsed.createdAt) || 0 }, bkUnlockPw: '' });
      return;
    }
    cwBkAcceptParsed(parsed);
  } finally {
    setState({ bkBusy: false });
  }
}

// Everything from "we have a parsed backup object" onward, shared by the plain path and by the
// path that had to decrypt first. Returns true when a destination choice is now on screen.
function cwBkAcceptParsed(parsed) {
  let bundle = null;
  try { bundle = cwBkReadIncoming(parsed); }
  catch (err) {
    setState({ bkNotice: { kind: 'bad', message: (err && err.message === 'newer-format')
      ? 'This backup was made by a newer version of ChemoWell than the one on this phone. Update the app first — loading it here could leave part of it out without saying so.'
      : "That doesn't look like a ChemoWell backup. Choose the file whose name ends in .json." } });
    return false;
  }
  const total = bundle.entries.length + bundle.appointments.length + bundle.notes.length;
  const nMeds = (bundle.medications && Array.isArray(bundle.medications.meds)) ? bundle.medications.meds.length : 0;
  if (!total && !nMeds) {
    setState({ bkNotice: { kind: 'bad', message: 'That backup file is empty. Nothing was changed.' } });
    return false;
  }
  // Preselect by whether the file is about the person whose profile is open. Never decide -- a
  // wrong merge mixes two patients' records together, which is far worse than an extra profile.
  const here = String((getPrefsDB().patientName || '')).trim().toLowerCase();
  const there = String(bundle.profileName || '').trim().toLowerCase();
  const sameName = !!here && !!there && here === there;
  setState({ bkPending: { bundle: bundle, total: total, nMeds: nMeds, dest: sameName ? 'merge' : 'new' } });
  return true;
}

async function cwBkUnlock() {
  const lock = state.bkLocked;
  if (!lock || state.bkBusy) return;
  const pw = String(state.bkUnlockPw || '');
  if (!pw) { setState({ bkNotice: { kind: 'bad', message: 'Type the password this file was protected with.' } }); return; }
  setState({ bkBusy: true, bkNotice: null });
  let payload = null;
  try {
    payload = await cwBkDecryptEnvelope(lock.env, pw);
  } catch (err) {
    const m = (err && err.message) || '';
    setState({ bkBusy: false, bkNotice: { kind: 'bad', message:
      m === 'unsupported-cipher'
        ? 'This protected backup was made by a newer version of ChemoWell than the one on this phone. Update the app first — this version cannot open it.'
        : (m === 'damaged'
          ? 'That file is damaged and cannot be opened, even with the right password. Use another copy of the backup if you have one. Nothing was changed.'
          : "That password did not open the file. Nothing was changed — check for a capital letter or a space at the end, and try again.") } });
    return;
  }
  setState({ bkBusy: false, bkLocked: null, bkUnlockPw: '' });
  cwBkAcceptParsed(payload);
}

async function cwBkConfirmRestore() {
  const p = state.bkPending;
  if (!p || state.bkBusy) return;
  setState({ bkBusy: true });
  try {
    const b = p.bundle;
    if (p.dest === 'new') {
      const id = createProfileForRestore(b.profileName || '');
      // Snapshot BEFORE the first write. For a new profile every key is absent, and that absence is
      // exactly what undo needs in order to remove it again cleanly.
      if (!cwSaveUndoPoint(id, b.profileName || '', true)) {
        const ps0 = profilesState();
        ps0.list = ps0.list.filter((x) => x.id !== id);
        saveJSON(PROFILES_KEY, ps0);
        setState({ bkPending: null, bkNotice: { kind: 'bad', message: 'There is not enough free space on this phone to save an undo point, so nothing was restored. Free up some space and try again — restoring without a way back is not worth the risk.' } });
        return;
      }
      const r = cwBkApplyTo(id, b, { forceMeds: true });   // a brand-new profile has nothing to protect
      const ps = profilesState(); ps.activeId = id; saveJSON(PROFILES_KEY, ps);
      // Reloading is how this app switches profiles -- every storage key is bound at module load.
      setToast('Restored into a new profile — opening it now');
      setTimeout(() => location.reload(), 700);
      return;
    }
    if (!cwSaveUndoPoint(ACTIVE_PROFILE_ID, String(getPrefsDB().patientName || ''), false)) {
      setState({ bkPending: null, bkNotice: { kind: 'bad', message: 'There is not enough free space on this phone to save an undo point, so nothing was restored. Free up some space and try again — restoring without a way back is not worth the risk.' } });
      return;
    }
    const r = cwBkApplyTo(ACTIVE_PROFILE_ID, b, null);
    const bits = [];
    const moved = r.entries + r.appointments + r.notes;
    bits.push(moved === 0
      ? 'Nothing new to add — everything in that file was already in this profile.'
      : ('Restored ' + moved + ' record' + (moved === 1 ? '' : 's') + '.'));
    if (r.meds === 'restored') bits.push('The medication list came back too.');
    if (r.meds === 'skipped') {
      bits.push('The medication list was left exactly as it is — this profile already has one. The file also holds ' +
        r.skippedMeds + ' medication' + (r.skippedMeds === 1 ? '' : 's') + '.');
    }
    if (r.prefs) bits.push('Settings that were not already set were filled in.');
    bits.push('Nothing was removed, and loading the same file again is safe.');
    setState({ bkPending: null, bkNotice: { kind: 'ok', message: bits.join(' ') } });
    setToast(moved ? ('Restored ' + moved + ' record' + (moved === 1 ? '' : 's')) : 'Nothing new to restore');
    setTimeout(() => location.reload(), 900);
  } catch (err) {
    console.error('[restore]', err);
    setState({ bkPending: null, bkNotice: { kind: 'bad', message: 'Something went wrong part-way through. Nothing was removed — load the file again; doing it twice is safe.' } });
  } finally {
    setState({ bkBusy: false });
  }
}

// ---- UNDO (app-v62) ----
// One slot, most recent restore only. A stack of undos on a phone is a way to put the wrong thing
// back twice.
// ================================================================================================
// THE LOG (app-v64) — what went wrong, and what should be better
// Aaron: "we were also going to build in a logger for errors or improvements."
// This app has no backend and no crash reporting, which means that until now a beta tester hitting
// a real error had exactly one way to tell anyone: remember it, and describe it later in their own
// words. So the app writes down its own failures as they happen, and gives the person a place to
// add theirs, and one button that turns the whole lot into a file they can send.
// Deliberately NOT profile-scoped: a fault belongs to the install, not to a patient, and scoping it
// per profile would scatter the record of one bug across however many profiles were open when it
// happened. Nothing here is ever sent anywhere on its own — it is a file, produced when asked for.
// ================================================================================================
const CW_LOG_KEY = 'chemowell-app-log-v1';
const CW_LOG_MAX = 100;          // a ring buffer: the newest 100 events, oldest dropped first
const CW_LOG_MAX_TEXT = 2000;    // one runaway stack must not fill the whole allowance
const CW_LOG_DEDUPE_MS = 60000;  // a render error repeating every tick is one fault, not sixty
function cwLogRead() {
  try {
    const raw = localStorage.getItem(CW_LOG_KEY);
    if (!raw) return [];
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v.filter((e) => e && typeof e === 'object' && !Array.isArray(e)) : [];
  } catch (e) { return []; }
}
// Not a plain ring buffer, and the gate is why. A person types a careful description of what went
// wrong; the fault they are describing then throws on every render tick; and a straight
// slice(-MAX) evicts their words within seconds, leaving only the machine's account of an event
// that already had a human one. So trimming drops the OLDEST ERRORS first and takes what the
// person wrote last -- the half nobody can reconstruct.
function cwLogTrim(list) {
  if (list.length <= CW_LOG_MAX) return list;
  const mine = list.filter((e) => e.kind !== 'error');
  const keptMine = mine.slice(-CW_LOG_MAX);
  const room = Math.max(0, CW_LOG_MAX - keptMine.length);
  const keptErrs = list.filter((e) => e.kind === 'error').slice(-room);
  // Identity, not ids: two entries created in the same millisecond could in principle collide on a
  // generated id, and a set membership test that drops the wrong one is silent.
  const keep = new Set(keptMine.concat(keptErrs));
  return list.filter((e) => keep.has(e));
}
function cwLogWrite(list) {
  try { localStorage.setItem(CW_LOG_KEY, JSON.stringify(cwLogTrim(list))); return true; }
  catch (e) { return false; }
}
function cwLogClear() { try { localStorage.removeItem(CW_LOG_KEY); } catch (e) {} }
// Every path in here is wrapped. A logger that throws while recording a fault turns one broken
// screen into a broken app, which is the exact opposite of the job.
function cwLogAdd(kind, text, where) {
  try {
    const now = Date.now();
    const t = String(text == null ? '' : text).slice(0, CW_LOG_MAX_TEXT);
    if (!t) return null;
    const w = String(where == null ? '' : where).slice(0, 200);
    const list = cwLogRead();
    // Automatic entries dedupe; something the person typed never does, even word for word.
    if (kind === 'error') {
      for (let i = list.length - 1; i >= 0 && i >= list.length - 12; i--) {
        const e = list[i];
        if (e.kind === 'error' && e.text === t && e.where === w && (now - (Number(e.ts) || 0)) < CW_LOG_DEDUPE_MS) {
          e.count = (Number(e.count) || 1) + 1;
          e.lastTs = now;
          cwLogWrite(list);
          return e;
        }
      }
    }
    const entry = { id: 'log_' + now.toString(36) + '_' + Math.random().toString(36).slice(2, 8),
                    kind: kind, text: t, where: w, ts: now, count: 1, app: APP_VERSION };
    list.push(entry);
    cwLogWrite(list);
    return entry;
  } catch (e) { return null; }
}
// Installed once, at module scope. Both handlers are passive listeners -- neither preventDefault()s
// nor swallows anything, so the browser still reports the error exactly as it would have.
function cwInstallErrorLog() {
  try {
    window.addEventListener('error', (ev) => {
      try {
        const msg = (ev && ev.message) ? ev.message : 'Unknown error';
        const at = (ev && ev.filename) ? ((ev.filename.split('/').pop() || '') + ':' + (ev.lineno || 0)) : '';
        cwLogAdd('error', msg + (ev && ev.error && ev.error.stack ? ('\n' + String(ev.error.stack).split('\n').slice(0, 4).join('\n')) : ''), at || ('screen: ' + state.view));
      } catch (e) {}
    });
    window.addEventListener('unhandledrejection', (ev) => {
      try {
        const r = ev && ev.reason;
        const msg = (r && r.message) ? r.message : String(r);
        cwLogAdd('error', 'Unfinished background task: ' + msg + ((r && r.stack) ? ('\n' + String(r.stack).split('\n').slice(0, 4).join('\n')) : ''), 'screen: ' + state.view);
      } catch (e) {}
    });
  } catch (e) {}
}
cwInstallErrorLog();

const CW_UNDO_KEY = 'chemowell-app-restore-undo-v1';
const CW_PROFILE_SUFFIXES = ['entries-v1', 'appts-v1', 'notes-v1', 'med-v1', 'prefs-v1'];

// Copies every key the profile owns, verbatim, as raw strings -- not parsed and re-serialised.
// Round-tripping through JSON would silently normalise anything the app does not currently model,
// and an undo that returns *almost* what was there is worse than no undo at all.
function cwSnapshotProfile(profileId) {
  const snap = {};
  CW_PROFILE_SUFFIXES.forEach((s) => {
    const k = 'chemowell-app-p-' + profileId + '-' + s;
    const v = localStorage.getItem(k);
    snap[s] = (v === null) ? null : v;      // null means "this key did not exist", which undo must recreate
  });
  return snap;
}

// Returns true only if the snapshot is genuinely saved and readable back. A snapshot that silently
// failed to write is the exact trap this feature exists to avoid, so it is verified, not assumed.
function cwSaveUndoPoint(profileId, profileName, createdProfile) {
  const point = {
    at: Date.now(),
    profileId: profileId,
    profileName: String(profileName || ''),
    createdProfile: !!createdProfile,
    keys: cwSnapshotProfile(profileId)
  };
  try {
    localStorage.setItem(CW_UNDO_KEY, JSON.stringify(point));
    const back = localStorage.getItem(CW_UNDO_KEY);
    return !!back && JSON.parse(back).at === point.at;
  } catch (e) {
    // Quota, private mode, anything. Do NOT swallow it -- the caller refuses to restore.
    try { localStorage.removeItem(CW_UNDO_KEY); } catch (e2) {}
    return false;
  }
}
function cwGetUndoPoint() {
  try {
    const raw = localStorage.getItem(CW_UNDO_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return (p && p.profileId && p.keys) ? p : null;
  } catch (e) { return null; }
}
function cwClearUndoPoint() { try { localStorage.removeItem(CW_UNDO_KEY); } catch (e) {} }

function cwUndoRestore() {
  const p = cwGetUndoPoint();
  if (!p) return;
  try {
    // Put the exact bytes back. A key that did not exist before is REMOVED again rather than left
    // holding an empty array, so the profile is byte-for-byte what it was.
    CW_PROFILE_SUFFIXES.forEach((s) => {
      const k = 'chemowell-app-p-' + p.profileId + '-' + s;
      if (p.keys[s] === null || p.keys[s] === undefined) localStorage.removeItem(k);
      else localStorage.setItem(k, p.keys[s]);
    });
    // If the restore created a profile, the profile itself is part of what gets undone.
    if (p.createdProfile) {
      const ps = profilesState();
      ps.list = ps.list.filter((x) => x.id !== p.profileId);
      if (!ps.list.length) ps.list = [{ id: 'p1', name: '', createdAt: Date.now() }];
      if (ps.activeId === p.profileId) ps.activeId = ps.list[0].id;
      saveJSON(PROFILES_KEY, ps);
      CW_PROFILE_SUFFIXES.forEach((s) => { try { localStorage.removeItem('chemowell-app-p-' + p.profileId + '-' + s); } catch (e) {} });
    }
    cwClearUndoPoint();
    setToast('Restore undone — everything is back as it was');
    setTimeout(() => location.reload(), 700);
  } catch (err) {
    console.error('[undo]', err);
    setState({ bkNotice: { kind: 'bad', message: 'Could not undo automatically. Nothing else was changed — your backup file will still load if you need it.' } });
  }
}

function cwBkApplyTo(profileId, bundle, opts) {
  const K = (suffix) => 'chemowell-app-p-' + profileId + '-' + suffix;
  const res = { entries: 0, appointments: 0, notes: 0, meds: 'none', prefs: false, skippedMeds: 0 };

  const e = cwBkMergeById(loadJSON(K('entries-v1'), []), bundle.entries);
  saveJSON(K('entries-v1'), e.list); res.entries = e.added;
  const a = cwBkMergeById(loadJSON(K('appts-v1'), []), bundle.appointments);
  saveJSON(K('appts-v1'), a.list); res.appointments = a.added;
  const n = cwBkMergeById(loadJSON(K('notes-v1'), []), bundle.notes);
  saveJSON(K('notes-v1'), n.list); res.notes = n.added;

  // The medication list is REPLACED only when the target has none. Same rule as care-tracker, and
  // for the same reason: a restore must never wipe a list someone is maintaining. When it is
  // declined, the count is reported -- silence here is the exact defect that shipped in v54.
  const incomingMeds = (bundle.medications && Array.isArray(bundle.medications.meds)) ? bundle.medications.meds : null;
  if (incomingMeds && incomingMeds.length) {
    const current = loadJSON(K('med-v1'), null);
    const hasLocal = !!(current && Array.isArray(current.meds) && current.meds.length);
    if (!hasLocal || (opts && opts.forceMeds)) {
      saveJSON(K('med-v1'), { version: 1, meds: incomingMeds, archivedMeds: (bundle.medications.archivedMeds || {}) });
      res.meds = 'restored';
    } else {
      res.meds = 'skipped'; res.skippedMeds = incomingMeds.length;
    }
  }

  // Preferences fill GAPS only. Overwriting them would silently change reminder times and units on
  // a phone whose owner had already set them.
  if (bundle.prefs) {
    const cur = loadJSON(K('prefs-v1'), {}) || {};
    const merged = Object.assign({}, bundle.prefs, cur);
    if (JSON.stringify(merged) !== JSON.stringify(cur)) { saveJSON(K('prefs-v1'), merged); res.prefs = true; }
  }
  return res;
}

function createProfile(name) {
  const ps = profilesState();
  if (ps.list.length >= tierLimit(getLicense().tier)) return false;
  const id = 'p' + Date.now().toString(36);
  ps.list.push({ id: id, name: name, createdAt: Date.now() });
  ps.activeId = id;
  // v33: new profiles now go through the (3-question) setup screen instead of skipping it —
  // sex and treatment type gate real UI (cycle tracking, radiation card), so a profile created
  // without them would land in the ambiguous legacy state on purpose, which defeats the point.
  // The typed name rides along as pendingName and prefills the setup form; tourDone stays true
  // so an experienced multi-profile caregiver isn't forced back through the guided tour.
  saveJSON('chemowell-app-p-' + id + '-prefs-v1', { pendingName: name, installedAt: Date.now(), tourDone: true });
  saveJSON(PROFILES_KEY, ps);
  location.reload();
  return true;
}
function deleteProfile(id) {
  const ps = profilesState();
  if (id === ps.activeId || ps.list.length <= 1) return; // never delete the active profile
  ps.list = ps.list.filter(p => p.id !== id);
  saveJSON(PROFILES_KEY, ps);
  // v36: added '-notes-v1' for the new Notes feature, and also closed a pre-existing gap here --
  // '-appts-v1' (app-v22) was never included in this cleanup list, so deleting a profile left its
  // calendar/appointment data orphaned in localStorage forever. Both are 1-line additions to an
  // existing list with no behavior change to entries/prefs/med, so folding the appts fix in here
  // rather than opening a separate change for it.
  ['-entries-v1', '-prefs-v1', '-med-v1', '-appts-v1', '-notes-v1'].forEach(sfx => { try { localStorage.removeItem('chemowell-app-p-' + id + sfx); } catch (e) {} });
  setState({ confirmDeleteProfile: null });
  setToast('Profile deleted');
}
function switchProfile(id) {
  const ps = profilesState();
  if (!ps.list.some(p => p.id === id) || id === ps.activeId) return;
  ps.activeId = id;
  saveJSON(PROFILES_KEY, ps);
  location.reload();
}

// ---- Sync: device identity + per-profile encrypted-sync key storage (v49) ----
// See outputs/SYNC_DEVELOPER_BRIEF_v2.md for the full design. installId is a stable random

// device's conflict UI can say "changed on another device" without exposing anything more
// (§2.3). The per-profile sync key (K) is the profile's durable AES-256 encryption key --
// generated once locally by whichever device first shares a profile (§2.2 step 0), then copied to
// each newly-paired device via the one-time handshake in the crypto helpers below. K is stored
// exactly like every other on-device secret in this app (localStorage, on-device only) -- it is
// itself never encrypted, because it IS the encryption key for the server-facing copy of the data,
// not data that needs its own separate protection beyond normal device security.
const INSTALL_ID_KEY = 'chemowell-app-install-id-v1';

}
function syncKeyStorageKey(profileId) { return 'chemowell-app-p-' + profileId + '-synckey-v1'; }

function syncMetaStorageKey(profileId) { return 'chemowell-app-p-' + profileId + '-syncmeta-v1'; }

// ---- Sync: Web Crypto helpers (SYNC_DEVELOPER_BRIEF_v2 §2.1-2.2) ----
// Three native crypto.subtle primitives, zero external dependency: ECDH(P-256)+HKDF for the
// one-time pairing handshake, AES-256-GCM for both key-wrapping during pairing and encrypting
// every medication/entry record before it ever reaches the server. Pure functions -- no
// localStorage, no fetch -- round-trip tested standalone in Node (9/9 checks passing: encrypt/
// decrypt round trip, wrong-key fails closed, full two-device handshake produces matching K, an
// eavesdropper with a different keypair cannot recover K) before being pasted in here, per the
// brief's own recommended order (task breakdown item 2).
function syncB64FromBytes(bytes) {
  let bin = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}
function syncBytesFromB64(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
// K generation -- the profile's durable AES-256 sync key (§2.2 step 0).
async function generateSyncKey() {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const raw = await crypto.subtle.exportKey('raw', key);
  return syncB64FromBytes(raw);
}
async function importSyncKey(base64Key) {
  return crypto.subtle.importKey('raw', syncBytesFromB64(base64Key), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
// AES-GCM encrypt/decrypt of a single JS object -- used both for wrapping K during pairing (§2.2
// step 5) and for every medication/entry record's content before it's pushed (§2.3). Fresh random
// IV every call (IVs are not secret, stored alongside the ciphertext).
async function syncAesEncryptObject(cryptoKey, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plaintext = new TextEncoder().encode(JSON.stringify(obj));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, plaintext);
  return { ciphertext: syncB64FromBytes(ciphertext), iv: syncB64FromBytes(iv) };
}
async function syncAesDecryptObject(cryptoKey, blob) {
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: syncBytesFromB64(blob.iv) }, cryptoKey, syncBytesFromB64(blob.ciphertext));
  return JSON.parse(new TextDecoder().decode(plaintext));
}
// A single medication/entry record, encrypted with the profile's sync key K.
async function encryptRecord(base64K, obj) {
  const key = await importSyncKey(base64K);
  return syncAesEncryptObject(key, obj);
}
async function decryptRecord(base64K, blob) {
  const key = await importSyncKey(base64K);
  return syncAesDecryptObject(key, blob);
}
// ---- Pairing handshake (§2.2 step 1) ----
// Every new device pairing gets its own fresh, single-use ECDH key pair -- never reused across
// pairing sessions, discarded once the transport key has done its one job (moving a copy of K).
async function generateEcdhKeyPair() {
  return crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
}
async function exportEcdhPublicKey(keyPair) {
  const raw = await crypto.subtle.exportKey('raw', keyPair.publicKey);
  return syncB64FromBytes(raw);
}
async function importEcdhPublicKey(base64Key) {
  return crypto.subtle.importKey('raw', syncBytesFromB64(base64Key), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
}
// Both sides independently derive the same one-time transport key from their own private key and
// the other side's public key -- the actual Diffie-Hellman step. HKDF turns the raw shared secret
// into a proper AES-256 key; the transport key itself is never transmitted in any form.
async function deriveTransportKey(myKeyPair, theirPublicKeyB64, salt) {
  const theirPublicKey = await importEcdhPublicKey(theirPublicKeyB64);
  const sharedBits = await crypto.subtle.deriveBits({ name: 'ECDH', public: theirPublicKey }, myKeyPair.privateKey, 256);
  const hkdfKey = await crypto.subtle.importKey('raw', sharedBits, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: new TextEncoder().encode(salt || 'chemowell-pair-v1'), info: new TextEncoder().encode('sync-key-transport') },
    hkdfKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}
// Inviting device (already holds K): wrap K with the freshly-derived transport key for upload.
async function wrapSyncKeyForTransport(myKeyPair, theirPublicKeyB64, base64K) {
  const transportKey = await deriveTransportKey(myKeyPair, theirPublicKeyB64);
  return syncAesEncryptObject(transportKey, { k: base64K });
}
// Joining device: unwrap the downloaded ciphertext with its own independently-derived transport key.
async function unwrapSyncKeyFromTransport(myKeyPair, theirPublicKeyB64, wrappedBlob) {
  const transportKey = await deriveTransportKey(myKeyPair, theirPublicKeyB64);
  const obj = await syncAesDecryptObject(transportKey, wrappedBlob);
  return obj.k;
}
// Debug/test hook only -- this file is a single <script type="module">, so nothing declared in it
// is reachable from outside (e.g. an automated test harness) without deliberately exposing it.
// None of these functions hold or expose any secret on their own (they're pure crypto operations
// callers must supply keys/data to) -- this mirrors the same round-trip test already run standalone
// in Node before this code was pasted in, so it can be re-verified against the real browser's
// crypto.subtle implementation too, and reused by future QA/Auditor passes on this feature.
if (typeof window !== 'undefined') {
  window.__syncTest = {
    generateSyncKey, encryptRecord, decryptRecord, generateEcdhKeyPair, exportEcdhPublicKey,
    wrapSyncKeyForTransport, unwrapSyncKeyFromTransport, getOrCreateInstallId,
  };

  // is a single module, so a harness cannot otherwise reach it to prove a real browser round-trips
  // the file, that a wrong password fails closed, and that a tampered byte is rejected rather than
  // silently restored. Assigned lazily -- these are declared far below this point in the file.
  queueMicrotask(() => {
    Object.assign(window.__syncTest, { cwBkEncryptPayload, cwBkDecryptEnvelope, cwBkIsEncrypted, cwBkBuildPayload, cwBkReadIncoming });
  });
}

// ---- Sync: backend API layer ----
// Talks to the zero-knowledge relay in /sync-backend (deployed separately on Vercel -- see
// outputs/SYNC_DEVELOPER_BRIEF_v2.md). Every call here either sends/receives ciphertext + opaque
// metadata only, or (for the pairing handshake) an ephemeral ECDH public key -- never plaintext
// patient data, never K itself, never anything key-equivalent. SYNC_API_BASE is intentionally a
// single constant to flip once the production backend is live; empty string means "sync isn't
// reachable yet," which every call below treats as a clean, non-throwing failure so a build with
// this code merged but no backend configured behaves identically to no sync existing at all.
const SYNC_API_BASE = ''; // TODO: set to the deployed backend's URL once outputs/SYNC_DEVELOPER_BRIEF_v2.md's Vercel setup is complete (see REQUESTS.md sync entry)
function syncApiReady() { return !!SYNC_API_BASE; }
async function syncApiCall(path, opts) {
  if (!syncApiReady()) throw new Error('sync_backend_not_configured');
  const res = await fetch(SYNC_API_BASE + path, {
    method: (opts && opts.method) || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || ('http_' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
function pairCreate(publicKey, profileToken) { return syncApiCall('/api/pair/create', { method: 'POST', body: { publicKey, profileToken } }); }
function pairRedeem(code, publicKey) { return syncApiCall('/api/pair/redeem', { method: 'POST', body: { code, publicKey } }); }
function pairUploadKey(sessionId, wrappedKey) { return syncApiCall('/api/pair/upload-key', { method: 'POST', body: { sessionId, wrappedKey } }); }
function pairStatus(sessionId) { return syncApiCall('/api/pair/status?session=' + encodeURIComponent(sessionId)); }
function profilePull(token) { return syncApiCall('/api/profile/pull?token=' + encodeURIComponent(token)); }

const ENTRIES_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-entries-v1';
const PREFS_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-prefs-v1';

let entriesListener = null;
let prefsListener = null;

function allEntriesRaw() { return loadJSON(ENTRIES_KEY, []); }

function notifyEntries() {
  if (!entriesListener) return;
  const all = allEntriesRaw().slice().sort((a, b) => a.ts - b.ts);
  state.chemoDates = all.filter(e => e.medId === 'chemo_date');
  entriesListener(all.filter(e => e.medId !== 'chemo_date'));
}

function subscribeEntries(callback) {
  entriesListener = callback;
  notifyEntries();
  return () => { entriesListener = null; };
}

async function addEntryDB(entry) {
  const all = allEntriesRaw();
  const id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  all.push({ id: id, ...entry });
  saveJSON(ENTRIES_KEY, all);
  notifyEntries();
  // v35: logging a dose is the highest-frequency event in the app and the one with the tightest
  // feedback expectation on native -- the reminder for that exact window should stop existing the
  // instant the dose is confirmed. A full rebuild would do it but would also cancel-and-reschedule
  // every other armed alarm on every tap; cancelReminderForEntry() below is the surgical path.
  // chemo_date entries aren't a dose window at all (they can shift every med's schedule), so they
  // get the full rebuild via markNotifDirty() instead.
  if (entry && entry.medId === 'chemo_date') markNotifDirty(); else cancelReminderForEntry({ id: id, ...entry });
}

async function removeEntryDB(id) {
  saveJSON(ENTRIES_KEY, allEntriesRaw().filter(e => e.id !== id));
  notifyEntries();
}

function getPrefsDB() { return loadJSON(PREFS_KEY, {}); }

  return () => { prefsListener = null; };

// ---- Notes (app-v36) — a free-text journal, one entry per calendar day. Mirrors the
// appointments storage pattern above (profile-scoped localStorage, held in state.notes, mutated
// through these functions + setState) but deliberately simpler: no reminders, no title, just a
// date and a body of text. Aaron's spec: "editable at all times... it should all roll together in
// one date it was intended for" -- so unlike appointments (many rows per day are normal), notes
// are keyed uniquely by dateStr. saveNote() below enforces the one-note-per-day rule itself:
// saving into a date that already has a note edits that existing entry (by date, not by whatever
// id happened to be open), so there's no code path that can leave two notes on the same day.
const NOTES_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-notes-v1';
function loadNotes() { return loadJSON(NOTES_KEY, []); }
function persistNotes(list) { saveJSON(NOTES_KEY, list); }
// dateStr: 'YYYY-MM-DD', the date the note is FOR (not necessarily when it was typed -- this is
// what makes backdating work: logging today about something from yesterday just targets yesterday's
// dateStr, and it lands in the same place a note made yesterday would have).
function saveNote(dateStr, text) {
  const trimmed = (text || '').trim();
  const list = loadNotes();
  const existing = list.find(n => n.date === dateStr);
  if (!trimmed) {
    // Saving an empty note deletes it outright rather than leaving a blank entry cluttering the
    // list -- matches how every other optional-text field in this app treats an emptied value.
    if (existing) return removeNote(existing.id);
    return;
  }
  if (existing) {
    existing.text = trimmed;
    existing.updatedAt = Date.now();
  } else {
    list.push({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), date: dateStr, text: trimmed, createdAt: Date.now(), updatedAt: Date.now() });
  }
  persistNotes(list);
  setState({ notes: list });
  setToast('Note saved');
}
function removeNote(id) {
  const list = loadNotes().filter(n => n.id !== id);
  persistNotes(list);
  setState({ notes: list, confirmDeleteNote: null });
  setToast('Note deleted');
}

// Keep two open tabs on the same device in sync.
window.addEventListener('storage', (ev) => {
  if (ev.key === ENTRIES_KEY) notifyEntries();
  if (ev.key === PREFS_KEY && prefsListener) prefsListener(getPrefsDB());
  // If another tab switched profiles, this tab must never keep writing into the old one (audit 6.9)
  if (ev.key === PROFILES_KEY && profilesState().activeId !== ACTIVE_PROFILE_ID) location.reload();

// ---- v57: browser-build first-run notice (Aaron-requested) -------------------------------------
// The beta reaches testers as a plain HTTPS URL months before either store listing exists. A
// browser tab is NOT the phone app, and the gaps are not cosmetic: a tester who never adds the app
// to their Home Screen can lose everything they logged (iOS Safari clears site data for a site the

function nameOf(id) { if (id === 'temp') return 'Temperature'; if (id === 'blood_pressure') return 'Blood Pressure'; if (id === 'weight') return 'Weight'; if (id === 'radiation_session') return 'Radiation Session'; if (id === 'cycle_start') return 'Period Start'; if (id === 'cycle_end') return 'Period End'; if (id === 'inpatient') return 'In-Patient Day'; if (id === 'inpatient_start') return 'In-Patient Start'; if (id === 'inpatient_end') return 'In-Patient End'; if (id === 'bowel_movement') return 'Bowel Movement'; if (id === 'appetite') return 'Appetite'; if (id && id.indexOf('symptom_') === 0) return SYMPTOM_TYPES[id.slice(8)] || id.slice(8); const m = state.meds.find(x => x.id === id); const archived = state.archivedMeds && state.archivedMeds[id]; return m ? m.name : (archived ? archived.name : id); }

// v23 (Aaron-requested copy simplification): the old "Today - Monday 7/28 at 5:12 AM" doubled up
// "Today" and the weekday, and repeated a time that already shows on its own "Next dose at ..."
// line right next to it -- cramped onto one line, it's what was forcing the ellipsis-clipping fix
// below. Just weekday + date reads cleanly and never needs the "Today -" special case.
function fmtDateLabel(ts) {

// Protonix's evening (PM) dose log time for the given day, if logged yet — the second dose,
// after its own Morning window (8am-12pm) has closed.
function protonixEveningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 + 12 * 3600000 && e.ts < d0 + 86400000);
  return entry ? entry.ts : null;
}

// Iron (and Compazine's own routine, unlinked) open at 10 PM by default, but if Protonix's evening
// dose was logged, Iron instead opens 2 hours after that actual log time (so the two are spaced out).
function eveningWindowsFor(med, d0) {
  const pTs = protonixEveningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Night' }];
  }
  return med.windows; // default: 10 PM
}

// Protonix's morning (AM) dose log time for the given day, if logged yet — any entry logged
// before its own Evening window opens (noon).
function protonixMorningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 && e.ts < d0 + 12 * 3600000);
  return entry ? entry.ts : null;
}

// Buspirone/Paroxetine open at 10 AM by default (2h after Protonix's own default 8 AM dose time),
// but if Protonix's actual morning dose was logged, they instead open 2 hours after that real log
// time and stay open through end of day (mirrors eveningWindowsFor's pattern for Iron exactly:
// Iron defaults to 10 PM, 2h after Protonix's default 8 PM evening time, then shifts the same way).
function morningWindowsFor(med, d0) {
  const pTs = protonixMorningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Morning' }];
  }
  return med.windows; // default: 10 AM–midnight
}

function status(med) {
  const now = state.now;
  // v20: defense-in-depth -- the Home card bypasses status() entirely for a paused medication (see
  // medCards/renderGroupedMedsCard), but logMed()/other direct callers of status() are reachable
  // independent of the card UI, so this closes that gap too.
  if (med.paused) return { locked: true, paused: true };
  if (med.id === 'zofran' && zofranBlockedOn(now)) {
    // 3-day block (chemo day + 2 following days, see zofranBlockedOn) — opens on day+3 at 8am.
    // From the day actually blocking, never nextChemoTs(), and never null: returning null would
    // just move the 1970 downstream into fmtTime(). Falling through to AVAILABLE is the safe
    // failure -- a caregiver can still give a dose the app should have allowed.
    const zb = zofranBlockingDay(now);
    if (zb !== null) return { locked: true, chemoBlock: true, availableAt: zb + 3 * 86400000 + 8 * 3600000 };
  }
  const es = entriesFor(med.id).slice().sort((a, b) => a.ts - b.ts);
  if (med.type === 'gap') {
    // Check daily ceiling first (Tylenol mg or Imodium pills)
    if (med.ceiling) {
      const dc = dailyCeiling(med);
      if (dc && dc.used >= dc.max) {
        if (med.rollingCeilingH) {
          // Rolling-window ceiling (e.g. Morphine's 15 mg / 4h): the lockout self-resolves as old
          // doses age out of the window, not at midnight — compute the actual next-available time.
          return { locked: true, ceilingHit: true, rollingCeiling: true, ceilingLabel: dc.label, availableAt: rollingCeilingAvailableAt(med) };
        }
        return { locked: true, ceilingHit: true, ceilingLabel: dc.label };
      }
    }
    // Form-specific volume cap (e.g. Tylenol Liquid's 90 mL/24h) — independent of the mg ceiling
    if (med.volumeCeilingMl) {
      const vc = dailyVolumeCeiling(med);
      if (vc && vc.used >= vc.max) {
        return { locked: true, ceilingHit: true, ceilingLabel: vc.label };
      }
    }
    // Rolling-ceiling meds (Morphine) are gated solely by the mg ceiling above — a half dose must
    // NOT trigger a flat gapH lockout the way a full dose does, since there's still 7.5 mg of room
    // left in the 4-hour window. Per-dose-button blocking (doseBlocked, in the render loop) still
    // prevents logging a dose that would push the rolling total over the ceiling.
    if (med.rollingCeilingH) return { locked: false };
    const last = es[es.length - 1];
    if (!last) return { locked: false };
    const at = last.ts + med.gapH * 3600000;
    return { locked: now < at, availableAt: at };

  // windows (Aaron-requested — "scheduled meds still could have gap timers"). This ORs in with the
  // window logic below: a window being open no longer guarantees "available" if the last dose was
  // logged too recently. The existing "Log early" override UI already keys off locked/availableAt
  // generically, so it picks this up with no changes of its own.
  const lastForGap = es[es.length - 1];
  const gapAvailableAt = (med.gapH && lastForGap) ? lastForGap.ts + med.gapH * 3600000 : null;
  for (const w of windows) {
    const ws = atH(w.start), we = atH(w.end);
    const used = es.some(e => e.ts >= ws && e.ts < we);
    if (used) continue;
    if (now < ws) return { locked: true, availableAt: gapAvailableAt ? Math.max(ws, gapAvailableAt) : ws, windowName: w.name };
    if (now >= ws && now < we) {
      if (gapAvailableAt && now < gapAvailableAt) return { locked: true, availableAt: gapAvailableAt, windowName: w.name };
      return { locked: false, windowName: w.name };
    }
  }
  const chemoOver = treatmentOnlyBlocks(med, d0 + 86400000);
  if (chemoOver) {
    return { locked: true, courseComplete: true };
  }
  const tomorrowWindows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0 + 86400000)) : windows;
  const first = tomorrowWindows[0];
  return { locked: true, availableAt: d0 + 86400000 + first.start * 3600000, windowName: first.name };
}

function setToast(msg) {
  setState({ toast: msg });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setState({ toast: null }), 4500);
}

function afterLog(entry) {
  const twoH = 2 * 3600000;
  if (entry.medId === 'iron' || entry.medId === 'protonix') {
    const other = entry.medId === 'iron' ? 'protonix' : 'iron';
    const near = state.entries.find(e => e.medId === other && e.id !== entry.id && Math.abs(e.ts - entry.ts) <= twoH);
    if (near) { setState({ warn: { tone: 'amber', title: 'Iron + Protonix timing', body: 'Iron and Protonix were logged within 2 hours of each other. Protonix (a PPI) lowers stomach acid, which can markedly reduce iron absorption. Aim to separate the two by at least 2 hours.' } }); return; }
  }
  if (entry.medId === 'tylenol' || entry.medId === 'tylenol-liquid') {
    const mg = tylenolMg();
    const tylenol = state.meds.find(med => med.id === 'tylenol');
    const limit = medicationCeilingMax(tylenol) || 0;
    const mgOver = limit > 0 && mg > limit;
    let volOver = false, vol = 0, liquidMed = null;
    if (entry.medId === 'tylenol-liquid') {
      liquidMed = state.meds.find(med => med.id === 'tylenol-liquid');
      vol = dailyVolumeMl('tylenol-liquid');
      volOver = !!(liquidMed && liquidMed.volumeCeilingMl && vol > liquidMed.volumeCeilingMl);
    }
    if (mgOver && volOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg (above the " + limit.toLocaleString() + " mg daily limit) and Tylenol Liquid volume is " + vol + " mL (above the " + liquidMed.volumeCeilingMl + " mL daily limit). Do not give more without contacting the care team." } });
    } else if (mgOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg, above the " + limit.toLocaleString() + " mg daily limit. Do not give more without contacting the care team." } });
    } else if (volOver) {
      setState({ warn: { tone: 'red', title: 'Tylenol Liquid volume ceiling exceeded', body: "Today's Tylenol Liquid total is " + vol + " mL, above the " + liquidMed.volumeCeilingMl + " mL daily limit. Do not give more without contacting the care team." } });
    }

    const configuredMedication = state.meds.find(med => med.id === entry.medId);
    const configuredLimit = dailyCeiling(configuredMedication);

      setState({ warn: { tone: 'red', title: configuredMedication.name + ' daily limit exceeded', body: "Today's " + configuredMedication.name + ' total is ' + configuredLimit.used + ' ' + configuredLimit.unit + ', above the ' + configuredLimit.label + ' daily limit. Do not give more without contacting the care team.' } });
    }
  }
}

async function logMed(medId, dose, opts) {
  opts = opts || {};
  const med = state.meds.find(m => m.id === medId);
  const st = status(med);
  // v26 (Aaron-requested): a medication restricted to specific days used to be a dead-end on an
  // off day -- no log option at all. It now gets the same arm-then-confirm override as any other
  // locked state (daily limit, gap timer, closed window); offDay rides along on state.override so
  // the card renderers' own offDay gating (medCards, renderGroupedMedsCard) — matches the file's own
  // scheduleDays/medScheduledOn logic used everywhere else a medication's "is it scheduled today"
  // question gets asked.
  const offDay = !medScheduledOn(med, state.now);
  if ((st.locked || offDay) && !opts.force) { setState({ override: { medId, offDay } }); return; }
  setState({ override: null, timeModal: { type: 'med', medId, dose, opts, timeValue: nowLocalISO() } });
}

// Backfill a missed dose from History — opens the same log flow, pre-filled to the missed
// window's scheduled time (editable), bypassing the lock check since this IS the catch-up path.
function logMissedDose(e) {
  const med = state.meds.find(m => m.id === e.medId);
  if (!med) return;
  const dose = med.doses ? med.doses[0] : null;
  const d = new Date(e.ts);
  const pad = n => String(n).padStart(2, '0');
  const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  setState({ override: null, timeModal: { type: 'med', medId: e.medId, dose, opts: { force: true }, timeValue: iso } });
}

function tempDefault() { return CONFIG.tempUnit === 'Celsius' ? '36.9' : '98.5'; }

async function confirmTimeAndLog() {
  const m = state.timeModal;
  if (!m) return;
  // 'period' logs its own Start/End pair below with its own validation -- it has no single
  // m.timeValue, so it's excluded from this shared single-timestamp check.
  let ts;
  if (m.type !== 'period') {
    ts = new Date(m.timeValue).getTime();
    if (isNaN(ts)) { setToast('Invalid time'); return; }
    if (ts > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
  }

  if (m.type === 'med') {
    const med = state.meds.find(x => x.id === m.medId);
    if (med.painScale && !m.painLevel) { setToast('Select a pain level before logging ' + med.name); return; }
    const entry = { medId: m.medId, dose: m.dose ? m.dose.label : null, mg: m.dose ? (m.dose.mg || 0) : 0, ts };
    if (m.dose && m.dose.pills) entry.pills = m.dose.pills;
    if (med.volumePerDoseMl) entry.volumeMl = med.volumePerDoseMl;
    if (med.painScale && m.painLevel) entry.painLevel = m.painLevel;
    const early = !!(m.opts && m.opts.force) && isEarlyAt(med, ts);
    // v23 (Aaron-requested): confirm on-screen when a dose was force-logged over today's daily
    // limit, the same way an early gap-timer override already gets "(early)" appended below.
    const overLimit = !!(m.opts && m.opts.force) && !!med.ceiling && (() => {
      const dc = dailyCeiling(med);
      if (!dc) return false;
      const amt = med.ceilingUnit ? (entry.pills || 0) : (entry.mg || 0);
      return amt > 0 && amt > (dc.max - dc.used);
    })();
    // v26 auditor fix: the off-day override (Aaron-requested — every medication can now be logged
    // on a day it isn't scheduled for) went through the exact same force-logMed path as early/
    // over-limit overrides but was never checked here, so the resulting entry carried no override
    // flag at all and was indistinguishable from a normal on-schedule dose in Journal/History --
    // silently losing the "this was a caregiver exception" audit trail for the release's headline
    // feature. Checked against the logged date (dayStart(ts)), not state.now, so a caregiver
    // backdating/adjusting the time in the modal is still evaluated against the day they actually
    // logged for.
    const offDay = !!(m.opts && m.opts.force) && !medScheduledOn(med, dayStart(ts));
    // v23 auditor fix: both "early" and "over-limit" overrides set the same entry.override flag,
    // so an over-limit log showed a factually wrong "EARLY" badge in the Journal/History even
    // though it wasn't early at all -- overrideReason lets the badge say which one actually
    // happened. Entries logged before this fix have override:true with no overrideReason; the
    // badge below defaults those to "Early" since that was the only override reason that existed
    // at the time they were saved. v26: offDay folds into the same scheme rather than a parallel
    // one -- reasonParts lists every reason actually true, so a dose that's simultaneously off-day
    // and over the daily limit (e.g. a caregiver already force-logged once today) still records
    // both facts instead of one silently overwriting the other.
    if (early || overLimit || offDay) {
      entry.override = true;
      const reasonParts = [];
      if (offDay) reasonParts.push('offDay');
      if (early) reasonParts.push('early');
      if (overLimit) reasonParts.push('overLimit');
      entry.overrideReason = reasonParts.length > 1 ? reasonParts.join('+') : reasonParts[0];
    }
    setState({ timeModal: null });
    await addEntryDB(entry);
    setToast(med.name + ' logged' + (m.dose ? (' · ' + m.dose.label) : '') + (entry.painLevel ? (' · Pain ' + entry.painLevel + '/10') : '') + (offDay ? ' (not scheduled today)' : '') + (early ? ' (early)' : '') + (overLimit ? ' (over today’s limit)' : '') + ' at ' + fmtTime(ts));
    setTimeout(() => afterLog({ ...entry, id: 'pending' }), 500);
  } else if (m.type === 'temp') {
    const v = m.tempValue;
    const suffix = tempSuffix();
    const entry = { medId: 'temp', temp: v, unit: CONFIG.tempUnit, dose: v + ' ' + suffix, mg: 0, ts };
    setState({ tempInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Temperature ' + v + ' ' + suffix + ' logged at ' + fmtTime(ts));
  } else if (m.type === 'para') {
    const v = m.paraValue;
    setState({ paraInput: '', timeModal: null });
    await addEntryDB({ medId: PARA_MED_ID, paraId: paraNewId(), liters: v, dose: paraFmtLiters(v) + ' L',
                       mg: 0, ts, loggedAt: Date.now() });
    setToast('Paracentesis ' + paraFmtLiters(v) + ' L logged at ' + fmtTime(ts));
  } else if (m.type === 'weight') {
    const v = m.weightValue;
    // Liters is optional, but if the user typed something while Paracentesis is selected, it must
    // be a valid amount — silently dropping an out-of-range value would look like it saved when it
    // didn't (audit finding: caregiver reviewing the trend later would see "Paracentesis" with no
    // liters and no idea a typo or bad value was rejected).
    const litersRaw = (m.litersDrained === undefined || m.litersDrained === null) ? '' : String(m.litersDrained).trim();
    if (m.weightReason === 'paracentesis' && litersRaw !== '') {
      const litersCheck = parseFloat(litersRaw);
      if (isNaN(litersCheck) || litersCheck < 0 || litersCheck > 20) { setToast('Enter a valid liters amount (0–20), or leave it blank.'); return; }
    }
    const entry = { medId: 'weight', weight: v, unit: CONFIG.weightUnit, dose: v + ' ' + weightSuffix(), mg: 0, ts };
    if (m.weightReason) entry.weightReason = m.weightReason;
    if (m.weightReason === 'paracentesis' && litersRaw !== '') {
      const liters = parseFloat(litersRaw);
      entry.litersDrained = round1(liters);
    }
    const noteTrimmed = (m.weightNote || '').trim();
    if (noteTrimmed) entry.weightNote = noteTrimmed;
    setState({ weightInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Weight ' + v + ' ' + weightSuffix() + ' logged at ' + fmtTime(ts));
  } else if (m.type === 'multi') {
    // Re-validate at confirm time — a med may have locked between opening and confirming (audit 6.5)
    const ids = m.medIds.filter(id => { const md = state.meds.find(x => x.id === id); return md && !status(md).locked && medScheduledOn(md, ts); });
    const skipped = m.medIds.length - ids.length;
    setState({ timeModal: null });
    if (skipped > 0) setToast(skipped + ' medication' + (skipped > 1 ? 's' : '') + ' skipped (not currently due)');
    for (const id of ids) {
      const md = state.meds.find(x => x.id === id);
      const d0 = md && md.doses ? md.doses[0] : null;
      const en = { medId: id, dose: d0 ? d0.label : null, mg: d0 ? (d0.mg || 0) : 0, ts };
      if (d0 && d0.pills) en.pills = d0.pills;
      await addEntryDB(en);
    }
    setToast(ids.length + ' meds logged at ' + fmtTime(ts));
    setTimeout(() => { if (ids.includes('iron')) afterLog({ medId: 'iron', ts, id: 'pending' }); }, 500);
  } else if (m.type === 'period') {
    // Retroactive Start(+Stop) logging for Cycle/In-Patient via the "+" control (v68 redesign).
    // Always writing a matched Start+End pair (instead of the old single-marker log) means the
    // resulting period is always well-formed and unambiguous to cyclePeriods()/inpatientPeriods()'s
    // chronological pairing -- a lone backdated Start could previously get silently swallowed
    // (overwritten with no visible trace) if a later Start already existed with no End between them.
    // The "still ongoing" path (End omitted) keeps that same risk, so it's guarded explicitly below.
    const startTs = new Date(m.startValue).getTime();
    if (isNaN(startTs)) { setToast('Invalid start time'); return; }
    if (startTs > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
    if (m.ongoing) {
      const related = state.entries.filter(e => e.medId === m.startMedId || e.medId === m.endMedId);
      const latest = related.reduce((mx, e) => Math.max(mx, e.ts), -Infinity);
      if (related.length && startTs <= latest) {
        setToast('This start time is before an existing ' + m.label + ' entry \u2014 add an End time to close this stay out, or edit the conflicting entry instead.');
        return;
      }
      setState({ timeModal: null });
      await addEntryDB({ medId: m.startMedId, dose: null, mg: 0, ts: startTs });
      setToast(m.label + ' Start logged for ' + new Date(startTs).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' at ' + fmtTime(startTs));
    } else {
      const endTs = new Date(m.endValue).getTime();
      if (isNaN(endTs)) { setToast('Invalid end time'); return; }
      if (endTs <= startTs) { setToast('End must be after Start'); return; }
      if (endTs > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
      setState({ timeModal: null });
      await addEntryDB({ medId: m.startMedId, dose: null, mg: 0, ts: startTs });
      await addEntryDB({ medId: m.endMedId, dose: null, mg: 0, ts: endTs });
      setToast(m.label + ' logged: ' + new Date(startTs).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' \u2013 ' + new Date(endTs).toLocaleDateString([], { month: 'short', day: 'numeric' }));
    }
  } else if (m.type === 'symptom') {
    if (!m.symptomType) { setToast('Select a symptom first'); return; }
    if (m.symptomType === 'other' && !(m.note || '').trim()) { setToast('Describe the symptom before saving'); return; }
    const editId = m.editId;
    setState({ timeModal: null });
    if (editId) await removeEntryDB(editId);

// Unified notice/banner tones (design batch 2, item 6): tone is an accent on a white card,
// never a flood. accent drives the 4px left border and solid action buttons; chipBg/chipFg
// drive the tinted icon chip. Shared geometry lives at each banner's container.
const NOTICE_TONES = {
  info:      { accent: '#BF4C1A', chipBg: 'rgba(191,76,26,0.12)', chipFg: '#A83D0F' },
  attention: { accent: '#B5761E', chipBg: 'rgba(181,118,30,0.14)', chipFg: '#8C5900' },
  urgent:    { accent: '#C0453B', chipBg: 'rgba(192,69,59,0.12)',  chipFg: '#A5443C' }

function bowelMovementEntriesByDay() {
  const map = new Map();
  state.entries.filter(e => e.medId === 'bowel_movement').forEach(e => {
    const d0 = dayStart(e.ts);
    const existing = map.get(d0);
    if (!existing || e.ts >= existing.ts) map.set(d0, e);
  });
  return map;
}
function bowelMovementFor(dayStartTs) { return bowelMovementEntriesByDay().get(dayStartTs) || null; }
function latestBowelDay() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return days[0];
}
function bowelMovementHistorySorted() { return [...bowelMovementEntriesByDay().values()].sort((a, b) => b.ts - a.ts); }
async function logBowelMovement(value, dayStartTs) {
  await addEntryDB({ medId: 'bowel_movement', value, dose: BOWEL_MOVEMENT_LABELS[value] || value, mg: 0, ts: dayStartTs + 12 * 3600000 });
}
function bowelIssueActive() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return false;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value);
}
function currentBowelIssueType() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  const latest = byDay.get(days[0]);
  return BOWEL_ISSUE_VALUES.has(latest.value) ? latest.value : null;
}
function daysSinceBowelIssueStart() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  if (!BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value)) return null;
  let count = 0, expected = days[0];
  for (const d of days) {
    if (d !== expected) break; // a gap in consecutive daily answers breaks the streak
    if (!BOWEL_ISSUE_VALUES.has(byDay.get(d).value)) break;
    count++;
    expected = d - 86400000;
  }
  return count;
}
// Overwrites (rather than appends to) a given day's retrospective answer, so there's always at
// most one bowel_movement entry per day — keeps the "last daily answer wins" derivation above
// unambiguous even when the user changes their mind and hits Update.
async function submitBowelMovement(dayStartTs) {
  const v = state.bowelInput;
  if (!v) { setToast('Select a bowel movement status first'); return; }
  try {
    const existing = bowelMovementFor(dayStartTs);
    if (existing) await removeEntryDB(existing.id);
    await logBowelMovement(v, dayStartTs);
    setState({ bowelInput: undefined });
    setToast('Bowel movement logged — ' + (BOWEL_MOVEMENT_LABELS[v] || v));
  } catch (e) {
    setToast('Could not save — please try again');
  }
}
// Quick-update from the pinned "Bowel Issue Active" banner (mirrors submitBowelMovement, but
// targets whichever day is currently driving the active streak — not necessarily "yesterday" —
// and uses its own input field so it never fights with the retrospective card's dropdown.
async function submitBowelBannerUpdate() {
  const day = latestBowelDay();
  const v = state.bowelBannerInput;
  if (day === null) return;
  if (!v) { setToast('Select a bowel movement status first'); return; }
  try {

    setState({ bowelBannerInput: undefined });
    setToast('Bowel movement updated — ' + (BOWEL_MOVEMENT_LABELS[v] || v));
  } catch (e) {
    setToast('Could not save — please try again');
  }
}

// Weight-change reasons (app-v21, per Aaron's request) — a quick-select list of the most common
// drivers of a fast weight swing in chemo/radiation patients, sourced from oncology-nursing and
// cancer-society guidance on what's worth documenting. 'paracentesis' is the one that unlocks the

// paracentesis-driven weight drop (~1 L ≈ 1 kg of the "weight" that just left the room).
// 'paracentesis' was removed from this list in app-v59. It is a PROCEDURE, not a reason a weight

  { id: 'poor_appetite', label: 'Poor appetite / eating less' },

function weightReasonLabel(id) { if (id === 'paracentesis') return 'Paracentesis (fluid drained)'; const r = WEIGHT_REASONS.find(x => x.id === id); return r ? r.label : id; }
// Common oncology steroid names/brands (dexamethasone/Decadron is the standard chemo antiemetic

  { id: "rem-none", cat: "reminders", q: "I'm not getting any reminders at all", a: "There are two separate phone settings involved, and the order matters. Do the battery one first. That is what finally worked here, and once it was on, the exact-timing setting turned on without a fight.", steps: ["Open ChemoWell. Tap the three lines in the top left, then tap **Settings**.", "Scroll down to the part that says **Notifications**.", "If you see **Turn on notifications**, tap it, and tap Allow when your phone asks.", "Now look for a button that says **Allow background activity**. **Tap this one first**, before anything else. Your phone will show its own screen — choose the option that lets the app run without limits (on Samsung phones it is usually called *Unrestricted*).", "Come back to ChemoWell. Now look for **Allow exact reminders** and tap it. Your phone opens a screen called *Alarms & reminders*. Turn the switch on.", "Come back to Settings in ChemoWell one more time. It should now say **✓ Notifications are on**, with a line underneath telling you how many reminders are set for the next 3 days."], branches: [{ when: "There is no Allow background activity button", steps: ["That is fine. The button only appears when your phone is still holding the app back. If it isn't there, your phone is already letting ChemoWell run, and there is nothing to do on that step.", "Carry on with the exact-timing step above."] }, { when: "It still says 0 reminders, or the count line is missing", steps: ["Check that at least one of your medications actually has set times. A medication set to *As needed* never sends a reminder — it only counts hours between doses. See *\"One medication never reminds me\"*.", "Check that the medication is not paused. A paused medication is not tracked and does not remind.", "Look at the top of your Home screen for a box called **Beta date controls**. If it is showing a date that isn't today, reminders are switched off on purpose. Open that box and tap **Reset**."] }, { when: "Everything says it's on, but nothing arrives", steps: ["Check your phone isn't on Do Not Disturb or a sleep/bedtime mode.", "In your phone's own Settings, find Apps, then ChemoWell, then Notifications, and make sure they are allowed there too.", "Open ChemoWell at least once every couple of days. Reminders are set up 3 days ahead each time you open the app — see *\"My reminders stopped after I didn't open the app for a while\"*."] }], note: "ChemoWell can ask your phone for permission, but it can never switch these settings on for you — Android deliberately puts that in your hands.", keywords: ["notification", "alarm", "alert", "silent", "nothing", "never", "missing", "battery", "optimisation", "optimization"], related: ["rem-exact-toggle-missing", "rem-after-3-days", "rem-no-reminder-for-med", "rem-web-vs-app"], medical: true, safety: true },
  { id: "rem-exact-toggle-missing", cat: "reminders", q: "The 'Alarms & reminders' switch isn't there, or won't turn on", a: "This is a known quirk on some Samsung phones. Once you say no to it, the whole section can disappear. There are two standard ways to bring it back.", steps: ["First, do the battery step described in *\"I'm not getting any reminders at all\"* — on the phone this was tested on, that alone made the switch work.", "If it is still missing: close ChemoWell completely (swipe it away from your recent apps), then open it again, and try the button once more.", "If it is still missing: open your phone's Settings, tap Apps, find ChemoWell, and use the app's own force-stop option. Then open ChemoWell again.", "If it is *still* missing: open your phone's Settings, tap Apps, tap the three dots in the top corner, and choose **Reset app preferences**. This does not delete anything — it only clears hidden permission decisions across all your apps. Then try again."], note: "You do not have to solve this to get reminders. When exact timing is off, ChemoWell already sets every reminder a few minutes early on purpose, so an ordinary phone delay makes it arrive on time rather than late. The time you see on screen is always the real time.", keywords: ["exact", "alarms and reminders", "samsung", "one ui", "toggle", "greyed out", "missing", "won't turn on"], related: ["rem-none", "rem-late"] },
  { id: "rem-late", cat: "reminders", q: "The reminder came a few minutes early, or a few minutes late", a: "A few minutes early is on purpose. A few minutes late means your phone is delaying the app.", steps: ["If it arrived **early**: that is ChemoWell doing it deliberately. When your phone hasn't granted exact timing, the app sets reminders about four minutes ahead so normal phone delays land them on time instead of late. Every time shown in the app is still the real time.", "If it arrived **late**: go to the menu → **Settings** → **Notifications**, and do both steps in *\"I'm not getting any reminders at all\"* — background activity first, then exact reminders.", "Once the app says exact timing is allowed, it stops setting reminders early and uses the exact time you chose."], note: "If one particular medication truly cannot be late, it is still safest to set its reminder a few minutes ahead yourself.", keywords: ["early", "late", "wrong time", "minutes", "delayed"], related: ["rem-none", "rem-exact-toggle-missing"] },
  { id: "rem-web-vs-app", cat: "reminders", q: "I'm using ChemoWell in a web browser, not the installed app", a: "Three things work differently in a browser. Everything else — logging, history, reports, exports — is exactly the same.", steps: ["**Add it to your Home Screen.** On iPhone, tap Share, then **Add to Home Screen**. On Android, open the browser menu, then **Add to Home screen**. This matters most on iPhone: Safari deletes a website's saved data after **7 days without a visit**, and your log is stored nowhere else. A Home Screen app is not treated as a website, so it is not cleared.", "**Reminders only fire while this page is open.** A browser cannot wake a locked phone. They will not reach you with the tab closed or the screen locked. The installed phone app schedules them with the operating system instead, so those arrive either way.", "**Exports download instead of opening the share sheet.** Download CSV and Print/PDF save straight to your Downloads folder. Sending them on to someone is a manual step in the browser version.", "Check which one you are in: the installed app opens on its own, with no address bar at the top."], note: "Nothing you log is sent anywhere in either version. It stays on this device.", keywords: ["browser", "chrome", "safari", "website", "tab", "locked", "installed", "apk", "home screen", "add to home screen", "web preview", "7 days", "cleared", "install"], related: ["rem-none", "priv-lost-phone", "exp-where-file"] },
  { id: "rem-after-3-days", cat: "reminders", q: "My reminders stopped after I didn't open the app for a while", a: "ChemoWell sets up reminders three days ahead every time you open it. If the app isn't opened for longer than that, the queue runs out.", steps: ["Just open ChemoWell. That alone refills the next three days of reminders.", "To check it worked: menu → **Settings** → **Notifications**. It should say how many reminders are scheduled over the next 3 days, and when the next one is.", "Try to open the app at least every couple of days, even briefly."], keywords: ["stopped", "ran out", "vacation", "away", "three days", "72 hours"], related: ["rem-none"] },
