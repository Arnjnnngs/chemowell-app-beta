function renderWeightTrend(now) {
  // v12b: convert every reading to the current display unit ONCE at ingestion — bounds, axis,
  // stats, dot labels, and the readings list below all inherit converted values, so mixed-unit
  // history (logged in lbs, viewed in kg, or vice versa) charts correctly on one axis.
  const weightEntries = state.entries.filter(e => e.medId === 'weight' && e.weight).sort((a, b) => a.ts - b.ts).map(e => ({ ...e, weight: dispWeight(e) }));
  const range = state.weightRange;
  const DAY = 86400000;

  // Range toggle
  const toggle = h('div', { style: { display: 'flex', gap: '5px', background: 'rgba(255,255,255,0.45)', borderRadius: '10px', padding: '3px', border: '1px solid #E9D8D1', alignSelf: 'flex-start' } },
    h('button', { onClick: () => setState({ weightRange: 'weeks' }), 'aria-pressed': String(range === 'weeks'), style: { minHeight: '44px', padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'weeks' ? '#AE5833' : 'transparent', color: range === 'weeks' ? '#fff' : '#7A6E76' } }, 'Weeks'),
    h('button', { onClick: () => setState({ weightRange: 'months' }), 'aria-pressed': String(range === 'months'), style: { minHeight: '44px', padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'months' ? '#AE5833' : 'transparent', color: range === 'months' ? '#fff' : '#7A6E76' } }, 'Months')
  );

  if (weightEntries.length === 0) {
    return [
      toggle,
      h('div', { style: { background: 'rgba(255,255,255,0.03)', border: '1px dashed rgba(255,255,255,0.1)', borderRadius: '16px', padding: '40px', textAlign: 'center', color: '#7A6E76', fontSize: '14px', lineHeight: '1.5' } }, 'No weight readings logged yet.\nLog your first weight on the Today tab.')
    ];
  }

  // Determine time range
  const spanDays = range === 'weeks' ? 28 : 90;
  const minTs = now - spanDays * DAY;
  const filtered = weightEntries.filter(e => e.ts >= minTs);
  const points = filtered.length > 0 ? filtered : weightEntries.slice(-2);

  if (points.length === 0) {
    return [toggle, h('div', { style: { color: '#7A6E76', fontSize: '14px', textAlign: 'center', padding: '40px' } }, 'No data in this range.')];
  }

  // Calculate bounds
  const weights = points.map(p => p.weight);
  const allWeights = weightEntries.map(p => p.weight);
  const minW = Math.floor(Math.min(...weights) - 2);
  const maxW = Math.ceil(Math.max(...weights) + 2);
  const wRange = maxW - minW || 4;
  const tMin = points[0].ts;
  const tMax = Math.max(points[points.length - 1].ts, tMin + DAY);
  const tRange = tMax - tMin || DAY;

  // SVG dimensions
  const W = 680, H = 300;
  const pad = { top: 30, right: 20, bottom: 50, left: 55 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  const x = (ts) => pad.left + ((ts - tMin) / tRange) * cW;
  const y = (w) => pad.top + cH - ((w - minW) / wRange) * cH;

  // Build SVG path
  let pathD = '';
  let areaD = '';
  const dots = [];
  points.forEach((p, i) => {
    const px = x(p.ts), py = y(p.weight);
    pathD += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
    if (i === 0) areaD = 'M' + px.toFixed(1) + ',' + (pad.top + cH);
    areaD += 'L' + px.toFixed(1) + ',' + py.toFixed(1);
    dots.push({ x: px, y: py, w: p.weight, ts: p.ts });
  });
  areaD += 'L' + x(points[points.length - 1].ts).toFixed(1) + ',' + (pad.top + cH) + 'Z';

  // Y-axis labels (weight)
  const ySteps = 5;
  const yLabels = [];
  for (let i = 0; i <= ySteps; i++) {
    const val = minW + (wRange / ySteps) * i;
    yLabels.push({ val: Math.round(val * 10) / 10, py: y(val) });
  }

  // X-axis labels (dates)
  const xLabels = [];
  const labelCount = range === 'weeks' ? 4 : 6;
  for (let i = 0; i <= labelCount; i++) {
    const ts = tMin + (tRange / labelCount) * i;
    const d = new Date(ts);
    const label = (d.getMonth() + 1) + '/' + d.getDate();
    xLabels.push({ label, px: x(ts) });
  }

  // Stats
  const latest = points[points.length - 1];
  const first = points[0];
  const change = latest.weight - first.weight;
  const changeLabel = (change >= 0 ? '+' : '') + change.toFixed(1) + ' ' + weightSuffix();
  const changeColor = Math.abs(change) < 0.5 ? '#915E48' : change > 0 ? '#9A6419' : '#BF4C1A';
  const avg = (weights.reduce((s, w) => s + w, 0) / weights.length).toFixed(1);

  // Build SVG as string
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">';
  // Grid lines
  yLabels.forEach(yl => {
    svg += '<line x1="' + pad.left + '" y1="' + yl.py.toFixed(1) + '" x2="' + (W - pad.right) + '" y2="' + yl.py.toFixed(1) + '" stroke="rgba(246,108,49,0.10)" stroke-width="1"/>';
    svg += '<text x="' + (pad.left - 10) + '" y="' + (yl.py + 4).toFixed(1) + '" fill="#7A6E76" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="end">' + yl.val + '</text>';
  });
  // X labels
  xLabels.forEach(xl => {
    svg += '<text x="' + xl.px.toFixed(1) + '" y="' + (H - 10) + '" fill="#7A6E76" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">' + xl.label + '</text>';
  });
  // Area gradient
  svg += '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(174,88,51,0.25)"/><stop offset="100%" stop-color="rgba(174,88,51,0)"/></linearGradient></defs>';
  svg += '<path d="' + areaD + '" fill="url(#wg)"/>';
  // Line
  svg += '<path d="' + pathD + '" fill="none" stroke="#AE5833" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  // Dots
  dots.forEach((d, i) => {
    const isLast = i === dots.length - 1;
    svg += '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="' + (isLast ? 5 : 3.5) + '" fill="' + (isLast ? '#AE5833' : '#8B3C1B') + '" stroke="' + (isLast ? '#BF4C1A' : '#AE5833') + '" stroke-width="' + (isLast ? 2 : 1.5) + '"/>';
    // Value label on last dot
    if (isLast) {
      svg += '<text x="' + d.x.toFixed(1) + '" y="' + (d.y - 12).toFixed(1) + '" fill="#8B3C1B" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">' + d.w + '</text>';
    }
  });
  svg += '</svg>';

  // Chart card
  const chart = h('section', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '18px', padding: '20px 16px 12px', boxShadow: '0 4px 24px rgba(203,122,87,0.10), 0 1px 2px rgba(203,122,87,0.06)' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' } },
      h('div', null,
        h('div', { style: { ...TYPE.label, color: '#915E48' } }, 'Weight Trend'),
        h('div', { style: { fontSize: '12.5px', color: '#7A6E76', marginTop: '3px' } }, range === 'weeks' ? 'Last 4 weeks' : 'Last 3 months')
      ),
      h('div', { className: 'mono', style: { fontSize: '24px', fontWeight: '700', color: '#8B3C1B', letterSpacing: '-0.02em' } }, latest.weight + ' ' + weightSuffix())
    ),
    h('div', { innerHTML: svg })
  );

  // Stats row
  const stats = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px' } },
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(203,122,87,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Current'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#2A2127' } }, latest.weight + '')
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(203,122,87,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Average'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#2A2127' } }, avg)
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(203,122,87,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Change'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: changeColor } }, changeLabel)
    )
  );

  // Readings list — reason/liters/note (app-v21) get their own lines below the date, since this
  // view has the room History's compact single-line format doesn't.
  // Aaron's "notes for weight that can add the para together to see how much was drained" --
  // reported against the SAME window the chart shows, so the number always matches the picture.
  // The plotted weights are not adjusted by any of it.
  const paraAll = paracentesisResolved();
  const paraInRange = paraAll.filter(p => p.ts >= tMin && p.ts <= tMax);
  const paraLine = paraInRange.length
    ? h('div', { style: { background: 'rgba(62,116,158,0.09)', border: '1px solid rgba(62,116,158,0.22)', borderRadius: '14px', padding: '12px 14px', display: 'flex', alignItems: 'center', gap: '10px' } },
        h('span', { style: { flexShrink: '0', width: '10px', height: '10px', borderRadius: '50%', background: '#3E749E' } }),
        h('div', { style: { fontSize: '12.5px', color: '#4A5C6B', lineHeight: '1.45' } },
          h('span', { style: { fontWeight: '800' } }, paraInRange.length + ' paracentesis ' + (paraInRange.length === 1 ? 'procedure' : 'procedures') + ' in this range · ' + paraFmtLiters(paraTotalLiters(paraInRange)) + ' L drained'),
          h('span', { style: { display: 'block', marginTop: '2px' } }, 'Marked on the chart. Weight readings are shown exactly as recorded and are not adjusted for drainage.')
        )
      )
    : null;

  const readingsItems = points.slice().reverse().map((p, i) => {
    const d = new Date(p.ts);
    const day = d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
    const time = fmtTime(p.ts);
    const reasonLine = p.weightReason
      ? weightReasonLabel(p.weightReason) + (p.weightReason === 'paracentesis' && typeof p.litersDrained === 'number' ? ' — ' + p.litersDrained + ' L drained' : '')
      : null;
    return h('div', { style: { display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '11px 14px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none' } },
      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div', { style: { fontSize: '14px', fontWeight: '700' } }, day),
        h('div', { style: { ...TYPE.caption, color: '#7A6E76' } }, time),
        reasonLine ? h('div', { style: { fontSize: '12.5px', color: '#A83D0F', fontWeight: '700', marginTop: '3px' } }, reasonLine) : null,
        p.weightNote ? h('div', { style: { fontSize: '12.5px', color: '#7A6E76', marginTop: '2px', fontStyle: 'italic', wordBreak: 'break-word' } }, p.weightNote) : null
      ),
      h('div', { className: 'mono', style: { fontSize: '16px', fontWeight: '600', color: '#8B3C1B', flexShrink: '0' } }, p.weight + ' ' + weightSuffix())
    );
  });

  const readings = h('section', null,
    h('div', { style: { ...TYPE.label, color: '#915E48', marginBottom: '10px' } }, 'All Readings'),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(203,122,87,0.10)' } },
      ...readingsItems
    )
  );

  return paraLine ? [toggle, chart, stats, paraLine, readings] : [toggle, chart, stats, readings];
}


// --------- Notification System ---------
let notifSentToday = {};  // key: 'scheduled-8pm' or 'avail-tylenol-{ts}', value: true

function resetNotifTracking() {
  const today = dayStart(Date.now());
  if (notifSentToday._day !== today) {
    notifSentToday = { _day: today };
  }
}

async function requestNotifPermission() {
  if (isNativeApp()) {
    try {
      const ln = window.Capacitor.Plugins.LocalNotifications;
      const current = await ln.checkPermissions();
      if (current.display !== 'granted') await ln.requestPermissions();
    } catch (e) { /* plugin unavailable — reminders silently stay off, rest of the app unaffected */ }
    return;
  }
  if ('Notification' in window && Notification.permission === 'default') {
    // v24: awaited (was fire-and-forget) so the Settings "Turn on notifications" button can chain
    // a re-render once the browser's real answer comes back, instead of the status line only
    // updating on the next unrelated render.
    await Notification.requestPermission();
  }
}

// v24 (Aaron-reported: no way to tell if notification permission was ever granted, or to retry
// after dismissing/denying the one-time browser prompt): visible status + action for Settings.
// Native build has its own OS-level permission surface and doesn't need this.
function notifPermissionStatusBlock() {
  if (!('Notification' in window)) {
    return h('div', { style: { marginTop: '10px', fontSize: '12.5px', color: '#915E48' } }, 'This browser doesn’t support notifications.');
  }
  const perm = Notification.permission;
  if (perm === 'granted') {
    // v24 Designer finding: reuse the app's existing success-pill pattern (same one used for the
    // "Active" profile badge two sections above) instead of bare colored text, so a settled
    // positive state reads consistently across the same screen.
    return h('div', { style: { marginTop: '10px', display: 'inline-flex', alignItems: 'center', gap: '5px', fontSize: '12.5px', fontWeight: '700', color: '#2E7D4F', background: 'rgba(46,125,79,0.10)', padding: '3px 10px', borderRadius: '99px' } }, '✓ Notifications are on');
  }
  if (perm === 'denied') {
    return h('div', { style: { marginTop: '10px' } },
      h('div', { style: { fontSize: '12.5px', fontWeight: '700', color: '#A5443C' } }, 'Notifications are blocked for this app'),
      h('div', { style: { fontSize: '12px', color: '#6D5247', marginTop: '3px', lineHeight: '1.4' } }, 'To turn them back on, open your browser’s site settings for this page, allow notifications, then reload.')
    );
  }
  return h('div', { style: { marginTop: '10px' } },
    h('div', { style: { fontSize: '12.5px', fontWeight: '700', color: '#9A6419' } }, 'Notifications aren’t turned on yet'),
    // v24 Designer findings: was 40px tall (4px under the app's 44px touch-target floor) and
    // styled identically to the low-stakes "Replay the walkthrough" button right below it, even
    // though this is the fix for an actual functional gap (no reminders fire until it's tapped) —
    // now uses the app's solid-fill primary-action treatment (same as the Calendar modal's Add/
    // Save button) so it visually reads as "the thing to tap," not an optional extra.
    h('button', { onClick: () => { requestNotifPermission().then(() => setState({})); }, style: { marginTop: '8px', minHeight: '44px', padding: '0 16px', borderRadius: '11px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '13px', fontWeight: '800', boxShadow: '0 6px 18px rgba(168,61,15,0.32)' } }, 'Turn on notifications')
  );
}

function sendNotif(title, body, tag) {
  if (isNativeApp()) {
    try {
      window.Capacitor.Plugins.LocalNotifications.schedule({
        notifications: [{
          // 31-bit int id required by Android; tag text is hashed in so repeat notifications for
          // the same event (e.g. the same missed-dose window) reliably replace one another instead
          // of stacking, matching the old web path's `tag` de-dupe behavior.
          id: Math.abs([...tag].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) % 2147483647,
          title, body,
          schedule: { at: new Date(Date.now() + 300) },
          smallIcon: 'ic_stat_chemowell'
        }]
      });
    } catch (e) { /* native delivery failed silently — never blocks the app */ }
    return;
  }
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
  } catch(e) {
    // Fallback for mobile: use service worker registration
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
      }).catch(() => {});
    }
  }
}

// Generic per-medication dose reminders (v16). Reminders used to fire on a hardcoded clock schedule
// for five hardcoded legacy medication ids (protonix/iron/compazine/buspirone/paroxetine) — ids no
// real user-created medication can ever have (RESERVED_LEGACY_MED_IDS exists specifically to stop a
// new medication from inheriting another patient's rules), so every branch was unreachable dead code
// for every real install: there was no way to get a reminder for a medication you actually added. This
// replaces that with a med-agnostic reminder driven by the exact same source of truth the passive
// missed-dose banner already uses (missedDosesFor): a medication's own `windows` (from the "Schedule
// windows" editor field) and its auto-derived `alerts` flag. Pulled out as a pure function (like
// doseProgressToday) so it's unit-testable via a Node harness even though checkNotifications() itself
// only actually fires in the native APK build or a non-TEST_MODE web install (see below).
function dueRemindersAt(nowDate) {
  const nowTs = nowDate.getTime();
  const h = nowDate.getHours(), m = nowDate.getMinutes();
  const d0 = dayStart(nowTs);
  const due = [];
  // v42 (Aaron-requested, 2026-08-08): dose reminders used to go silent 10 PM-8 AM ("quiet
  // hours"), with no warning anywhere that a chosen time would never fire -- found via a live
  // APK test where a 10:30 PM dose never notified. Appointment reminders were always deliberately
  // exempt from this same gate (see buildReminderPlan below), on the reasoning that a caregiver
  // needs to be woken for a time-sensitive appointment; a medication dose is at least as
  // time-sensitive, so the inconsistency is removed rather than papered over with a warning.
  // Dose reminders now fire any hour, same as appointments. The daily check-in nudge (a
  // non-critical, once-a-day prompt, not a medication safety mechanism) intentionally keeps its
  // own separate 8 AM-10 PM window further down in this file.
  state.meds.filter(med => med.alerts && med.windows && med.windows.length).forEach(med => {

const NOTIF_CHANNEL_DOSE = 'chemowell_dose_reminders';
const NOTIF_CHANNEL_APPT = 'chemowell_appointment_reminders';
const NOTIF_CHANNEL_CHECKIN = 'chemowell_daily_checkin';
const NOTIF_HORIZON_MS = 72 * 3600 * 1000;      // how far ahead the plan looks

// receive, register, and fire it in time -- arming it anyway risks a race where the alarm is set
// after the moment it was meant to fire. Anything closer than this is simply left off the plan; it
// already fired via the reactive path moments earlier on a running app, or it's acceptably missed
// on a closed one this one time and self-heals on the next sync.

  notifSyncBusy = true;
  try {
    await ensureNotifChannels(ln);
    notifPermState = (await ln.checkPermissions()).display;
    if (ln.checkExactNotificationSetting) {
      notifExactState = (await ln.checkExactNotificationSetting().catch(() => ({ exact_alarm: 'unknown' }))).exact_alarm;
    }
    if (notifPermState !== 'granted') { notifLastSyncAt = Date.now(); return; }

    const pendingRes = await ln.getPending();
    const pending = (pendingRes && pendingRes.notifications) || [];
    const planIds = new Set(plan.map(n => n.id));
    // Reconcile against getPending(), never against notifPlanApplied -- getPending() reflects what
    // is truly armed on the device right now, which is the only thing safe to cancel or leave alone.
    const guardEnd = nowTs + NOTIF_MIN_LEAD_MS;
    const toCancel = pending.filter(p => !planIds.has(p.id)).filter(p => {
      // Protection band: don't race a cancel against an id that may already be mid-fire.
      const applied = notifPlanApplied.find(a => a.id === p.id);
      return !applied || applied.at > guardEnd;
    });
    const pendingKeyById = new Map(pending.map(p => [p.id, (p.extra && p.extra.pk) || null]));
    const toSchedule = plan.filter(n => pendingKeyById.get(n.id) !== n.pk);

    if (toCancel.length) await ln.cancel({ notifications: toCancel.map(p => ({ id: p.id })) });
    if (toSchedule.length) {
      await ln.schedule({
        notifications: toSchedule.map(n => ({
          id: n.id, title: n.title, body: n.body,
          schedule: { at: new Date(n.at), allowWhileIdle: true },
          channelId: n.channelId, smallIcon: 'ic_stat_chemowell',
          extra: { kind: n.extra.kind, profileId: n.extra.profileId, medId: n.extra.medId || null, apptId: n.extra.apptId || null, dayTs: n.extra.dayTs || null, at: n.at, pk: n.pk }
        }))
      });
    }

    notifPlanApplied = plan.map(n => ({ tag: n.tag, id: n.id, at: n.at }));
    notifScheduledCount = notifPlanApplied.length;
    notifNextAt = notifPlanApplied.length ? Math.min(...notifPlanApplied.map(p => p.at)) : 0;
    notifLastSignature = signature;
    notifLastSyncAt = Date.now();
    notifSyncFailed = false;
    notifSyncErrMsg = '';
  } catch (e) {
    // A failed sync must not clear notifPlanApplied or the count/next-at derived from it -- the UI
    // keeps showing the last known-good armed state (labeled as failed) rather than snapping to
    // "0 reminders," and cancelReminderForEntry() keeps working off the last-known-accurate plan.
    notifSyncFailed = true;
    notifSyncErrMsg = (e && e.message) || String(e);
    // console.error is deliberately never used here: the release verification harnesses fail a run
    // on any console message of type 'error', and a native scheduling failure (permission revoked
    // behind our back, OS quota) is an expected, handled condition, not a bug to crash a CI run over.
    console.warn('[ChemoWell] native reminder sync failed:', notifSyncErrMsg);
    notifLastSignature = ''; // don't let a stale signature suppress a genuine retry next time
  } finally {
    notifSyncBusy = false;
    if (notifSyncAgain) { notifSyncAgain = false; markNotifDirty(); }
    setState({});
  }
}

// Nearly everything that changes the plan calls this instead of syncNativeReminders() directly. It
// coalesces a burst of changes (e.g. editing several medications in a row) into one sync 400ms later,
// and lets syncNativeReminders() work out whether anything actually needs to reach the bridge.
function markNotifDirty() {
  if (!isNativeApp()) return;
  if (notifDirtyTimer) return;
  notifDirtyTimer = setTimeout(() => { notifDirtyTimer = null; syncNativeReminders(); }, 400);
}

// Logging a dose is the highest-frequency event in the app and the one with the tightest feedback
// expectation: tap "taken," the reminder for that window should stop existing. A full rebuild would
// do it, but it would also cancel-and-recreate every other armed alarm on every single tap. So this
// path is deliberately surgical -- cancel exactly the one id -- while config changes (which are rare
// and can invalidate anything) get the full rebuild via markNotifDirty(). Cancelling here also pulls
// the reminder out of the notification shade if it already fired, which is the correct outcome: the
// dose is in.
async function cancelReminderForEntry(entry) {
  try {
    if (!isNativeApp() || !entry || !entry.medId) return;
    const ln = lnPlugin();
    if (!ln) return;
    const med = (state.meds || []).find(m => m.id === entry.medId);
    if (!med || !med.windows || !med.windows.length) return;
    const ts = Number(entry.ts);
    if (!Number.isFinite(ts)) return;
    const d0 = dayStart(ts);
    const ids = [];
    med.windows.forEach(w => {
      if (ts < hourTs(d0, w.start) || ts >= hourTs(d0, w.end)) return; // dose isn't in this window
      const tag = notifDoseTag(ACTIVE_PROFILE_ID, med, w, d0);
      const hit = notifPlanApplied.find(p => p.tag === tag);
      if (hit) ids.push(hit);
    });
    if (!ids.length) return;
    await ln.cancel({ notifications: ids.map(p => ({ id: p.id })) });
    notifPlanApplied = notifPlanApplied.filter(p => ids.indexOf(p) === -1);
    notifScheduledCount = notifPlanApplied.length;
    notifNextAt = notifPlanApplied.length ? Math.min(...notifPlanApplied.map(p => p.at)) : 0;
    // Force the next sync to genuinely reconcile rather than short-circuit on an unchanged
    // signature: what's armed on the device no longer matches what that signature described, and a
    // freed slot may need backfilling if the plan was previously truncated at NOTIF_MAX_PENDING.
    notifLastSignature = '';
  } catch (e) { /* a failed targeted cancel self-heals on the next full sync */ }
}

// Reads the two pieces of OS state the caregiver can turn off behind our back (notification
// permission, exact-alarm permission) into the single status this section's card renders from.
function nativeNotifStatus() {
  if (!isNativeApp()) return 'web';
  if (TEST_MODE && !!state.dateOffsetDays) return 'paused_sim';
  if (notifPermState === 'unknown') return 'checking';
  if (notifPermState === 'denied') return 'blocked';
  if (notifPermState === 'prompt' || notifPermState === 'prompt-with-rationale') return 'not_asked';
  if (notifSyncFailed) return 'failed';
  if (notifExactState === 'denied') return 'on-exact';
  if (notifScheduledCount === 0) return 'empty';
  return 'on';
}

async function changeExactNotificationSetting() {
  if (notifActionBusy) return;
  notifActionBusy = true;
  const ln = lnPlugin();
  try {
    if (ln && ln.changeExactNotificationSetting) {
      await ln.changeExactNotificationSetting();
      // The OS settings screen is modal from the caregiver's perspective -- by the time control
      // returns here they've either granted it or backed out. Re-read the real state rather than
      // assuming success, since "opened the screen" and "allowed it" are different outcomes.
      if (ln.checkExactNotificationSetting) {
        notifExactState = (await ln.checkExactNotificationSetting()).exact_alarm;
      }
      if (notifExactState === 'granted') { setToast('Exact reminders are allowed.'); markNotifDirty(); }
      else { setToast('Open your phone’s Settings → Apps → ChemoWell → Alarms & reminders to allow this.'); }
    } else {
      // Older Capacitor local-notifications builds don't expose this method at all. There's no OS
      // jump available in that case, but a dead button with zero feedback is worse than an honest
      // toast telling the caregiver exactly where to go by hand.
      setToast('Open your phone’s Settings → Apps → ChemoWell → Alarms & reminders to allow this.');
    }
  } catch (e) {
    setToast('Open your phone’s Settings → Apps → ChemoWell → Alarms & reminders to allow this.');
  } finally {
    notifActionBusy = false;
    setState({});
  }
}

async function retryNotifPermission() {
  if (notifActionBusy) return;
  notifActionBusy = true;
  const ln = lnPlugin();
  try {
    if (ln) { await ln.requestPermissions(); }
    await refreshNativeNotifStatus(true);
    syncNativeReminders({ force: true }).catch(() => {}).then(() => { notifActionBusy = false; setState({}); });
    return;
  } catch (e) { /* fall through to reset the busy flag below */ }
  notifActionBusy = false;
  setState({});
}

subscribePush();

// Init
if (!getPrefsDB().installedAt) { setPrefsDB({ installedAt: Date.now() }); }
unsubPrefs = subscribePrefs((prefs) => {
  if (prefs.installedAt) MISSED_TRACK_SINCE = prefs.installedAt;
  CONFIG.tempUnit = prefs.tempUnit === 'Celsius' ? 'Celsius' : 'Fahrenheit';
  CONFIG.weightUnit = prefs.weightUnit === 'kg' ? 'kg' : 'lbs';
  CONFIG.patientName = (prefs.patientName || '').trim();
  // v33: a profile just created via "Add profile" carries the name typed there — prefill the
  // setup form with it (once; never clobber something the user has since typed on the form).
  if (!CONFIG.patientName && prefs.pendingName && !setupNameDraft) setupNameDraft = prefs.pendingName;
  setState({ missedClearedAt: prefs.missedClearedAt || 0, dismissedMisses: prefs.dismissedMisses || [], patientName: CONFIG.patientName, prefsLoaded: true, supportPromptAt: prefs.supportPromptAt || 0, supportOptOut: !!prefs.supportOptOut, browserNoticeSeen: !!prefs.browserNoticeSeen });
});
unsub = subscribeEntries((entries) => {
  const wasEmpty = state.entries.length === 0 && !state.loaded;
  if (state.timeModal) {
    // Defer update so the modal isn't destroyed mid-interaction
    pendingEntries = entries;
    if (!state.loaded) { state.loaded = true; state.entries = entries; }
    return;
  }
  setState({ entries, loaded: true });
  // One-time move of the app-v21 weightReason:'paracentesis' shape into standalone records.
  // Idempotent, so running it on every load is safe and self-healing; it returns 0 and touches
  // nothing once there is nothing left to move.
  try {
    const moved = paraMigrateLegacy();
    if (moved) console.info('[paracentesis] moved ' + moved + ' legacy record(s) off the weight entry');
  } catch (err) { console.warn('[paracentesis] migration skipped:', err); }

});

setInterval(() => {
  state.now = simNow();
  const activeTag = document.activeElement && document.activeElement.tagName;
  const isEditing = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA';
  // upgradeOpen joins timeModal in the tick guard (v11): rebuilding the plans sheet every second
  // replayed its 320ms sheetUp entry animation and reset its internal scroll — the "flickering,
  // adjusting popup" Aaron saw on his phone. Interaction re-renders still repaint it instantly.
  // drawerOpen/apptModal join the same guard (v22): without it, a focused element inside the drawer
  // or the appointment form would be destroyed and re-created every second by the full-tree rebuild,
  // silently dropping keyboard focus (and defeating the drawer's Tab-trap) the instant the tick fired.
  // medEditor/infoModal join the same guard (v27, Aaron-reported): the medication editor was left out
  // of this list by oversight, so the whole sheet -- including the small "?" help-icon badge next to
  // Schedule windows -- was being torn down and rebuilt every single second while it sat open, which
  // read as the icon "flashing"/disappearing. infoModal (the help-icon's own explanation sheet) gets
  // the same guard for the same reason -- it's a bottom sheet exactly like plans/appt, not a live view.
  // v45: this exclusion list is a recurring bug class in this file (v11, v22, v27 all hit the same
  // thing — a new modal/confirm state gets added somewhere below and nobody remembers to also list it
  // here, so the 1s tick silently rebuilds the whole DOM under it). Added the "Erase all data" modal
  // and every tap-to-arm delete-confirm state this time (Aaron's live report: "screen keeps refreshing
  // constantly" while trying to permanently delete things) — each of these either replays its entrance
  // animation or just visibly flickers every second while open, since render() tears down and rebuilds
  // the whole tree regardless of what's showing.
  // v55: the Help view joins this list. It has a search box the user types into, and the 1s
  // tick rebuilds the entire tree -- which destroys the focused input and eats the keystroke.
  // The isEditing check above already covers a focused field, but the whole Help view is
  // excluded outright because nothing on it is time-dependent, so there is nothing for the
  // tick to update there and no reason to leave a second way for this bug to come back a
  // fifth time. Interaction re-renders (setState/render) still repaint it instantly.
  if (state.view !== 'help'
      && !state.timeModal && !state.upgradeOpen && !state.drawerOpen && !state.apptModal && !state.noteModal && !state.checkinModal && !state.medEditor && !state.infoModal && !state.eraseAllModalOpen && !state.confirmDeleteMed && !state.confirmDeleteAppt && !state.confirmDeleteNote && !state.confirmDeleteProfile && !state.confirmRemove && !isEditing) render();
  checkNotifications();
  checkAppointmentReminders();
  // v35 backstop. Everything that changes the plan already calls markNotifDirty(), but a backstop
  // costs almost nothing here and covers the cases no hook can see: local midnight sliding the 72h
  // horizon, a reminder firing and freeing a slot, or a future change that forgets to add its own
  // hook. force:true is required here (Auditor F3, live-tested): without it, the signature
  // short-circuit inside syncNativeReminders() runs BEFORE the permission re-check, so if the OS
  // permission is silently revoked behind the app's back while the ideal plan's shape happens not to
  // have changed, this backstop can itself do nothing -- leaving the Settings card claiming
  // "Notifications are on" indefinitely with no path back to "blocked." force:true makes every field
  // (including a live permission re-read) genuinely re-checked every time this fires, matching every
  // other "make sure this really happens" call site in this file.
  if (isNativeApp() && Date.now() - notifLastSyncAt > NOTIF_SYNC_MAX_AGE_MS) syncNativeReminders({ force: true });
}, 1000);
if (!getPrefsDB().tourDone && (getPrefsDB().patientName || '').trim()) { const savedStep = getPrefsDB().tourStep; state.tourStep = (typeof savedStep === 'number' && savedStep >= 0 && savedStep < TOUR_STEPS.length) ? savedStep : 0; }
render();

// v35: arm the native reminder set once at boot, unconditionally. subscribeEntries() above calls its
// listener synchronously, so state.entries/state.loaded are already populated by the time execution
// reaches here. force:true skips the signature short-circuit because a fresh app process knows
// nothing about what's armed -- and after a reboot or app update, what's armed may be stale, partial,
// or left over from an older build's id scheme.
if (isNativeApp()) {
  refreshNativeNotifStatus(true);
  refreshBatteryOptStatus();
  syncNativeReminders({ force: true });
}

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Proactively check for a newer sw.js on every load instead of relying solely on the
    // browser's own background update check, which can be slow/throttled and left this
    // testing app running stale cached JS (with already-pushed bug fixes not applying) for
    // multiple page loads during the 30-use-case QA pass — found while verifying UC11.
    reg.update().catch(() => {});
  }).catch(() => {});

  // Once a new service worker activates and takes control, reload once so this tab picks up
  // the new app shell immediately rather than continuing to run the JS it started with.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
