    if (child == null || child === false) continue;

// v27 (Aaron-reported): scrollTo(0,0) called synchronously right after a tap can get quietly undone
// on mobile Safari, which resizes the viewport (collapsing/expanding the URL bar) a frame or two
// AFTER the tap -- the page looks like it "jumps down too far" once that resize settles, landing
// below the field the user is meant to type into. A second scrollTo on the next animation frame,
// after that settle has happened, fixes it without changing behavior on browsers that don't have
// this quirk (the second call is a no-op there since the first already landed at 0,0).
// v28 (Aaron-reported regression from the above): navigateTo('home') calls this, and the SAME call
// can also synchronously trigger the guided tour's own positionTour(), which -- for a step whose
// target sits further down the page (e.g. "quick-log", pointing at the newly-added medication card)
// -- deliberately scrolls somewhere other than 0. That legitimate scroll was getting silently undone
// a frame later by this function's own deferred safety net, which doesn't know anything scrolled on
// purpose in between and just resets back to 0 -- Aaron saw this as the tour's popup card sitting up
// top while the medication it was pointing at stayed off-screen at the bottom. scrollAdjustToken lets
// any later, more-authoritative scroll action (positionTour bumps it before its own scrollIntoView)
// cancel a still-pending deferred reset from an earlier scrollToTop() call.
let scrollAdjustToken = 0;

  const token = ++scrollAdjustToken;
  window.scrollTo(0, 0);
  requestAnimationFrame(() => { if (token === scrollAdjustToken) window.scrollTo(0, 0); });
}
function navigateTo(view) {
  const editorClosing = !!state.medEditor && view !== 'meds'; // audit v12 P3-1: nav-away also closes the editor

  // v55: tapping Help in the menu always lands on the top level, the same way tapping Reports
  // always lands on the report list. Coming back to a walkthrough you left three screens deep,
  // with a stale search still in the box, is not what "Help" reads like it will do.
  if (view === 'help') { helpQuery = ''; next.help = { cat: null, topic: null }; }
  // v57 (Auditor R2-E): a toast describes something that just happened on the screen you were on.
  // Carrying it across a navigation is noise at best, and at worst it paints over the destination's
  // own content for 4.5s -- which is how it ended up covering the Help search screen's care-team
  // button at 320px. Cleared here rather than chased with offsets on each screen it might land on.
  if (state.toast) next.toast = null;
  setState(next);
  persistView(view);
  scrollToTop();
  if (editorClosing) tourEvent('medEditor:closed'); // step the tour back BEFORE the view event so it re-points at Add
  tourEvent('view:' + view);
}

// ---- Left-side nav drawer (app-v22) — houses Profile/Calendar/Settings per Owner request. Kept
// as its own small state machine (not just a boolean) so open/close can manage focus properly:
// the trigger button ref is remembered so focus returns to it on close, matching standard
// dialog/drawer accessibility behavior (Designer research: M3 navigation drawer guidelines).

function openDrawer() {

  // mid-tour buries the tour with no way back short of closing the drawer first. The hamburger has
  // no reason to be tapped mid-tour (the tour's own Skip/Back/Next controls are always available),
  // so simplest fix is just not opening the drawer while a tour is in progress.
  if (state.tourStep != null) return;
  drawerTriggerEl = document.querySelector('[data-tour="menu-btn"]');

  setState({ drawerOpen: false });

// Escape closes the drawer from anywhere; Tab is trapped inside it while open so keyboard focus
// can't silently leave into the (visually obscured, scrim-covered) app behind it. Registered once
// at module scope, not per-render, so it never double-attaches.
document.addEventListener('keydown', (ev) => {
  if (!state.drawerOpen) return;
  if (ev.key === 'Escape') { ev.preventDefault(); closeDrawer(); return; }
  if (ev.key === 'Tab') {
    const panel = document.getElementById('app-drawer');
    if (!panel) return;
    const focusables = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }

// onboarding) opens the on-screen keyboard, which resizes the visible viewport -- on some mobile
// browsers the page settles scrolled to a spot that leaves the just-focused field above the fold,
// so the user has to manually scroll back up to see what they're typing. A short delay lets the
// keyboard's own open animation finish resizing the viewport first, then nudges the focused field
// into view -- registered once at module scope (like the drawer's Tab-trap above) so it never
// double-attaches on re-render.

  const el = ev.target;

});

// Dose-progress ring (item 11): 44px SVG built as an innerHTML string, matching the existing
// lockSVG / weight-chart string pattern. Hidden entirely when nothing is scheduled today.
function doseRing(now) {
  const { scheduled, taken } = doseProgressToday(now);
  if (scheduled === 0) return null;
  const complete = taken >= scheduled && scheduled > 0;
  const C = 113.1; // 2π·18
  const offset = C * (1 - taken / scheduled);
  let svg = '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">';
  svg += '<circle cx="22" cy="22" r="18" stroke="#F3C7B4" stroke-width="4" fill="none"></circle>';
  svg += '<circle cx="22" cy="22" r="18" stroke="' + (complete ? '#0F9D6B' : '#BF4C1A') + '" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 22 22)" style="transition: stroke-dashoffset .5s ease"></circle>';
  svg += complete
    ? '<text x="22" y="27" text-anchor="middle" font-size="16" font-weight="800" fill="#0C7F57">✓</text>'
    : '<text x="22" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2127" font-family="ui-monospace,Menlo,monospace">' + taken + '/' + scheduled + '</text>';
  svg += '</svg>';
  return h('div', { innerHTML: svg, role: 'img', 'aria-label': taken + ' of ' + scheduled + ' scheduled doses logged today', style: { display: 'inline-flex', marginTop: '4px' } });
}

// Left-side nav drawer (app-v22, Owner-requested) — houses Profile / Calendar / Settings, the

// pill-shaped active indicator, and real dismissal (scrim tap, Escape, or the explicit X — see

function renderDrawer() {
  if (!state.drawerOpen) return null;

    // shrink every existing touch target below what the Designer signed off on. The drawer already
    // houses the app's other "check in on sometimes, not a daily quick-log" destinations.
    { key: 'notes', label: 'Notes', icon: 'notes', helper: 'Daily journal' },
    { key: 'help', label: 'Help & FAQ', icon: 'help', helper: 'Find and fix a problem' },

      // Identity header (app-v22 audit fix): the close "X" is now its own top-right button, not
      // nested inside the identity button. Two real bugs from the first pass, fixed together:
      // (1) a nested <button><span role=button></span></button> is invalid markup and inconsistent
      // across screen readers; (2) because the drawer opens flush to the header's top-left, the old
      // full-width identity button placed interactive area right where the hamburger used to be, so
      // a fast double-tap on the hamburger could land its second tap on the newly-rendered identity

      // the X to the top-right corner (away from the hamburger's top-left position) removes the
      // coordinate collision entirely, regardless of tap timing.
      h('div', { style: { position: 'relative', padding: '20px 56px 20px 18px', borderBottom: '1px solid #E9D8D1' } },
        h('button', { id: 'drawer-close-btn', onClick: closeDrawer, 'aria-label': 'Close menu', style: { position: 'absolute', top: '8px', right: '8px', width: '44px', height: '44px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#915E48', background: 'transparent' } }, appIcon('x', 18)),

            appIcon(item.icon, 22, { color: active ? '#0A6B4A' : '#6D5247', flexShrink: '0' }),
            h('div', { style: { textAlign: 'left', minWidth: '0' } },

// Shared renderer for a "grouped" meds card (Evening meds, Morning meds) — a set of `type:'win'`
// meds presented together in one card with a "Take all" button when 2+ are currently open, instead
// of scattering them across the individual Quick Log cards. Used for the Protonix-linked meds
// (Buspirone/Paroxetine in the morning, Iron/Compazine in the evening).
function renderGroupedMedsCard(title, meds, now) {
  // v20: paused and treatment-window-hidden meds are excluded from "due"/"Take all" the same way
  // medCards' upstream filter already excludes them for standalone Quick Log cards.
  const dueMeds = meds.filter(m => { if (m.paused) return false; if (treatmentOnlyBlocks(m, now)) return false; if (treatmentExcludedNow(m, now)) return false; if (!medScheduledOn(m, now)) return false; const s = status(m); return !s.locked; });
  return h('section', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' } },
      h('div', { style: { ...TYPE.label, color: '#915E48' } }, title),
      // 'Take all' was hidden for the whole of a stay, left behind when the Restricted tiles
      // were deleted in app-v67. A caregiver home for the evening on a half-day stay needs it
      // most, not least. Both web builds removed it correctly; this one did not.
      (dueMeds.length >= 2) ? h('button', { onClick: () => setState({ timeModal: { type: 'multi', medIds: dueMeds.map(m => m.id), timeValue: nowLocalISO() } }), style: { minHeight: '44px', padding: '0 16px', borderRadius: '11px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '13.5px', fontWeight: '700', boxShadow: '0 6px 18px rgba(168,61,15,0.32)' } }, 'Take all (' + dueMeds.length + ')') : null
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '18px', overflow: 'hidden', marginTop: '11px', boxShadow: '0 4px 24px rgba(203,122,87,0.10), 0 1px 2px rgba(203,122,87,0.06)' } },
      ...meds.map((med, i) => {
        if (med.paused) {
          // v20: pause wins over every other row state, matching medCards' standalone card ordering.
          // Designer review (v20): apply the same opacity:0.65 muting as the treatment-excluded row
          // just below, so this card has one consistent "row is inert" visual language instead of a
          // third, weaker one of its own; copy also aligned with the standalone Home card's wording.
          return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none', opacity: '0.65' } },
            h('div', { style: { flex: '1', minWidth: '0' } },
              h('div', { style: { ...TYPE.title, color: '#554A52' } }, med.name + ' \u2014 Paused'),
              h('div', { style: { ...TYPE.caption, color: '#7A6E76', marginTop: '2px' } }, 'Not tracked while paused. Resume anytime.')
            ),
            h('button', { onClick: () => setMedicationPaused(med.id, false), style: { flexShrink: '0', minHeight: '44px', padding: '0 16px', borderRadius: '999px', background: '#FFFFFF', border: '1px solid #D7B8AA', color: '#6D5247', fontSize: '13px', fontWeight: '700' } }, 'Resume')
          );
        }
        if (treatmentOnlyBlocks(med, now) || treatmentExcludedNow(med, now)) {
          // v20: this grouped-card path never gated treatmentOnly/excluded at all before this
          // release (a pre-existing gap noted in the schedule-window brief's blast-radius review) --
          // closing it now for both directions rather than leaving grouped placement inconsistent
          // with standalone Quick Log cards, which have always hidden the card outright here.
          return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none', opacity: '0.65' } },
            h('div', { style: { flex: '1', minWidth: '0' } },
              h('div', { style: { ...TYPE.title, color: '#554A52' } }, med.name),
              h('div', { style: { ...TYPE.caption, color: '#7A6E76', marginTop: '2px' } }, med.treatmentOnly ? (isOtherTreatmentType() ? 'Outside its date window' : 'Outside its treatment-day window') : (isOtherTreatmentType() ? 'Excluded near your date' : 'Excluded near treatment day'))
            )
          );
        }
        // v26 (Aaron-requested): matches medCards' equivalent fix -- a day-restricted medication now
        // falls through to the normal override-capable row instead of a dead-end inert row, so every
        // medication has the same "log it anyway" option regardless of why it's not the default
        // available state. In-patient USED to win outright here -- "hospital-administered, not
        // overridable" -- which made it the single blocked state with no way to log anyway. That was
        // the whole trap: a caregiver at the bedside, or home for the evening on a half-day stay,
        // had no way to record a real dose. Aaron: "I had to end in patient bc I couldn't enter the
        // Dex for the evening." An app must never require falsifying one true record to enter
        // another. In-patient now falls through to the same override-capable row as every other
        // reason, and the hospital's own doses are handled by inpatientCoversMoment() instead.
        // `!inpatientNow &&` was left here when the Restricted tile above was deleted, and it
        // forced offDay FALSE for the whole of a stay -- so an unscheduled medication rendered a
        // full Log button that did nothing when tapped (logMed re-derives correctly and diverts),
        // and the override prompt then said 'Closed - opens later' instead of 'Not scheduled
        // today'. The rewritten Help topic promises nothing is locked; this made that untrue.
        const offDay = !medScheduledOn(med, now);
        const st = status(med);
        const locked = !!st.locked || offDay;
        const todayLogs = entriesFor(med.id).filter(e => e.ts >= dayStart(now));
        const lastToday = todayLogs[todayLogs.length - 1];
        const isOv = !!(state.override && state.override.medId === med.id);
        // v23 bugfix: this card's ceiling handling was silently broken -- a medication that hit its
        // daily limit (st.ceilingHit, no rollingCeilingH) has no st.availableAt at all, so the old
        // "Opens " + fmtTime(undefined) button rendered as "Opens Invalid Date", and the override
        // button unconditionally said "Log early" even when the real reason was the daily limit, not
        // a gap timer. Also brings the override capability here in line with the standalone Quick Log
        // card (Aaron: "there isn't a way to override taking a med if over the limit"). Auditor v23
        // re-review caught a second reachable case (st.courseComplete -- a treatment-only medication
        // whose window has ended) that still hit the same "Invalid Date" bug; handled alongside
        // ceilingHit here rather than leaving one case fixed and the other not. Designer v23 re-review
        // caught the override buttons had no explanatory copy (unlike the standalone card's red
        // banner) and sat at 42px, under the app's 44px touch-target floor -- both fixed below.
        const overrideReasonLabel = st.courseComplete ? 'Course complete' : st.ceilingHit ? 'Log over limit' : offDay ? 'Log anyway' : 'Log early';
        const overrideExplain = st.courseComplete
          ? 'This medication’s treatment window has ended. Log it anyway?'
          : st.ceilingHit
            ? 'This would go over today’s limit. Log it anyway?'
            : offDay
              ? ('Not scheduled today (' + scheduleDaysLabel(med) + '). Log it anyway?')
              : ('Closed — opens ' + (st.availableAt ? fmtTime(st.availableAt) : 'later') + '. Log it early anyway?');
        let right;
        if (isOv) {
          right = h('div', { style: { display: 'flex', gap: '7px', flexShrink: '0' } },
            h('button', { onClick: () => logMed(med.id, med.doses ? med.doses[0] : null, { force: true }), style: { minHeight: '44px', padding: '0 13px', borderRadius: '11px', background: '#C0453B', color: '#fff', fontSize: '13px', fontWeight: '700' } }, overrideReasonLabel),
            h('button', { onClick: () => setState({ override: null }), style: { minHeight: '44px', padding: '0 11px', borderRadius: '11px', background: 'rgba(255,255,255,0.5)', border: '1px solid rgba(246,108,49,0.15)', color: '#7A6E76', fontSize: '13px', fontWeight: '600' } }, 'Cancel')
          );
        } else if (!locked) {
          right = h('button', { onClick: () => logMed(med.id, med.doses ? med.doses[0] : null), style: { minHeight: '44px', padding: '0 20px', borderRadius: '12px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '14px', fontWeight: '700', boxShadow: '0 6px 18px rgba(168,61,15,0.32)', flexShrink: '0' } }, 'Log');
        } else {

function renderContent(now, mg, pct, tyColor, ceiling) {
  if (state.view === 'meds') return renderMedicationManager(now);
  if (state.view === 'settings') return renderSettings(now);
  if (state.view === 'account') return renderAccount(now);
  if (state.view === 'reports') return state.reportsView ? renderReportDetail(state.reportsView, now) : renderReportsMenu(now);
  if (state.view === 'inpatient') return renderInPatient(now);
  if (state.view === 'symptoms') return renderSymptoms(now);
  if (state.view === 'calendar') return renderCalendarView(now);
  // v55 (Auditor V55-4): this router used to carry a second arm for the retired 'faq' view value,
  // with a comment claiming it caught an old persisted one. It could not: restoreView() filters
  // against VALID_VIEWS (line ~784), which has never listed that value, so it was unreachable the
  // moment it stopped being set. Removed rather than left as a comforting no-op — dead branches
  // with confident comments are how the next reader gets misled about what the router accepts.
  // (state.faqOpenId is unrelated and still live: it is the Common-questions accordion.)
  if (state.view === 'help') return renderHelpView(now);
  if (state.view === 'report') return renderReportView(now);
  if (state.view === 'notes') return renderNotesView(now);
  return [...renderToday(now, mg, pct, tyColor, ceiling)];
}

  const monthLabel = first.toLocaleDateString([], { month: 'long', year: 'numeric' });
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const dstr = (d) => cy + '-' + String(cm).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  return h('div', { style: { background: 'rgba(255,255,255,0.5)', border: '1px solid #E9D8D1', borderRadius: '13px', padding: '10px 10px 6px' } },
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' } },
      h('button', { onClick: () => onNav(-1), 'aria-label': 'Previous month', style: { minHeight: '44px', minWidth: '44px', borderRadius: '8px', background: 'rgba(246,108,49,0.1)', color: '#BF4C1A', fontSize: '16px', fontWeight: '700' } }, '\u2039'),
      h('div', { style: { fontSize: '13.5px', fontWeight: '800', color: '#2A2127' } }, monthLabel),
      h('button', { onClick: () => onNav(1), 'aria-label': 'Next month', style: { minHeight: '44px', minWidth: '44px', borderRadius: '8px', background: 'rgba(246,108,49,0.1)', color: '#BF4C1A', fontSize: '16px', fontWeight: '700' } }, '\u203a')
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', marginBottom: '2px' } },
      ...['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(l => h('div', { style: { textAlign: 'center', fontSize: '12px', fontWeight: '700', color: '#915E48', padding: '2px 0' } }, l))
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', paddingBottom: '4px' } },
      ...cells.map(d => {
        if (d === null) return h('div', null);
        const ds = dstr(d);
        const isSel = ds === dateStr;
        const isToday = ds === todayStr;
        // 40px day cells: 44px is not achievable in a 7-col grid inside the 320px modal; 40px + 2px
        // gap is the documented acceptable floor (design batch 3, item 14 known deviation).
        return h('button', { onClick: () => onPick(ds), style: { minHeight: '40px', borderRadius: '9px', fontSize: '13px', fontWeight: isSel ? '800' : '600', background: isSel ? '#BF4C1A' : (isToday ? 'rgba(246,108,49,0.14)' : 'transparent'), color: isSel ? '#fff' : '#2A2127', border: isToday && !isSel ? '1px solid rgba(246,108,49,0.45)' : '1px solid transparent' } }, String(d));
      })
    )
  );
}

  } else if (m.type === 'multi') {
    title = 'Log ' + m.medIds.length + ' meds · ' + m.medIds.map(id => nameOf(id)).join(', ');
  } else if (m.type === 'temp') {

// Per-missed-window actions (v68, per Aaron's request): a late-logged dose was previously
// resolved only by inference (logging any same-day dose and hoping missedDosesFor's coverage
// math caught it), with no explicit way to say "I gave this late" vs "this was deliberately
// skipped" vs "just dismiss this, nothing to log". Now each row offers all three explicitly.
function missedRow(e, i) {
  return h('div', { style: { padding: '12px 14px', borderTop: i > 0 ? '1px solid rgba(192,69,59,0.2)' : 'none', background: 'rgba(192,69,59,0.06)', borderLeft: '3px solid #C0453B' } },

      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, color: '#2A2127', display: 'flex', alignItems: 'center', gap: '7px', flexWrap: 'wrap' } },
          nameOf(e.medId),
          h('span', { style: { fontSize: '12px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#A5443C', background: 'rgba(192,69,59,0.12)', borderRadius: '6px', padding: '2px 7px' } }, 'Missed')
        ),
        h('div', { style: { ...TYPE.caption, color: '#7A6E76' } }, e.windowName + ' window closed')
      )
    ),
    h('div', { style: { display: 'flex', gap: '6px', marginTop: '10px' } },
      h('button', { onClick: () => logMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#C0453B', color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Took later'),
      h('button', { onClick: () => skipMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#FFFFFF', border: '1px solid #E3C2BE', color: '#A5443C', fontSize: '13px', fontWeight: '700' } }, 'Skipped'),
      h('button', { onClick: () => dismissMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#FFFFFF', border: '1px solid #E3C2BE', color: '#A5443C', fontSize: '13px', fontWeight: '700' } }, 'Clear')
    )
  );
}

// Weight, Cycle markers, Bowel Movement, and Symptoms entries aren't part of the medication
// dosing safety chain the 48h lock protects, so they stay editable/removable indefinitely
// (data-entry corrections only). Symptoms use a medId prefix (symptom_nausea, etc.) rather than
// a fixed id, so those are matched separately below instead of being listed in this set.
const BYPASS_48H_IDS = new Set(['weight', 'cycle_start', 'cycle_end', 'bowel_movement', 'appetite', 'radiation_session', 'blood_pressure']);
// blood_pressure joined in v33: its report rows now use the shared removeBtn (two-tap confirm), and
// like weight it's a vital reading outside the dosing safety chain — corrections stay open forever.
function bypasses48h(medId) { return BYPASS_48H_IDS.has(medId) || (medId && medId.indexOf('symptom_') === 0); }
function removeBtn(e) {
  if (!bypasses48h(e.medId) && state.now - e.ts > 48 * 3600000) return null; // entries older than 48h are permanent history
  if (state.confirmRemove === e.id) {
    return h('div', { style: { display: 'flex', gap: '6px', alignItems: 'center', flexShrink: '0' } },
      h('button', { onClick: () => { setState({ confirmRemove: null }); removeEntry(e.id); }, style: { color: '#fff', background: '#C0453B', fontSize: '12.5px', fontWeight: '700', minHeight: '44px', padding: '8px 12px', borderRadius: '9px' } }, 'Delete'),
      h('button', { onClick: () => setState({ confirmRemove: null }), style: { color: '#7A6E76', fontSize: '12.5px', minHeight: '44px', padding: '8px 6px', fontWeight: '600' } }, 'Keep')
    );
  }
  return h('button', { onClick: () => { setState({ confirmRemove: e.id }); setTimeout(() => { if (state.confirmRemove === e.id) setState({ confirmRemove: null }); }, 6000); }, style: { color: '#A15B56', fontSize: '12.5px', padding: '12px 10px', minHeight: '44px' } }, 'Remove');
}

function renderToday(now, mg, pct, tyColor, ceiling) {
  const parts = [];
  const inpatientActiveNow = isInpatientActiveNow();

  // v57 (Aaron-requested): the browser build's one-time "what's different here" notice. First card
  // on Home, above everything, because the Home Screen item below is time-sensitive on iOS -- a
  // tester who reads it a week late may already have lost their log. See browserNoticeDue().
  if (browserNoticeDue()) {
    const bTone = NOTICE_TONES.attention;
    const installed = isInstalledPWA();
    // Designer S4: v57's first cut branched only the first SENTENCE, so the longest and most alarming
    // clause in the card -- the one about Safari -- was shown to Android testers as the sole reason to
    // act ("on iPhone this is the one that matters"), and to iPhone testers as a note about iPhones
    // while they were holding one. Both audiences read the half addressed to the other. Branch the
    // whole body or don't branch at all.
    const homeScreenPoint = installed
      ? ['Your log is safe on this device', 'You’ve already added ChemoWell to your Home Screen. Keep opening it from that icon, not a browser tab.']
      : isIOSDevice()
        ? ['Add it to your Home Screen', 'Tap Share, then Add to Home Screen. Safari deletes a site’s saved data after 7 days without a visit — and your log is stored nowhere else.']
        : ['Add it to your Home Screen', 'Open your browser menu, then Add to Home screen. It keeps your log one tap away and out of reach of anything that clears browser data.'];
    // Designer S1: heading and body were both 13px, 100 weight units apart, so three blocks read as
    // one paragraph. 14/700 over 13/500 is the step the rest of the file already uses.
    const point = (title, body) => h('div', { style: { marginTop: '16px' } },
      h('div', { style: { fontSize: '14px', fontWeight: '700', color: '#2A2127', lineHeight: '1.35', marginBottom: '3px' } }, title),
      h('div', { style: { fontSize: '13px', fontWeight: '500', color: '#554A52', lineHeight: '1.5' } }, body)
    );
    // Designer M1: the icon and the ✕ used to be flex siblings of the entire body, so all ~40 lines
    // of copy ran in a 207px column inside a 328px card -- 24 characters per line at 360px, against a
    // comfortable floor of 45. They are now a header row and an absolutely-positioned control, and
    // the copy is roughly half what it was; the detail that came out lives in rem-web-vs-app, which
    // the button below links straight to. N3: its own off-white surface, so a tester scrolling can
    // tell where the notice ends and the app begins.
    parts.push(h('div', { style: { position: 'relative', background: '#FFFBF5', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + bTone.accent, borderRadius: '14px', padding: '14px 16px', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center', paddingRight: '36px' } },
        h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: bTone.chipBg, color: bTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center' } }, appIcon('bulb', 16, { color: bTone.chipFg })),
        h('div', { style: { ...TYPE.bodyBold, fontSize: '15px', color: '#2A2127', lineHeight: '1.3' } },
          installed ? 'A couple of things about the browser version' : 'You’re using the web preview')
      ),
      h('div', { style: { fontSize: '13px', fontWeight: '500', color: '#554A52', lineHeight: '1.5', marginTop: '8px' } },
        installed ? 'Everything works, and your log is already safe. Two things still behave differently here:'
                  : 'Everything works. Three things are different in a browser:'),
      point(homeScreenPoint[0], homeScreenPoint[1]),
      point('Reminders need this page open', 'A browser can’t wake a locked phone. The phone app schedules them with the operating system instead.'),
      point('Exports download instead of sharing', 'Download CSV and Print/PDF save to your Downloads folder.'),
      h('div', { style: { fontSize: '13px', fontWeight: '500', color: '#554A52', lineHeight: '1.5', marginTop: '14px' } }, 'Everything you log stays on this device.'),
      h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center', marginTop: '13px' } },
        // Designer S6: this wore the INFO gradient on an ATTENTION-toned card. attention.accent behind
        // white text measures 3.77:1 and must not be used; chipFg gives 5.93:1.
        h('button', { onClick: dismissBrowserNotice, style: { minHeight: '44px', padding: '0 18px', borderRadius: '12px', background: bTone.chipFg, color: '#fff', fontSize: '13px', fontWeight: '700', border: 'none', cursor: 'pointer' } }, 'Got it'),
        // Designer S3: this used to dismiss the notice AND land on the Help LANDING page, which says
        // nothing about any of the above -- so the one person who tapped it because they wanted to
        // read more was the only person who could never get the card back. It now deep-links to the
        // page that actually answers it, and leaves the notice alone. navigateTo('help') deliberately
        // resets state.help (v55: tapping Help in the menu always lands on the top level), so the
        // target is set AFTER it, not before. N1: same 18px padding as its sibling, so the two labels
        // share a left edge when the row wraps at 320/360.
        h('button', { onClick: () => { navigateTo('help'); setState({ help: { cat: 'reminders', topic: 'rem-web-vs-app' } }); }, style: { minHeight: '44px', padding: '0 18px', borderRadius: '12px', background: 'transparent', border: 'none', color: '#8C5900', fontSize: '13px', fontWeight: '700', cursor: 'pointer' } }, 'More about the web version')
      ),
      // Designer M2: was 28x28 -- 40% under the project's 44px floor -- and, because the card used to
      // be 919px tall, the only control on screen when it first painted. #6B5C63 on the chip is
      // 5.50:1; the old #7A6E76 was 4.25:1, under AA for a 13px glyph.
      h('button', { onClick: dismissBrowserNotice, 'aria-label': 'Dismiss', style: { position: 'absolute', top: '10px', right: '10px', width: '44px', height: '44px', borderRadius: '50%', background: 'rgba(124,97,86,0.10)', color: '#6B5C63', fontSize: '15px', fontWeight: '800', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, '✕')
    ));
  }

  // v33 migration: profiles created before v33 have no sex/treatment on record, and both now
  // gate real UI. A compact finish-setup card sits at the top of Home until answered — deliber-
  // ately NOT dismissible (dismiss-forever would freeze the profile in the ambiguous legacy
  // state), but it goes away the moment both chips are picked and saved, and everything else
  // keeps working exactly as before in the meantime. Drafts are module-level like the setup form.
  if (needsProfileCompletion()) {
    const mTone = NOTICE_TONES.info;
    const p = getPrefsDB();
    const curSex = migrateSexDraft || p.sex || '';
    const curTreat = migrateTreatDraft || p.treatmentType || '';
    const chipBtn = (on, label, cb) => h('button', { onClick: cb, 'aria-pressed': on ? 'true' : 'false', style: { flex: '1', minHeight: '44px', padding: '0 4px', borderRadius: '11px', border: on ? '2px solid #BF4C1A' : '1px solid rgba(246,108,49,0.3)', background: on ? 'rgba(191,76,26,0.10)' : '#FFFFFF', color: on ? '#A83D0F' : '#5E4337', fontSize: '13px', fontWeight: on ? '800' : '600' } }, label);
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + mTone.accent, borderRadius: '14px', padding: '14px 16px', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'Finish setting up this profile'),
      h('div', { style: { ...TYPE.caption, color: '#554A52', marginBottom: '10px' } }, 'Two quick answers tailor which cards appear — nothing is shared off this device.'),
      h('div', { style: { fontSize: '11px', fontWeight: '800', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#8E6452', marginBottom: '5px' } }, 'Patient is'),
      h('div', { style: { display: 'flex', gap: '8px', marginBottom: '10px' } },
        chipBtn(curSex === 'male', 'Male', () => { migrateSexDraft = 'male'; setState({}); }),
        chipBtn(curSex === 'female', 'Female', () => { migrateSexDraft = 'female'; setState({}); })
      ),
      h('div', { style: { fontSize: '11px', fontWeight: '800', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#8E6452', marginBottom: '5px' } }, 'Treatment type'),
      h('div', { style: { display: 'flex', gap: '8px', marginBottom: '10px' } },
        chipBtn(curTreat === 'chemo', 'Chemo', () => { migrateTreatDraft = 'chemo'; setState({}); }),
        chipBtn(curTreat === 'radiation', 'Radiation', () => { migrateTreatDraft = 'radiation'; setState({}); }),
        chipBtn(curTreat === 'both', 'Both', () => { migrateTreatDraft = 'both'; setState({}); }),
        chipBtn(curTreat === 'other', 'Other', () => { migrateTreatDraft = 'other'; setState({}); })
      ),
      // Full-strength fill always (v33 fix pass): the 35%-alpha "waiting" state read as a broken
      // disabled button while still being tappable — the tap-with-guidance toast covers the
      // incomplete case, so the button just stays a real button.
      h('button', { onClick: () => { if (!curSex || !curTreat) { setToast('Pick both answers to save'); return; } applyTreatmentTypeChange(curTreat, { sex: curSex }); migrateSexDraft = ''; migrateTreatDraft = ''; setToast('Profile updated'); }, style: { width: '100%', minHeight: '44px', borderRadius: '11px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '13.5px', fontWeight: '700' } }, 'Save')
    ));
  }

  // In-Patient banner — pinned, non-dismissible, only shown while a stay is active
  if (inpatientActiveNow) {
    const ipDayN = daysSinceInpatientStart();
    const ipTone = NOTICE_TONES.attention;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + ipTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'center', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: ipTone.chipBg, color: ipTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '+'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'In-Patient active'),
        h('div', { style: { ...TYPE.caption, color: '#554A52' } }, (ipDayN !== null ? ('Day ' + ipDayN + ' — ') : '') + 'doses given by hospital staff are not counted as missed. You can still log anything yourself.')
      ),
      h('button', { onClick: logInpatientEnd, style: { flexShrink: '0', minHeight: '44px', padding: '0 16px', borderRadius: '12px', background: ipTone.accent, color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Log In-Patient End')
    ));
  }

  // Today's Missed dose banner is scoped to TODAY only (v69) -- previously this walked every day
  // since MISSED_TRACK_SINCE and joined them into one ever-growing line, which meant an old unresolved
  // miss from a week ago never went away and the banner text just kept accumulating. Unresolved misses
  // from earlier days are now surfaced separately via the pinned "previous days" card in the header
  // (see pastMissedCount()/renderHeader()), which links straight to History instead of cluttering Today.
  const bannerItemsAll = missedDosesFor(dayStart(now), now).map(m => ({ ...m, when: 'Today' }));
  const bannerItems = bannerItemsAll.filter(m => m.ts > (state.missedClearedAt || 0));

  // MISSED DOSE ALERT — always on top; a Clear button lets the caregiver acknowledge
  // and dismiss the current list without deleting the underlying data (new misses still show).
  // Persisted in on-device prefs so it survives reloads.
  if (bannerItems.length) {
    // v70: the whole banner is now clickable -- tapping it (anywhere except the Clear button,
    // which stops propagation) jumps to History filtered to missed-only, same as the pinned
    // previous-days card. Clear still just dismisses today's banner in place without navigating.
    const mdTone = NOTICE_TONES.urgent;
    parts.push(h('div', { onClick: goToHistoryTop, role: 'button', tabindex: '0', 'aria-label': 'Review ' + bannerItems.length + ' missed dose' + (bannerItems.length > 1 ? 's' : '') + ' from today', onKeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); goToHistoryTop(); } }, style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + mdTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'flex-start', boxShadow: '0 2px 10px rgba(203,122,87,0.10)', cursor: 'pointer' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: mdTone.chipBg, color: mdTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '!'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', marginBottom: '4px' } },
          h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127' } }, 'Missed dose' + (bannerItems.length > 1 ? 's' : '')),
          h('button', { onClick: (ev) => { ev.stopPropagation(); clearMissedDoses(); }, style: { flexShrink: '0', minHeight: '44px', padding: '0 14px', borderRadius: '99px', background: 'transparent', border: '1px solid #F2BEA8', color: '#A83D0F', fontSize: '13px', fontWeight: '700' } }, 'Clear')
        ),
        // One line per miss (item 8) — med name in ink, details in secondary
        ...bannerItems.map(m => h('div', { style: { ...TYPE.caption, color: '#554A52' } },
          m.when + ': ',
          h('span', { style: { fontWeight: '700', color: '#2A2127' } }, nameOf(m.medId)),
          ' — ' + m.windowName + ' window (' + fmtTime(m.ts) + ') closed with no dose logged'))
      )
    ));
  }

  // Chemo plan banner — persistent from 2 days before chemo through the day after.
  // v33: hidden for radiation-only profiles — their daily-session rhythm has no "pre-treatment
  // meds two days out" concept, and the radiation card below covers their schedule.
  const chemoOffNow = chemoOffsetFor(now);
  if (!isRadiationOnly() && chemoOffNow !== null && chemoOffNow >= -2 && chemoOffNow <= 1) {
    const cDay = chemoDayFor(now);
    const cLabel = cDay === null ? '' : new Date(cDay).toLocaleDateString([], { weekday: 'long', month: 'numeric', day: 'numeric' });
    let cTitle = '', cBody = '';
    // v41 (Aaron-requested): this banner's original copy presumes an oncology regimen ("pre-
    // treatment medications," "the care team"), which read as confusing/inapplicable for an
    // "Other" profile using this card for a personal doctor visit rather than chemo/radiation.
    // Chemo/radiation profiles keep the exact original copy below, unchanged.
    if (isOtherTreatmentType()) {
      if (chemoOffNow === -2) { cTitle = cLabel + ' \u2014 in 2 days'; cBody = 'Your date is coming up in two days \u2014 a good time to double-check anything that needs to start beforehand.'; }
      else if (chemoOffNow === -1) { cTitle = 'Tomorrow'; cBody = 'Your date is tomorrow.'; }
      else if (chemoOffNow === 0) { cTitle = 'Today'; cBody = 'Today\u2019s the day \u2014 log doses and symptoms as they happen.'; }
      else { cTitle = 'Following day'; cBody = 'Keep logging symptoms and any as-needed medications.'; }
    } else if (chemoOffNow === -2) { cTitle = 'Treatment on ' + cLabel; cBody = 'Treatment session is in two days. If the care team prescribed pre-treatment medications, they may need to start the day before \u2014 follow the care team\u2019s plan.'; }
    else if (chemoOffNow === -1) { cTitle = 'Treatment tomorrow'; cBody = 'Treatment session is tomorrow. Follow the care team\u2019s instructions for any pre-treatment medications.'; }
    else if (chemoOffNow === 0) { cTitle = 'Treatment day'; cBody = 'Treatment day. Log doses and symptoms as they happen \u2014 the care team will want the record.'; }
    else { cTitle = 'Recovery day'; cBody = 'Recovery day. Keep logging symptoms, appetite, and any as-needed medications.'; }
    // Supportive, not red-alert (item 7): day 0 is attention tone, every other covered day is info
    const cTone = chemoOffNow === 0 ? NOTICE_TONES.attention : NOTICE_TONES.info;
    // Legacy regimen chips only appear if those exact meds exist in THIS profile's list
    const dexDueToday = dexActiveOn(now) && state.meds.some(m => m.id === 'dexamethasone');
    const zofranRestrictedToday = zofranBlockedOn(now) && state.meds.some(m => m.id === 'zofran');
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + cTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '12px', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'flex-start' } },
        h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: cTone.chipBg, color: cTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '13px' } }, 'Rx'),
        h('div', { style: { flex: '1' } },
          h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, cTitle),
          h('div', { style: { ...TYPE.caption, color: '#554A52' } }, cBody)
        )
      ),
      (dexDueToday || zofranRestrictedToday) ? h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } },
        dexDueToday ? h('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '7px', background: 'rgba(15,157,87,0.10)', border: '1px solid rgba(15,157,87,0.25)', borderRadius: '11px', padding: '8px 13px' } },
          h('span', { style: { flexShrink: '0', width: '18px', height: '18px', borderRadius: '50%', background: 'rgba(15,157,87,0.15)', color: '#0C7F57', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '12px' } }, '\u2713'),
          h('span', { style: { fontSize: '13px', fontWeight: '700', color: '#0C7F57', letterSpacing: '0.01em' } }, 'Dexamethasone Due — ' + (chemoOffNow === 1 ? '8 AM only' : '8 AM & 2 PM'))
        ) : null,
        zofranRestrictedToday ? h('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '7px', background: 'rgba(192,69,59,0.10)', border: '1px solid rgba(192,69,59,0.25)', borderRadius: '11px', padding: '8px 13px' } },
          h('span', { style: { flexShrink: '0', width: '18px', height: '18px', borderRadius: '50%', background: 'rgba(192,69,59,0.15)', color: '#A5443C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '12px' } }, '\u2715'),
          h('span', { style: { fontSize: '13px', fontWeight: '700', color: '#A5443C', letterSpacing: '0.01em' } }, 'Zofran — Restricted')
        ) : null
      ) : null
    ));
  }

  // v20: Daily "still pausing?" check-in — one banner per paused-and-unconfirmed medication (not
  // batched, so it's never ambiguous which medication a button applies to, matching how the missed-
  // dose banner already does one line per miss rather than one generic pair of buttons). Modeled on
  // the Bowel/Weight/Appetite check-in banners' cadence (once a day, non-urgent info tone — a
  // deliberately paused medication isn't a risk signal the way a missing health data point is) but
  // gated on a persisted per-medication field (pausedCheckinDate) rather than an entry's existence,
  // since "did the user confirm this pause today" has no natural logged entry to check.
  const pausedUnconfirmed = state.meds.filter(m => m.paused && m.pausedCheckinDate !== dayStart(now));
  pausedUnconfirmed.forEach(med => {
    const puTone = NOTICE_TONES.info;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + puTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'flex-start', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: puTone.chipBg, color: puTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '❚❚'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'Still pausing ' + med.name + '?'),
        h('div', { style: { ...TYPE.caption, color: '#554A52', marginBottom: '10px' } }, 'It won’t be tracked or remind you today unless you resume it.'),
        h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
          h('button', { onClick: () => setMedicationPaused(med.id, true), style: { minHeight: '44px', padding: '0 14px', borderRadius: '11px', background: 'rgba(255,255,255,0.5)', border: '1px solid rgba(246,108,49,0.2)', color: '#6D5247', fontSize: '13px', fontWeight: '700' } }, 'Continue pausing'),
          h('button', { onClick: () => setMedicationPaused(med.id, false), style: { minHeight: '44px', padding: '0 14px', borderRadius: '11px', background: puTone.accent, color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Resume')
        )
      )
    ));
  });

  // Menstrual Cycle active banner — non-dismissible, stays up until Period End is logged.
  // v33: cycleAllowed() joins the gate — Owner-specified that cycle tracking is Female-only.
  if (cycleAllowed() && homePref('cycleTracking') && cycleActive()) {
    const cDayN = daysSinceCycleStart();
    const pTone = NOTICE_TONES.info;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderLeft: '4px solid ' + pTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'center', boxShadow: '0 2px 10px rgba(203,122,87,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: pTone.chipBg, color: pTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '●'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'Period active'),
        h('div', { style: { ...TYPE.caption, color: '#554A52' } }, cDayN !== null ? ('Day ' + cDayN + ' since period start') : 'Period in progress')
      ),

      return h('div', { style: { background: 'rgba(124,97,86,0.06)', border: '1.5px dashed rgba(124,97,86,0.30)', borderRadius: '16px', padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: '4px' } },

    const offDay = !medScheduledOn(med, now);
    const st = status(med);
    const locked = !!st.locked || offDay;
    const last = latest(med.id);
    const doseList = med.doses || [{ single: true }];
    const countdownLabel = locked && st.availableAt ? fmtCountdown(st.availableAt - now) : '';
    const lastLabel = last ? ('Last taken - ' + fmtDateLabel(last.ts) + (last.dose ? (' · ' + last.dose) : '')) : 'No doses logged';

    let nextDoseLabel = '';

      nextDoseLabel = 'Next dose at ' + fmtTime(st.availableAt);

      nextDoseLabel = 'Next dose tomorrow after midnight';
    } else if (st.chemoBlock) {
      nextDoseLabel = 'Restricted — next dose ' + new Date(st.availableAt).toLocaleDateString([], { weekday: 'long' }) + ' ' + fmtTime(st.availableAt);
    } else if (st.courseComplete) {
      nextDoseLabel = 'Course complete';
    } else if (offDay) {
      nextDoseLabel = 'Not scheduled today · Taken: ' + scheduleDaysLabel(med);
    } else if (locked && st.availableAt) {
      nextDoseLabel = 'Next dose at ' + fmtTime(st.availableAt);
    } else {
      nextDoseLabel = 'Available now';
    }
    // Sub-status
    let subStatus = '';
    const dc = med.ceiling ? dailyCeiling(med) : null;
    if (st.ceilingHit) {
      subStatus = st.rollingCeiling ? ((dc ? dc.label : 'Limit') + ' reached in the last ' + med.rollingCeilingH + 'h') : ('Daily limit reached' + (dc ? ' (' + dc.label + ')' : ''));
    } else if (st.windowName) {

    // v23 (Aaron-requested): there was previously no way to log a dose that would push past the

    // WHICH dose option is being overridden (a med can offer several dose sizes, only some of which

    const doseKeyOf = (d, i) => (d.label != null ? String(d.label) : ('idx' + i));
    const overridingDoseKey = (isOverriding && state.override.doseKey != null) ? state.override.doseKey : null;
    // A dose is blocked if it would push past the daily ceiling (unless the ceiling is already

    const doseBlocked = (d) => {

    };

    const overrideDoseBtn = (d, i) => h('button', { onClick: () => setState({ override: { medId: med.id, doseKey: doseKeyOf(d, i) } }), style: { flex: '0 1 auto', minWidth: '0', maxWidth: '100%', minHeight: '44px', padding: '0 12px', borderRadius: '999px', background: 'rgba(255,255,255,0.35)', border: '1px dashed rgba(145,94,72,0.35)', color: '#5E4337', fontSize: '13px', fontWeight: '600', whiteSpace: 'normal', textAlign: 'center', lineHeight: '1.25' } }, (d.single ? ('Log ' + med.name) : d.label) + ' · over limit');

        locked ?

function formatRuleSummary(med) {
  const fragments = [];
  if (med.paused) fragments.push('Paused'); // v20: prepend so it's scannable without opening the editor

    // Rolling-window ceiling meds (e.g. Morphine) are governed by the cumulative-mg limit below,
    // not a flat per-dose gap — skip the "Min X-hour gap" fragment so it isn't shown alongside a
    // rule that no longer applies.
  } else if (med.type === 'gap') {
    fragments.push(med.gapH > 0 ? ('Min ' + med.gapH + '-hour gap') : 'No minimum gap set \u2014 edit to fix');
  } else if (med.windows && med.windows.length) {
    // v26: windows are now a single alert time each (no user-facing range) — the summary shows
    // just the start time for an unnamed window instead of a start–end pair.
    fragments.push(med.windows.map(window => window.name || formatQuarterHour(window.start)).join(' · '));
    // v23: scheduled meds can now optionally also carry a gapH lockout (see status()) -- show both
    // rules together instead of the old gap/windows either-or.
    if (med.gapH > 0) fragments.push('Min ' + med.gapH + '-hour gap');
  }
  if (med.ceiling) {
    const limit = medicationCeilingMax(med);
    if (limit) fragments.push((med.rollingCeilingH ? ('Up to ' + limit + ' ' + (med.ceilingUnit || 'mg') + ' per ' + med.rollingCeilingH + 'h') : ('Daily limit ' + limit + ' ' + (med.ceilingUnit || 'mg'))));

}

function formatHour(hour) {
  const h = Math.max(0, Math.min(24, Number(hour) || 0));

  return (h > 12 ? h - 12 : h) + (h >= 12 ? ' PM' : ' AM');

// value, so existing legacy medications' rule summaries/labels are unchanged.
function formatQuarterHour(hour) {
  const h = Math.max(0, Math.min(24, Number(hour) || 0));
  if (h === 24) return 'Midnight';
  const min = Math.round((h % 1) * 60);

  return min === 0 ? base : base.replace(/^(\d+)/, '$1:' + String(min).padStart(2, '0'));
}
// v27 (Aaron-requested): the Start field for each schedule window is now a native <input type="time">
// clock picker instead of a 96-entry 15-minute-increment dropdown -- these two converters translate
// between the app's internal decimal-hour representation (8.25 = 8:15 AM, unchanged by this) and the
// "HH:MM" 24-hour string a time input reads/writes. A native picker also drops the old 15-minute
// floor entirely -- any minute can be set directly, not just quarter-hours.
function decimalHourToTimeValue(hour) {
  const h = Math.max(0, Math.min(23.983333333333334, Number(hour) || 0)); // clamp below 24:00 -- a Start is never midnight-as-end-of-day
  const totalMinutes = Math.round(h * 60);
  const hh = Math.floor(totalMinutes / 60), mm = totalMinutes % 60;

}
function timeValueToDecimalHour(value) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(value || ''));
  if (!m) return 0;
  const hh = Math.max(0, Math.min(23, Number(m[1]))), mm = Math.max(0, Math.min(59, Number(m[2])));
  return hh + mm / 60;
}

// v28 (Aaron-reported): fields that pass rerender:true get a full setState()/render() on every
// keystroke so their live preview (dailyLimitPreview) stays current -- but render() tears down and
// recreates the whole DOM tree each time, which blurs and refocuses the input even though the
// render()-time id-based restore logic keeps JS-perceived focus intact. On a real phone that native
// blur+refocus resets the on-screen keyboard to its DEFAULT page every time -- for a field that mixes
// letters and digits (Dosage options: "500 mg"), that meant every digit typed knocked the keyboard
// off the numeric page it had just been switched to, forcing a re-tap of "123" before the next digit.
// Daily limit didn't show this since inputMode="decimal" keeps a single flat numeric keypad with no
// page to reset to. Passing rerender:'debounced' still updates the underlying value instantly (used
// for parsing/saving) but defers the disruptive full rebuild until typing pauses, so the keyboard only
// resets between words, not between characters -- the live preview still updates, just ~450ms after
// the last keystroke instead of on every one.
let medFormRerenderTimer = null;
function updateMedicationForm(field, value, rerender) {
  if (!state.medEditor) return;
  state.medEditor.form[field] = value;
  if (rerender === 'debounced') {
    clearTimeout(medFormRerenderTimer);
    medFormRerenderTimer = setTimeout(() => { if (state.medEditor) setState({ medEditor: state.medEditor }); }, 450);
  } else if (rerender) {
    clearTimeout(medFormRerenderTimer);
    setState({ medEditor: state.medEditor });

function parseDoseOptions(text) {
  return String(text || '').split(',').map(value => value.trim()).filter(Boolean).map(label => {
    const mgMatch = label.match(/(\d+(?:\.\d+)?)\s*mg\b/i);
    // v45 (Aaron-reported live bug): this used to require one specific word right after the number
    // -- pill/tab/tablet/cap/capsule/application -- for a non-mg Dosage options entry to "count"
    // toward the picked Limit unit. But Limit unit only has three choices (mg/pills/applications)
    // while Dosage options is free text, and the field's OWN example text ("1 patch, 2 patches" --
    // see the helpIcon above) doesn't contain any of those words, so following the app's own
    // suggested format could permanently fail this check. Since dosageOptionsCarryLimitUnit() below
    // disables Daily limit entirely until this check passes, that meant a caregiver typing a
    // perfectly reasonable dosage ("1 patch," "2 sprays," "1 drop") could get permanently locked
    // out of Daily limit with the warning banner showing and no way to dismiss it -- Aaron: "the
    // dosage option banner pops up and can't be bypassed." Fix: any leading number in a Dosage
    // options entry now counts as that entry's non-mg amount, whatever word (if any) follows it --
    // matches how a real person reads "1 patch" or "2 applications" (the number IS the amount).
    const numMatch = label.match(/(\d+(?:\.\d+)?)/);
    const dose = { label, mg: mgMatch ? Number(mgMatch[1]) : 0 };
    if (numMatch) dose.pills = Number(numMatch[1]);
    return dose;
  });
}

// Limit unit -- pulled out of dailyLimitPreview so it can gate the Daily limit input itself (see
// renderMedicationEditor) and not just explain a mismatch after the fact. Deliberately independent
// of whether a Daily limit value has been typed yet, unlike the old inline check inside
// dailyLimitPreview -- Aaron: "you should not be able to progress to 'Daily Limit' if it's not
// indicated correctly," i.e. the field should be gated up front, not just validated after entry.

  const unit = form.dailyLimitUnit;

  return unit === 'mg' ? testDoses.some(d => d.mg > 0) : testDoses.some(d => d.pills > 0);
}

    // v26 (Aaron-requested): the plain amber-on-cream text line was easy to miss against the
    // editor's background. Solid fill + border + a filled "!" badge instead of relying on color

      h('span', { 'aria-hidden': 'true', style: { flexShrink: '0', width: '18px', height: '18px', borderRadius: '50%', background: '#C77800', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '12px', marginTop: '1px' } }, '!'),

const APPT_REMINDER_OPTIONS = [
  { id: 'none', label: 'No reminder' },
  { id: 'attime', label: 'At the scheduled time' },
  { id: '1h', label: '1 hour before' },
  { id: 'morning', label: 'The morning of (9 AM)' },
  { id: '1day', label: '1 day before' },

// v24: takes the full appointment (not just the reminder id) so the 'custom' case can read its
// stored lead-time value/unit to build a real label instead of a generic placeholder.
function apptReminderLabel(appt) {
  if (appt.reminder === 'custom') {
    const n = appt.reminderCustomValue, unit = appt.reminderCustomUnit || 'minutes';
    if (!Number.isFinite(n) || n < 0) return 'Custom reminder';
    if (n === 0) return 'At the scheduled time'; // 0 lead time = same as the 'attime' option
    const unitLabel = unit === 'days' ? (n === 1 ? 'day' : 'days') : unit === 'hours' ? (n === 1 ? 'hour' : 'hours') : (n === 1 ? 'minute' : 'minutes');
    return n + ' ' + unitLabel + ' before';
  }
  const r = APPT_REMINDER_OPTIONS.find(x => x.id === appt.reminder);
  return r ? r.label : 'No reminder';
}

function openApptModal(editId, presetDateStr) {
  if (editId) {
    const appt = (state.appts || []).find(a => a.id === editId);
    if (!appt) return;
    const d = new Date(appt.ts);
    // v24: seed customValue/customUnit from the appointment so re-opening an edit shows the lead
    // time Aaron actually set, same as every other field here — default to 30 minutes if this
    // appointment has never used the custom option, so the fields aren't blank if he switches to it.
    setState({ apptModal: { editId, title: appt.title, note: appt.note || '', reminder: appt.reminder || 'none', dateStr: toLocalISO(appt.ts).slice(0, 10), time: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), calOpen: false, calCursor: toLocalISO(appt.ts).slice(0, 7), customValue: Number.isFinite(appt.reminderCustomValue) ? appt.reminderCustomValue : 30, customUnit: appt.reminderCustomUnit || 'minutes', color: appt.color || DEFAULT_APPT_COLOR } });
  } else {
    const todayStr = toLocalISO(simNow()).slice(0, 10);
    // v40: only pre-fill the date field when opened from the Calendar month-grid's day panel
    // ("+ Add" for a specific selected day) -- that's a deliberate choice the user already made by
    // navigating to and tapping that day, so re-showing it here saves a redundant re-pick. The
    // header's plain "+ Add" button (no presetDateStr) deliberately keeps the ORIGINAL blank-date,
    // forced-pick behavior: silently defaulting every new appointment to "today" would risk saving
    // the wrong date if someone fills in the title, forgets to touch the date field, and taps Add --
    // a real risk for a medical appointment, not just a UX nicety.
    setState({ apptModal: { editId: null, title: '', note: '', reminder: 'none', dateStr: presetDateStr || '', time: '09:00', calOpen: false, calCursor: (presetDateStr || todayStr).slice(0, 7), customValue: 30, customUnit: 'minutes', color: DEFAULT_APPT_COLOR } });

function closeApptModal() { setState({ apptModal: null }); }
function confirmApptModal() {
  const m = state.apptModal;

  const title = (m.title || '').trim();
  if (!title) { setToast('Enter a title for this appointment'); return; }
  if (!m.dateStr) { setToast('Pick a date'); return; }
  const ts = new Date(m.dateStr + 'T' + (m.time || '09:00')).getTime();
  if (isNaN(ts)) { setToast('Invalid date or time'); return; }
  // v24: custom reminder must be a real, non-negative number — block the save with a clear
  // message rather than let a malformed value silently save a reminder that never fires (matches
  // the existing validation pattern used for the Liters-drained field).
  if (m.reminder === 'custom' && (m.customValue === '' || isNaN(Number(m.customValue)) || Number(m.customValue) < 0)) {
    setToast('Enter a reminder time of 0 or more.');
    return;
  }
  const noteTrimmed = (m.note || '').trim();
  const payload = { title, note: noteTrimmed, reminder: m.reminder || 'none', ts, color: m.color || DEFAULT_APPT_COLOR };
  if (m.reminder === 'custom') {
    payload.reminderCustomValue = Number(m.customValue);
    payload.reminderCustomUnit = m.customUnit || 'minutes';
  }
  if (m.editId) {
    // Editing resets the reminded flag ONLY when a field the trigger condition actually depends on
    // changed (time or reminder choice) — audit fix: resetting unconditionally re-armed the reminder
    // on an edit as small as fixing a typo in the note, re-notifying for an appointment already
    // inside its fired 24h grace window with nothing about the reminder itself having changed.
    const prev = (state.appts || []).find(a => a.id === m.editId);
    // Compare at minute precision, not exact ms — the form's time input is minute-granularity, so
    // an appointment whose stored ts carried seconds/ms (however it was created) would otherwise
    // look "changed" on every edit even when the user picked the exact same date and time back.
    // v24: also re-arm when only the custom lead time/unit changed — the reminder id itself stays
    // 'custom' in both cases, so without this clause below, changing "30 min before" to "2 hours
    // before" on an already-fired appointment would silently never re-notify even though the
    // actual trigger timestamp moved. No-op for the other 4 options since they carry no per-
    // instance stored value, so this can't over-fire for them.
    const reminderRelevantChange = !prev
      || Math.floor(prev.ts / 60000) !== Math.floor(ts / 60000)
      || (prev.reminder || 'none') !== (m.reminder || 'none')
      || (m.reminder === 'custom' && (Number(prev.reminderCustomValue) !== Number(m.customValue) || (prev.reminderCustomUnit || 'minutes') !== (m.customUnit || 'minutes')));

    if (m.reminder && m.reminder !== 'none' && !isNativeApp() && !(TEST_MODE && !!state.dateOffsetDays)) requestNotifPermission();
    addAppointment(payload);
  }

}

// ---- Notes (app-v36) — modal + list view. Mirrors the appointment modal's date-picker wiring
// (renderCalendar/calShift/calPillLabel) but with a single textarea instead of title/time/reminder
// fields, since a note is just "what happened, for this date."
function openNoteModal(dateOrId) {
  // Lead Designer catch (v36 chain, pre-push): openNoteModal(null) -- what the primary "+ Add"
  // button calls -- used to look up an existing note by matching dateOrId itself, which is null on
  // this path, so it could never find "today already has a note" and always opened a blank editor.
  // Saving from there did a full silent overwrite of that day's real text (saveNote() replaces the
  // whole field by design; it doesn't append). Fixed by resolving dateOrId to today's date FIRST
  // when null, so the same existing-note lookup that already works for the Edit button and the
  // calendar-repick path also covers the plain "+ Add" button on a day that's already logged.
  const todayStr = toLocalISO(simNow()).slice(0, 10);
  const lookupKey = dateOrId == null ? todayStr : dateOrId;
  const existing = (state.notes || []).find(n => n.id === lookupKey || n.date === lookupKey);
  if (existing) {
    setState({ noteModal: { editId: existing.id, dateStr: existing.date, text: existing.text, calOpen: false, calCursor: existing.date.slice(0, 7) } });
  } else {
    setState({ noteModal: { editId: null, dateStr: todayStr, text: '', calOpen: false, calCursor: todayStr.slice(0, 7) } });
  }
}

function confirmNoteModal() {
  const m = state.noteModal;
  if (!m) return;
  if (!m.dateStr) { setToast('Pick a date'); return; }
  if (!(m.text || '').trim()) { setToast('Write something before saving, or Cancel.'); return; }
  // saveNote keys off dateStr, not editId -- so if this note started as a fresh "Add note" for
  // today but the person then picked a different date that already has a note, this correctly
  // edits THAT note instead of creating a second one for the same day (Aaron: "roll together in
  // one date"). If they instead picked a date that started a brand-new day, it creates fresh.
  saveNote(m.dateStr, m.text);
  closeNoteModal();
}
