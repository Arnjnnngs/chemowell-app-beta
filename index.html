<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ChemoWell</title>
<!-- Capacitor bridge (native APK build only). On the web/PWA build these load a no-op JS-only
     fallback (Capacitor.isNativePlatform() === false) so nothing here changes web behavior at all
     — see isNativeApp() below. If blocked or offline, window.Capacitor stays undefined and every
     call site already guards for that, so the app degrades to normal web behavior either way. -->
<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@8.4.2/dist/capacitor.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/local-notifications@8.2.1/dist/plugin.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--safe-top:env(safe-area-inset-top,0px);}
html,body{height:100%;overscroll-behavior-y:none;}
body{-webkit-font-smoothing:antialiased;background:#FAF7F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;color:#2A2127;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none;}
button:active{transform:translateY(1px);}
input{-webkit-tap-highlight-color:transparent;font-family:inherit;}
input:focus{outline:2px solid #A24C71;outline-offset:0;border-color:#A24C71;}
/* v23 (Aaron-requested): native <select> elements weren't covered by the same font-family:inherit
   reset button/input already get, so every dropdown box silently fell back to the OS's default UI
   font instead of the app's own -- this one rule fixes that everywhere in one place. The rounded
   corners / light background / custom arrow (replacing the dark, square native one) are applied
   per-select via SELECT_ARROW_STYLE (see selectStyleFix helper) since those also need per-instance
   sizing, but the font fix belongs globally so no dropdown can be missed. */
select{font-family:inherit;-webkit-tap-highlight-color:transparent;}
select:focus{outline:2px solid #A24C71;outline-offset:0;border-color:#A24C71;}
button:focus-visible, [role="button"]:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #A24C71; outline-offset: 2px; }
::placeholder{color:#7A6E76 !important;opacity:1;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#root{min-height:100vh;}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes tourPulse{0%{outline-color:rgba(46,125,79,1)}50%{outline-color:rgba(46,125,79,0.75)}100%{outline-color:rgba(46,125,79,1)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">

// ---------- On-device storage — no cloud, no accounts ----------
// All data lives in this device's localStorage. Nothing is ever sent to a server.
const TEST_MODE = true; // APP BETA — enables the date-override controls + simulated purchases

// ---- Safe-area top (v15) ----
// Android WebViews (incl. the Capacitor shell on edge-to-edge devices) draw under the status bar
// but report env(safe-area-inset-top)=0. Probe env(); only when it measures 0 inside a WebView do
// we substitute a 28px literal. setProperty REPLACES the var — env and fallback never stack.
(function initSafeTop() {
  try {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;';
    document.documentElement.appendChild(probe);
    const measured = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    probe.remove();
    const isWebView = /; wv\)/.test(navigator.userAgent) || (typeof isNativeApp === 'function' && isNativeApp());
    if (isWebView && measured === 0) document.documentElement.style.setProperty('--safe-top', '28px');
  } catch (e) {}
})();
function safeTopPx() {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'));
  return isNaN(v) ? 0 : v;
}

// True only inside the Capacitor native shell (android/), never in the installed PWA or a plain
// browser tab. Gates every native-only code path (real local notifications) so the web build's
// behavior is byte-for-byte unchanged. Wrapped in try/catch: if the CDN bridge script above is
// blocked or hasn't loaded yet, this safely reports "not native" rather than throwing (v14).
function isNativeApp() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
  catch (e) { return false; }
}

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ---- Plans & licensing (Free / Plus / Pro) — device-wide, not per profile ----
const LICENSE_KEY = 'chemowell-app-license-v1';
function getLicense() { return loadJSON(LICENSE_KEY, { tier: 'free' }); }
function setLicense(patch) { saveJSON(LICENSE_KEY, { ...getLicense(), ...patch }); }
function tierLimit(tier) { return tier === 'pro' ? Infinity : tier === 'plus' ? 3 : 1; }
function tierLabel(tier) { return tier === 'pro' ? 'Pro' : tier === 'plus' ? 'Plus' : 'Free'; }

// ---- Profiles: each patient gets fully separate on-device storage ----
const PROFILES_KEY = 'chemowell-app-profiles-v1';
(function initProfiles() {
  if (loadJSON(PROFILES_KEY, null)) return;
  const ps = { list: [{ id: 'p1', name: '', createdAt: Date.now() }], activeId: 'p1' };
  // One-time migration of pre-profile (app-v1..v4) single-profile data into profile p1.
  const legacy = [
    ['chemowell-app-entries-v1', 'chemowell-app-p-p1-entries-v1'],
    ['chemowell-app-prefs-v1', 'chemowell-app-p-p1-prefs-v1'],
    ['chemowell-app-medication-config-v1', 'chemowell-app-p-p1-med-v1']
  ];
  for (const [oldKey, newKey] of legacy) {
    const v = localStorage.getItem(oldKey);
    if (v != null) { localStorage.setItem(newKey, v); localStorage.removeItem(oldKey); }
  }
  const migratedPrefs = loadJSON('chemowell-app-p-p1-prefs-v1', {});
  if (migratedPrefs.patientName) ps.list[0].name = migratedPrefs.patientName;
  saveJSON(PROFILES_KEY, ps);
})();
function profilesState() { return loadJSON(PROFILES_KEY, { list: [{ id: 'p1', name: '', createdAt: 0 }], activeId: 'p1' }); }
const ACTIVE_PROFILE_ID = (function () { const ps = profilesState(); return ps.list.some(p => p.id === ps.activeId) ? ps.activeId : ps.list[0].id; })();
let newProfileNameDraft = '';
function createProfile(name) {
  const ps = profilesState();
  if (ps.list.length >= tierLimit(getLicense().tier)) return false;
  const id = 'p' + Date.now().toString(36);
  ps.list.push({ id: id, name: name, createdAt: Date.now() });
  ps.activeId = id;
  // Seed the new profile so it opens ready to use (no welcome screen / guide rerun).
  saveJSON('chemowell-app-p-' + id + '-prefs-v1', { patientName: name, installedAt: Date.now(), tourDone: true });
  saveJSON(PROFILES_KEY, ps);
  location.reload();
  return true;
}
function deleteProfile(id) {
  const ps = profilesState();
  if (id === ps.activeId || ps.list.length <= 1) return; // never delete the active profile
  ps.list = ps.list.filter(p => p.id !== id);
  saveJSON(PROFILES_KEY, ps);
  ['-entries-v1', '-prefs-v1', '-med-v1'].forEach(sfx => { try { localStorage.removeItem('chemowell-app-p-' + id + sfx); } catch (e) {} });
  setState({ confirmDeleteProfile: null });
  setToast('Profile deleted');
}
function switchProfile(id) {
  const ps = profilesState();
  if (!ps.list.some(p => p.id === id) || id === ps.activeId) return;
  ps.activeId = id;
  saveJSON(PROFILES_KEY, ps);
  location.reload();
}

const ENTRIES_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-entries-v1';
const PREFS_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-prefs-v1';

let entriesListener = null;
let prefsListener = null;

function allEntriesRaw() { return loadJSON(ENTRIES_KEY, []); }

function notifyEntries() {
  if (!entriesListener) return;
  const all = allEntriesRaw().slice().sort((a, b) => a.ts - b.ts);
  state.chemoDates = all.filter(e => e.medId === 'chemo_date');
  entriesListener(all.filter(e => e.medId !== 'chemo_date'));
}

function subscribeEntries(callback) {
  entriesListener = callback;
  notifyEntries();
  return () => { entriesListener = null; };
}

async function addEntryDB(entry) {
  const all = allEntriesRaw();
  const id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  all.push({ id: id, ...entry });
  saveJSON(ENTRIES_KEY, all);
  notifyEntries();
}

async function removeEntryDB(id) {
  saveJSON(ENTRIES_KEY, allEntriesRaw().filter(e => e.id !== id));
  notifyEntries();
}

function getPrefsDB() { return loadJSON(PREFS_KEY, {}); }
function subscribePrefs(callback) {
  prefsListener = callback;
  callback(getPrefsDB());
  return () => { prefsListener = null; };
}
async function setPrefsDB(patch) {
  const next = { ...getPrefsDB(), ...patch };
  saveJSON(PREFS_KEY, next);
  if (prefsListener) prefsListener(next);
}

// ---- Calendar / appointments (app-v22) — future appointments and other important dates the
// patient or caregiver wants a reminder for. Mirrors the entries/prefs storage pattern above:
// profile-scoped localStorage, held in state.appts, mutated through these functions + setState.
// Kept fully separate from the medication/dose "entries" store since appointments aren't doses.
const APPTS_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-appts-v1';
function loadAppointments() { return loadJSON(APPTS_KEY, []); }
function persistAppointments(list) { saveJSON(APPTS_KEY, list); }
function addAppointment(appt) {
  const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const list = loadAppointments();
  list.push({ id, reminded: false, ...appt });
  persistAppointments(list);
  setState({ appts: list });
  setToast('Appointment saved');
}
function updateAppointment(id, patch) {
  const list = loadAppointments().map(a => a.id === id ? { ...a, ...patch } : a);
  persistAppointments(list);
  setState({ appts: list });
}
function removeAppointment(id) {
  const list = loadAppointments().filter(a => a.id !== id);
  persistAppointments(list);
  setState({ appts: list, confirmDeleteAppt: null });
  setToast('Appointment removed');
}

// Keep two open tabs on the same device in sync.
window.addEventListener('storage', (ev) => {
  if (ev.key === ENTRIES_KEY) notifyEntries();
  if (ev.key === PREFS_KEY && prefsListener) prefsListener(getPrefsDB());
  // If another tab switched profiles, this tab must never keep writing into the old one (audit 6.9)
  if (ev.key === PROFILES_KEY && profilesState().activeId !== ACTIVE_PROFILE_ID) location.reload();
});

// Requests notification permission (native prompt in the Capacitor build, browser prompt on the
// web/PWA build once TEST_MODE is off for a real user). Safe to call every load — both permission
// paths no-op once already granted or denied. Named subscribePush for historical reasons; there is
// no server push involved, only local/on-device scheduling (v14).
async function subscribePush() { requestNotifPermission(); }

function missKey(e) { return e.medId + '|' + e.ts; }

// Per-row alternative to the banner's bulk "Clear": dismiss just this one missed window without
// logging a dose or creating any record. Stored as a list of "medId|ts" keys in prefs.
async function dismissMissedDose(e) {
  try {
    const next = (state.dismissedMisses || []).concat([missKey(e)]);
    await setPrefsDB({ dismissedMisses: next });
    setToast('Dismissed');
  } catch (err) {
    setToast('Could not save');
  }
}

// Per-row "Skipped": writes a real (permanent) entry marking this window as intentionally not
// given, rather than just hiding it. missedDosesFor() treats a skipped:true entry the same as a
// real dose for coverage purposes.
async function skipMissedDose(e) {
  await addEntryDB({ medId: e.medId, dose: null, mg: 0, ts: e.ts, skipped: true });
  setToast(nameOf(e.medId) + ' marked as skipped for ' + e.windowName + ' window');
}

async function clearMissedDoses() {
  const ts = state.now;
  try {
    await setPrefsDB({ missedClearedAt: ts });
    setToast('Missed doses cleared');
  } catch (e) {
    setToast('Could not save');
  }
}

// Full local wipe: profile, medication list, and every logged entry. Since everything lives on
// this device only, this is the app's "start completely over" — after the reload the first-run
// welcome + guide appear again, exactly like a brand-new install.
function eraseAllAppData() {
  try {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('chemowell-app-') === 0 && k !== LICENSE_KEY) doomed.push(k); // purchases survive a data wipe
    }
    doomed.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  // Factory reset must boot exactly like a brand-new install — including landing on Home, not on
  // the Settings tab the erase button lives in (v11). UI_VIEW_KEY is declared later in the file,
  // but that's safe: this function only runs on user action, long after module evaluation (P3-3).
  try { sessionStorage.removeItem(UI_VIEW_KEY); } catch (e) {}
  location.reload();
}

// ---------- React via htm + preact-like approach using vanilla ----------
// Using a minimal reactive approach with vanilla JS for zero build step

// Legacy regimen data removed (audit 1.3) — fresh installs build their own med list.
const DEFAULT_MEDS = [];

// Medication configuration is intentionally browser-local for the testing app.
// Dose-entry history remains in on-device storage; configuration changes do not touch it.
const MED_CONFIG_STORAGE_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-med-v1';
const DEFAULT_QUICK_LOG_IDS = [];
const DEFAULT_EVENING_IDS = [];
const DEFAULT_MORNING_IDS = [];

function deepCopyMeds(meds) {
  return meds.map(med => ({
    ...med,
    doses: Array.isArray(med.doses) ? med.doses.map(dose => ({ ...dose })) : undefined,
    windows: Array.isArray(med.windows) ? med.windows.map(window => ({ ...window })) : undefined
  }));
}

function safeMedicationId(value, fallback) {
  const cleaned = String(value || fallback || 'medication').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return cleaned || 'medication';
}

// v20 restart (audit P1-1): shared validator so a medication's live pausePeriods (normalizeMedication)
// and an archived medication's carried-forward pausePeriods (normalizeArchivedMeds, deleteMedicationConfig's
// restore path) can never drift into two different notions of "what's a valid period" -- both call sites
// use this instead of duplicating the same filter/map inline.
function normalizePausePeriods(raw) {
  return Array.isArray(raw) ? raw.filter(p => p && Number.isFinite(p.start)).map(p => ({ start: p.start, end: Number.isFinite(p.end) ? p.end : null })) : [];
}

function normalizeMedication(raw, index) {
  const original = raw || {};
  const id = safeMedicationId(original.id, original.name || ('medication-' + (index + 1)));
  const type = original.type === 'win' ? 'win' : 'gap';
  const doses = Array.isArray(original.doses) ? original.doses.filter(dose => dose && dose.label).map(dose => ({
    label: String(dose.label),
    mg: Number(dose.mg) || 0,
    ...(Number(dose.pills) ? { pills: Number(dose.pills) } : {})
  })) : undefined;
  // v20: start's ceiling was hard-clamped to 23 (silently truncating a legitimate 11:45 PM/23.75
  // start to 11:00 PM the moment 15-minute-granular windows exist) -- raised to 23.75, the highest
  // valid quarter-hour start. end's own ceiling (24, "through midnight") is unaffected.
  const windows = Array.isArray(original.windows) ? original.windows.map((window, windowIndex) => ({
    start: Math.max(0, Math.min(23.75, Number(window.start) || 0)),
    end: Math.max(1, Math.min(24, Number(window.end) || 24)),
    name: String(window.name || ('Window ' + (windowIndex + 1)))
  })).filter(window => window.end > window.start).sort((a, b) => a.start - b.start) : [];
  // v20 restart (audit P2-1): resolved once, as a local, so treatmentOnly can be derived from it below
  // instead of read independently from `original` (see the comment at the treatmentOnly/treatmentMode
  // fields for why the independent-read version was a real, if not currently reachable, bug).
  const treatmentMode = ['only', 'excluded'].includes(original.treatmentMode) ? original.treatmentMode
    : (typeof original.treatmentOnly === 'boolean' ? (original.treatmentOnly ? 'only' : 'none') : (original.chemoOnly ? 'only' : 'none'));
  const medication = {
    ...original,
    id,
    name: String(original.name || 'Untitled medication').trim(),
    sub: String(original.sub || '').trim(),
    type,
    // v23: gapH now survives normalize for scheduled ('win') meds too, so a scheduled medication can
    // optionally carry its own minimum-gap lockout on top of its time windows (Aaron-requested).
    gapH: Math.max(0, Number(original.gapH) || 0),
    alerts: type === 'win' && !(original.scheduleDays && original.scheduleDays.mode === 'asneeded'), // scheduled meds get missed-dose tracking; as-needed meds don't
    quickLog: typeof original.quickLog === 'boolean' ? original.quickLog : DEFAULT_QUICK_LOG_IDS.includes(id),
    groupedEvening: typeof original.groupedEvening === 'boolean' ? original.groupedEvening : DEFAULT_EVENING_IDS.includes(id),
    groupedMorning: typeof original.groupedMorning === 'boolean' ? original.groupedMorning : DEFAULT_MORNING_IDS.includes(id),
    groupedAfternoon: !!original.groupedAfternoon,
    // v16 migration: chemoOnly (fixed +-1 day window, "Chemo-day only") -> treatmentOnly with a
    // per-medication configurable day range. A device with an existing chemoOnly:true medication and
    // no explicit day fields keeps behaving identically (+-1) until the user edits it.
    // v20 restart (audit P2-1): treatmentOnly and treatmentMode used to be computed as two independent
    // reads of `original`, so a desynced stored pair (unreachable via the shipped UI, but possible via
    // tampering/a future import feature) would silently drive wrong visibility with no self-correction
    // -- even though this function is the one place every saved medication is supposed to pass through
    // for exactly that kind of schema-drift cleanup. treatmentMode is now resolved first as a local,
    // and treatmentOnly is derived FROM it (matching how saveMedicationEditor already writes them in
    // lockstep at save time), so the two fields can never disagree once they're normalized here.
    treatmentOnly: treatmentMode === 'only',
    treatmentDaysBefore: Number.isFinite(original.treatmentDaysBefore) ? Math.max(0, Math.round(original.treatmentDaysBefore)) : 1,
    treatmentDaysAfter: Number.isFinite(original.treatmentDaysAfter) ? Math.max(0, Math.round(original.treatmentDaysAfter)) : 1,
    treatmentMode: treatmentMode,
    // v20: pause a medication temporarily, for any reason, without deleting it. `paused` gates live
    // behavior (Home card, reminders, dose logging); `pausePeriods` is a permanent per-day-range record
    // of every past+current pause window, so missedDosesFor can skip exactly the days that were paused
    // -- even after resuming -- instead of flooding History with "missed" flags for the whole pause
    // window the moment it's lifted (see missedDosesFor's isPausedOn check below).
    paused: typeof original.paused === 'boolean' ? original.paused : false,
    pausedCheckinDate: Number.isFinite(original.pausedCheckinDate) ? original.pausedCheckinDate : null,
    pausePeriods: normalizePausePeriods(original.pausePeriods)
  };
  delete medication.chemoOnly;
  const sd = original.scheduleDays;
  if (sd && sd.mode === 'weekly' && Array.isArray(sd.days)) {
    const days = sd.days.map(Number).filter(d => d >= 0 && d <= 6);
    if (days.length && days.length < 7) medication.scheduleDays = { mode: 'weekly', days: days }; else delete medication.scheduleDays;
  } else if (sd && sd.mode === 'asneeded') {
    medication.scheduleDays = { mode: 'asneeded' };
  } else if (sd && sd.mode === 'interval' && Number(sd.n) >= 2 && sd.anchor) {
    medication.scheduleDays = { mode: 'interval', n: Math.round(Number(sd.n)), anchor: String(sd.anchor) };
  } else {
    delete medication.scheduleDays;
  }
  if (doses && doses.length) medication.doses = doses; else delete medication.doses;
  if (type === 'win') medication.windows = windows.length ? windows : [{ start: 0, end: 24, name: 'Daily' }]; else delete medication.windows;
  return medication;
}

function normalizeArchivedMeds(raw) {
  const archived = {};
  if (!raw || typeof raw !== 'object') return archived;
  Object.entries(raw).forEach(([id, value]) => {
    if (!value || typeof value !== 'object') return;
    // v20 restart (audit P1-1): archived entries used to be rebuilt as exactly {name, sub} on every
    // load, silently dropping pausePeriods the moment the page reloaded -- deleteMedicationConfig's
    // archive step below is only half the fix without this, since this function runs on every
    // loadMedicationConfig() call and would otherwise strip right back out what was just archived.
    archived[id] = { name: String(value.name || id), sub: String(value.sub || ''), pausePeriods: normalizePausePeriods(value.pausePeriods) };
  });
  return archived;
}

function defaultMedicationConfig() {
  // APP: fresh installs start with an empty list — the first-run guide walks the user
  // through building their own. DEFAULT_MEDS is retained only for legacy migrations.
  return { meds: [], archivedMeds: {} };
}

// v37 one-shot migration: Senokot became plain as-needed with 1- or 2-pill options.
// Saved device configs still carrying the old windowed Senokot get the fresh default;
// fires only while the saved med is still type 'win', so later manual edits persist.
function migrateSenokotV37(med) { return med; } // legacy migration retired (audit 1.3)

// A saved device config is a point-in-time snapshot of the FULL med list — it does not automatically
// pick up medications added to DEFAULT_MEDS after that snapshot was taken (e.g. Tylenol Liquid, added
// well after most devices had already saved a config from editing some other medication). Without this
// merge, a brand-new default medication would silently never appear on any device with an existing
// saved config, even though it renders fine on a fresh/no-saved-config session. Any DEFAULT_MEDS entry
// whose id isn't already present in the saved list AND isn't archived (deliberately deleted) gets
// appended, in DEFAULT_MEDS order at the end; existing customizations for meds already present are
// left untouched.
function mergeMissingDefaultMeds(meds, archivedMeds) {
  // APP: no auto-seeding of defaults — the user's list is entirely their own.
  return meds;
}

function loadMedicationConfig() {
  const fallback = defaultMedicationConfig();
  try {
    if (typeof localStorage === 'undefined') return fallback;
    const saved = JSON.parse(localStorage.getItem(MED_CONFIG_STORAGE_KEY));
    // v20 restart (audit P1-1, caught during fix verification): this used to also bail to the
    // fallback -- discarding a real, persisted `archivedMeds` -- whenever `saved.meds` was a validly
    // EMPTY array, not just when `saved` itself was missing/malformed. That's exactly what happens
    // the moment a user deletes their only medication: the next reload silently wiped archivedMeds,
    // so a medication re-added later got no pausePeriods restored, and the whole point of archiving
    // them on delete (see deleteMedicationConfig) was defeated for precisely the single-medication
    // case that's easiest for a real user to hit. Only bail on a genuinely malformed/missing save --
    // an empty meds array is valid data, not corruption, and must still carry its archivedMeds through.
    if (!saved || !Array.isArray(saved.meds)) return fallback;
    const archivedMeds = normalizeArchivedMeds(saved.archivedMeds);
    const meds = mergeMissingDefaultMeds(saved.meds.map(normalizeMedication).map(migrateSenokotV37), archivedMeds);
    return { meds, archivedMeds };
  } catch (error) {
    console.warn('Medication configuration could not be loaded:', error);
    return fallback;
  }
}

function persistMedicationConfig(meds, archivedMeds) {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(MED_CONFIG_STORAGE_KEY, JSON.stringify({ version: 1, meds, archivedMeds }));
  } catch (error) {
    console.warn('Medication configuration could not be saved:', error);
    setToast('Medication changes are active for this session but could not be saved on this device.');
  }
}

const CONFIG = { patientName: '', ceilingMg: 2500, tempUnit: 'Fahrenheit', weightUnit: 'lbs' };

  const md = (new Date(ts).getMonth() + 1) + '/' + new Date(ts).getDate();
  return weekday + ' ' + md;
}

// Protonix's evening (PM) dose log time for the given day, if logged yet — the second dose,
// after its own Morning window (8am-12pm) has closed.
function protonixEveningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 + 12 * 3600000 && e.ts < d0 + 86400000);
  return entry ? entry.ts : null;
}

// Iron (and Compazine's own routine, unlinked) open at 10 PM by default, but if Protonix's evening
// dose was logged, Iron instead opens 2 hours after that actual log time (so the two are spaced out).
function eveningWindowsFor(med, d0) {
  const pTs = protonixEveningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Night' }];
  }
  return med.windows; // default: 10 PM
}

// Protonix's morning (AM) dose log time for the given day, if logged yet — any entry logged
// before its own Evening window opens (noon).
function protonixMorningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 && e.ts < d0 + 12 * 3600000);
  return entry ? entry.ts : null;
}

// Buspirone/Paroxetine open at 10 AM by default (2h after Protonix's own default 8 AM dose time),
// but if Protonix's actual morning dose was logged, they instead open 2 hours after that real log
// time and stay open through end of day (mirrors eveningWindowsFor's pattern for Iron exactly:
// Iron defaults to 10 PM, 2h after Protonix's default 8 PM evening time, then shifts the same way).
function morningWindowsFor(med, d0) {
  const pTs = protonixMorningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Morning' }];
  }
  return med.windows; // default: 10 AM–midnight
}

function status(med) {
  const now = state.now;
  // v20: defense-in-depth -- the Home card bypasses status() entirely for a paused medication (see
  // medCards/renderGroupedMedsCard), but logMed()/other direct callers of status() are reachable
  // independent of the card UI, so this closes that gap too.
  if (med.paused) return { locked: true, paused: true };
  if (med.id === 'zofran' && zofranBlockedOn(now)) {
    // 3-day block (chemo day + 2 following days, see zofranBlockedOn) — opens on day+3 at 8am.
    return { locked: true, chemoBlock: true, availableAt: dayStart(nextChemoTs()) + 3 * 86400000 + 8 * 3600000 };
  }
  const es = entriesFor(med.id).slice().sort((a, b) => a.ts - b.ts);
  if (med.type === 'gap') {
    // Check daily ceiling first (Tylenol mg or Imodium pills)
    if (med.ceiling) {
      const dc = dailyCeiling(med);
      if (dc && dc.used >= dc.max) {
        if (med.rollingCeilingH) {
          // Rolling-window ceiling (e.g. Morphine's 15 mg / 4h): the lockout self-resolves as old
          // doses age out of the window, not at midnight — compute the actual next-available time.
          return { locked: true, ceilingHit: true, rollingCeiling: true, ceilingLabel: dc.label, availableAt: rollingCeilingAvailableAt(med) };
        }
        return { locked: true, ceilingHit: true, ceilingLabel: dc.label };
      }
    }
    // Form-specific volume cap (e.g. Tylenol Liquid's 90 mL/24h) — independent of the mg ceiling
    if (med.volumeCeilingMl) {
      const vc = dailyVolumeCeiling(med);
      if (vc && vc.used >= vc.max) {
        return { locked: true, ceilingHit: true, ceilingLabel: vc.label };
      }
    }
    // Rolling-ceiling meds (Morphine) are gated solely by the mg ceiling above — a half dose must
    // NOT trigger a flat gapH lockout the way a full dose does, since there's still 7.5 mg of room
    // left in the 4-hour window. Per-dose-button blocking (doseBlocked, in the render loop) still
    // prevents logging a dose that would push the rolling total over the ceiling.
    if (med.rollingCeilingH) return { locked: false };
    const last = es[es.length - 1];
    if (!last) return { locked: false };
    const at = last.ts + med.gapH * 3600000;
    return { locked: now < at, availableAt: at };
  }
  const d0 = dayStart(now), atH = (h) => d0 + h * 3600000;
  const windows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0)) : med.eveningLinkedToProtonix ? eveningWindowsFor(med, d0) : med.morningLinkedToProtonix ? morningWindowsFor(med, d0) : med.windows;
  // v23: scheduled meds can now optionally carry a gapH minimum-gap lockout on top of their time
  // windows (Aaron-requested — "scheduled meds still could have gap timers"). This ORs in with the
  // window logic below: a window being open no longer guarantees "available" if the last dose was
  // logged too recently. The existing "Log early" override UI already keys off locked/availableAt
  // generically, so it picks this up with no changes of its own.
  const lastForGap = es[es.length - 1];
  const gapAvailableAt = (med.gapH && lastForGap) ? lastForGap.ts + med.gapH * 3600000 : null;
  for (const w of windows) {
    const ws = atH(w.start), we = atH(w.end);
    const used = es.some(e => e.ts >= ws && e.ts < we);
    if (used) continue;
    if (now < ws) return { locked: true, availableAt: gapAvailableAt ? Math.max(ws, gapAvailableAt) : ws, windowName: w.name };
    if (now >= ws && now < we) {
      if (gapAvailableAt && now < gapAvailableAt) return { locked: true, availableAt: gapAvailableAt, windowName: w.name };
      return { locked: false, windowName: w.name };
    }
  }
  const chemoOver = med.treatmentOnly && !treatmentActiveOn(med, d0 + 86400000);
  if (chemoOver) {
    return { locked: true, courseComplete: true };
  }
  const tomorrowWindows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0 + 86400000)) : windows;
  const first = tomorrowWindows[0];
  return { locked: true, availableAt: d0 + 86400000 + first.start * 3600000, windowName: first.name };
}

function setToast(msg) {
  setState({ toast: msg });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setState({ toast: null }), 4500);
}

function afterLog(entry) {
  const twoH = 2 * 3600000;
  if (entry.medId === 'iron' || entry.medId === 'protonix') {
    const other = entry.medId === 'iron' ? 'protonix' : 'iron';
    const near = state.entries.find(e => e.medId === other && e.id !== entry.id && Math.abs(e.ts - entry.ts) <= twoH);
    if (near) { setState({ warn: { tone: 'amber', title: 'Iron + Protonix timing', body: 'Iron and Protonix were logged within 2 hours of each other. Protonix (a PPI) lowers stomach acid, which can markedly reduce iron absorption. Aim to separate the two by at least 2 hours.' } }); return; }
  }
  if (entry.medId === 'tylenol' || entry.medId === 'tylenol-liquid') {
    const mg = tylenolMg();
    const tylenol = state.meds.find(med => med.id === 'tylenol');
    const limit = medicationCeilingMax(tylenol) || 0;
    const mgOver = limit > 0 && mg > limit;
    let volOver = false, vol = 0, liquidMed = null;
    if (entry.medId === 'tylenol-liquid') {
      liquidMed = state.meds.find(med => med.id === 'tylenol-liquid');
      vol = dailyVolumeMl('tylenol-liquid');
      volOver = !!(liquidMed && liquidMed.volumeCeilingMl && vol > liquidMed.volumeCeilingMl);
    }
    if (mgOver && volOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg (above the " + limit.toLocaleString() + " mg daily limit) and Tylenol Liquid volume is " + vol + " mL (above the " + liquidMed.volumeCeilingMl + " mL daily limit). Do not give more without contacting the care team." } });
    } else if (mgOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg, above the " + limit.toLocaleString() + " mg daily limit. Do not give more without contacting the care team." } });
    } else if (volOver) {
      setState({ warn: { tone: 'red', title: 'Tylenol Liquid volume ceiling exceeded', body: "Today's Tylenol Liquid total is " + vol + " mL, above the " + liquidMed.volumeCeilingMl + " mL daily limit. Do not give more without contacting the care team." } });
    }
  } else {
    const configuredMedication = state.meds.find(med => med.id === entry.medId);
    const configuredLimit = dailyCeiling(configuredMedication);
    if (configuredLimit && configuredLimit.used > configuredLimit.max) {
      setState({ warn: { tone: 'red', title: configuredMedication.name + ' daily limit exceeded', body: "Today's " + configuredMedication.name + ' total is ' + configuredLimit.used + ' ' + configuredLimit.unit + ', above the ' + configuredLimit.label + ' daily limit. Do not give more without contacting the care team.' } });
    }
  }
}

async function logMed(medId, dose, opts) {
  opts = opts || {};
  const med = state.meds.find(m => m.id === medId);
  const st = status(med);
  if (st.locked && !opts.force) { setState({ override: { medId } }); return; }
  setState({ override: null, timeModal: { type: 'med', medId, dose, opts, timeValue: nowLocalISO() } });
}

// Backfill a missed dose from History — opens the same log flow, pre-filled to the missed
// window's scheduled time (editable), bypassing the lock check since this IS the catch-up path.
function logMissedDose(e) {
  const med = state.meds.find(m => m.id === e.medId);
  if (!med) return;
  const dose = med.doses ? med.doses[0] : null;
  const d = new Date(e.ts);
  const pad = n => String(n).padStart(2, '0');
  const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  setState({ override: null, timeModal: { type: 'med', medId: e.medId, dose, opts: { force: true }, timeValue: iso } });
}

function tempDefault() { return CONFIG.tempUnit === 'Celsius' ? '36.9' : '98.5'; }
async function logTemp() {
  const raw = (state.tempInput || '').trim();
  const v = parseFloat(raw);
  const tempOk = CONFIG.tempUnit === 'Celsius' ? (v >= 30 && v <= 45) : (v >= 86 && v <= 113);
  if (!raw || isNaN(v) || !tempOk) { setToast(CONFIG.tempUnit === 'Celsius' ? 'Enter a valid temperature in °C (30–45)' : 'Enter a valid temperature in °F (86–113)'); return; }
  setState({ timeModal: { type: 'temp', tempValue: v, timeValue: nowLocalISO() } });
}

async function setChemoDate() {
  const raw = (state.chemoInput || '').trim();
  if (!raw) { setToast('Pick a date first'); return; }
  const p = raw.split('-').map(Number);
  const ts = new Date(p[0], p[1] - 1, p[2]).getTime();
  if (isNaN(ts)) { setToast('Invalid date'); return; }
  await addEntryDB({ medId: 'chemo_date', dose: 'Treatment scheduled', mg: 0, ts, loggedAt: Date.now() });
  setState({ chemoInput: '' });
  setToast('Treatment date set — ' + new Date(ts).toLocaleDateString());
}

function weightDefault() { const lw = latest('weight'); return lw ? String(dispWeight(lw)) : ''; } // v12b: converted to current unit
async function logBloodPressure() {
  const sys = Math.round(Number(state.bpSysInput));
  const dia = Math.round(Number(state.bpDiaInput));
  if (!(sys >= 40 && sys <= 300) || !(dia >= 20 && dia <= 200)) { setToast('Enter a valid reading, e.g. 120 over 80.'); return; }
  const ts = state.now;
  await addEntryDB({ medId: 'blood_pressure', sys: sys, dia: dia, dose: sys + '/' + dia + ' mmHg', mg: 0, ts: ts });
  state.bpSysInput = ''; state.bpDiaInput = '';
  setToast('Blood pressure ' + sys + '/' + dia + ' logged at ' + fmtTime(ts));
}

async function logWeight() {
  const raw = (state.weightInput || '').trim();
  const v = parseFloat(raw);
  if (!raw || isNaN(v) || v <= 0 || v > 999) { setToast('Enter a valid weight'); return; }
  setState({ timeModal: { type: 'weight', weightValue: v, timeValue: nowLocalISO() } });
}

async function confirmTimeAndLog() {
  const m = state.timeModal;
  if (!m) return;
  // 'period' logs its own Start/End pair below with its own validation -- it has no single
  // m.timeValue, so it's excluded from this shared single-timestamp check.
  let ts;
  if (m.type !== 'period') {
    ts = new Date(m.timeValue).getTime();
    if (isNaN(ts)) { setToast('Invalid time'); return; }
    if (ts > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
  }

  if (m.type === 'med') {
    const med = state.meds.find(x => x.id === m.medId);
    if (med.painScale && !m.painLevel) { setToast('Select a pain level before logging ' + med.name); return; }
    const entry = { medId: m.medId, dose: m.dose ? m.dose.label : null, mg: m.dose ? (m.dose.mg || 0) : 0, ts };
    if (m.dose && m.dose.pills) entry.pills = m.dose.pills;
    if (med.volumePerDoseMl) entry.volumeMl = med.volumePerDoseMl;
    if (med.painScale && m.painLevel) entry.painLevel = m.painLevel;
    const early = !!(m.opts && m.opts.force) && isEarlyAt(med, ts);
    // v23 (Aaron-requested): confirm on-screen when a dose was force-logged over today's daily
    // limit, the same way an early gap-timer override already gets "(early)" appended below.
    const overLimit = !!(m.opts && m.opts.force) && !!med.ceiling && (() => {
      const dc = dailyCeiling(med);
      if (!dc) return false;
      const amt = med.ceilingUnit ? (entry.pills || 0) : (entry.mg || 0);
      return amt > 0 && amt > (dc.max - dc.used);
    })();
    // v23 auditor fix: both "early" and "over-limit" overrides set the same entry.override flag,
    // so an over-limit log showed a factually wrong "EARLY" badge in the Journal/History even
    // though it wasn't early at all -- overrideReason lets the badge say which one actually
    // happened. Entries logged before this fix have override:true with no overrideReason; the
    // badge below defaults those to "Early" since that was the only override reason that existed
    // at the time they were saved.
    if (early || overLimit) {
      entry.override = true;
      entry.overrideReason = early && overLimit ? 'both' : early ? 'early' : 'overLimit';
    }
    setState({ timeModal: null });
    await addEntryDB(entry);
    setToast(med.name + ' logged' + (m.dose ? (' · ' + m.dose.label) : '') + (entry.painLevel ? (' · Pain ' + entry.painLevel + '/10') : '') + (early ? ' (early)' : '') + (overLimit ? ' (over today’s limit)' : '') + ' at ' + fmtTime(ts));
    setTimeout(() => afterLog({ ...entry, id: 'pending' }), 500);
  } else if (m.type === 'temp') {
    const v = m.tempValue;
    const suffix = tempSuffix();
    const entry = { medId: 'temp', temp: v, unit: CONFIG.tempUnit, dose: v + ' ' + suffix, mg: 0, ts };
    setState({ tempInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Temperature ' + v + ' ' + suffix + ' logged at ' + fmtTime(ts));
  } else if (m.type === 'weight') {
    const v = m.weightValue;
    // Liters is optional, but if the user typed something while Paracentesis is selected, it must
    // be a valid amount — silently dropping an out-of-range value would look like it saved when it
    // didn't (audit finding: caregiver reviewing the trend later would see "Paracentesis" with no
    // liters and no idea a typo or bad value was rejected).
    const litersRaw = (m.litersDrained === undefined || m.litersDrained === null) ? '' : String(m.litersDrained).trim();
    if (m.weightReason === 'paracentesis' && litersRaw !== '') {
      const litersCheck = parseFloat(litersRaw);
      if (isNaN(litersCheck) || litersCheck < 0 || litersCheck > 20) { setToast('Enter a valid liters amount (0–20), or leave it blank.'); return; }
    }
    const entry = { medId: 'weight', weight: v, unit: CONFIG.weightUnit, dose: v + ' ' + weightSuffix(), mg: 0, ts };
    if (m.weightReason) entry.weightReason = m.weightReason;
    if (m.weightReason === 'paracentesis' && litersRaw !== '') {
      const liters = parseFloat(litersRaw);
      entry.litersDrained = round1(liters);
    }
    const noteTrimmed = (m.weightNote || '').trim();
    if (noteTrimmed) entry.weightNote = noteTrimmed;
    setState({ weightInput: '', timeModal: null });
    await addEntryDB(entry);
    setToast('Weight ' + v + ' ' + weightSuffix() + ' logged at ' + fmtTime(ts));
  } else if (m.type === 'multi') {
    // Re-validate at confirm time — a med may have locked between opening and confirming (audit 6.5)
    const ids = m.medIds.filter(id => { const md = state.meds.find(x => x.id === id); return md && !status(md).locked && medScheduledOn(md, ts); });
    const skipped = m.medIds.length - ids.length;
    setState({ timeModal: null });
    if (skipped > 0) setToast(skipped + ' medication' + (skipped > 1 ? 's' : '') + ' skipped (not currently due)');
    for (const id of ids) {
      const md = state.meds.find(x => x.id === id);
      const d0 = md && md.doses ? md.doses[0] : null;
      const en = { medId: id, dose: d0 ? d0.label : null, mg: d0 ? (d0.mg || 0) : 0, ts };
      if (d0 && d0.pills) en.pills = d0.pills;
      await addEntryDB(en);
    }
    setToast(ids.length + ' meds logged at ' + fmtTime(ts));
    setTimeout(() => { if (ids.includes('iron')) afterLog({ medId: 'iron', ts, id: 'pending' }); }, 500);
  } else if (m.type === 'period') {
    // Retroactive Start(+Stop) logging for Cycle/In-Patient via the "+" control (v68 redesign).
    // Always writing a matched Start+End pair (instead of the old single-marker log) means the
    // resulting period is always well-formed and unambiguous to cyclePeriods()/inpatientPeriods()'s
    // chronological pairing -- a lone backdated Start could previously get silently swallowed
    // (overwritten with no visible trace) if a later Start already existed with no End between them.
    // The "still ongoing" path (End omitted) keeps that same risk, so it's guarded explicitly below.
    const startTs = new Date(m.startValue).getTime();
    if (isNaN(startTs)) { setToast('Invalid start time'); return; }
    if (startTs > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
    if (m.ongoing) {
      const related = state.entries.filter(e => e.medId === m.startMedId || e.medId === m.endMedId);
      const latest = related.reduce((mx, e) => Math.max(mx, e.ts), -Infinity);
      if (related.length && startTs <= latest) {
        setToast('This start time is before an existing ' + m.label + ' entry \u2014 add an End time to close this stay out, or edit the conflicting entry instead.');
        return;
      }
      setState({ timeModal: null });
      await addEntryDB({ medId: m.startMedId, dose: null, mg: 0, ts: startTs });
      setToast(m.label + ' Start logged for ' + new Date(startTs).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' at ' + fmtTime(startTs));
    } else {
      const endTs = new Date(m.endValue).getTime();
      if (isNaN(endTs)) { setToast('Invalid end time'); return; }
      if (endTs <= startTs) { setToast('End must be after Start'); return; }
      if (endTs > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
      setState({ timeModal: null });
      await addEntryDB({ medId: m.startMedId, dose: null, mg: 0, ts: startTs });
      await addEntryDB({ medId: m.endMedId, dose: null, mg: 0, ts: endTs });
      setToast(m.label + ' logged: ' + new Date(startTs).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' \u2013 ' + new Date(endTs).toLocaleDateString([], { month: 'short', day: 'numeric' }));
    }
  } else if (m.type === 'symptom') {
    if (!m.symptomType) { setToast('Select a symptom first'); return; }
    if (m.symptomType === 'other' && !(m.note || '').trim()) { setToast('Describe the symptom before saving'); return; }
    const editId = m.editId;
    setState({ timeModal: null });
    if (editId) await removeEntryDB(editId);
    await logSymptom(m.symptomType, ts, { note: (m.note || '').trim() });
    setToast((SYMPTOM_TYPES[m.symptomType] || m.symptomType) + (editId ? ' updated' : ' logged') + ' at ' + fmtTime(ts));
  }
}

// ---- Menstrual cycle tracking ----
// Instant one-tap events, no time picker — logs at the current moment.
function cycleEntries() { return state.entries.filter(e => e.medId === 'cycle_start' || e.medId === 'cycle_end').sort((a, b) => a.ts - b.ts); }
function cycleActive() {
  const es = cycleEntries();
  if (!es.length) return false;
  return es[es.length - 1].medId === 'cycle_start';
}
function lastCycleStart() {
  const es = entriesFor('cycle_start');
  return es.length ? es.reduce((a, b) => a.ts > b.ts ? a : b) : null;
}
function daysSinceCycleStart() {
  const last = lastCycleStart();
  if (!last) return null;
  return Math.floor((dayStart(state.now) - dayStart(last.ts)) / 86400000) + 1; // start day counts as Day 1
}
async function logCycleStart() { await addEntryDB({ medId: 'cycle_start', dose: null, mg: 0, ts: simNow() }); setToast('Period start logged'); }
async function logCycleEnd() { await addEntryDB({ medId: 'cycle_end', dose: null, mg: 0, ts: simNow() }); setToast('Period end logged'); }
function cyclePeriods() {
  // Pairs cycle_start/cycle_end chronologically into periods; the most recent period has end:null
  // if it's still active. Returned most-recent-first for display.
  //
  // A second cycle_start logged while one is already open (no cycle_end between them — e.g. a
  // double-tap, or correcting an accidental Start via the "+" log-for-another-day control) does
  // NOT start a second period. It updates the still-open period's start time instead. This keeps
  // this list consistent with cycleActive()/daysSinceCycleStart(), which already treat only the
  // single latest event as authoritative — without this, the earlier open period would be
  // orphaned and stuck showing as "Active" in history forever, even after a real Period End is
  // later logged against the newer start. Found live during the 30-use-case QA pass (UC20): two
  // back-to-back Period Starts around 7/14 left a permanently un-closeable "7/14/2026 – Active"
  // duplicate in Cycle History.
  const events = cycleEntries();
  const periods = [];
  let cur = null;
  events.forEach(e => {
    if (e.medId === 'cycle_start') {
      if (cur && cur.end === null) { cur.start = e.ts; }
      else { cur = { start: e.ts, end: null }; periods.push(cur); }
    }
    else if (e.medId === 'cycle_end' && cur && cur.end === null) { cur.end = e.ts; }
  });
  return periods.reverse();
}
function fmtCyclePeriod(p) {
  const startLabel = fmtInpatientDate(p.start);
  if (p.end === null) return startLabel + ' – Active';
  const days = Math.round((dayStart(p.end) - dayStart(p.start)) / 86400000) + 1;
  const endLabel = fmtInpatientDate(p.end);
  return startLabel === endLabel ? startLabel : startLabel + ' – ' + endLabel + ' (' + days + ' day' + (days === 1 ? '' : 's') + ')';
}

// ---- Bowel Movement tracking ----
// One retrospective daily entry (usually), value one of: normal / very_little / none / diarrhea,
// tagged to the day being reported on. An "issue" is active for as long as the most recent
// consecutive daily answers are none/diarrhea; it ends the first day a normal/very_little answer
// is given. Derived entirely from the daily entries themselves — no separate start/end markers —
// so there's a single source of truth shared by the retrospective card and the Symptoms tab
// (a Diarrhea/Constipation entry there can start/continue this same tracker, but only a genuine
// daily answer of normal/very_little can end it).
const BOWEL_ISSUE_VALUES = new Set(['none', 'diarrhea']);
const BOWEL_MOVEMENT_LABELS = { normal: 'Normal', very_little: 'Very little', none: 'None', loose: 'Loose', diarrhea: 'Diarrhea' };
function yesterdayStart(now) { return dayStart(now) - 86400000; }
// Shared "must be answered today" escalation rules — quiet reminder in the morning, firmer by
// afternoon, urgent by evening. Used by the Daily Weight, Bowel Movement, and Appetite Home
// alerts so all three escalate identically rather than each having its own copy of the logic.
// Home screen & daily check-in preferences (audit §4). Vitals cards default ON; the daily
// check-in alerts default OFF for a general audience — they were the original family's
// care-team instruction, not a universal need. Cycle tracking is opt-in.
const HOME_PREF_DEFAULTS = { showTemperature: true, showWeight: true, showBloodPressure: true, showChemoSchedule: true, dailyWeightCheckin: false, bowelCheckin: false, appetiteCheckin: false, cycleTracking: false };
function homePref(key) {
  const prefs = getPrefsDB();
  const saved = prefs.homeCards || {};
  return typeof saved[key] === 'boolean' ? saved[key] : HOME_PREF_DEFAULTS[key];
}
function setHomePref(key, value) {
  const prefs = getPrefsDB();
  const next = { ...(prefs.homeCards || {}) };
  next[key] = value;
  setPrefsDB({ homeCards: next });
  setState({});
}

function dailyAlertLevel(now) {
  // Never escalate on install day — a 7 PM install must not open to urgent red alerts (audit 2.1/2.2)
  if (dayStart(now) === dayStart(MISSED_TRACK_SINCE)) return 0;
  const hourNow = new Date(now).getHours();
  return hourNow >= 18 ? 2 : hourNow >= 12 ? 1 : 0; // 0 quiet, 1 firm, 2 urgent
}
// Unified notice/banner tones (design batch 2, item 6): tone is an accent on a white card,
// never a flood. accent drives the 4px left border and solid action buttons; chipBg/chipFg
// drive the tinted icon chip. Shared geometry lives at each banner's container.
const NOTICE_TONES = {
  info:      { accent: '#A24C71', chipBg: 'rgba(162,76,113,0.12)', chipFg: '#8E3D61' },
  attention: { accent: '#B5761E', chipBg: 'rgba(181,118,30,0.14)', chipFg: '#8C5900' },
  urgent:    { accent: '#C0453B', chipBg: 'rgba(192,69,59,0.12)',  chipFg: '#A5443C' }
};
function dailyAlertStyle(level) {
  return NOTICE_TONES[level === 2 ? 'urgent' : level === 1 ? 'attention' : 'info'];
}
function bowelMovementEntriesByDay() {
  const map = new Map();
  state.entries.filter(e => e.medId === 'bowel_movement').forEach(e => {
    const d0 = dayStart(e.ts);
    const existing = map.get(d0);
    if (!existing || e.ts >= existing.ts) map.set(d0, e);
  });
  return map;
}
function bowelMovementFor(dayStartTs) { return bowelMovementEntriesByDay().get(dayStartTs) || null; }
function latestBowelDay() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return days[0];
}
function bowelMovementHistorySorted() { return [...bowelMovementEntriesByDay().values()].sort((a, b) => b.ts - a.ts); }
async function logBowelMovement(value, dayStartTs) {
  await addEntryDB({ medId: 'bowel_movement', value, dose: BOWEL_MOVEMENT_LABELS[value] || value, mg: 0, ts: dayStartTs + 12 * 3600000 });
}
function bowelIssueActive() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return false;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  return BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value);
}
function currentBowelIssueType() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  const latest = byDay.get(days[0]);
  return BOWEL_ISSUE_VALUES.has(latest.value) ? latest.value : null;
}
function daysSinceBowelIssueStart() {
  const byDay = bowelMovementEntriesByDay();
  if (!byDay.size) return null;
  const days = [...byDay.keys()].sort((a, b) => b - a);
  if (!BOWEL_ISSUE_VALUES.has(byDay.get(days[0]).value)) return null;
  let count = 0, expected = days[0];
  for (const d of days) {
    if (d !== expected) break; // a gap in consecutive daily answers breaks the streak
    if (!BOWEL_ISSUE_VALUES.has(byDay.get(d).value)) break;
    count++;
    expected = d - 86400000;
  }
  return count;
}
// Overwrites (rather than appends to) a given day's retrospective answer, so there's always at
// most one bowel_movement entry per day — keeps the "last daily answer wins" derivation above
// unambiguous even when the user changes their mind and hits Update.
async function submitBowelMovement(dayStartTs) {
  const v = state.bowelInput;
  if (!v) { setToast('Select a bowel movement status first'); return; }
  try {
    const existing = bowelMovementFor(dayStartTs);
    if (existing) await removeEntryDB(existing.id);
    await logBowelMovement(v, dayStartTs);
    setState({ bowelInput: undefined });
    setToast('Bowel movement logged — ' + (BOWEL_MOVEMENT_LABELS[v] || v));
  } catch (e) {
    setToast('Could not save — please try again');
  }
}
// Quick-update from the pinned "Bowel Issue Active" banner (mirrors submitBowelMovement, but
// targets whichever day is currently driving the active streak — not necessarily "yesterday" —
// and uses its own input field so it never fights with the retrospective card's dropdown.
async function submitBowelBannerUpdate() {
  const day = latestBowelDay();
  const v = state.bowelBannerInput;
  if (day === null) return;
  if (!v) { setToast('Select a bowel movement status first'); return; }
  try {
    const existing = bowelMovementFor(day);
    if (existing) await removeEntryDB(existing.id);
    await logBowelMovement(v, day);
    setState({ bowelBannerInput: undefined });
    setToast('Bowel movement updated — ' + (BOWEL_MOVEMENT_LABELS[v] || v));
  } catch (e) {
    setToast('Could not save — please try again');
  }
}

// ---- Appetite tracking ----
// One retrospective daily entry (like Bowel Movement), value one of: normal / little / none,
// tagged to the day being reported on, with an optional free-text note for the reason. Lives in
// its own Reports tab rather than a Home card. At most one appetite entry per day — Update
// overwrites (rather than appends to) that day's answer, same pattern as Bowel Movement.
const APPETITE_LABELS = { normal: 'Normal', little: 'Little to none', none: 'No Appetite' };
function appetiteEntriesByDay() {
  const map = new Map();
  state.entries.filter(e => e.medId === 'appetite').forEach(e => {
    const d0 = dayStart(e.ts);
    const existing = map.get(d0);
    if (!existing || e.ts >= existing.ts) map.set(d0, e);

function appetiteFor(dayStartTs) { return appetiteEntriesByDay().get(dayStartTs) || null; }

// tracked properly via the dedicated Bowel Movement Home alert/history — having both created
// confusing duplicate entry points for the same thing. 'diarrhea'/'constipation' remain in
// SYMPTOM_TYPES/SYMPTOM_COLORS below purely so any pre-existing logged entries of those types still
// display correctly in history. v68: expanded the pickable list from Nausea/Vomiting/Other to the
// most commonly-tracked chemo side effects, per Aaron's request.

// ---- In-Patient (hospital) tracking ----
// Paired start/end events (mirrors menstrual cycle) — supports half-day precision.
// Legacy single-day 'inpatient' marker entries (pre-redesign) are still recognized
// by isInpatientDay() for missed-dose suppression, but no longer created.
function fmtInpatientDate(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
}
function fmtInpatientDateTime(ts) {
  const d = new Date(ts);
  return fmtInpatientDate(ts) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function inpatientEntries() { return state.entries.filter(e => e.medId === 'inpatient_start' || e.medId === 'inpatient_end').sort((a, b) => a.ts - b.ts); }
function inpatientPeriods() {
  // See cyclePeriods()'s matching comment: a second inpatient_start logged while one is already
  // open (no inpatient_end between them — reachable via the "+ Log for another day" control, which
  // has no active-stay guard the way the main Start button does) updates the still-open period's
  // start/startId instead of orphaning a second, permanently-"Active" period in history.
  const events = inpatientEntries();
  const periods = [];
  let cur = null;
  events.forEach(e => {
    if (e.medId === 'inpatient_start') {
      if (cur && cur.end === null) { cur.start = e.ts; cur.startId = e.id; }
      else { cur = { start: e.ts, end: null, startId: e.id, endId: null }; periods.push(cur); }
    }
    else if (e.medId === 'inpatient_end' && cur && cur.end === null) { cur.end = e.ts; cur.endId = e.id; }
  });
  return periods.reverse(); // most recent first
}
function currentInpatientPeriod() {
  const ps = inpatientPeriods();
  return (ps.length && ps[0].end === null) ? ps[0] : null;
}
function isInpatientActiveNow() { return !!currentInpatientPeriod(); }
function daysSinceInpatientStart() {
  const cur = currentInpatientPeriod();
  if (!cur) return null;
  return Math.floor((dayStart(state.now) - dayStart(cur.start)) / 86400000) + 1; // start day counts as Day 1
}
function isInpatientDay(ts) {
  const d0 = dayStart(ts), d1 = d0 + 86400000;
  if (state.entries.some(e => e.medId === 'inpatient' && dayStart(e.ts) === d0)) return true; // legacy marker
  return inpatientPeriods().some(p => p.start < d1 && (p.end === null || p.end > d0));
}
async function logInpatientStart() {
  if (isInpatientActiveNow()) return;
  await addEntryDB({ medId: 'inpatient_start', dose: null, mg: 0, ts: simNow() });
  setToast('In-Patient started — meds now show as Restricted');
}
async function logInpatientEnd() {
  if (!isInpatientActiveNow()) return;
  await addEntryDB({ medId: 'inpatient_end', dose: null, mg: 0, ts: simNow() });
  setToast('In-Patient ended');
}
let _undoInpatientTimer = null;
async function undoInpatientStart() {
  const cur = currentInpatientPeriod();
  if (!cur) return;
  if (!state.confirmUndoInpatient) {
    setState({ confirmUndoInpatient: true });
    setToast('Tap Undo again to remove this In-Patient entry');
    clearTimeout(_undoInpatientTimer);
    _undoInpatientTimer = setTimeout(() => setState({ confirmUndoInpatient: false }), 5000);
    return;
  }
  clearTimeout(_undoInpatientTimer);
  await removeEntryDB(cur.startId);
  setState({ confirmUndoInpatient: false });
  setToast('In-Patient entry removed');
}
function fmtInpatientPeriod(p) {
  const startLabel = fmtInpatientDateTime(p.start);
  if (p.end === null) return startLabel + ' – Active';
  const days = Math.round((dayStart(p.end) - dayStart(p.start)) / 86400000) + 1;
  const endLabel = fmtInpatientDateTime(p.end);
  return startLabel + ' – ' + endLabel + ' (' + days + ' day' + (days === 1 ? '' : 's') + ')';
}

// Type scale (design batch 2, item 1) — 7 spread-able steps. Usage: style: { ...TYPE.title, color: '#2A2127' }.
// Color stays separate; standard text colors: ink #2A2127, secondary #554A52, tertiary #7A6E76, rose label #8E3D61.
// Weight 800 is reserved for `display` and primary CTA labels; no text below 12px.
const TYPE = {
  display:  { fontSize: '24px', fontWeight: '800', lineHeight: '1.1',  letterSpacing: '-0.03em'  }, // page titles
  title:    { fontSize: '17px', fontWeight: '700', lineHeight: '1.25', letterSpacing: '-0.015em' }, // card/med/modal titles

  mono:     { fontSize: '14px', fontWeight: '600', lineHeight: '1.3',  letterSpacing: '-0.01em'  }  // pair with className:'mono'

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  let deferredValue; // <select> needs value applied AFTER its options exist; attribute alone never selects an option
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') {
        Object.assign(el.style, v);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'innerHTML') {
        el.innerHTML = v;
      } else if (k === 'className') {
        el.className = v;
      } else if (k === 'value') {
        el.setAttribute('value', v);
        deferredValue = v;
      } else {
        el.setAttribute(k, v);
      }
    }
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }
  if (deferredValue !== undefined) { try { el.value = deferredValue; } catch (e) {} }
  return el;
}

function navigateTo(view) {
  const editorClosing = !!state.medEditor && view !== 'meds'; // audit v12 P3-1: nav-away also closes the editor
  const next = { view, reportsView: view === 'reports' ? null : state.reportsView, medEditor: view === 'meds' ? state.medEditor : null, confirmDeleteMed: null };
  setState(next);
  persistView(view);
  window.scrollTo(0, 0);
  if (editorClosing) tourEvent('medEditor:closed'); // step the tour back BEFORE the view event so it re-points at Add
  tourEvent('view:' + view);
}

// ---- Left-side nav drawer (app-v22) — houses Profile/Calendar/Settings per Owner request. Kept
// as its own small state machine (not just a boolean) so open/close can manage focus properly:
// the trigger button ref is remembered so focus returns to it on close, matching standard
// dialog/drawer accessibility behavior (Designer research: M3 navigation drawer guidelines).
let drawerTriggerEl = null;
function openDrawer() {
  // Audit nice-to-have: the drawer (z90) renders above the first-run tour card (z80), so opening it
  // mid-tour buries the tour with no way back short of closing the drawer first. The hamburger has
  // no reason to be tapped mid-tour (the tour's own Skip/Back/Next controls are always available),
  // so simplest fix is just not opening the drawer while a tour is in progress.
  if (state.tourStep != null) return;
  drawerTriggerEl = document.querySelector('[data-tour="menu-btn"]');
  setState({ drawerOpen: true });
  setTimeout(() => { const el = document.getElementById('drawer-close-btn'); if (el) el.focus(); }, 50);
}
function closeDrawer() {
  setState({ drawerOpen: false });
  if (drawerTriggerEl) { try { drawerTriggerEl.focus(); } catch (e) {} }
}
function drawerGo(view) {
  closeDrawer();
  navigateTo(view);
}
// Escape closes the drawer from anywhere; Tab is trapped inside it while open so keyboard focus
// can't silently leave into the (visually obscured, scrim-covered) app behind it. Registered once
// at module scope, not per-render, so it never double-attaches.
document.addEventListener('keydown', (ev) => {
  if (!state.drawerOpen) return;
  if (ev.key === 'Escape') { ev.preventDefault(); closeDrawer(); return; }
  if (ev.key === 'Tab') {
    const panel = document.getElementById('app-drawer');
    if (!panel) return;
    const focusables = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});

function openReport(report) {
  setState({ view: 'reports', reportsView: report });
  persistView('reports');
  window.scrollTo(0, 0);
}

// Jumps straight to the top of the History tab, filtered to missed doses only (v70) -- used by
// both the pinned "previous days missed" header card (v69) and the Today missed-dose banner, so
// clicking either one takes the caregiver directly to a focused missed-only list instead of the
// full (much longer) day-by-day History. The "Show all" toggle in History switches back.
function goToHistoryTop() {

// Bulk-dismisses every missed dose currently visible in History's missed-only view (respecting
// whatever's already been resolved/dismissed) in one write, then confirms with a toast -- the
// "Clear all" companion to the per-row Clear button, for clearing a backlog in one tap instead of
// one row at a time. Uses the same dismissedMisses prefs field as the per-row Clear (v68), so it's
// stored in the same on-device prefs as that field.
async function clearAllMissedInHistory(now) {
  const all = [];
  for (let d = dayStart(MISSED_TRACK_SINCE); d <= dayStart(now); d = nextDay(d)) {
    missedDosesFor(d, now).forEach(m => all.push(missKey(m)));
  }
  if (!all.length) return;
  try {
    const next = (state.dismissedMisses || []).concat(all);
    await setPrefsDB({ dismissedMisses: next });
    setToast(all.length + ' missed dose' + (all.length > 1 ? 's' : '') + ' cleared');
  } catch (err) {
    setToast('Could not save — please try again');
  }
}

// Dose-progress ring (item 11): 44px SVG built as an innerHTML string, matching the existing
// lockSVG / weight-chart string pattern. Hidden entirely when nothing is scheduled today.
function doseRing(now) {
  const { scheduled, taken } = doseProgressToday(now);
  if (scheduled === 0) return null;
  const complete = taken >= scheduled && scheduled > 0;
  const C = 113.1; // 2π·18
  const offset = C * (1 - taken / scheduled);
  let svg = '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">';
  svg += '<circle cx="22" cy="22" r="18" stroke="#E9D2DB" stroke-width="4" fill="none"></circle>';
  svg += '<circle cx="22" cy="22" r="18" stroke="' + (complete ? '#0F9D6B' : '#A24C71') + '" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 22 22)" style="transition: stroke-dashoffset .5s ease"></circle>';
  svg += complete
    ? '<text x="22" y="27" text-anchor="middle" font-size="16" font-weight="800" fill="#0C7F57">✓</text>'
    : '<text x="22" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2127" font-family="ui-monospace,Menlo,monospace">' + taken + '/' + scheduled + '</text>';
  svg += '</svg>';
  return h('div', { innerHTML: svg, role: 'img', 'aria-label': taken + ' of ' + scheduled + ' scheduled doses logged today', style: { display: 'inline-flex', marginTop: '4px' } });
}

// Left-side nav drawer (app-v22, Owner-requested) — houses Profile / Calendar / Settings, the

// pill-shaped active indicator, and real dismissal (scrim tap, Escape, or the explicit X — see

function renderDrawer() {
  if (!state.drawerOpen) return null;

    h('div', { id: 'app-drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Menu', style: { position: 'absolute', left: '0', top: '0', bottom: '0', width: 'min(84vw, 320px)', background: '#FFFFFF', boxShadow: '4px 0 32px rgba(80,30,55,0.22)', display: 'flex', flexDirection: 'column', animation: 'drawerIn .26s cubic-bezier(0.16,1,0.3,1)', paddingTop: 'var(--safe-top)' } },
      // Identity header (app-v22 audit fix): the close "X" is now its own top-right button, not
      // nested inside the identity button. Two real bugs from the first pass, fixed together:
      // (1) a nested <button><span role=button></span></button> is invalid markup and inconsistent
      // across screen readers; (2) because the drawer opens flush to the header's top-left, the old

// Shared renderer for a "grouped" meds card (Evening meds, Morning meds) — a set of `type:'win'`
// meds presented together in one card with a "Take all" button when 2+ are currently open, instead
// of scattering them across the individual Quick Log cards. Used for the Protonix-linked meds
// (Buspirone/Paroxetine in the morning, Iron/Compazine in the evening).
function renderGroupedMedsCard(title, meds, now) {
  const inpatientNow = isInpatientActiveNow();
  // v20: paused and treatment-window-hidden meds are excluded from "due"/"Take all" the same way
  // medCards' upstream filter already excludes them for standalone Quick Log cards.
  const dueMeds = meds.filter(m => { if (m.paused) return false; if (m.treatmentOnly && !treatmentActiveOn(m, now)) return false; if (treatmentExcludedNow(m, now)) return false; if (!medScheduledOn(m, now)) return false; const s = status(m); return !s.locked; });
  return h('section', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' } },
      h('div', { style: { ...TYPE.label, color: '#8A6479' } }, title),
      (dueMeds.length >= 2 && !inpatientNow) ? h('button', { onClick: () => setState({ timeModal: { type: 'multi', medIds: dueMeds.map(m => m.id), timeValue: nowLocalISO() } }), style: { minHeight: '44px', padding: '0 16px', borderRadius: '11px', background: '#A24C71', color: '#fff', fontSize: '13.5px', fontWeight: '700', boxShadow: '0 2px 8px rgba(142,61,97,0.22)' } }, 'Take all (' + dueMeds.length + ')') : null
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '18px', overflow: 'hidden', marginTop: '11px', boxShadow: '0 4px 24px rgba(180,130,150,0.10), 0 1px 2px rgba(180,130,150,0.06)' } },
      ...meds.map((med, i) => {
        if (med.paused) {
          // v20: pause wins over every other row state, matching medCards' standalone card ordering.
          // Designer review (v20): apply the same opacity:0.65 muting as the treatment-excluded row
          // just below, so this card has one consistent "row is inert" visual language instead of a
          // third, weaker one of its own; copy also aligned with the standalone Home card's wording.

          ),
          right
        );
      })
    )
  );
}

function renderContent(now, mg, pct, tyColor, ceiling) {
  if (state.view === 'meds') return renderMedicationManager(now);
  if (state.view === 'settings') return renderSettings(now);
  if (state.view === 'reports') return state.reportsView ? renderReportDetail(state.reportsView, now) : renderReportsMenu(now);
  if (state.view === 'inpatient') return renderInPatient(now);
  if (state.view === 'symptoms') return renderSymptoms(now);
  if (state.view === 'calendar') return renderCalendarView(now);
  return [...renderToday(now, mg, pct, tyColor, ceiling)];
}

// ---------- Interactive first-run walkthrough (coach marks) ----------
// A step either waits for a real user action (advanceOn matches a tourEvent fired from the app's
// own handlers) or shows a Next button. Highlighting/positioning happens after every render in
// positionTour(), since render() rebuilds the whole DOM each pass.
const TOUR_STEPS = [
  { target: null, title: 'Welcome — let\u2019s set up together', text: 'ChemoWell works best once your medications are in. This quick guide walks you through adding your first medication and shows you where everything lives. It takes about two minutes.', next: 'Show me' },

  { target: 'nav-symptoms', title: 'Symptoms', text: 'Log symptoms like nausea, pain, or fever so you have a clear record to share with the care team.', next: 'Next' },
  { target: null, title: 'You\u2019re ready!', text: 'That\u2019s the basics. You can re-run this guide any time from the menu (the three lines, top left) \u2192 Settings \u2192 Replay the walkthrough.', next: 'Finish' }
];
// v12: on form-filling steps the tour renders as a slim banner (see renderTourLayer). tourExpanded
// tracks the user tapping "More" for the full card; deliberately NOT persisted and reset on every
// step change so each step starts in its designed default state.
let tourExpanded = false;
function startTour() { tourExpanded = false; setPrefsDB({ tourStep: 0 }); setState({ tourStep: 0 }); }
function endTour() { tourExpanded = false; setPrefsDB({ tourDone: true, tourStep: null }); setState({ tourStep: null }); tourClearHighlight(); }
function setTourStep(n) { tourExpanded = false; setPrefsDB({ tourStep: n }); setState({ tourStep: n }); } // progress survives app restarts (audit 2.4)
function advanceTour() {
  const n = (state.tourStep == null ? -1 : state.tourStep) + 1;
  if (n >= TOUR_STEPS.length) { endTour(); } else { setTourStep(n); }
}
function backTour() { if (state.tourStep > 0) setTourStep(state.tourStep - 1); }
function tourEvent(name) {
  if (state.tourStep == null) return;
  const step = TOUR_STEPS[state.tourStep];
  if (!step) return;
  if (step.advanceOn === name) { advanceTour(); return; }
  // v12: discarding the med editor mid-"Fill in the details" used to strand the tour ("Save the
  // medication to continue" with no editor open) — step back to the Add step instead.
  if (step.backOn === name) backTour();
}
function tourClearHighlight() {
  if (window.__tourHighlighted) {
    try {
      window.__tourHighlighted.style.outline = '';
      window.__tourHighlighted.style.outlineOffset = '';
      window.__tourHighlighted.style.animation = '';
      window.__tourHighlighted.style.animationDelay = '';
    } catch (e) {}
    window.__tourHighlighted = null;
  }
}
// v17: green attention treatment (Owner-reported — the guide banner/highlight blended in with the
// app's own rose accent family). TOUR_PULSE_MS/tourPulseDelay compute a phase-synced NEGATIVE
// animation-delay from real wall-clock time (Date.now(), not simNow()/state.now, so TEST_MODE date
// jumps never glitch the glow) so a freshly-created node — every element here is rebuilt every
// render pass, including every 1s tick — resumes the pulse mid-cycle instead of restarting it at 0%.
// A naive `animation: … infinite` without this would visibly "snap" once a second for as long as a
// tour step is on screen (same root cause as the v11 Plans-sheet flicker, different failure shape).
// prefers-reduced-motion: the existing global rule (`*{animation-duration:0.01ms !important}`) works
// for one-shot animations like sheetUp (it snaps to the end state and stops), but NOT for this one —
// tourPulse has `iteration-count: infinite`, which the global rule doesn't touch, so forcing its
// duration to 0.01ms just makes it loop at an absurd frequency instead of stopping. Design review
// (outputs/DESIGNER_REVIEW_v17.md) caught this by polling computed style every ~40ms under emulated
// reduced-motion and finding the outline alpha still jumping around unpredictably — a real flicker
// risk for photosensitive users, the opposite of what the setting is supposed to guarantee. Fix:
// check the media query directly in JS and skip the animation properties entirely when it's set, so
// the element falls back to its static base outline-color (full-opacity green) with nothing looping.
function prefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
}
const TOUR_PULSE_MS = 1600;
function tourPulseDelay() { return '-' + (Date.now() % TOUR_PULSE_MS) + 'ms'; }
function tourGlowAnim() {
  if (prefersReducedMotion()) return {};
  return { animation: 'tourPulse ' + TOUR_PULSE_MS + 'ms ease-out infinite', animationDelay: tourPulseDelay() };
}
function applyTourHighlight(el) {
  el.style.outline = '3px solid #2E7D4F';
  el.style.outlineOffset = '3px';
  if (prefersReducedMotion()) {
    el.style.animation = '';
    el.style.animationDelay = '';
  } else {
    el.style.animation = 'tourPulse ' + TOUR_PULSE_MS + 'ms ease-out infinite';
    el.style.animationDelay = tourPulseDelay();
  }
  window.__tourHighlighted = el;
}
function renderTourLayer() {
  if (state.tourStep == null) return null;
  const step = TOUR_STEPS[state.tourStep];
  const formStep = !!step.short; // action steps: the user must touch the app while the tour is up
  // v12 MOBILE FIRST: on steps that wait for a real tap (Meds tab, Add button, the whole med form,
  // Home tab) the big centered card covered the very element the user had to touch — verified by
  // real hit-target clicks, not just screenshots (Owner-reported on the form step). Those steps

function positionTour() {

  const banner = document.getElementById('tour-banner');
  if (!card && !banner) return;
  const isNewStep = tourLastPositionedStep !== state.tourStep;
  tourLastPositionedStep = state.tourStep;
  if (banner) {

    // brand row (not needed mid-step) so it NEVER covers page content the user must touch. No
    // repositioning, no scrollIntoView: the page content scrolls freely beneath the sticky header.
    if (step.target) {

      if (targetEl) applyTourHighlight(targetEl);
    }
    return;
  }
  if (!step.target) return; // centered
  const el = document.querySelector('[data-tour="' + step.target + '"]');
  if (!el) return; // target missing -> stay centered
  applyTourHighlight(el);
  if (isNewStep) { try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (e) {} }
  const r = el.getBoundingClientRect();
  const cardH = card.offsetHeight || 200;
  const margin = 14;
  let top;
  if (r.top > cardH + margin + 8) top = r.top - cardH - margin;
  else top = Math.min(window.innerHeight - cardH - 8, r.bottom + margin);
  card.style.top = Math.max(8 + safeTopPx(), top) + 'px';
  card.style.transform = 'translateX(-50%)';
}

          'Still ongoing (no end yet)'
        ),
        !m.ongoing ? h('div', { style: { marginTop: '14px' } },
          h('div', { style: { ...TYPE.label, color: '#8A6479', marginBottom: '8px' } }, 'End'),
          h('button', { onClick: () => { state.timeModal.endCalOpen = !state.timeModal.endCalOpen; state.timeModal.startCalOpen = false; setState({ timeModal: state.timeModal }); }, className: 'mono', style: { width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', minHeight: '44px', border: '1px solid rgba(212,104,138,0.2)', borderRadius: '13px', padding: '0 14px', fontSize: '15px', background: '#FFFFFF', color: '#2A2127' } },
            h('span', null, calPillLabel(m.endValue.slice(0, 10))),
            h('span', { style: { fontSize: '12px', color: '#8A6479' } }, m.endCalOpen ? '▲' : '▼')
