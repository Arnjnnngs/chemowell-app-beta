              (ds) => { state.timeModal.endValue = ds + 'T' + state.timeModal.endValue.slice(11); state.timeModal.endCalCursor = ds.slice(0, 7); setState({ timeModal: state.timeModal }); },
              (delta) => { const cur = state.timeModal.endCalCursor || state.timeModal.endValue.slice(0, 7); state.timeModal.endCalCursor = calShift(cur, delta); setState({ timeModal: state.timeModal }); }
            )
          ) : null,
          h('input', { type: 'time', value: m.endValue.slice(11), onInput: (e) => { state.timeModal.endValue = state.timeModal.endValue.slice(0, 10) + 'T' + e.target.value; }, className: 'mono', style: { width: '100%', minHeight: '44px', marginTop: '8px', border: '1px solid rgba(212,104,138,0.2)', borderRadius: '13px', padding: '0 14px', fontSize: '15px', background: '#FFFFFF', color: '#2A2127', colorScheme: 'light' } })
        ) : h('div', { style: { fontSize: '12px', color: '#7A6E76', marginTop: '10px', lineHeight: '1.4' } }, 'Only a Start will be logged \u2014 add the End later from the card once this stay is over.')
      ) : h('div', null,
        h('div', { style: { ...TYPE.label, color: '#8A6479', marginBottom: '8px' } }, 'Date'),
        // v70: collapsed behind a date pill by default (same pattern as the period Start/End
        // pickers above) -- this is what was overflowing the Symptom modal, which also carries a
        // dropdown + note textarea above this and had no way to scroll to reach Cancel/Confirm.
        h('button', { onClick: () => { state.timeModal.calOpen = !state.timeModal.calOpen; setState({ timeModal: state.timeModal }); }, className: 'mono', style: { width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', minHeight: '44px', border: '1px solid rgba(212,104,138,0.2)', borderRadius: '13px', padding: '0 14px', fontSize: '15px', background: '#FFFFFF', color: '#2A2127' } },
          h('span', null, calPillLabel(m.timeValue.slice(0, 10))),
          h('span', { style: { fontSize: '12px', color: '#8A6479' } }, m.calOpen ? '▲' : '▼')
        ),
        m.calOpen ? h('div', { style: { marginTop: '8px' } },
          renderCalendar(m.timeValue.slice(0, 10), m.calCursor || m.timeValue.slice(0, 7),
            (ds) => { state.timeModal.timeValue = ds + 'T' + state.timeModal.timeValue.slice(11); state.timeModal.calCursor = ds.slice(0, 7); setState({ timeModal: state.timeModal }); },
            (delta) => { const cur = state.timeModal.calCursor || state.timeModal.timeValue.slice(0, 7); state.timeModal.calCursor = calShift(cur, delta); setState({ timeModal: state.timeModal }); }
          )
        ) : null,
        h('div', { style: { ...TYPE.label, color: '#8A6479', margin: '14px 0 8px' } }, 'Time'),
        h('input', { type: 'time', value: m.timeValue.slice(11), onInput: (e) => { state.timeModal.timeValue = state.timeModal.timeValue.slice(0, 10) + 'T' + e.target.value; }, className: 'mono', style: { width: '100%', minHeight: '48px', border: '1px solid rgba(212,104,138,0.2)', borderRadius: '13px', padding: '0 14px', fontSize: '16px', background: '#FFFFFF', color: '#2A2127', colorScheme: 'light' } }),
        h('div', { style: { fontSize: '12px', color: '#7A6E76', marginTop: '6px' } }, 'Defaults to now — edit if logging a past time')
      ),
      showPainScale ? h('div', { style: { marginTop: '16px' } },
        h('div', { style: { ...TYPE.label, color: '#8A6479', marginBottom: '8px' } }, 'Pain level (1–10)'),
        h('select', { value: m.painLevel || '', onChange: (e) => { state.timeModal.painLevel = e.target.value ? Number(e.target.value) : null; }, className: 'mono', style: selectFix({ width: '100%', minHeight: '52px', border: '1px solid rgba(212,104,138,0.2)', borderRadius: '13px', padding: '0 14px', fontSize: '16px', background: '#FFFFFF', color: '#2A2127' }) },
          h('option', { value: '' }, 'Not recorded'),
          ...Array.from({ length: 10 }, (_, i) => i + 1).map(n => h('option', { value: String(n) }, String(n) + (n === 1 ? ' — mild' : n === 5 ? ' — moderate' : n === 10 ? ' — worst' : '')))
        )
      ) : null,
      m.futureOk ? h('div', { style: { marginTop: '14px', background: 'rgba(181,118,30,0.12)', border: '1px solid rgba(181,118,30,0.3)', borderRadius: '12px', padding: '11px 13px', fontSize: '13px', lineHeight: '1.45', color: '#9A6419', fontWeight: '600' } }, '⚠ This time is in the future. Press Confirm again to log it anyway.') : null,
      h('div', { style: { display: 'flex', gap: '10px', marginTop: '22px' } },
        h('button', { onClick: () => setState({ timeModal: null }), style: { flex: '1', minHeight: '50px', borderRadius: '13px', border: '1px solid #E3D5DA', background: '#FFFFFF', color: '#5F4A56', fontSize: '15px', fontWeight: '700' } }, 'Cancel'),
        h('button', { onClick: confirmTimeAndLog, style: { flex: '1', minHeight: '50px', borderRadius: '13px', background: '#A24C71', color: '#fff', fontSize: '15px', fontWeight: '700', boxShadow: '0 2px 8px rgba(142,61,97,0.22)' } }, 'Confirm')
      )
    )
  );
}

// Per-missed-window actions (v68, per Aaron's request): a late-logged dose was previously
// resolved only by inference (logging any same-day dose and hoping missedDosesFor's coverage
// math caught it), with no explicit way to say "I gave this late" vs "this was deliberately
// skipped" vs "just dismiss this, nothing to log". Now each row offers all three explicitly.
function missedRow(e, i) {
  return h('div', { style: { padding: '12px 14px', borderTop: i > 0 ? '1px solid rgba(192,69,59,0.2)' : 'none', background: 'rgba(192,69,59,0.06)', borderLeft: '3px solid #C0453B' } },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
      h('div', { className: 'mono', style: { ...TYPE.mono, color: '#C0453B', fontWeight: '700', minWidth: '66px' } }, fmtTime(e.ts)),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, color: '#2A2127', display: 'flex', alignItems: 'center', gap: '7px', flexWrap: 'wrap' } },
          nameOf(e.medId),
          h('span', { style: { fontSize: '12px', fontWeight: '700', letterSpacing: '0.05em', textTransform: 'uppercase', color: '#A5443C', background: 'rgba(192,69,59,0.12)', borderRadius: '6px', padding: '2px 7px' } }, 'Missed')
        ),
        h('div', { style: { ...TYPE.caption, color: '#7A6E76' } }, e.windowName + ' window closed')
      )
    ),
    h('div', { style: { display: 'flex', gap: '6px', marginTop: '10px' } },
      h('button', { onClick: () => logMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#C0453B', color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Took later'),
      h('button', { onClick: () => skipMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#FFFFFF', border: '1px solid #E3C2BE', color: '#A5443C', fontSize: '13px', fontWeight: '700' } }, 'Skipped'),
      h('button', { onClick: () => dismissMissedDose(e), style: { flex: '1', minHeight: '44px', borderRadius: '11px', background: '#FFFFFF', border: '1px solid #E3C2BE', color: '#A5443C', fontSize: '13px', fontWeight: '700' } }, 'Clear')
    )
  );
}

// Weight, Cycle markers, Bowel Movement, and Symptoms entries aren't part of the medication
// dosing safety chain the 48h lock protects, so they stay editable/removable indefinitely
// (data-entry corrections only). Symptoms use a medId prefix (symptom_nausea, etc.) rather than
// a fixed id, so those are matched separately below instead of being listed in this set.
const BYPASS_48H_IDS = new Set(['weight', 'cycle_start', 'cycle_end', 'bowel_movement', 'appetite']);
function bypasses48h(medId) { return BYPASS_48H_IDS.has(medId) || (medId && medId.indexOf('symptom_') === 0); }
function removeBtn(e) {
  if (!bypasses48h(e.medId) && state.now - e.ts > 48 * 3600000) return null; // entries older than 48h are permanent history
  if (state.confirmRemove === e.id) {
    return h('div', { style: { display: 'flex', gap: '6px', alignItems: 'center', flexShrink: '0' } },
      h('button', { onClick: () => { setState({ confirmRemove: null }); removeEntry(e.id); }, style: { color: '#fff', background: '#C0453B', fontSize: '12.5px', fontWeight: '700', minHeight: '44px', padding: '8px 12px', borderRadius: '9px' } }, 'Delete'),
      h('button', { onClick: () => setState({ confirmRemove: null }), style: { color: '#7A6E76', fontSize: '12.5px', minHeight: '44px', padding: '8px 6px', fontWeight: '600' } }, 'Keep')
    );
  }
  return h('button', { onClick: () => { setState({ confirmRemove: e.id }); setTimeout(() => { if (state.confirmRemove === e.id) setState({ confirmRemove: null }); }, 6000); }, style: { color: '#A15B56', fontSize: '12.5px', padding: '12px 10px' } }, 'Remove');
}

function renderToday(now, mg, pct, tyColor, ceiling) {
  const parts = [];
  const inpatientActiveNow = isInpatientActiveNow();

  // In-Patient banner — pinned, non-dismissible, only shown while a stay is active
  if (inpatientActiveNow) {
    const ipDayN = daysSinceInpatientStart();
    const ipTone = NOTICE_TONES.attention;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderLeft: '4px solid ' + ipTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'center', boxShadow: '0 2px 10px rgba(180,130,150,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: ipTone.chipBg, color: ipTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '+'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'In-Patient active'),
        h('div', { style: { ...TYPE.caption, color: '#554A52' } }, (ipDayN !== null ? ('Day ' + ipDayN + ' — ') : '') + 'meds below show as Restricted')
      ),
      h('button', { onClick: logInpatientEnd, style: { flexShrink: '0', minHeight: '44px', padding: '0 16px', borderRadius: '12px', background: ipTone.accent, color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Log In-Patient End')
    ));
  }

  // Today's Missed dose banner is scoped to TODAY only (v69) -- previously this walked every day
  // since MISSED_TRACK_SINCE and joined them into one ever-growing line, which meant an old unresolved
  // miss from a week ago never went away and the banner text just kept accumulating. Unresolved misses
  // from earlier days are now surfaced separately via the pinned "previous days" card in the header
  // (see pastMissedCount()/renderHeader()), which links straight to History instead of cluttering Today.
  const bannerItemsAll = missedDosesFor(dayStart(now), now).map(m => ({ ...m, when: 'Today' }));
  const bannerItems = bannerItemsAll.filter(m => m.ts > (state.missedClearedAt || 0));

  // MISSED DOSE ALERT — always on top; a Clear button lets the caregiver acknowledge
  // and dismiss the current list without deleting the underlying data (new misses still show).
  // Persisted in on-device prefs so it survives reloads.
  if (bannerItems.length) {
    // v70: the whole banner is now clickable -- tapping it (anywhere except the Clear button,
    // which stops propagation) jumps to History filtered to missed-only, same as the pinned
    // previous-days card. Clear still just dismisses today's banner in place without navigating.
    const mdTone = NOTICE_TONES.urgent;
    parts.push(h('div', { onClick: goToHistoryTop, role: 'button', tabindex: '0', 'aria-label': 'Review ' + bannerItems.length + ' missed dose' + (bannerItems.length > 1 ? 's' : '') + ' from today', onKeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); goToHistoryTop(); } }, style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderLeft: '4px solid ' + mdTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'flex-start', boxShadow: '0 2px 10px rgba(180,130,150,0.10)', cursor: 'pointer' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: mdTone.chipBg, color: mdTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '!'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', marginBottom: '4px' } },
          h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127' } }, 'Missed dose' + (bannerItems.length > 1 ? 's' : '')),
          h('button', { onClick: (ev) => { ev.stopPropagation(); clearMissedDoses(); }, style: { flexShrink: '0', minHeight: '44px', padding: '0 14px', borderRadius: '99px', background: 'transparent', border: '1px solid #E5C9D6', color: '#8E3D61', fontSize: '13px', fontWeight: '700' } }, 'Clear')
        ),
        // One line per miss (item 8) — med name in ink, details in secondary
        ...bannerItems.map(m => h('div', { style: { ...TYPE.caption, color: '#554A52' } },
          m.when + ': ',
          h('span', { style: { fontWeight: '700', color: '#2A2127' } }, nameOf(m.medId)),
          ' — ' + m.windowName + ' window (' + fmtTime(m.ts) + ') closed with no dose logged'))
      )
    ));
  }

  // Chemo plan banner — persistent from 2 days before chemo through the day after
  const chemoOffNow = chemoOffsetFor(now);
  if (chemoOffNow !== null && chemoOffNow >= -2 && chemoOffNow <= 1) {
    const cLabel = new Date(dayStart(nextChemoTs())).toLocaleDateString([], { weekday: 'long', month: 'numeric', day: 'numeric' });
    let cTitle = '', cBody = '';
    if (chemoOffNow === -2) { cTitle = 'Treatment on ' + cLabel; cBody = 'Treatment session is in two days. If the care team prescribed pre-treatment medications, they may need to start the day before \u2014 follow the care team\u2019s plan.'; }
    else if (chemoOffNow === -1) { cTitle = 'Treatment tomorrow'; cBody = 'Treatment session is tomorrow. Follow the care team\u2019s instructions for any pre-treatment medications.'; }
    else if (chemoOffNow === 0) { cTitle = 'Treatment day'; cBody = 'Treatment day. Log doses and symptoms as they happen \u2014 the care team will want the record.'; }
    else { cTitle = 'Recovery day'; cBody = 'Recovery day. Keep logging symptoms, appetite, and any as-needed medications.'; }
    // Supportive, not red-alert (item 7): day 0 is attention tone, every other covered day is info
    const cTone = chemoOffNow === 0 ? NOTICE_TONES.attention : NOTICE_TONES.info;
    // Legacy regimen chips only appear if those exact meds exist in THIS profile's list
    const dexDueToday = dexActiveOn(now) && state.meds.some(m => m.id === 'dexamethasone');
    const zofranRestrictedToday = zofranBlockedOn(now) && state.meds.some(m => m.id === 'zofran');
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderLeft: '4px solid ' + cTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: '12px', boxShadow: '0 2px 10px rgba(180,130,150,0.10)' } },
      h('div', { style: { display: 'flex', gap: '12px', alignItems: 'flex-start' } },
        h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: cTone.chipBg, color: cTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '13px' } }, 'Rx'),
        h('div', { style: { flex: '1' } },
          h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, cTitle),
          h('div', { style: { ...TYPE.caption, color: '#554A52' } }, cBody)
        )
      ),
      (dexDueToday || zofranRestrictedToday) ? h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } },
        dexDueToday ? h('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '7px', background: 'rgba(15,157,87,0.10)', border: '1px solid rgba(15,157,87,0.25)', borderRadius: '11px', padding: '8px 13px' } },
          h('span', { style: { flexShrink: '0', width: '18px', height: '18px', borderRadius: '50%', background: 'rgba(15,157,87,0.15)', color: '#0C7F57', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '12px' } }, '\u2713'),
          h('span', { style: { fontSize: '13px', fontWeight: '700', color: '#0C7F57', letterSpacing: '0.01em' } }, 'Dexamethasone Due — ' + (chemoOffNow === 1 ? '8 AM only' : '8 AM & 2 PM'))
        ) : null,
        zofranRestrictedToday ? h('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '7px', background: 'rgba(192,69,59,0.10)', border: '1px solid rgba(192,69,59,0.25)', borderRadius: '11px', padding: '8px 13px' } },
          h('span', { style: { flexShrink: '0', width: '18px', height: '18px', borderRadius: '50%', background: 'rgba(192,69,59,0.15)', color: '#A5443C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '12px' } }, '\u2715'),
          h('span', { style: { fontSize: '13px', fontWeight: '700', color: '#A5443C', letterSpacing: '0.01em' } }, 'Zofran — Restricted')
        ) : null
      ) : null
    ));
  }

  // v20: Daily "still pausing?" check-in — one banner per paused-and-unconfirmed medication (not
  // batched, so it's never ambiguous which medication a button applies to, matching how the missed-
  // dose banner already does one line per miss rather than one generic pair of buttons). Modeled on
  // the Bowel/Weight/Appetite check-in banners' cadence (once a day, non-urgent info tone — a
  // deliberately paused medication isn't a risk signal the way a missing health data point is) but
  // gated on a persisted per-medication field (pausedCheckinDate) rather than an entry's existence,
  // since "did the user confirm this pause today" has no natural logged entry to check.
  const pausedUnconfirmed = state.meds.filter(m => m.paused && m.pausedCheckinDate !== dayStart(now));
  pausedUnconfirmed.forEach(med => {
    const puTone = NOTICE_TONES.info;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderLeft: '4px solid ' + puTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'flex-start', boxShadow: '0 2px 10px rgba(180,130,150,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: puTone.chipBg, color: puTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '❚❚'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'Still pausing ' + med.name + '?'),
        h('div', { style: { ...TYPE.caption, color: '#554A52', marginBottom: '10px' } }, 'It won’t be tracked or remind you today unless you resume it.'),
        h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
          h('button', { onClick: () => setMedicationPaused(med.id, true), style: { minHeight: '44px', padding: '0 14px', borderRadius: '11px', background: 'rgba(255,255,255,0.5)', border: '1px solid rgba(212,104,138,0.2)', color: '#6E5A64', fontSize: '13px', fontWeight: '700' } }, 'Continue pausing'),
          h('button', { onClick: () => setMedicationPaused(med.id, false), style: { minHeight: '44px', padding: '0 14px', borderRadius: '11px', background: puTone.accent, color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Resume')
        )
      )
    ));
  });

  // Menstrual Cycle active banner — non-dismissible, stays up until Period End is logged
  if (homePref('cycleTracking') && cycleActive()) {
    const cDayN = daysSinceCycleStart();
    const pTone = NOTICE_TONES.info;
    parts.push(h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderLeft: '4px solid ' + pTone.accent, borderRadius: '14px', padding: '14px 16px', display: 'flex', gap: '12px', alignItems: 'center', boxShadow: '0 2px 10px rgba(180,130,150,0.10)' } },
      h('span', { style: { flexShrink: '0', width: '32px', height: '32px', borderRadius: '10px', background: pTone.chipBg, color: pTone.chipFg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '15px' } }, '●'),
      h('div', { style: { flex: '1' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14px', color: '#2A2127', marginBottom: '2px' } }, 'Period active'),
        h('div', { style: { ...TYPE.caption, color: '#554A52' } }, cDayN !== null ? ('Day ' + cDayN + ' since period start') : 'Period in progress')
      ),
      h('button', { onClick: logCycleEnd, style: { flexShrink: '0', minHeight: '44px', padding: '0 16px', borderRadius: '12px', background: pTone.accent, color: '#fff', fontSize: '13px', fontWeight: '700' } }, 'Log Period End')
    ));
  }

  // Bowel Issue active banner — non-dismissible, pinned like Period/In-Patient. Stays up until
  // a Normal/Very little answer is logged for the day driving the streak (usually "today" or
  // "yesterday" depending on whether a Symptoms entry or the retrospective alert started it).
  // Always shows its own inline control — the retrospective "Bowel Movement" alert directly below
  // only ever appears when YESTERDAY is unanswered, and this banner's bannerDay can only equal
  // yesterday once yesterday already has an entry, so the two controls' visible windows never
  // actually overlap (v54 note: prior to the Bowel Movement alert hiding-once-answered redesign,
  // this banner used to defer to a card that was always on screen; that card no longer always
  // renders, so deferring to it is no longer valid and this banner must always show its own control).
  if (bowelIssueActive()) {
    const bIssueType = currentBowelIssueType();

  // Evening meds — grouped card (Iron, Compazine — Iron 2h after Protonix's evening dose)
  const eveningMeds = state.meds.filter(med => med.groupedEvening);
  if (eveningMeds.length) parts.push(renderGroupedMedsCard('Evening meds', eveningMeds, now));

  // Today's journal
  const d0 = dayStart(now);
  const todayEntries = state.entries.filter(e => e.ts >= d0 && e.medId !== 'inpatient' && e.medId !== 'inpatient_start' && e.medId !== 'inpatient_end' && e.medId !== 'cycle_start' && e.medId !== 'cycle_end').slice().sort((a, b) => a.ts - b.ts);
  const bucket = timeBucket;
  const tmap = {};
  const missedTodayForJournal = missedDosesFor(now, now);
  [...todayEntries, ...missedTodayForJournal].sort((a, b) => a.ts - b.ts).forEach(e => { const bk = bucket(e.ts); (tmap[bk] = tmap[bk] || []).push(e); });
  const journalGroups = Object.keys(tmap).map(label => ({ label, minTs: tmap[label][0].ts, items: tmap[label] })).sort((a, b) => a.minTs - b.minTs);

  parts.push(h('section', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
      h('div', { style: { ...TYPE.label, color: '#8A6479' } }, 'Today’s journal'),
      null
    ),
    journalGroups.length > 0 ?
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px', marginTop: '11px' } },
        ...journalGroups.map(g => h('div', null,
          h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '8px' } }, g.label),
          h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(180,130,150,0.10)' } },
            ...g.items.map((e, i) => e.missed ? missedRow(e, i) : h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 14px', borderTop: i > 0 ? '1px solid rgba(212,104,138,0.08)' : 'none' } },
              h('div', { className: 'mono', style: { ...TYPE.mono, fontWeight: '600', color: '#8A6479', minWidth: '66px' } }, fmtTime(e.ts)),
              h('div', { style: { flex: '1' } },
                h('div', { style: { ...TYPE.body, display: 'flex', alignItems: 'center', gap: '7px', flexWrap: 'wrap' } },
                  nameOf(e.medId),
                  e.override ? h('span', { style: { fontSize: '12px', fontWeight: '700', letterSpacing: '0.04em', textTransform: 'uppercase', color: '#A5443C', background: 'rgba(192,69,59,0.12)', borderRadius: '6px', padding: '1px 6px' } }, e.overrideReason === 'overLimit' ? 'Over limit' : e.overrideReason === 'both' ? 'Early \u00b7 Over limit' : 'Early') : null,
                  e.skipped ? h('span', { style: { fontSize: '12px', fontWeight: '700', letterSpacing: '0.04em', textTransform: 'uppercase', color: '#7A6E76', background: 'rgba(125,105,116,0.14)', borderRadius: '6px', padding: '1px 6px' } }, 'Skipped') : null
                ),
                e.skipped ? h('div', { style: { fontSize: '12.5px', color: '#7A6E76', fontStyle: 'italic' } }, 'Marked as not given') : e.dose ? h('div', { style: { fontSize: '12.5px', color: '#8A6479' } }, entryDoseLabel(e) + (e.painLevel ? (' · Pain ' + e.painLevel + '/10') : '')) : (e.painLevel ? h('div', { style: { fontSize: '12.5px', color: '#8A6479' } }, 'Pain ' + e.painLevel + '/10') : null)
              ),
              removeBtn(e)
            ))
          )
        ))
      ) :
      h('div', { style: { background: 'rgba(255,255,255,0.4)', border: '1px dashed rgba(212,104,138,0.2)', borderRadius: '16px', padding: '30px', textAlign: 'center', color: '#7A6E76', fontSize: '14px', marginTop: '11px', lineHeight: '1.5' } }, 'No doses logged yet today.\nDoses you log from your medication cards will appear here.')
  ));

  return parts;
}

function formatRuleSummary(med) {
  const fragments = [];
  if (med.paused) fragments.push('Paused'); // v20: prepend so it's scannable without opening the editor
  if (med.rollingCeilingH) {
    // Rolling-window ceiling meds (e.g. Morphine) are governed by the cumulative-mg limit below,
    // not a flat per-dose gap — skip the "Min X-hour gap" fragment so it isn't shown alongside a
    // rule that no longer applies.
  } else if (med.type === 'gap') {
    fragments.push(med.gapH > 0 ? ('Min ' + med.gapH + '-hour gap') : 'No minimum gap set \u2014 edit to fix');
  } else if (med.windows && med.windows.length) {
    fragments.push(med.windows.map(window => window.name || (formatQuarterHour(window.start) + '–' + formatQuarterHour(window.end))).join(' · '));
    // v23: scheduled meds can now optionally also carry a gapH lockout (see status()) -- show both
    // rules together instead of the old gap/windows either-or.
    if (med.gapH > 0) fragments.push('Min ' + med.gapH + '-hour gap');
  }
  if (med.ceiling) {
    const limit = medicationCeilingMax(med);
    if (limit) fragments.push((med.rollingCeilingH ? ('Up to ' + limit + ' ' + (med.ceilingUnit || 'mg') + ' per ' + med.rollingCeilingH + 'h') : ('Daily limit ' + limit + ' ' + (med.ceilingUnit || 'mg'))));
  }
  return fragments.join(' · ') || (med.note || 'No schedule rule set');
}

function formatHour(hour) {
  const h = Math.max(0, Math.min(24, Number(hour) || 0));
  if (h === 0 || h === 24) return h === 24 ? 'Midnight' : '12 AM';
  return (h > 12 ? h - 12 : h) + (h >= 12 ? ' PM' : ' AM');
}
// v20: minute-aware sibling of formatHour, for the structured time-window picker (which stores
// start/end as quarter-hour decimals -- 8.25 = 8:15). Byte-identical to formatHour for any whole-hour
// value, so existing legacy medications' rule summaries/labels are unchanged.
function formatQuarterHour(hour) {
  const h = Math.max(0, Math.min(24, Number(hour) || 0));
  if (h === 24) return 'Midnight';
  const min = Math.round((h % 1) * 60);
  const base = formatHour(Math.trunc(h));
  return min === 0 ? base : base.replace(/^(\d+)/, '$1:' + String(min).padStart(2, '0'));
}
// v20: dropdown-option label -- always shows minutes (even :00) for unambiguous scanning across a
// 96/97-entry list, unlike formatQuarterHour's more compact "8 AM" used in summaries/previews.
function formatClockOption(hour) {
  const h = Math.max(0, Math.min(24, Number(hour) || 0));
  if (h === 24) return 'Midnight (12:00 AM)';
  const whole = Math.trunc(h), min = Math.round((h % 1) * 60);
  const displayH = whole === 0 ? 12 : (whole > 12 ? whole - 12 : whole);
  return displayH + ':' + String(min).padStart(2, '0') + (whole >= 12 ? ' PM' : ' AM');
}
// 96 quarter-hour Start options (12:00 AM .. 11:45 PM). End options are the same 96 plus a 97th
// "Midnight" entry at value 24, since the windows model already uses end:24 to mean "through the
// end of the day" (see normalizeMedication's default fallback and formatHour's own Midnight case).
const TIME_STEP_OPTIONS = Array.from({ length: 96 }, (_, i) => ({ value: i * 0.25, label: formatClockOption(i * 0.25) }));
const END_TIME_OPTIONS = TIME_STEP_OPTIONS.concat([{ value: 24, label: formatClockOption(24) }]);

function medicationDoseSummary(med) {
  return med.doses && med.doses.length ? med.doses.map(dose => dose.label).join(' · ') : 'Single-tap log';
}

function medicationFormFrom(med) {
  const base = med || {};
  const max = medicationCeilingMax(base);
  return {
    name: base.name || '',
    sub: base.sub || '',
    note: base.note || '',
    type: base.type === 'win' ? 'win' : 'gap',
    gapH: base.gapH || '', // v12: empty (grey placeholder 0) — no more delete-the-0-before-typing; empty still saves as 0/As needed
    dosesText: base.doses && base.doses.length ? base.doses.map(dose => dose.label).join(', ') : '',
    // v20: windowRows replaces windowsText's free-text round-trip entirely -- each row is loaded
    // directly from med.windows (start/end/name copied as-is, no string parse/format step), which
    // also removes the old round-trip's own latent bug (formatHour is lossy for non-whole hours;
    // irrelevant before this release since none existed, but would have been a live landmine).
    windowRows: base.windows && base.windows.length ? base.windows.map(window => ({ start: window.start, end: window.end, name: window.name || '' })) : [{ start: 8, end: 20, name: 'Daily' }],
    dailyLimit: max || '',
    dailyLimitUnit: base.ceilingUnit || 'mg',
    quickLog: typeof base.quickLog === 'boolean' ? base.quickLog : true,
    groupedEvening: !!base.groupedEvening,
    groupedMorning: !!base.groupedMorning,
    groupedAfternoon: !!base.groupedAfternoon,
    // v13: snapshot of the loaded placement so a non-canonical multi-group combo (legal in older
    // versions) can be preserved exactly via the "Custom" picker option — editing an unrelated
    // field must never silently rewrite a patient's Home layout.
    _origPlacement: { quickLog: typeof base.quickLog === 'boolean' ? base.quickLog : true, groupedMorning: !!base.groupedMorning, groupedAfternoon: !!base.groupedAfternoon, groupedEvening: !!base.groupedEvening },
    treatmentOnly: !!base.treatmentOnly,
    // v20: treatmentMode drives the new 3-way picker; base.treatmentMode is already normalized
    // (derived from legacy treatmentOnly) by the time a medication reaches this editor.
    treatmentMode: ['only', 'excluded'].includes(base.treatmentMode) ? base.treatmentMode : (base.treatmentOnly ? 'only' : 'none'),
    treatmentDaysBefore: Number.isFinite(base.treatmentDaysBefore) ? base.treatmentDaysBefore : 1,
    treatmentDaysAfter: Number.isFinite(base.treatmentDaysAfter) ? base.treatmentDaysAfter : 1,
    scheduleMode: base.scheduleDays ? base.scheduleDays.mode : 'daily',
    weekDays: base.scheduleDays && base.scheduleDays.mode === 'weekly' ? (base.scheduleDays.days || []).slice() : [],
    intervalN: base.scheduleDays && base.scheduleDays.mode === 'interval' ? base.scheduleDays.n : 2,
    intervalAnchor: base.scheduleDays && base.scheduleDays.mode === 'interval' ? base.scheduleDays.anchor : (function () { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })()
  };
}

function updateMedicationForm(field, value, rerender) {
  if (!state.medEditor) return;
  state.medEditor.form[field] = value;
  if (rerender) setState({ medEditor: state.medEditor });
}

function parseDoseOptions(text) {
  return String(text || '').split(',').map(value => value.trim()).filter(Boolean).map(label => {
    const mgMatch = label.match(/(\d+(?:\.\d+)?)\s*mg\b/i);
    const pillMatch = label.match(/(\d+(?:\.\d+)?)\s*(?:pill|tab|tablet|cap|capsule|application)/i);
    const dose = { label, mg: mgMatch ? Number(mgMatch[1]) : 0 };
    if (pillMatch) dose.pills = Number(pillMatch[1]);
    return dose;
  });
}

// v70: accepts 12-hour "8 AM-12 PM Morning" input (what the field now shows/expects) while still
// falling back to plain 24-hour digits ("8-12 Morning") for anyone/anything that types it that way
// -- Aaron shouldn't need to know military time to edit a schedule window.
function scheduleHourTo24(hourStr, ampm, isEnd) {
  let hr = Number(hourStr);
  const ap = (ampm || '').toLowerCase();
  if (ap === 'pm' && hr < 12) hr += 12;
  if (ap === 'am' && hr === 12) hr = isEnd ? 24 : 0;
  return hr;
}
function parseScheduleWindows(text) {
  const windows = [];
  String(text || '').split(',').map(value => value.trim()).filter(Boolean).forEach((segment, index) => {
    const match = segment.match(/^(\d{1,2})(?::\d{2})?\s*([AaPp][Mm])?\s*[-–]\s*(\d{1,2})(?::\d{2})?\s*([AaPp][Mm])?\s*(.*)$/);
    if (!match) return;
    const start = Math.max(0, Math.min(23, scheduleHourTo24(match[1], match[2], false)));
    const end = Math.max(1, Math.min(24, scheduleHourTo24(match[3], match[4], true)));
    if (end > start) windows.push({ start, end, name: (match[5] || ('Window ' + (index + 1))).trim() });
  });
  return windows;
}

// Legacy ids from the original single-family app still key special-case logic (chemo lockouts,
// linked windows, fixed ceilings). User-created meds must NEVER receive these ids, or a stranger's
// "Zofran" would inherit another patient's regimen rules (audit P0-2).
const RESERVED_LEGACY_MED_IDS = new Set(['dexamethasone', 'zofran', 'protonix', 'tylenol', 'tylenol-liquid', 'iron', 'compazine', 'buspirone', 'paroxetine', 'morphine', 'senokot', 'imodium', 'lidocaine']);
function nextMedicationId(name, existingId) {
  const base = safeMedicationId(name, 'medication');
  if (existingId) return existingId;
  const ids = new Set(state.meds.map(med => med.id));
  const taken = id => ids.has(id) || RESERVED_LEGACY_MED_IDS.has(id);
  if (!taken(base)) return base;
  let suffix = 2;
  while (taken(base + '-' + suffix)) suffix += 1;
  return base + '-' + suffix;
}

function openMedicationEditor(med) {
  setState({ medEditor: { mode: med ? 'edit' : 'add', sourceId: med ? med.id : null, form: medicationFormFrom(med) }, confirmDeleteMed: null });
  tourEvent('medEditor:open');
  window.scrollTo(0, 0);
}

// Clamp a treatment-window day-count input to a non-negative integer, falling back to 1 (the old
// fixed +-1 day behavior) for blank/invalid input rather than silently collapsing to 0. Blank/
// whitespace must be checked BEFORE Number() coercion -- Number('') and Number('   ') are both 0,
// a legitimate value, so a cleared field would otherwise silently save as "treatment day only"
// instead of falling back (audit v16 finding #1).
function clampTreatmentDays(value) {
  if (value === '' || value === null || value === undefined || (typeof value === 'string' && value.trim() === '')) return 1;
  const n = Math.round(Number(value));
  return Number.isFinite(n) && n >= 0 ? n : 1;
}
function saveMedicationEditor() {
  if (!state.medEditor) return;
  const editor = state.medEditor;
  const form = editor.form;
  const name = String(form.name || '').trim();
  if (!name) { setToast('Enter a medication name before saving.'); return; }
  const type = form.type === 'win' ? 'win' : 'gap';
  const gapH = Math.max(0, Number(form.gapH) || 0);
  // v20: windows now come straight from the structured windowRows picker (start/end already
  // decimal-hour numbers from the dropdowns) instead of being parsed back out of free text --
  // parseScheduleWindows is kept only for any legacy callers, not used here anymore. A row only
  // counts if its end is actually after its start (a row left at its default or misconfigured by
  // dragging end before start must not silently save a zero/negative-length window).
  const windows = type === 'win' ? (form.windowRows || [])
    .filter(row => Number(row.end) > Number(row.start))
    .map((row, index) => ({ start: Number(row.start), end: Number(row.end), name: String(row.name || '').trim() || ('Window ' + (index + 1)) }))
    : [];
  if (type === 'win' && !windows.length) { setToast('Add at least one schedule window, for example 8:00 AM–12:00 PM Morning.'); return; }
  // v19: an "as needed" medication with no minimum gap never re-locks after logging -- the card
  // just sits on "Available" forever, which looked broken (Owner bug report: Zofran/Iron/Compazine
  // stayed "Available" right after being logged). A gap-timer medication now requires an actual
  // gap value before it can be saved.
  if (type === 'gap' && gapH <= 0) { setToast('Enter a minimum gap in hours (e.g. 4) before saving an \u201cas needed\u201d medication \u2014 without one, the card never locks after logging.'); return; }
  let scheduleDays;
  if (form.scheduleMode === 'asneeded') {
    scheduleDays = { mode: 'asneeded' };
  } else if (form.scheduleMode === 'weekly') {
    const days = (form.weekDays || []).map(Number).filter(d => d >= 0 && d <= 6);
    if (!days.length) { setToast('Pick at least one day of the week, or switch Days taken to Every day.'); return; }
    if (days.length < 7) scheduleDays = { mode: 'weekly', days: days };
  } else if (form.scheduleMode === 'interval') {
    const n = Math.round(Number(form.intervalN) || 0);
    if (n < 2) { setToast('Every-few-days schedules need a gap of at least 2 days.'); return; }
    scheduleDays = { mode: 'interval', n: n, anchor: form.intervalAnchor || new Date().toISOString().slice(0, 10) };
  }
  const dailyLimit = Number(form.dailyLimit) || 0;
  if (dailyLimit > 0) {
    const testDoses = parseDoseOptions(form.dosesText);
    const unit = form.dailyLimitUnit;
    const carries = unit === 'mg' ? testDoses.some(d => d.mg > 0) : testDoses.some(d => d.pills > 0);
    if (!carries) { setToast('The daily limit is in ' + unit + ' but no dose option includes a ' + (unit === 'mg' ? 'mg amount (e.g. "500 mg")' : 'count (e.g. "1 pill")') + ' \u2014 the limit could never be enforced. Fix the dose options or clear the limit.'); return; }
  }
  const original = editor.sourceId ? state.meds.find(med => med.id === editor.sourceId) : null;
  const id = nextMedicationId(name, editor.sourceId);
  // v20 restart (audit P1-1): when ADDING a brand-new medication (not editing an existing one) whose
  // freshly-derived id happens to match a previously-deleted medication's archived entry, restore that
  // entry's pausePeriods so re-adding "Ibuprofen" after deleting it doesn't erase the memory of which
  // days it was legitimately paused (see deleteMedicationConfig's matching archive step). Only applies
  // to a genuine add (editor.sourceId is falsy) -- an edit-mode save already carries its own
  // pausePeriods forward via `...(original || {})` below and must never be overwritten by a stale
  // archive entry.
  const archivedMatch = !editor.sourceId ? (state.archivedMeds || {})[id] : null;
  const candidate = {
    ...(original || {}),
    id,
    name,
    sub: String(form.sub || '').trim(),
    note: String(form.note || '').trim(),
    type,
    gapH,
    doses: parseDoseOptions(form.dosesText),
    windows,
    quickLog: !!form.quickLog,
    groupedEvening: !!form.groupedEvening,
    groupedMorning: !!form.groupedMorning,
    groupedAfternoon: !!form.groupedAfternoon,
    scheduleDays: scheduleDays,
    ...(archivedMatch ? { pausePeriods: normalizePausePeriods(archivedMatch.pausePeriods) } : {}),
    // v20: treatmentOnly is kept in sync (mirrored) purely for any older code path that might
    // still read the boolean directly -- treatmentMode is the actual source of truth going forward.
    treatmentOnly: form.treatmentMode === 'only',
    treatmentMode: ['only', 'excluded'].includes(form.treatmentMode) ? form.treatmentMode : 'none',
    treatmentDaysBefore: clampTreatmentDays(form.treatmentDaysBefore),
    treatmentDaysAfter: clampTreatmentDays(form.treatmentDaysAfter),
    ceiling: dailyLimit > 0,
    ceilingMax: dailyLimit || undefined,
    ceilingUnit: form.dailyLimitUnit === 'mg' ? undefined : form.dailyLimitUnit,
    // v23 bugfix: stamp brand-new medications with a createdAt so missedDosesFor never flags a
    // window that closed before the medication existed (see missedDosesFor). Editing an existing
    // medication leaves its createdAt untouched via the `...(original || {})` spread above.
    ...(!editor.sourceId ? { createdAt: Date.now() } : {})
  };
  if (!candidate.doses.length) delete candidate.doses;
  if (!candidate.scheduleDays) delete candidate.scheduleDays;
  if (type !== 'win') delete candidate.windows;
  if (!candidate.ceiling) { delete candidate.ceilingMax; delete candidate.ceilingUnit; }
  const saved = normalizeMedication(candidate, state.meds.length);
  const meds = editor.sourceId ? state.meds.map(med => med.id === editor.sourceId ? saved : med) : [...state.meds, saved];
  persistMedicationConfig(meds, state.archivedMeds);
  setState({ meds, medEditor: null, confirmDeleteMed: null });
  setToast(saved.name + (editor.mode === 'add' ? ' added to medication management.' : ' updated.'));
  tourEvent('med:saved');
}

// Meds that render as their own standalone Quick Log card on Home (not folded into the Morning
// meds / Evening meds grouped card). This is exactly the population the Home Quick Log grid at
// state.meds.filter(m => m.quickLog && ...) draws from and renders in state.meds array order, so
// reordering this subset is what actually changes the order those cards appear on Home.
function reorderableHomeMeds() {
  return state.meds.filter(med => med.quickLog && !med.groupedMorning && !med.groupedEvening && !med.groupedAfternoon);
}

// v20: pause/resume a single medication in place, immediate-persist (like moveReorderableMed below)
// -- not routed through the med editor's Save-changes flow, since pausing should take effect right
// away from the Home card or the daily check-in banner. Pausing opens a new pausePeriods entry
// (end:null = still ongoing) and stamps today as already-confirmed so the daily banner doesn't
// immediately re-ask about a medication the user just paused. Resuming closes the open period.
function setMedicationPaused(id, paused) {
  const today = dayStart(state.now);
  const meds = state.meds.map(m => {
    if (m.id !== id) return m;
    const periods = (m.pausePeriods || []).slice();
    if (paused) {
      if (!periods.length || periods[periods.length - 1].end !== null) periods.push({ start: today, end: null });
    } else if (periods.length && periods[periods.length - 1].end === null) {
      periods[periods.length - 1] = { ...periods[periods.length - 1], end: today };
    }
    return { ...m, paused, pausedCheckinDate: paused ? today : null, pausePeriods: periods };
  });
  persistMedicationConfig(meds, state.archivedMeds);
  setState({ meds });
}
// Swaps two meds' positions directly within state.meds (by id), leaving every other medication's
// position untouched — including any grouped/managed-only meds that happen to sit between them in
// the raw array. dir is -1 (move up/earlier) or +1 (move down/later), relative to the reorderable
// subset's current order, not raw array index.
function moveReorderableMed(id, dir) {
  const list = reorderableHomeMeds();
  const idx = list.findIndex(med => med.id === id);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
  const aId = list[idx].id, bId = list[swapIdx].id;
  const meds = state.meds.slice();
  const aPos = meds.findIndex(med => med.id === aId);
  const bPos = meds.findIndex(med => med.id === bId);
  const tmp = meds[aPos];
  meds[aPos] = meds[bPos];
  meds[bPos] = tmp;
  persistMedicationConfig(meds, state.archivedMeds);
  setState({ meds });
}

function deleteMedicationConfig(id) {
  const med = state.meds.find(item => item.id === id);
  if (!med) return;
  if (state.confirmDeleteMed !== id) { setState({ confirmDeleteMed: id }); return; }
  const meds = state.meds.filter(item => item.id !== id);
  // v20 restart (audit P1-1): archive pausePeriods too, not just {name, sub} -- otherwise a medication
  // deleted and later re-added under the same (recycled) id loses all memory of which days it was
  // legitimately paused, and those days silently reappear as "missed" the moment the new medication is
  // saved (the exact flood the pause feature exists to prevent). Any still-OPEN period must be closed
  // at the deletion timestamp before archiving -- isPausedOn treats end:null as "paused forever,
  // including all future days," so archiving an open period as-is would make a medication re-added
  // weeks later silently exempt from missed-dose tracking for the entire gap, a worse bug in the
  // opposite direction.
  const today = dayStart(state.now);
  const archivedPausePeriods = normalizePausePeriods(med.pausePeriods).map(p => p.end === null ? { ...p, end: today } : p);
  const archivedMeds = { ...(state.archivedMeds || {}), [id]: { name: med.name, sub: med.sub || '', pausePeriods: archivedPausePeriods } };
  persistMedicationConfig(meds, archivedMeds);
  setState({ meds, archivedMeds, confirmDeleteMed: null, medEditor: state.medEditor && state.medEditor.sourceId === id ? null : state.medEditor });
  setToast(med.name + ' was removed from the active list. Existing dose history was preserved.');
}

function toggleMedicationForm(field) {
  if (!state.medEditor) return;
  updateMedicationForm(field, !state.medEditor.form[field], true);
}

// v13 (R5): the four additive placement toggles are now ONE single-choice picker. The picker's
// value is DERIVED from the same four stored booleans each render — no new stored field, no
// save-path change, so the save round-trip invariant holds by construction.
function placementOf(form) {
  const q = !!form.quickLog, m = !!form.groupedMorning, a = !!form.groupedAfternoon, e = !!form.groupedEvening;

function openApptModal(editId) {
  if (editId) {
    const appt = (state.appts || []).find(a => a.id === editId);
    if (!appt) return;
    const d = new Date(appt.ts);
    setState({ apptModal: { editId, title: appt.title, note: appt.note || '', reminder: appt.reminder || 'none', dateStr: toLocalISO(appt.ts).slice(0, 10), time: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), calOpen: false, calCursor: toLocalISO(appt.ts).slice(0, 7) } });
  } else {
    const todayStr = toLocalISO(simNow()).slice(0, 10);
    setState({ apptModal: { editId: null, title: '', note: '', reminder: 'none', dateStr: '', time: '09:00', calOpen: false, calCursor: todayStr.slice(0, 7) } });
  }
}
function closeApptModal() { setState({ apptModal: null }); }
function confirmApptModal() {
  const m = state.apptModal;
  const title = (m.title || '').trim();
  if (!title) { setToast('Enter a title for this appointment'); return; }
  if (!m.dateStr) { setToast('Pick a date'); return; }
  const ts = new Date(m.dateStr + 'T' + (m.time || '09:00')).getTime();
  if (isNaN(ts)) { setToast('Invalid date or time'); return; }
  const noteTrimmed = (m.note || '').trim();
  const payload = { title, note: noteTrimmed, reminder: m.reminder || 'none', ts };
  if (m.editId) {
    // Editing resets the reminded flag ONLY when a field the trigger condition actually depends on
    // changed (time or reminder choice) — audit fix: resetting unconditionally re-armed the reminder
    // on an edit as small as fixing a typo in the note, re-notifying for an appointment already
    // inside its fired 24h grace window with nothing about the reminder itself having changed.
    const prev = (state.appts || []).find(a => a.id === m.editId);
    // Compare at minute precision, not exact ms — the form's time input is minute-granularity, so
    // an appointment whose stored ts carried seconds/ms (however it was created) would otherwise
    // look "changed" on every edit even when the user picked the exact same date and time back.
    const reminderRelevantChange = !prev || Math.floor(prev.ts / 60000) !== Math.floor(ts / 60000) || (prev.reminder || 'none') !== (m.reminder || 'none');
    updateAppointment(m.editId, { ...payload, reminded: reminderRelevantChange ? false : !!(prev && prev.reminded) });
  } else {
    if (m.reminder && m.reminder !== 'none' && !isNativeApp() && !TEST_MODE) requestNotifPermission();
    addAppointment(payload);
  }
  closeApptModal();
}

function renderBloodPressureReport(now) {
  // v18 (Owner-reported): this function used to return a bare h() node in both branches instead of
  // an array like every sibling report function (renderWeightTrend, renderHistory, etc). renderReportDetail
  // spreads the return value with `...content` expecting an array -- spreading a single non-iterable
  // Element threw a TypeError on every open, with no visible feedback (the throw happens before
  // render() swaps in the new DOM) and the error re-fired every ~1s via the tick loop until the user
  // navigated away. Pure display bug -- underlying BP entries were never at risk. Fix: wrap both
  // returns in an array, matching the established sibling convention exactly.
  const list = state.entries.filter(e => e.medId === 'blood_pressure').sort((a, b) => b.ts - a.ts);
  if (!list.length) return [h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '16px', padding: '22px 16px', textAlign: 'center', color: '#554A52', fontSize: '13px' } }, 'No blood pressure readings yet. Log them from the Home screen card.')];
  return [h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '16px', overflow: 'hidden' } },
    ...list.map((e, i) => h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '11px 14px', borderTop: i > 0 ? '1px solid rgba(212,104,138,0.08)' : 'none' } },
      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div', { className: 'mono', style: { fontSize: '16px', fontWeight: '700', color: '#7B3F6B' } }, e.sys + '/' + e.dia + ' mmHg'),
        h('div', { style: { fontSize: '12px', color: '#7A6E76', marginTop: '1px' } }, new Date(e.ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + fmtTime(e.ts))
      ),
      h('button', { onClick: () => removeEntryDB(e.id), style: { minHeight: '34px', padding: '0 10px', borderRadius: '9px', background: 'rgba(192,69,59,0.08)', border: '1px solid rgba(192,69,59,0.2)', color: '#A5443C', fontSize: '12px', fontWeight: '700' } }, 'Remove')
    ))
  )];
}

function reportDescriptor(type, now) {
  if (type === 'blood_pressure') { const bp = state.entries.filter(e => e.medId === 'blood_pressure').sort((a, b) => b.ts - a.ts)[0]; return { label: 'Blood Pressure', icon: 'chart', description: 'Review blood pressure readings over time.', meta: bp ? (bp.sys + '/' + bp.dia + ' mmHg latest') : 'No readings yet' }; }
  if (type === 'history') return { label: 'History', icon: 'history', description: 'Review dose, symptom, and vital logs by day.', meta: state.entries.length + ' recorded entries' };
  if (type === 'weight') { const latestWeight = latest('weight'); return { label: 'Weight', icon: 'chart', description: 'Explore weight readings, trends, and recent changes.', meta: latestWeight ? (dispWeight(latestWeight) + ' ' + weightSuffix() + ' latest') : 'No readings yet' }; }
  if (type === 'cycle') {
    const active = cycleActive();
    const day = daysSinceCycleStart();
    return { label: 'Cycle', icon: 'cycle', description: 'Track period status and cycle history.', meta: active ? ('Active · day ' + day) : 'No active cycle' };
  }
  if (type === 'bowel_movement') {
    const bEntries = bowelMovementHistorySorted();
    const bLatest = bEntries[0];
    return { label: 'Bowel Movement', icon: 'notes', description: 'Review bowel movement history logged from Home.', meta: bLatest ? ((BOWEL_MOVEMENT_LABELS[bLatest.value] || bLatest.value) + ' most recent') : 'No entries yet' };
  }
  const yStart = yesterdayStart(now);
  const yEntry = appetiteFor(yStart);
  return { label: 'Appetite', icon: 'notes', description: 'Review appetite history logged from Home.', meta: yEntry ? ((APPETITE_LABELS[yEntry.value] || yEntry.value) + ' yesterday') : 'Not yet logged for yesterday' };
}

function renderHistory(now) {
  const d0 = dayStart(now);
  const yStart = d0 - 86400000;
  const dmap = {};
  state.entries.forEach(e => { if (e.medId === 'inpatient' || e.medId === 'inpatient_start' || e.medId === 'inpatient_end' || e.medId === 'cycle_start' || e.medId === 'cycle_end') return; const k = dayStart(e.ts); (dmap[k] = dmap[k] || []).push(e); });

  const allHistoryDays = Object.keys(dmap).map(k => +k).sort((a, b) => b - a).map(k => {
    const missed = missedDosesFor(k, now);
    const items = [...dmap[k], ...missed].sort((a, b) => a.ts - b.ts);
    const tyDay = items.filter(e => e.medId === 'tylenol' && !e.missed).reduce((s, e) => s + (e.mg || 0), 0);
    const doses = items.filter(e => e.medId !== 'temp' && e.medId !== 'weight' && e.medId !== 'cycle_start' && e.medId !== 'cycle_end' && !e.missed && !e.skipped).length;
    const temps = items.filter(e => e.medId === 'temp').length;
    const weights = items.filter(e => e.medId === 'weight').length;
    const wkday = new Date(k).toLocaleDateString([], { weekday: 'long' });
    const md = (new Date(k).getMonth() + 1) + '/' + new Date(k).getDate();
    const label = k === d0 ? ('Today - ' + wkday + ' ' + md) : (wkday + ', ' + md);
    let summary = doses + ' dose' + (doses === 1 ? '' : 's');
    if (temps) summary += ' · ' + temps + ' temp' + (temps === 1 ? '' : 's');
    if (weights) summary += ' · ' + weights + ' wt';
    if (tyDay) summary += ' · ' + tyDay.toLocaleString() + ' mg APAP';
    const imoDay = items.filter(e => e.medId === 'imodium' && !e.missed).reduce((s, e) => s + (e.pills || 0), 0);
    if (imoDay) summary += ' · ' + imoDay + ' Imodium';
    if (missed.length) summary += ' · ' + missed.length + ' MISSED';
    return { key: k, label, summary, items, missedCount: missed.length };
  });

  // v70: "Missed Doses" / "Show all" toggle, driven by clicking a missed-dose banner elsewhere
  // (Today's banner or the pinned previous-days header card both set historyMissedOnly via
  // goToHistoryTop()) or by tapping the toggle directly here. Filtered mode keeps each day's
  // original summary line (for context -- "3 doses · 1 MISSED") but only lists the missed rows
  // underneath, and drops any day with zero misses entirely.
  const totalMissed = allHistoryDays.reduce((s, d) => s + d.missedCount, 0);
  const missedOnly = !!state.historyMissedOnly;
  const historyDays = missedOnly
    ? allHistoryDays.map(d => ({ ...d, items: d.items.filter(e => e.missed) })).filter(d => d.items.length > 0)
    : allHistoryDays;

  const toggleBar = h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', flexWrap: 'wrap' } },
    h('div', { style: { display: 'inline-flex', background: 'rgba(212,104,138,0.10)', borderRadius: '11px', padding: '3px', gap: '2px' } },
      h('button', { onClick: () => setState({ historyMissedOnly: true }), 'aria-pressed': String(missedOnly), style: { minHeight: '44px', padding: '0 13px', borderRadius: '9px', background: missedOnly ? '#C0453B' : 'transparent', color: missedOnly ? '#fff' : '#7A6E76', fontSize: '12.5px', fontWeight: '800' } }, 'Missed Doses' + (totalMissed ? ' (' + totalMissed + ')' : '')),
      h('button', { onClick: () => setState({ historyMissedOnly: false }), 'aria-pressed': String(!missedOnly), style: { minHeight: '44px', padding: '0 13px', borderRadius: '9px', background: !missedOnly ? '#A24C71' : 'transparent', color: !missedOnly ? '#fff' : '#7A6E76', fontSize: '12.5px', fontWeight: '800' } }, 'Show all')
    ),
    missedOnly && totalMissed ? h('button', { onClick: () => clearAllMissedInHistory(now), style: { minHeight: '44px', padding: '0 14px', borderRadius: '9px', background: 'rgba(192,69,59,0.14)', border: '1px solid rgba(192,69,59,0.4)', color: '#A13830', fontSize: '12.5px', fontWeight: '800' } }, 'Clear all') : null
  );

  if (historyDays.length === 0) {
    const emptyMsg = missedOnly ? 'No missed doses to review — you\'re all caught up!' : 'No history yet.';

function renderWeightTrend(now) {
  // v12b: convert every reading to the current display unit ONCE at ingestion — bounds, axis,
  // stats, dot labels, and the readings list below all inherit converted values, so mixed-unit
  // history (logged in lbs, viewed in kg, or vice versa) charts correctly on one axis.
  const weightEntries = state.entries.filter(e => e.medId === 'weight' && e.weight).sort((a, b) => a.ts - b.ts).map(e => ({ ...e, weight: dispWeight(e) }));
  const range = state.weightRange;
  const DAY = 86400000;

  // Range toggle
  const toggle = h('div', { style: { display: 'flex', gap: '5px', background: 'rgba(255,255,255,0.45)', borderRadius: '10px', padding: '3px', border: '1px solid #EBE3E4', alignSelf: 'flex-start' } },
    h('button', { onClick: () => setState({ weightRange: 'weeks' }), 'aria-pressed': String(range === 'weeks'), style: { minHeight: '44px', padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'weeks' ? '#9B5B8A' : 'transparent', color: range === 'weeks' ? '#fff' : '#7A6E76' } }, 'Weeks'),
    h('button', { onClick: () => setState({ weightRange: 'months' }), 'aria-pressed': String(range === 'months'), style: { minHeight: '44px', padding: '8px 18px', borderRadius: '8px', fontSize: '13px', fontWeight: '700', background: range === 'months' ? '#9B5B8A' : 'transparent', color: range === 'months' ? '#fff' : '#7A6E76' } }, 'Months')
  );

  if (weightEntries.length === 0) {
    return [
      toggle,
      h('div', { style: { background: 'rgba(255,255,255,0.03)', border: '1px dashed rgba(255,255,255,0.1)', borderRadius: '16px', padding: '40px', textAlign: 'center', color: '#7A6E76', fontSize: '14px', lineHeight: '1.5' } }, 'No weight readings logged yet.\nLog your first weight on the Today tab.')
    ];
  }

  // Determine time range
  const spanDays = range === 'weeks' ? 28 : 90;
  const minTs = now - spanDays * DAY;
  const filtered = weightEntries.filter(e => e.ts >= minTs);
  const points = filtered.length > 0 ? filtered : weightEntries.slice(-2);

  if (points.length === 0) {
    return [toggle, h('div', { style: { color: '#7A6E76', fontSize: '14px', textAlign: 'center', padding: '40px' } }, 'No data in this range.')];
  }

  // Calculate bounds
  const weights = points.map(p => p.weight);
  const allWeights = weightEntries.map(p => p.weight);
  const minW = Math.floor(Math.min(...weights) - 2);
  const maxW = Math.ceil(Math.max(...weights) + 2);
  const wRange = maxW - minW || 4;
  const tMin = points[0].ts;
  const tMax = Math.max(points[points.length - 1].ts, tMin + DAY);
  const tRange = tMax - tMin || DAY;

  // SVG dimensions
  const W = 680, H = 300;
  const pad = { top: 30, right: 20, bottom: 50, left: 55 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  const x = (ts) => pad.left + ((ts - tMin) / tRange) * cW;
  const y = (w) => pad.top + cH - ((w - minW) / wRange) * cH;

  // Build SVG path
  let pathD = '';
  let areaD = '';
  const dots = [];
  points.forEach((p, i) => {
    const px = x(p.ts), py = y(p.weight);
    pathD += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
    if (i === 0) areaD = 'M' + px.toFixed(1) + ',' + (pad.top + cH);
    areaD += 'L' + px.toFixed(1) + ',' + py.toFixed(1);
    dots.push({ x: px, y: py, w: p.weight, ts: p.ts });
  });
  areaD += 'L' + x(points[points.length - 1].ts).toFixed(1) + ',' + (pad.top + cH) + 'Z';

  // Y-axis labels (weight)
  const ySteps = 5;
  const yLabels = [];
  for (let i = 0; i <= ySteps; i++) {
    const val = minW + (wRange / ySteps) * i;
    yLabels.push({ val: Math.round(val * 10) / 10, py: y(val) });
  }

  // X-axis labels (dates)
  const xLabels = [];
  const labelCount = range === 'weeks' ? 4 : 6;
  for (let i = 0; i <= labelCount; i++) {
    const ts = tMin + (tRange / labelCount) * i;
    const d = new Date(ts);
    const label = (d.getMonth() + 1) + '/' + d.getDate();
    xLabels.push({ label, px: x(ts) });
  }

  // Stats
  const latest = points[points.length - 1];
  const first = points[0];
  const change = latest.weight - first.weight;
  const changeLabel = (change >= 0 ? '+' : '') + change.toFixed(1) + ' ' + weightSuffix();
  const changeColor = Math.abs(change) < 0.5 ? '#8A6479' : change > 0 ? '#9A6419' : '#A24C71';
  const avg = (weights.reduce((s, w) => s + w, 0) / weights.length).toFixed(1);

  // Build SVG as string
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">';
  // Grid lines
  yLabels.forEach(yl => {
    svg += '<line x1="' + pad.left + '" y1="' + yl.py.toFixed(1) + '" x2="' + (W - pad.right) + '" y2="' + yl.py.toFixed(1) + '" stroke="rgba(212,104,138,0.10)" stroke-width="1"/>';
    svg += '<text x="' + (pad.left - 10) + '" y="' + (yl.py + 4).toFixed(1) + '" fill="#7A6E76" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="end">' + yl.val + '</text>';
  });
  // X labels
  xLabels.forEach(xl => {
    svg += '<text x="' + xl.px.toFixed(1) + '" y="' + (H - 10) + '" fill="#7A6E76" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">' + xl.label + '</text>';
  });
  // Area gradient
  svg += '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(155,91,138,0.25)"/><stop offset="100%" stop-color="rgba(155,91,138,0)"/></linearGradient></defs>';
  svg += '<path d="' + areaD + '" fill="url(#wg)"/>';
  // Line
  svg += '<path d="' + pathD + '" fill="none" stroke="#9B5B8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  // Dots
  dots.forEach((d, i) => {
    const isLast = i === dots.length - 1;
    svg += '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="' + (isLast ? 5 : 3.5) + '" fill="' + (isLast ? '#9B5B8A' : '#7B3F6B') + '" stroke="' + (isLast ? '#A24C71' : '#9B5B8A') + '" stroke-width="' + (isLast ? 2 : 1.5) + '"/>';
    // Value label on last dot
    if (isLast) {
      svg += '<text x="' + d.x.toFixed(1) + '" y="' + (d.y - 12).toFixed(1) + '" fill="#7B3F6B" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">' + d.w + '</text>';
    }
  });
  svg += '</svg>';

  // Chart card
  const chart = h('section', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '18px', padding: '20px 16px 12px', boxShadow: '0 4px 24px rgba(180,130,150,0.10), 0 1px 2px rgba(180,130,150,0.06)' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' } },
      h('div', null,
        h('div', { style: { ...TYPE.label, color: '#8A6479' } }, 'Weight Trend'),
        h('div', { style: { fontSize: '12.5px', color: '#7A6E76', marginTop: '3px' } }, range === 'weeks' ? 'Last 4 weeks' : 'Last 3 months')
      ),
      h('div', { className: 'mono', style: { fontSize: '24px', fontWeight: '700', color: '#7B3F6B', letterSpacing: '-0.02em' } }, latest.weight + ' ' + weightSuffix())
    ),
    h('div', { innerHTML: svg })
  );

  // Stats row
  const stats = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px' } },
    h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Current'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#2A2127' } }, latest.weight + '')
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Average'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: '#2A2127' } }, avg)
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '14px', padding: '14px', textAlign: 'center', boxShadow: '0 4px 24px rgba(180,130,150,0.10)' } },
      h('div', { style: { ...TYPE.label, color: '#7A6E76', marginBottom: '6px' } }, 'Change'),
      h('div', { className: 'mono', style: { fontSize: '18px', fontWeight: '700', color: changeColor } }, changeLabel)
    )
  );

  // Readings list — reason/liters/note (app-v21) get their own lines below the date, since this
  // view has the room History's compact single-line format doesn't.
  const readingsItems = points.slice().reverse().map((p, i) => {
    const d = new Date(p.ts);
    const day = d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
    const time = fmtTime(p.ts);
    const reasonLine = p.weightReason
      ? weightReasonLabel(p.weightReason) + (p.weightReason === 'paracentesis' && typeof p.litersDrained === 'number' ? ' — ' + p.litersDrained + ' L drained' : '')
      : null;
    return h('div', { style: { display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '11px 14px', borderTop: i > 0 ? '1px solid rgba(212,104,138,0.08)' : 'none' } },
      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div', { style: { fontSize: '14px', fontWeight: '700' } }, day),
        h('div', { style: { ...TYPE.caption, color: '#7A6E76' } }, time),
        reasonLine ? h('div', { style: { fontSize: '12.5px', color: '#8E3D61', fontWeight: '700', marginTop: '3px' } }, reasonLine) : null,
        p.weightNote ? h('div', { style: { fontSize: '12.5px', color: '#7A6E76', marginTop: '2px', fontStyle: 'italic', wordBreak: 'break-word' } }, p.weightNote) : null
      ),
      h('div', { className: 'mono', style: { fontSize: '16px', fontWeight: '600', color: '#7B3F6B', flexShrink: '0' } }, p.weight + ' ' + weightSuffix())
    );
  });

  const readings = h('section', null,
    h('div', { style: { ...TYPE.label, color: '#8A6479', marginBottom: '10px' } }, 'All Readings'),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #EBE3E4', borderRadius: '16px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(180,130,150,0.10)' } },
      ...readingsItems
    )
  );

  return [toggle, chart, stats, readings];
}


// --------- Notification System ---------
let notifSentToday = {};  // key: 'scheduled-8pm' or 'avail-tylenol-{ts}', value: true

function resetNotifTracking() {
  const today = dayStart(Date.now());
  if (notifSentToday._day !== today) {
    notifSentToday = { _day: today };
  }
}

async function requestNotifPermission() {
  if (isNativeApp()) {
    try {
      const ln = window.Capacitor.Plugins.LocalNotifications;
      const current = await ln.checkPermissions();
      if (current.display !== 'granted') await ln.requestPermissions();
    } catch (e) { /* plugin unavailable — reminders silently stay off, rest of the app unaffected */ }
    return;
  }
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendNotif(title, body, tag) {
  if (isNativeApp()) {
    try {
      window.Capacitor.Plugins.LocalNotifications.schedule({
        notifications: [{
          // 31-bit int id required by Android; tag text is hashed in so repeat notifications for
          // the same event (e.g. the same missed-dose window) reliably replace one another instead
          // of stacking, matching the old web path's `tag` de-dupe behavior.
          id: Math.abs([...tag].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) % 2147483647,
          title, body,
          schedule: { at: new Date(Date.now() + 300) },
          smallIcon: 'ic_stat_chemowell'
        }]
      });
    } catch (e) { /* native delivery failed silently — never blocks the app */ }
    return;
  }
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
  } catch(e) {
    // Fallback for mobile: use service worker registration
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, { body, icon: 'icon-192.png', tag, requireInteraction: false });
      }).catch(() => {});
    }
  }
}

// Generic per-medication dose reminders (v16). Reminders used to fire on a hardcoded clock schedule
// for five hardcoded legacy medication ids (protonix/iron/compazine/buspirone/paroxetine) — ids no
// real user-created medication can ever have (RESERVED_LEGACY_MED_IDS exists specifically to stop a
// new medication from inheriting another patient's rules), so every branch was unreachable dead code
// for every real install: there was no way to get a reminder for a medication you actually added. This
// replaces that with a med-agnostic reminder driven by the exact same source of truth the passive
// missed-dose banner already uses (missedDosesFor): a medication's own `windows` (from the "Schedule
// windows" editor field) and its auto-derived `alerts` flag. Pulled out as a pure function (like
// doseProgressToday) so it's unit-testable via a Node harness even though checkNotifications() itself
// only actually fires in the native APK build or a non-TEST_MODE web install (see below).
function dueRemindersAt(nowDate) {
  const nowTs = nowDate.getTime();
  const h = nowDate.getHours(), m = nowDate.getMinutes();
  const d0 = dayStart(nowTs);
  const due = [];
  if (h >= 22 || h < 8) return due; // quiet hours: no notifications 10 PM-8 AM
  state.meds.filter(med => med.alerts && med.windows && med.windows.length).forEach(med => {
    if (med.paused) return; // v20: don't remind for a currently-paused medication
    if (!medScheduledOn(med, nowTs)) return; // off-day for this medication's own schedule
    if (med.treatmentOnly && !treatmentActiveOn(med, nowTs)) return; // outside its treatment-day window
    if (treatmentExcludedNow(med, nowTs)) return; // v20: excluded near treatment day
    med.windows.forEach(w => {
      // v20: w.start may now be a quarter-hour decimal (8.25 = 8:15) from the structured time-window
      // picker -- the old `h !== w.start` integer-only compare would never match a non-hour-aligned
      // window, silently killing its reminder forever. Split into hour+minute and fire only in the
      // window's first 5 minutes, same as before for on-the-hour windows (byte-identical behavior
      // when w.start is a whole number).
      const startH = Math.trunc(w.start), startM = Math.round((w.start % 1) * 60);
      if (h !== startH || m < startM || m >= startM + 5) return;
      // Key includes both start AND end hour, not just start (audit v16 finding #2): two windows
      // that happen to open at the same hour (e.g. "8-9 AM dose 1" + "8-20 AM dose 2") would
      // otherwise collide on a start-hour-only key and silently suppress the second window's
      // reminder every single day.
      const key = 'win-' + med.id + '-' + w.start + '-' + w.end + '-' + d0;
      if (notifSentToday[key]) return;
      notifSentToday[key] = true; // mark now so this window is never re-checked again today
      const ws = d0 + w.start * 3600000, we = d0 + w.end * 3600000;
      const taken = entriesFor(med.id).some(e => e.ts >= ws && e.ts < we);
      if (!taken) due.push({ med, window: w });
    });
  });
  return due;
}

function checkNotifications() {
  // Web/PWA beta stays silent (TEST_MODE simulated dates make real-time reminders meaningless
  // there); the native APK test build fires for real even under TEST_MODE, since that's the whole
  // point of this build — see isNativeApp() above (v14).
  if (TEST_MODE && !isNativeApp()) return;
  if (!isNativeApp() && (!('Notification' in window) || Notification.permission !== 'granted')) return;
  if (!state.loaded || state.entries.length === 0 && !state.demo) return;

  resetNotifTracking();
  dueRemindersAt(new Date()).forEach(({ med, window }) => {
    sendNotif(med.name + ' Due', med.name + (window.name ? ' — ' + window.name : '') + ' dose window has opened', 'win-' + med.id + '-' + window.start + '-' + window.end);
  });
}

// Calendar appointment reminders (app-v22) — deliberately independent of checkNotifications()
// above: appointments aren't medication doses, so they don't belong in that function's dose-window
// logic, and keeping them separate means a future change to one can't silently break the other.
// Same TEST_MODE gate as checkNotifications for the same reason (simulated beta dates make
// real-time reminders meaningless on the web build; the native test build fires for real).
function reminderTriggerTs(appt) {
  if (appt.reminder === '1h') return appt.ts - 3600000;
  if (appt.reminder === '1day') return appt.ts - 86400000;
  if (appt.reminder === 'morning') {
    const d = new Date(appt.ts);
    d.setHours(9, 0, 0, 0);
    let triggerTs = d.getTime();
    // Audit fix: a fixed 9 AM trigger fires AFTER an appointment earlier than 9 AM (e.g. a 7 AM
    // lab draw) — the reminder would land while the visit is already over. Fall back to 1 hour
    // before the appointment itself whenever that would land earlier than the naive 9 AM slot.
    if (triggerTs >= appt.ts - 3600000) triggerTs = appt.ts - 3600000;
    return triggerTs;
  }
  return null; // 'none' or unset
}
function checkAppointmentReminders() {
  if (TEST_MODE && !isNativeApp()) return;
  if (!isNativeApp() && (!('Notification' in window) || Notification.permission !== 'granted')) return;
  const nowTs = Date.now();
  (state.appts || []).forEach(appt => {
    if (appt.reminded || !appt.reminder || appt.reminder === 'none') return;
    const triggerTs = reminderTriggerTs(appt);
    // Skip stale appointments the app never had a chance to check in time (e.g. reopened after a
    // long absence) rather than firing a reminder for something that already happened over a day ago.
    if (triggerTs == null || nowTs < triggerTs || nowTs > appt.ts + 86400000) return;
    sendNotif('Upcoming: ' + appt.title, new Date(appt.ts).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + (appt.note ? ' — ' + appt.note : ''), 'appt-' + appt.id);
    updateAppointment(appt.id, { reminded: true });
  });
}

subscribePush();

// Init
if (!getPrefsDB().installedAt) { setPrefsDB({ installedAt: Date.now() }); }
unsubPrefs = subscribePrefs((prefs) => {
  if (prefs.installedAt) MISSED_TRACK_SINCE = prefs.installedAt;
  CONFIG.tempUnit = prefs.tempUnit === 'Celsius' ? 'Celsius' : 'Fahrenheit';
  CONFIG.weightUnit = prefs.weightUnit === 'kg' ? 'kg' : 'lbs';
  CONFIG.patientName = (prefs.patientName || '').trim();
  setState({ missedClearedAt: prefs.missedClearedAt || 0, dismissedMisses: prefs.dismissedMisses || [], patientName: CONFIG.patientName, prefsLoaded: true });
});
unsub = subscribeEntries((entries) => {
  const wasEmpty = state.entries.length === 0 && !state.loaded;
  if (state.timeModal) {
    // Defer update so the modal isn't destroyed mid-interaction
    pendingEntries = entries;
    if (!state.loaded) { state.loaded = true; state.entries = entries; }
    return;
  }
  setState({ entries, loaded: true });

});

setInterval(() => {
  state.now = simNow();
  const activeTag = document.activeElement && document.activeElement.tagName;
  const isEditing = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA';
  // upgradeOpen joins timeModal in the tick guard (v11): rebuilding the plans sheet every second
  // replayed its 320ms sheetUp entry animation and reset its internal scroll — the "flickering,
  // adjusting popup" Aaron saw on his phone. Interaction re-renders still repaint it instantly.
  // drawerOpen/apptModal join the same guard (v22): without it, a focused element inside the drawer
  // or the appointment form would be destroyed and re-created every second by the full-tree rebuild,
  // silently dropping keyboard focus (and defeating the drawer's Tab-trap) the instant the tick fired.
  if (!state.timeModal && !state.upgradeOpen && !state.drawerOpen && !state.apptModal && !isEditing) render();
  checkNotifications();
  checkAppointmentReminders();
}, 1000);
if (!getPrefsDB().tourDone && (getPrefsDB().patientName || '').trim()) { const savedStep = getPrefsDB().tourStep; state.tourStep = (typeof savedStep === 'number' && savedStep >= 0 && savedStep < TOUR_STEPS.length) ? savedStep : 0; }
render();

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Proactively check for a newer sw.js on every load instead of relying solely on the
    // browser's own background update check, which can be slow/throttled and left this
    // testing app running stale cached JS (with already-pushed bug fixes not applying) for
    // multiple page loads during the 30-use-case QA pass — found while verifying UC11.
    reg.update().catch(() => {});
  }).catch(() => {});

  // Once a new service worker activates and takes control, reload once so this tab picks up
  // the new app shell immediately rather than continuing to run the JS it started with.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
