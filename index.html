            h('div', { style: { ...TYPE.body, color: '#7A6E76' } }, 'No notes yet.'),
            h('div', { style: { ...TYPE.caption, color: '#915E48', marginTop: '4px' } }, 'Jot down anything worth remembering — a side effect, a question for the doctor, how the day went.')
          )
    )
  ];
}

const APP_VERSION = 'app-v68';

// v35: the Settings notification card. One of eight mutually-exclusive states, computed by
// nativeNotifStatus() -- never more than one status indicator on screen at once (no green pill next
// to an error, no armed count without the pill that says reminders are actually on), so the card can
// never tell the caregiver two contradictory things at the same time.
function renderNativeNotifStatusCard() {
  const status = nativeNotifStatus();
  const muted = { fontSize: '12.5px', color: '#6D5247', lineHeight: '1.45' };
  // disabled must never be passed as a literal `false` -- h() sets it via setAttribute, and
  // setAttribute('disabled', false) still renders a disabled (and therefore unclickable) button,
  // because HTML boolean attributes are presence-based, not value-based. Same trap this file's own
  // arrow-button code already documents (~line 4395); conditionally spread the key in instead.
  const btn = (label, onClick, bg) => h('button', Object.assign(
    { onClick, style: { minHeight: '44px', padding: '0 16px', borderRadius: '11px', background: bg || '#BF4C1A', color: '#fff', fontSize: '13px', fontWeight: '800', boxShadow: '0 6px 18px rgba(168,61,15,0.32)' } },
    notifActionBusy ? { disabled: true } : {}
  ), label);
  const pill = (text) => h('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '5px', fontSize: '12.5px', fontWeight: '700', color: '#0A6B4A', background: 'rgba(46,125,79,0.10)', padding: '3px 10px', borderRadius: '99px' } }, text);
  const errBlock = (title, body) => h('div', null,
    h('div', { style: { fontSize: '12.5px', fontWeight: '700', color: '#A5443C', overflowWrap: 'anywhere' } }, title),
    h('div', { style: { ...muted, marginTop: '3px', overflowWrap: 'anywhere' } }, body)
  );
  const countLine = () => h('div', { style: muted }, notifScheduledCount + (notifScheduledCount === 1 ? ' reminder' : ' reminders') + ' scheduled over the next 3 days' + (notifNextAt ? ', next at ' + new Date(notifNextAt).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.' : '.'));
  // A single top-level wrapper owns the gap from the section's intro sentence above AND the gap
  // between each state's own children, via flex+gap rather than a per-child marginTop -- so every
  // state lines up identically instead of drifting depending on which helper its first child came
  // from (Designer catch: checking/empty/paused_sim/not_asked had 0px here, blocked/failed/on/
  // on-exact had 10px, purely because only some of the helpers above happened to set marginTop).
  const card = (...children) => h('div', { style: { marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'flex-start' } }, ...children);

  if (status === 'checking') return card(h('div', { style: muted }, 'Checking notification status…'));

  if (status === 'paused_sim') return card(h('div', { style: muted }, 'Reminders are paused while the beta date controls are simulating a date. Reset the date to re-arm them.'));

  if (status === 'blocked') return card(
    errBlock('Notifications are blocked for ChemoWell', 'Reminders can’t be scheduled until notifications are allowed for this app in your phone’s Settings.'),
    btn('Try again', retryNotifPermission)
  );

  if (status === 'not_asked') return card(
    h('div', null,
      h('div', { style: { fontSize: '12.5px', fontWeight: '700', color: '#9A6419' } }, 'Notifications aren’t turned on yet'),
      h('div', { style: { ...muted, marginTop: '3px' } }, 'Turn them on so dose and appointment reminders can reach you even when the app is closed.')
    ),
    btn('Turn on notifications', retryNotifPermission)
  );

  if (status === 'failed') return card(
    errBlock('Reminders couldn’t be set on this device', 'Something went wrong scheduling reminders. Your existing reminders are unaffected — this only blocks new ones from being armed until it’s retried.'),
    btn('Try again', () => syncNativeReminders({ force: true }))
  );

  // app-v50 (Aaron-requested): a second, independent OS control from exact timing -- surfaced only
  // when there's something to do (batteryOptState === 'enabled'), never when it's already off,
  // unsupported, or not yet known, matching this card's existing "only show an action that's real"
  // rule.
  const batteryOptBlock = () => {
    if (batteryOptState !== 'enabled') return [];
    return [
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
        h('div', { style: muted }, 'Android battery saving may also delay delivery.'),
        helpIcon('Background reminder reliability', 'This is a separate setting from exact timing above. Some phones aggressively pause apps running in the background to save power, which can delay a reminder reaching you even once it’s armed correctly.\n\nTurning this off just for ChemoWell tells your phone this app is allowed to run reliably in the background. It has very little real effect on battery life for an app that only checks a schedule occasionally — it isn’t constantly running in between.')
      ),
      btn('Allow background activity', requestBatteryOptExemption, '#9A6419')
    ];
  };

  if (status === 'on-exact') return card(
    pill('✓ Notifications are on'),
    countLine(),
    h('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
      h('div', { style: { ...muted, color: '#9A6419', fontWeight: '700' } }, 'Exact timing isn’t allowed — reminders are scheduled a few minutes ahead so they land on time rather than late.'),
      helpIcon('About exact reminder timing', 'Most Android phones let any app request exact-time alarms once you allow it below — this isn’t limited to clock or calendar apps, and it’s worth turning on. A few phones (Samsung devices have reported this) can make the toggle harder to find or behave inconsistently, especially right after declining it once; if "Alarms & reminders" isn’t visible under Settings → Apps → ChemoWell, try again after closing and reopening the app, or check Settings → Apps → (three-dot menu) → Reset app preferences.\n\nEither way, ChemoWell already schedules reminders a few minutes ahead of their real time on your behalf when this is off, so ordinary Android delivery slop lands early rather than late — you don’t need to build in your own buffer. If one specific reminder truly can’t ever be late, setting it a few minutes ahead yourself is still the safest belt-and-suspenders option.'),
    ),
    btn('Allow exact reminders', changeExactNotificationSetting, '#9A6419'),
    ...batteryOptBlock()
  );

  if (status === 'empty') return card(h('div', { style: muted }, 'No reminders are currently due in the next 3 days.'), ...batteryOptBlock());

  // 'on'
  return card(pill('✓ Notifications are on'), countLine(), ...batteryOptBlock());
}

// ---------- Help centre (app-v55) — replaces the standalone FAQ view ----------
// Three levels, one at a time: categories -> the problems in that category -> the walkthrough.
// 117 entries shown as one flat list would be the same as no list on a 360px phone, so they never
// are. Every level has a visible way back that is not the phone's Back button, because on this app
// the hardware Back button still leaves the app entirely (AUDIT_full_app_v51.md, M-7).
//
// helpQuery is module-level, NOT state: the 1-second tick at the bottom of this file rebuilds the
// whole DOM tree, and a module-level draft is the pattern this file already uses to survive that
// (see setupNameDraft). The tick guard also excludes the whole Help view — see the comment there.
let helpQuery = '';

function helpFaqTopics() {
  // The 15 original FAQ entries become the "Common questions" category. Same objects, same keys —
  // they still render through the untouched accordion in renderHelpCommon() below.
  return FAQ_ITEMS.map(f => ({ id: 'faq:' + f.id, faqId: f.id, cat: 'common', q: f.q, a: f.a }));
}
function helpAllTopics() { return HELP_TOPICS.concat(helpFaqTopics()); }
function helpTopicById(id) { return helpAllTopics().find(t => t.id === id) || null; }
function helpCategory(id) { return HELP_CATEGORIES.find(c => c.id === id) || null; }
function helpCategoryLabel(id) { const c = helpCategory(id); return c ? c.label : ''; }
function helpTopicsIn(cat) { return cat === 'common' ? helpFaqTopics() : HELP_TOPICS.filter(t => t.cat === cat); }
function helpCategoryCount(cat) { return helpTopicsIn(cat).length + HELP_POINTERS.filter(p => p.cat === cat).length; }

// ---------------------------------------------------------------------------------------------
// v56: the help matcher, powering the Help & FAQ centre's search box.
//
// Why the old v55 helpSearch() was replaced: it was an AND-over-terms substring filter, so it only
// worked if the user typed bare keywords. People type sentences into a search box too -- "why cant
// i type in the daily limit box" contains why/cant/in/the/box, and under an AND filter that returns
// ZERO results for a perfectly well-formed question. v57 removed the on-screen bubble this matcher
// was originally built alongside; the matcher stays, because the search box is the half of it that
// works and reverting to substring matching would be a straight regression.
//
// There is no model and no network here. This is a scored lookup over the help documents that
// already ship inside index.html -- stopwords, light stemming, a small query-side synonym map,
// bounded typo tolerance, field weighting and IDF. Every constant below was measured against the
// 60-question fixture in the brief, not guessed.
// ---------------------------------------------------------------------------------------------

// Deliberately includes the filler verbs (put/get/want/need/know) -- they are RARE in this corpus,
// so IDF weights them high, and a rare filler word is the most effective way to drag a query to
// the wrong topic. And 'help': without it here, typing the single word "help" returns the
// emergency-symptom walkthrough at 0.90, which is the worst possible answer to the most likely
// single word a frightened person types.
const HELP_STOP = new Set(('a an the and or but if of to in into onto is am are was were be been being it its ' +
  'this that these those my mine me i we our us you your he she they them their his her ' +
  'do does did doing done have has had having can could should would will shall may might must ' +
  'about at as by for from with without so than then there here just even also very really ' +
  'please thanks thank hi hello hey ok okay yeah ' +   // greeting/meta -- see HELP_STOP_SEARCH
  'put puts putting get gets getting got make makes made want wants wanted need needs needed ' +
  'know knows thing things stuff tell tells telling like help ' +
  'what whats why how when where which who whom whose ' +
  'ive im id ill isnt arent wasnt werent dont doesnt didnt hasnt havent thats theres lets').split(' '));

// The search box gets a SMALLER stop list than the bot (Lead Auditor LA-2). The greeting words
// exist so that typing "help" or "hi" into a CHAT box produces the greeting instead of the
// emergency-symptom page -- a bot has to decide whether it understood you. A search box has no
// such problem: it lists what matches and the user picks. Sharing one list meant typing "help"
// into a screen headed *Search help* returned "Nothing matched that", which v55 did not do.
const HELP_STOP_GREETING = new Set('please thanks thank hi hello hey ok okay yeah help'.split(' '));
const HELP_STOP_SEARCH = new Set(Array.from(HELP_STOP).filter(function (w) { return !HELP_STOP_GREETING.has(w); }));

// NOT stopwords, and do not add them -- each is load-bearing somewhere in the corpus:
// no not never nothing none on off over out up down back before after again same one two still
// work working go see find missing wont cant wrong only early late

// Query-side only, never applied to the index. Every entry earned its place by fixing a fixture
// case: the corpus is written in one register ("medication", "reminder") and users type another.
const HELP_SYNONYMS = {
  med: 'medication', meds: 'medication', medicine: 'medication', medicines: 'medication',
  pill: 'medication', pills: 'medication', tablet: 'medication', tablets: 'medication',
  drug: 'medication', drugs: 'medication', rx: 'medication',
  notification: 'reminder', notifications: 'reminder', notif: 'reminder',
  alert: 'reminder', alerts: 'reminder',
  temp: 'temperature', bp: 'blood pressure', dr: 'doctor'
};

const HELP_FIELDS = [['q', 1.0], ['kw', 0.9], ['a', 0.55], ['cat', 0.45], ['steps', 0.35], ['branch', 0.30], ['note', 0.25]];
const HELP_UNKNOWN_IDF = 1.2;      // roughly the IDF of a very common word: an unknown term costs
                                   // the query without single-handedly destroying a good question

// Apostrophes are DELETED rather than spaced, so "can't" -> "cant" and the corpus's own "can't
// type" keyword normalises to the same token. Everything else non-alphanumeric is a separator,
// applied identically to index and query -- consistency beats cleverness, so "100.4" becomes
// ["100","4"] on both sides and still matches.
function helpNorm(s) {
  return (s || '').toLowerCase()
    .replace(/[‘’ʼ´]/g, "'")
    .replace(/'/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

// ~12 lines, no library (this app has no build step and this would be its first dependency).
// Applied IDENTICALLY to index and query tokens -- that identity is the whole point; an
// asymmetric stemmer is worse than none. The trailing-e and doubled-consonant rules are what
// collapse take/taking and log/logged/logging; removing either silently breaks a third of the
// verb matches.
function helpStem(w) {
  let x = w;
  if (x.length >= 4) {
    if (/ies$/.test(x) && x.length >= 5) x = x.slice(0, -3) + 'i';
    else if (/ing$/.test(x) && x.length >= 6) x = x.slice(0, -3);
    else if (/ed$/.test(x) && x.length >= 5) x = x.slice(0, -2);
    else if (/es$/.test(x) && x.length >= 5) x = x.slice(0, -1);
    else if (/s$/.test(x) && !/(ss|us|is)$/.test(x)) x = x.slice(0, -1);
    if (/y$/.test(x) && x.length >= 4) x = x.slice(0, -1) + 'i';
  }
  if (x.length >= 4 && /([bcdfglmnprst])\1$/.test(x)) x = x.slice(0, -1);
  if (x.length >= 4 && /e$/.test(x)) x = x.slice(0, -1);
  return x;
}

let helpSearchIndex = null;

// Built once, lazily, on first use -- 133 documents x 7 fields is a few ms, and doing it at module
// load would add that to every cold start whether or not anyone opens help.
function helpIndex() {
  if (helpSearchIndex) return helpSearchIndex;
  // HELP_POINTERS were browsable but invisible to search (logged in BACKLOG). Folded in as keyword
  // ALIASES on their target rather than as documents of their own: one copy of the copy, so the
  // two can never drift, and the browse rendering and category counts stay untouched.
  const ptr = {};
  HELP_POINTERS.forEach(p => { (ptr[p.to] = ptr[p.to] || []).push(p.q); });
  const cats = {};
  HELP_CATEGORIES.forEach(c => { cats[c.id] = c; });

  const docs = helpAllTopics().map(t => {
    const c = cats[t.cat] || { label: '', blurb: '' };
    const kwList = (t.keywords || []).concat(ptr[t.id] || []);
    const fields = {
      q: t.q,
      kw: kwList.join(' '),
      a: t.a || '',
      cat: c.label + ' ' + (c.blurb || ''),
      steps: (t.steps || []).join(' '),
      branch: (t.branches || []).map(b => b.when + ' ' + b.steps.join(' ')).join(' '),
      note: t.note || ''
    };
    const tok = {}, seq = {};
    HELP_FIELDS.forEach(function (fw) {
      const f = fw[0];
      const ws = helpNorm(fields[f]).split(' ').filter(Boolean);
      seq[f] = ws.map(helpStem);
      // BOTH the raw token and its stem go in, so "120 over 80" and "one ui" keep their raw forms.
      tok[f] = new Set();
      ws.forEach(function (w) { tok[f].add(w); tok[f].add(helpStem(w)); });
    });
    const all = new Set();
    HELP_FIELDS.forEach(function (fw) { tok[fw[0]].forEach(function (w) { all.add(w); }); });
    return { t: t, tok: tok, seq: seq, all: all, kwPhrases: kwList, isFaq: !!t.faqId };
  });

  const df = {};
  docs.forEach(function (d) { d.all.forEach(function (w) { df[w] = (df[w] || 0) + 1; }); });
  helpSearchIndex = { docs: docs, df: df, N: docs.length, vocab: Object.keys(df).filter(function (w) { return w.length >= 4; }) };
  return helpSearchIndex;
}

// Bounded Damerau-Levenshtein against the index vocabulary. Caregivers type on phones at 2am;
// "notifcations" and "temprature" fail every exact and stem path. Budget is 0 below 5 characters
// on purpose -- at 4 the false friends (dose/does, log/long) cost more than the typos gain.
function helpEditWithin(a, b, max) {
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > max) return false;
  let prev2 = null, prev = new Array(lb + 1), cur;
  for (let j = 0; j <= lb; j++) prev[j] = j;
  for (let i = 1; i <= la; i++) {
    cur = new Array(lb + 1);
    cur[0] = i;
    let rowMin = cur[0];
    for (let j = 1; j <= lb; j++) {
      const cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
      let v = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      if (prev2 && i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
        v = Math.min(v, prev2[j - 2] + 1);
      }
      cur[j] = v;
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return false;   // early abandon
    prev2 = prev; prev = cur;
  }
  return prev[lb] <= max;
}
function helpFuzzy(w) {
  if (w.length < 5) return null;
  const budget = w.length >= 8 ? 2 : 1;
  const ix = helpIndex();
  let best = null, bestD = 99;
  for (let i = 0; i < ix.vocab.length; i++) {
    const cand = ix.vocab[i];
    if (Math.abs(cand.length - w.length) > budget) continue;
    for (let d = 1; d <= budget; d++) {
      if (d >= bestD) break;
      if (helpEditWithin(w, cand, d)) { best = cand; bestD = d; break; }
    }
    if (bestD === 1) break;
  }
  return best;
}

function helpTerms(query, stopSet) {
  const stop = stopSet || HELP_STOP;
  const ix = helpIndex();
  const raw = helpNorm(query).split(' ').filter(Boolean);
  const out = [], seen = {};
  raw.forEach(function (w) {
    // Synonym expansion happens BEFORE stopword removal, so a synonym target is never
    // accidentally stopworded on its way in.
    const isSyn = Object.prototype.hasOwnProperty.call(HELP_SYNONYMS, w);
    const expanded = isSyn ? HELP_SYNONYMS[w].split(' ') : [w];
    expanded.forEach(function (x) {
      if (!isSyn && stop.has(x)) return;
      if (x.length < 2 && !/^[0-9]$/.test(x)) return;
      if (seen[x]) return;
      seen[x] = 1;
      out.push(x);
    });
  });
  return out.map(function (w) {
    if (ix.df[w]) return { key: w, quality: 1.0 };
    const s = helpStem(w);
    if (ix.df[s]) return { key: s, quality: 0.9 };
    let f = helpFuzzy(w) || helpFuzzy(s);
    // A fuzzy hit that lands on a synonym KEY is re-expanded -- this is what turns
    // "notifcations" -> "notification" -> "reminder".
    if (f && Object.prototype.hasOwnProperty.call(HELP_SYNONYMS, f)) f = helpStem(HELP_SYNONYMS[f].split(' ')[0]);
    if (f && ix.df[f] === undefined) f = helpFuzzy(f);
    return f && ix.df[f] ? { key: f, quality: 0.65 } : { key: w, quality: 0 };
  });
}

function helpScore(d, terms, ix) {
  let num = 0, den = 0, matched = 0, anchor = false;
  terms.forEach(function (t) {
    const dfc = ix.df[t.key];
    const idf = dfc ? Math.log(1 + ix.N / dfc) : HELP_UNKNOWN_IDF;
    den += idf;                       // EVERY term counts against the denominator, matched or not.
    if (!t.quality) return;           // That is how unmatched words are punished.
    let best = 0, hits = 0;
    HELP_FIELDS.forEach(function (fw) {
      if (d.tok[fw[0]].has(t.key)) { hits++; if (fw[1] > best) best = fw[1]; }
    });
    if (best > 0) {
      matched++;
      if (best >= 0.9) anchor = true;               // matched in the title or the keywords
      // max, NOT sum: summing lets a long walkthrough win on repetition alone. The fieldsMatched
      // bonus is what separates a term genuinely central to a topic from one that appears once in
      // a note, and it is the single most load-bearing constant in this design.
      num += idf * t.quality * (best + Math.min(0.45, 0.15 * (hits - 1)));
    }
  });
  if (!den) return { score: 0, matched: 0, cov: 0, anchor: false, nterms: 0 };
  let s = num / den;

  const keys = terms.map(function (t) { return helpStem(t.key); });
  let bg = 0;
  for (let i = 0; i + 1 < keys.length; i++) {
    let b = 0;
    HELP_FIELDS.forEach(function (fw) {
      const sq = d.seq[fw[0]];
      for (let j = 0; j + 1 < sq.length; j++) {
        if (sq[j] === keys[i] && sq[j + 1] === keys[i + 1]) {
          const v = fw[1] >= 0.9 ? 0.15 : 0.07;
          if (v > b) b = v;
          break;
        }
      }
    });
    bg += b;
  }
  s += Math.min(0.30, bg);            // capped, or a long query echoing a long walkthrough runs away

  // Keyword-phrase bonus. The corpus's keywords include real phrases ("alarms and reminders",
  // "won't turn on", "greyed out"); an in-order phrase hit is worth roughly one extra title term,
  // which is what makes multi-word queries beat single tokens by construction.
  for (let i = 0; i < d.kwPhrases.length; i++) {
    const pt = helpNorm(d.kwPhrases[i]).split(' ').filter(Boolean).map(helpStem);
    if (pt.length < 2) continue;
    let ok = true, idx = -1;
    for (let k = 0; k < pt.length; k++) {
      const at = keys.indexOf(pt[k], idx + 1);
      if (at < 0) { ok = false; break; }
      idx = at;
    }
    if (ok) { s += 0.18; break; }
  }
  // Title-coverage tiebreaker, capped at +0.12. Without it a SHORT title loses to a LONG title
  // that merely repeats the same words more often: "What is the Daily check-in?" reduces to the
  // two content terms daily+check, which sit in vit-checkin-modal's whole title and also all over
  // rem-checkin-time ("I want the daily check-in reminder at a different time"), so the
  // fieldsMatched bonus handed it to the wrong one. Measuring how much of the TITLE the query
  // accounts for -- not how often the words appear -- is what tells those two apart. Kept small on
  // purpose: this breaks ties, it does not overturn a genuine win.
  const qt = d.seq.q.filter(function (w) { return !HELP_STOP.has(w); });
  if (qt.length) {
    let covered = 0;
    qt.forEach(function (w) { if (keys.indexOf(w) >= 0) covered++; });
    s += 0.12 * (covered / qt.length);
  }

  // Several FAQ entries near-duplicate a walkthrough. On a genuine tie the walkthrough is the
  // better reply because it has ordered steps; 5% breaks the tie without suppressing an FAQ that
  // is clearly the better match on its own merits.
  if (d.isFaq) s *= 0.95;
  return { score: s, matched: matched, cov: matched / terms.length, anchor: anchor, nterms: terms.length };
}

function helpMatch(query) {
  const ix = helpIndex();
  const terms = helpTerms(query);
  if (!terms.length) return [];
  return ix.docs.map(function (d) {
      const r = helpScore(d, terms, ix);
      return { topic: d.t, score: r.score, matched: r.matched, cov: r.cov, anchor: r.anchor, nterms: r.nterms };
    })
    .filter(function (r) { return r.score > 0; })
    .sort(function (a, b) { return b.score - a.score; })
    .slice(0, 6);
}

// The Help view's search box now shares the matcher. It stays UNFILTERED by threshold -- a search
// box may show weak matches; a bot may not.
// v57 (Auditor V57-1). The v55 search was an AND-over-substrings filter, so a typed sentence
// returned nothing -- an honest empty state, and the reason the corpus comment above calls this a
// "Search help" field rather than a chat box. The v56 matcher replaced it with a scorer and, on the
// SEARCH-BOX path, nobody ever measured what that did to a sentence the corpus has no answer for.
// The Auditor measured it: v55 returned nothing for 49 of 50 clinical questions; v56/v57 return a
// ranked list for 45 of 50. "she collapsed" ranked "All my medications vanished from Home" first --
// a genuine keyword hit on `collapsed`, which is why no threshold catches it -- and "she is coughing
// up blood" returned 66 rows headed by "How do I record blood pressure?".
//
// Three separate problems, fixed separately, because conflating them is how the v56 guard went wrong:
//
//  - SAFETY is handled in the UI, not here, and NOT conditionally. The care-team line now sits above
//    every result set. The Auditor recommended showing it "when the query resolves poorly"; I went
//    further and made it unconditional, because deciding which queries are the frightening ones is
//    exactly the classifier that failed twice in v56 -- and one calm sentence above a list of app
//    pages costs a person searching "export csv" nothing.
//  - RELEVANCE is the floor below. A result scoring a small fraction of the leader is carried by one
//    weak term and is noise; 66 rows of it buries whatever was right.
//  - LENGTH is the cap. Whatever survives the floor, a phone shows a usable number of rows.
//
// Both constants below are MEASURED against the 53-question fixture and the every-topic-findable
// regression in test/v57-search.mjs, not guessed -- a floor that starts emptying "export to excel"
// is its own defect.
const HELP_SEARCH_FLOOR = 0.22;   // fraction of the top score a result must reach to be shown
const HELP_SEARCH_MAX = 12;       // rows shown; the total is still reported to the user

// Returns { hits, total, shown, cov } -- cov is the leader's term coverage, reported so the results
// screen can say something honest about a query the corpus does not cover.
function helpSearchFull(query) {
  const empty = { hits: [], total: 0, shown: 0, cov: 0 };
  if (!(query || '').trim()) return empty;
  const ix = helpIndex();
  const terms = helpTerms(query, HELP_STOP_SEARCH);
  if (!terms.length) return empty;
  const scored = ix.docs.map(function (d) {
    const r = helpScore(d, terms, ix);
    return { topic: d.t, score: r.score, cov: r.cov };
  }).filter(function (r) { return r.score > 0; }).sort(function (a, b) { return b.score - a.score; });
  if (!scored.length) return empty;
  const cut = scored[0].score * HELP_SEARCH_FLOOR;
  const kept = scored.filter(function (r) { return r.score >= cut; });
  return { hits: kept.slice(0, HELP_SEARCH_MAX).map(function (r) { return r.topic; }),
    total: kept.length, shown: Math.min(kept.length, HELP_SEARCH_MAX), cov: scored[0].cov };
}

// The brief's copy carries **bold** for the words to look for on screen, *italics* for screen
// names and quoted topic titles, and `backticks` for text the user types into a field verbatim
// (`500 mg`, `2 sprays`). Rendered as real <strong>/<em>/<code> nodes; no innerHTML, so nothing in
// the content can ever be interpreted as markup.
//
// v55 (Auditor V55-2): the backtick arm was missing, so every literal example rendered with its
// backticks showing -- most visibly on med-daily-limit-locked, which the brief calls the single
// most-reported sticking point in the medication editor. The <code> style deliberately does NOT
// use a monospace face at body size (it reads as "broken" next to the rest of the copy at 14px);
// it is a tinted chip with a slightly tighter letterform, which is what makes "type exactly this"
// legible to a non-technical reader.
function helpRich(str) {
  const out = [];
  const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`/g;
  let last = 0, m;
  while ((m = re.exec(str)) !== null) {
    if (m.index > last) out.push(str.slice(last, m.index));
    if (m[1]) out.push(h('strong', { style: { fontWeight: '800', color: '#2A2127' } }, m[1]));
    else if (m[2]) out.push(h('em', { style: { fontStyle: 'italic' } }, m[2]));
    else out.push(h('code', { style: { fontFamily: 'inherit', fontWeight: '700', fontSize: '0.94em', color: '#2A2127', background: 'rgba(200,83,32,0.09)', border: '1px solid rgba(200,83,32,0.16)', borderRadius: '6px', padding: '1px 5px', whiteSpace: 'nowrap' } }, m[3]));
    last = re.lastIndex;
  }
  if (last < str.length) out.push(str.slice(last));
  return out;
}

// ---------- Account view + data export (app-v33, Owner-requested) ----------
// Reached from the drawer. Shows the plan, every profile on the device (with treatment type and
// entry counts), profile switching, and the export tools. Export philosophy per Owner decision:
// CSV of your own medical data is FREE for everyone (never hold someone's health record hostage);
// the formatted printable doctor's report is the Plus/Pro perk.
function profilePrefsFor(id) { return loadJSON('chemowell-app-p-' + id + '-prefs-v1', {}); }
function profileEntryCountFor(id) { return loadJSON('chemowell-app-p-' + id + '-entries-v1', []).filter(e => e.medId !== 'chemo_date').length; }
// short=true is for tight layouts (Account profile-list rows) where the fuller wording wraps to
// a second line next to single-line siblings like "Chemo"/"Radiation" -- see Lead Designer v39
// review. Only 'other' has a shorter form; the rest are already short enough not to need one.
function treatmentLabel(t, short) { return t === 'chemo' ? 'Chemo' : t === 'radiation' ? 'Radiation' : t === 'both' ? 'Chemo + Radiation' : t === 'other' ? (short ? 'Other' : 'Other treatment') : 'Not set'; }

function csvField(v) {
  v = (v === null || v === undefined) ? '' : String(v);
  // v33 audit fix (M1): neutralize spreadsheet formula injection (OWASP CSV Injection). Cells
  // starting with = + - @ (or tab/CR) are EVALUATED by Excel/Sheets — a patient note like
  // "=2+2" or even "-3 lbs overnight" would corrupt or weaponize a doctor-facing export.
  // Leading apostrophe forces text interpretation; the visible ' is the accepted tradeoff.
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
// One row per logged entry, chronological. chemo_date markers are internal scheduling state, not
// health data, so they're excluded; everything else the patient logged is included.
function buildExportRows() {
  const all = allEntriesRaw().filter(e => e.medId !== 'chemo_date').sort((a, b) => a.ts - b.ts);
  const radIds = {};
  all.filter(e => e.medId === 'radiation_session').forEach((e, i) => { radIds[e.id] = i + 1; });
  return all.map(e => {
    const d = new Date(e.ts);
    let detail = '', note = e.note || '';
    if (e.medId === 'temp') detail = e.dose || (e.temp + ' ' + (e.unit === 'Celsius' ? '°C' : '°F'));
    else if (e.medId === 'blood_pressure') detail = e.sys + '/' + e.dia + ' mmHg';
    else if (e.medId === 'weight') { detail = e.dose || (e.weight + ' ' + (e.unit || '')); if (e.weightReason) detail += ' (' + e.weightReason + (e.litersDrained ? ', ' + e.litersDrained + 'L drained' : '') + ')'; note = e.weightNote || note; }
    else if (e.medId === 'paracentesis') { detail = e.cancelled ? 'Removed' : ((Math.round(Number(e.liters) * 10) / 10).toFixed(1) + ' L drained'); }
    else if (e.medId === 'radiation_session') detail = 'Session ' + radIds[e.id];
    else if (e.medId === 'bowel_movement') detail = (typeof BOWEL_MOVEMENT_LABELS === 'object' && BOWEL_MOVEMENT_LABELS[e.value]) || e.value || '';
    else if (e.medId === 'appetite') detail = (typeof APPETITE_LABELS === 'object' && APPETITE_LABELS[e.value]) || e.value || '';
    else if (e.medId && e.medId.indexOf('symptom_') === 0) { const bits = []; if (e.severity) bits.push(e.severity); if (e.site) bits.push('site: ' + e.site); if (e.freq) bits.push(e.freq + ' episodes'); detail = bits.join(', '); }
    else if (e.medId === 'cycle_start' || e.medId === 'cycle_end' || e.medId === 'inpatient_start' || e.medId === 'inpatient_end' || e.medId === 'inpatient') detail = '';
    // v52 (audit H-3, Aaron-reported: "the detail column had 500mg, 500 pills. the med was Tylenol
    // for 500 mg"). `e.pills` is NOT a pill count -- parseDoseOptions deliberately stores any leading
    // number from a free-text dosage label there as "the amount in the non-mg limit unit" (see the
    // v45 comment on that function). Printing it with a hardcoded "pill(s)" invented a unit the user
    // never chose, and because the dose label already contains that same number, every row said the
    // amount twice: "8 mg, 8 pills", "40 mg, 40 pills", "2 tabs, 2 pills", "2 applications, 2 pills".
    // This function also feeds the printable report a doctor reads, so it was wrong in front of a
    // clinician. Fix: the dose label is the amount -- print it and stop. Only fall back to the raw
    // number when there is no label to describe it, and even then use the medication's real unit
    // rather than assuming pills.
    else {
      detail = e.dose || '';
      if (!detail && e.pills) {
        const medRec = state.meds.find(x => x.id === e.medId) || (state.archivedMeds && state.archivedMeds[e.medId]) || {};
        const unit = medRec.ceilingUnit || 'pill' + (e.pills === 1 ? '' : 's');
        detail = e.pills + ' ' + unit;
      }
      if (e.painLevel) detail += (detail ? ', ' : '') + 'pain ' + e.painLevel + '/10';
      if (e.overrideReason) detail += (detail ? ', ' : '') + 'override: ' + e.overrideReason;
    }
    return [d.toLocaleDateString('en-CA'), fmtTime(e.ts), nameOf(e.medId), detail, note];
  });
}
// v37 fix (Aaron, 2026-08-06): "says 2 CSV entries exported, but where does that go... no pop up
// or anything saying where that file lives." Root cause -- a plain Blob + <a download> click gives
// zero visible confirmation on a phone: Android Chrome silently drops it into Downloads with no
// on-screen indicator unless the user opens the browser's own downloads tray, and an installed
// iOS/Android PWA (standalone mode, no browser chrome at all) can no-op the click entirely with no
// error and no fallback UI. The fix is to prefer the Web Share API's file-sharing path when the
// platform supports it: navigator.share() pops the OS share sheet, which is an unmissable, visible
// answer to "where does that go" (Files, Drive, Mail, AirDrop, etc., user's choice). Desktop
// browsers generally don't support sharing files, so they fall back to the original blob-download
// link, with clearer toast copy pointing at the Downloads folder instead of leaving it unsaid.
// ================================================================================================
// BACKUP & RESTORE (app-v61).  See cwbackup-patch.py for why this is load-bearing rather than nice.
// ================================================================================================
const CW_BK_FORMAT = 'chemowell-backup';
// Two numbers, not one. A PLAIN file is still written at 1 so a phone running an older build can
// still read a backup made here; an ENCRYPTED file is written at 2, which makes an older build
// report "made by a newer version -- update first" instead of reading zero records out of an
// envelope it cannot open and calling the file empty. FORMAT_VERSION is the highest this build can
// read, and is what the newer-format guard compares against.
const CW_BK_PLAIN_VERSION = 1;
const CW_BK_ENC_VERSION = 2;
const CW_BK_FORMAT_VERSION = 2;
const CW_BK_MAX_BYTES = 25 * 1024 * 1024;

// ================================================================================================
// PASSWORD-PROTECTED BACKUP FILES (app-v63)
// A backup file is the one thing in this app that leaves the phone. It gets emailed, dropped into a
// shared folder, handed to a second caregiver -- and in plaintext it is a complete medical record,
// readable by anyone who ends up holding it. This wraps the whole payload in AES-256-GCM under a
// key derived from a password the person chooses, using PBKDF2-SHA256 and the same three
// crypto.subtle primitives already in this file. No new dependency, no server, nothing to sign up
// for. There is deliberately NO recovery path: the password is never stored, never transmitted, and
// not derivable from the file. That is the property that makes the file safe to send, and it is
// also the reason the UI makes the person type it twice and tells them to write it down.
// ================================================================================================
const CW_BK_KDF = 'PBKDF2-SHA256';
const CW_BK_KDF_ITERATIONS = 310000;
const CW_BK_KDF_MIN_ITERATIONS = 100000;
const CW_BK_KDF_MAX_ITERATIONS = 2000000;
const CW_BK_MIN_PASSWORD = 8;
async function cwBkDeriveFileKey(password, saltBytes, iterations) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: iterations, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
// format / formatVersion / createdAt sit in the CLEAR so a build that cannot open the file still
// recognises WHAT it is and says so. Everything that identifies a patient -- the profile name
// included -- is inside the ciphertext, which is why the saved filename drops the name too.
async function cwBkEncryptPayload(payload, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await cwBkDeriveFileKey(password, salt, CW_BK_KDF_ITERATIONS);
  const blob = await syncAesEncryptObject(key, payload);
  return {
    format: CW_BK_FORMAT,
    formatVersion: CW_BK_ENC_VERSION,
    app: APP_VERSION,
    createdAt: payload.createdAt,
    encrypted: true,
    kdf: CW_BK_KDF,
    iterations: CW_BK_KDF_ITERATIONS,
    salt: syncB64FromBytes(salt),
    cipher: 'AES-GCM',
    blob: blob
  };
}
function cwBkIsEncrypted(parsed) {

// Reports 'bad-password' for anything that fails to open under the given password, because from the
// person's side a wrong password and a truncated download are the same event, and telling them the
// file is corrupt when they simply mistyped sends them hunting a problem that isn't there. The two
// cases retyping can NEVER fix -- an unreadable envelope and a cipher this build doesn't know --
// are reported separately so the advice can differ.
async function cwBkDecryptEnvelope(env, password) {
  if (!cwBkIsEncrypted(env)) throw new Error('not-encrypted');
  if (env.kdf !== CW_BK_KDF || env.cipher !== 'AES-GCM') throw new Error('unsupported-cipher');
  const iters = Number(env.iterations);
  // An iteration count read out of a FILE is an attacker-controlled denial-of-service knob: two
  // billion rounds locks the phone up for minutes. Bounded, not trusted.
  if (!isFinite(iters) || iters < CW_BK_KDF_MIN_ITERATIONS || iters > CW_BK_KDF_MAX_ITERATIONS) throw new Error('unsupported-cipher');
  if (typeof env.salt !== 'string' || !env.blob || typeof env.blob !== 'object' || Array.isArray(env.blob)) throw new Error('damaged');
  if (typeof env.blob.ciphertext !== 'string' || typeof env.blob.iv !== 'string') throw new Error('damaged');
  let saltBytes = null;
  try { saltBytes = syncBytesFromB64(env.salt); } catch (e) { throw new Error('damaged'); }
  if (saltBytes.length < 8) throw new Error('damaged');
  let obj = null;
  try {
    const key = await cwBkDeriveFileKey(password, saltBytes, iters);
    obj = await syncAesDecryptObject(key, env.blob);
  } catch (e) { throw new Error('bad-password'); }
  // GCM has already proved the ciphertext was produced under this exact key. The plaintext still
  // has to be a BACKUP rather than merely well-formed JSON before it goes anywhere near storage.
  if (!obj || typeof obj !== 'object' || Array.isArray(obj) || obj.format !== CW_BK_FORMAT) throw new Error('damaged');
  return obj;
}

// One delivery path for every file this app produces, and it REPORTS which route it took. The CSV
// export inlines this same logic and throws the answer away, which on care-tracker produced a
// "saved!" message that never named a location and told Android users to check their "Files app".
async function cwDeliverFile(blob, filename, mime) {
  try {
    if (await nativeShareFile(blob, filename, mime, filename)) return { method: 'native', cancelled: false };
  } catch (e) { /* fall through to the web paths rather than losing the file */ }
  try {
    if (navigator.share && navigator.canShare) {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { method: 'share', cancelled: false };
      }
    }
  } catch (e) {
    // ONLY AbortError means the person closed the sheet, and only that must not fall through to a
    // download they just declined. NotAllowedError is different: it means the platform refused the
    // share (no user activation, an unsupported webview), and reporting that as "cancelled" would
    // leave someone believing they declined a backup they actually never got. Fall through and save
    // the file. A duplicate file is a nuisance; a missing backup is the whole failure mode this
    // feature exists to prevent.
    if (e && e.name === 'AbortError') return { method: 'share', cancelled: true };
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return { method: 'download', cancelled: false };
}

// Everything this profile owns. Read straight from storage rather than from state, so a backup is
// a picture of what is SAVED -- not of what a half-finished render happens to be holding.
function cwBkCollect() {
  const prefs = getPrefsDB();
  return {
    profileName: String(prefs.patientName || ''),
    entries: loadJSON(ENTRIES_KEY, []),
    appointments: loadJSON(APPTS_KEY, []),
    notes: loadJSON(NOTES_KEY, []),
    medications: loadJSON(MED_CONFIG_STORAGE_KEY, null),
    prefs: prefs

}
function cwBkBuildPayload(b, atMs) {
  return {

    formatVersion: CW_BK_PLAIN_VERSION,
    app: APP_VERSION,
    createdAt: atMs,
    profileName: b.profileName,

    appointments: Array.isArray(b.appointments) ? b.appointments : [],

async function downloadBackupFile() {
  if (state.bkBusy) return;
  const enc = !!state.bkProtect;
  const pw = String(state.bkPw || '');
  if (enc) {
    if (pw.length < CW_BK_MIN_PASSWORD) {
      setState({ bkNotice: { kind: 'bad', message: 'Choose a password of at least ' + CW_BK_MIN_PASSWORD + ' characters, or switch the password off to save this file unprotected.' } });
      return;
    }
    if (pw !== String(state.bkPw2 || '')) {
      setState({ bkNotice: { kind: 'bad', message: 'The two passwords are not the same. Nothing was saved — type it again in both boxes.' } });
      return;
    }
  }
  const b = cwBkCollect();
  const total = b.entries.length + b.appointments.length + b.notes.length;
  const nMeds = (b.medications && Array.isArray(b.medications.meds)) ? b.medications.meds.length : 0;
  if (!total && !nMeds) { setToast('Nothing to back up yet — log something first'); return; }
  const stamp = new Date(simNow()).toLocaleDateString('en-CA');
  // A protected file is meant to be sent somewhere. Putting the patient's name in the filename
  // would hand back, in the clear, the very thing the encryption was for.
  const name = enc
    ? ('chemowell-backup-protected-' + stamp + '.json')
    : ('chemowell-backup-' + ((b.profileName || 'profile').replace(/[^a-z0-9]/gi, '-').toLowerCase()) + '-' + stamp + '.json');
  const payload = cwBkBuildPayload(b, simNow());
  let text = '';
  if (enc) {
    setState({ bkBusy: true, bkNotice: null });
    try {
      text = JSON.stringify(await cwBkEncryptPayload(payload, pw), null, 2);
    } catch (e) {
      setState({ bkBusy: false, bkNotice: { kind: 'bad', message: "This phone could not encrypt the backup, so nothing was saved. Switch the password off to save an unprotected file, and keep that one off email." } });
      return;
    }
    setState({ bkBusy: false });
  } else {
    text = JSON.stringify(payload, null, 2);
  }
  const res = await cwDeliverFile(new Blob([text], { type: 'application/json' }), name, 'application/json');
  if (res.cancelled) { setToast('Backup cancelled — nothing was saved.'); return; }
  const where = (res.method === 'download')
    ? 'It is in your Downloads folder, named ' + name + '.'
    : 'Pick where to keep it in the sheet that just opened.';
  const tail = enc
    ? ' It is protected with your password — whoever opens it will need that password, and nobody can reset it, so write it down before you send the file.'
    : ' Keep it somewhere you will still have it if this phone is lost — there is no cloud copy and no password to reset.';
  setState({ bkNotice: { kind: 'ok', message: 'Backup saved — ' + total + ' record' + (total === 1 ? '' : 's') +
    (nMeds ? ' and ' + nMeds + ' medication' + (nMeds === 1 ? '' : 's') : '') + '. ' + where + tail } });
  // The password is not kept anywhere once the file exists. Retyping it for the next backup is a
  // smaller cost than leaving it sitting in memory behind a screen the person has walked away from.
  if (enc) setState({ bkPw: '', bkPw2: '' });
  setToast('Backup saved. ' + where);
}

// Validation is deliberately strict about the FORMAT and forgiving about missing SECTIONS: a file
// written by an older build simply has fewer keys, and absent must mean none rather than broken.
function cwBkReadIncoming(parsed) {
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('not-a-backup');
  if (parsed.format !== CW_BK_FORMAT) throw new Error('not-a-backup');
  const fv = Number(parsed.formatVersion);
  if (!isFinite(fv) || fv < 1) throw new Error('not-a-backup');
  // A file from a NEWER build may carry sections this build cannot read. Importing the parts it
  // understands would look like a complete restore and quietly not be one.
  if (fv > CW_BK_FORMAT_VERSION) throw new Error('newer-format');
  const arr = (v) => Array.isArray(v) ? v.filter(r => r && typeof r === 'object' && !Array.isArray(r)) : [];
  return {
    profileName: typeof parsed.profileName === 'string' ? parsed.profileName : '',
    createdAt: Number(parsed.createdAt) || 0,
    entries: arr(parsed.entries),
    appointments: arr(parsed.appointments),
    notes: arr(parsed.notes),
    medications: (parsed.medications && typeof parsed.medications === 'object' && !Array.isArray(parsed.medications)) ? parsed.medications : null,
    prefs: (parsed.prefs && typeof parsed.prefs === 'object' && !Array.isArray(parsed.prefs)) ? parsed.prefs : null
  };
}

// A Map, not a plain object. Record ids come out of a FILE, and a file is free to contain an id of
// "constructor" or "__proto__" -- on a plain object those read back a truthy INHERITED value, so
// the record would be silently treated as already-present and dropped. That exact class of bug has
// already cost this project one blocker.
function cwBkMergeById(existing, incoming) {
  const seen = new Map();
  (existing || []).forEach(r => { if (r && r.id != null) seen.set(String(r.id), true); });
  const out = (existing || []).slice();
  let added = 0;
  (incoming || []).forEach(r => {
    const id = (r && r.id != null) ? String(r.id) : null;
    if (id && seen.has(id)) return;          // already here: leave the local copy alone
    if (id) seen.set(id, true);
    out.push(r); added++;
  });
  return { list: out, added: added };
}

async function downloadEntriesCSV() {
  const rows = buildExportRows();
  if (!rows.length) { setToast('Nothing to export yet — log something first'); return; }
  const header = ['Date', 'Time', 'Type', 'Detail', 'Note'];
  const csv = [header, ...rows].map(r => r.map(csvField).join(',')).join('\r\n');
  const filename = 'chemowell-' + ((CONFIG.patientName || 'export').replace(/[^a-z0-9]/gi, '-').toLowerCase()) + '-' + new Date(simNow()).toLocaleDateString('en-CA') + '.csv';
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }); // BOM so Excel opens UTF-8 correctly
  // v47 (Aaron-reported: "check Downloads" but nothing appeared): tried first, before the web-only
  // paths below. navigator.share/canShare and the <a download> blob trick that follow are exactly
  // what silently failed on his installed APK -- neither one reliably reaches Android's real file
  // system from inside the native WebView. This writes the file via Filesystem and hands it to
  // Android's own share sheet via Share instead, which is the same file-export UX every other
  // Android app uses. No-op (returns false) on the web/PWA build -- falls straight through to the
  // unchanged behavior below there.
  try {
    if (await nativeShareFile(blob, filename, 'text/csv', filename)) {
      setToast(rows.length + ' entries exported — pick where to save it');
      return;
    }
  } catch (e) {
    setToast('Export failed on this device — ' + ((e && e.message) || 'please try again'));
    return;
  }
  try {
    if (navigator.share && navigator.canShare) {
      const file = new File([blob], filename, { type: 'text/csv' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        setToast(rows.length + ' entries exported — pick where to save it');
        return;
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user closed the share sheet without picking anything -- not a failure
    // Any other share failure (e.g. a flaky platform implementation) falls through to the classic
    // download link below rather than leaving the export stuck.
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    // Design review fix (v37): the fuller "exported to CSV — check your Downloads folder" wording
    // wrapped to 4 lines in the toast's 340px cap on mobile, visually overlapping the section below
    // it -- shortened (still wraps to a few lines on narrow phones, just no longer overlapping
    // content below it) rather than resizing the shared toast component used everywhere else.
    setToast(rows.length + ' entries exported — check Downloads');
  } catch (e) { setToast('Export failed on this device — try the printable report instead'); }
}

    + '</body></html>';

  // very likely failing silently on the installed APK the same way CSV export was, just not yet
  // reported. On native, share the generated report as a file instead -- Aaron picks where it goes
  // (Drive, email, a printer app, etc.) from Android's own share sheet, the same fix as CSV export.
  const filename = 'chemowell-report-' + ((CONFIG.patientName || 'report').replace(/[^a-z0-9]/gi, '-').toLowerCase()) + '-' + new Date(simNow()).toLocaleDateString('en-CA') + '.html';
  try {

  } catch (e) {

}

// ------------------------------------------------------------------------------------------------
// REPORT A PROBLEM (app-v64) — the log, and the person's side of it.
// Three things on one screen, in the order a person needs them: say what happened, see that the app
// already noticed something, and take the whole lot away as a file. There is no "send" button that
// silently posts anywhere, because there is nowhere to post to and a button that pretends otherwise
// is worse than none.
// ------------------------------------------------------------------------------------------------
const CW_REPORT_KINDS = [
  { key: 'problem', label: "Something's wrong", hint: 'What were you doing, and what happened instead?' },
  { key: 'idea', label: 'An idea', hint: 'What would make this easier to use?' }
];
function cwReportKind() { return state.reportKind === 'idea' ? 'idea' : 'problem'; }
function cwSubmitReport() {
  const text = String(state.reportDraft || '').trim();
  if (!text) { setToast('Type what happened first'); return; }
  const entry = cwLogAdd(cwReportKind(), text, 'screen: ' + (state.reportFrom || 'report'));
  if (!entry) {
    setState({ reportNotice: { kind: 'bad', message: 'There is no room left on this phone to save it, so nothing was written down. Free up some space and try again.' } });
    return;
  }
  setState({ reportDraft: '', reportNotice: { kind: 'ok', message: 'Saved to this phone. It stays here until you send the file — nothing was uploaded anywhere.' } });
  setToast('Written down');
}
function cwLogEntryLabel(kind) {
  if (kind === 'error') return 'The app noticed';
  if (kind === 'idea') return 'Your idea';
  return 'You reported';
}
// One plain-text file. Plain text rather than JSON on purpose: the person sending it, and whoever
// reads it, should both be able to see what is in it before it goes anywhere.
function cwBuildReportFile() {
  const list = cwLogRead().slice().reverse();
  const lines = [];
  lines.push('ChemoWell report');
  lines.push('App version: ' + APP_VERSION);
  lines.push('Made: ' + new Date(simNow()).toLocaleString());
  lines.push('Device: ' + (navigator.userAgent || 'unknown'));
  lines.push('Screen: ' + (window.innerWidth || 0) + 'x' + (window.innerHeight || 0));
  lines.push('Entries: ' + list.length);
  lines.push('');
  lines.push('This file holds what you typed and the errors the app recorded. It does NOT');
  lines.push('include your medications, entries, appointments or notes.');
  lines.push('------------------------------------------------------------');
  if (!list.length) lines.push('(nothing recorded)');
  list.forEach((e, i) => {
    lines.push('');
    lines.push('#' + (i + 1) + '  ' + cwLogEntryLabel(e.kind).toUpperCase() +
      '  ' + new Date(Number(e.ts) || 0).toLocaleString() +
      ((Number(e.count) || 1) > 1 ? ('  (x' + e.count + ')') : '') +
      (e.app ? ('  [' + e.app + ']') : ''));
    if (e.where) lines.push('   where: ' + e.where);
    String(e.text || '').split('\n').forEach((ln) => lines.push('   ' + ln));
  });
  lines.push('');
  return lines.join('\n');
}
async function cwSaveReportFile() {
  if (state.reportBusy) return;
  const list = cwLogRead();
  if (!list.length) { setToast('Nothing to send yet'); return; }
  setState({ reportBusy: true });
  try {
    const name = 'chemowell-report-' + new Date(simNow()).toLocaleDateString('en-CA') + '.txt';
    const res = await cwDeliverFile(new Blob([cwBuildReportFile()], { type: 'text/plain;charset=utf-8' }), name, 'text/plain');
    if (res.cancelled) { setState({ reportNotice: { kind: 'bad', message: 'Cancelled — nothing was sent.' } }); return; }
    setState({ reportNotice: { kind: 'ok', message: (res.method === 'download')
      ? ('The report is in your Downloads folder, named ' + name + '. Attach it to an email or a message to send it.')
      : 'Pick where to send it in the sheet that just opened.' } });
  } finally {
    setState({ reportBusy: false });
  }
}

function reportDescriptor(type, now) {
  if (type === 'blood_pressure') { const bp = state.entries.filter(e => e.medId === 'blood_pressure').sort((a, b) => b.ts - a.ts)[0]; return { label: 'Blood Pressure', icon: 'chart', description: 'Review blood pressure readings over time.', meta: bp ? (bp.sys + '/' + bp.dia + ' mmHg latest') : 'No readings yet' }; }
  if (type === 'history') return { label: 'History', icon: 'history', description: 'Review dose, symptom, and vital logs by day.', meta: state.entries.length + ' recorded ' + (state.entries.length === 1 ? 'entry' : 'entries') };
  if (type === 'weight') { const latestWeight = latest('weight'); return { label: 'Weight', icon: 'chart', description: 'Explore weight readings, trends, and recent changes.', meta: latestWeight ? (dispWeight(latestWeight) + ' ' + weightSuffix() + ' latest') : 'No readings yet' }; }
  if (type === 'cycle') {
    const active = cycleActive();
    const day = daysSinceCycleStart();
    return { label: 'Cycle', icon: 'cycle', description: 'Track period status and cycle history.', meta: active ? ('Active · day ' + day) : 'No active cycle' };
  }
  if (type === 'radiation') {
    const sessions = radiationSessionsSorted();
    const planned = radiationPlannedTotal();
    return { label: 'Radiation', icon: 'chart', description: 'Review radiation sessions completed over the course of treatment.', meta: sessions.length ? ('Session ' + sessions.length + (planned ? ' of ' + planned : '') + ' completed') : 'No sessions logged yet' };
  }
  if (type === 'bowel_movement') {
    const bEntries = bowelMovementHistorySorted();
    const bLatest = bEntries[0];
    return { label: 'Bowel Movement', icon: 'notes', description: 'Review bowel movement history logged from Home.', meta: bLatest ? ((BOWEL_MOVEMENT_LABELS[bLatest.value] || bLatest.value) + ' most recent') : 'No entries yet' };
  }
  if (type === 'paracentesis') {
    const pList = paracentesisResolved();
    const pLast = pList[0];
    return { label: 'Paracentesis', icon: 'chart', description: 'Fluid drainage procedures and how much was taken.',
             meta: pLast ? (paraFmtLiters(paraTotalLiters(pList)) + ' L over ' + pList.length + (pList.length === 1 ? ' procedure' : ' procedures')) : 'No procedures logged yet' };
  }
  // This function used to END on the Appetite object with no `if`, exactly like renderReportDetail
  // did -- so a type registered in reportTypes but missed here rendered a SECOND card reading
  // "Appetite". That is precisely what the first build of app-v59 shipped into the test run: the
  // dispatch was fixed and the descriptor was not, and the Reports menu listed Appetite twice with
  // no Paracentesis anywhere. Appetite is now explicit and an unknown type is a reported error.
  if (type === 'appetite') {

    return { label: 'Appetite', icon: 'notes', description: 'Review appetite history logged from Home.', meta: yEntry ? ((APPETITE_LABELS[yEntry.value] || yEntry.value) + ' today') : 'Not yet logged for today' };
  }
  console.warn('[reports] unknown report type:', type);
  return { label: 'Report', icon: 'notes', description: 'This report is not available.', meta: '' };
}

function renderHistory(now) {
  const d0 = dayStart(now);
  const yStart = d0 - 86400000;
  const dmap = {};
  state.entries.forEach(e => { if (e.medId === 'inpatient' || e.medId === 'inpatient_start' || e.medId === 'inpatient_end' || e.medId === 'cycle_start' || e.medId === 'cycle_end') return; const k = dayStart(e.ts); (dmap[k] = dmap[k] || []).push(e); });
  // v52 (audit H-1). dmap is built purely from logged entries, so a day with NOTHING logged -- or a
  // day whose only entries are the period/in-patient markers filtered out above -- never became a key
  // here and therefore could never render a missed-dose row. Meanwhile the Home banner
  // (pastMissedCount) walks every calendar day since MISSED_TRACK_SINCE. The two disagreed, and the
  // disagreement was unresolvable from the UI: Home said "2 missed doses from previous days", Review
  // said "you're all caught up", Clear all never rendered (it is gated on totalMissed > 0), and a
  // reload changed nothing. Worse, the day a caregiver logs nothing is exactly the day most likely to
  // contain a real missed dose -- the one day History could not show. An un-dismissable red alert
  // also trains people to ignore red alerts, which matters more than this one screen.
  // Fix: enumerate the same range pastMissedCount does and seed any day that has misses, so every
  // counted miss is listed and resolvable. Only days WITH misses are seeded -- empty days are not
  // added, so History gains no blank filler rows.
  // v52 (Auditor V52-5): `d <= d0`, not `d < d0`. Stopping before today left today's own misses
  // out of History, so "Review 1 missed dose from today" led to "you're all caught up" -- the same
  // contradiction H-1 fixed for past days, just one day narrower. Seeding only adds a day that has
  // misses AND no entries, so a normal today is unaffected.
  for (let d = dayStart(MISSED_TRACK_SINCE); d <= d0; d = nextDay(d)) {
    if (!dmap[d] && missedDosesFor(d, now).length) dmap[d] = [];
  }

  const allHistoryDays = Object.keys(dmap).map(k => +k).sort((a, b) => b - a).map(k => {
    const missed = missedDosesFor(k, now);
    const items = [...dmap[k], ...missed].sort((a, b) => a.ts - b.ts);
    const tyDay = items.filter(e => e.medId === 'tylenol' && !e.missed).reduce((s, e) => s + (e.mg || 0), 0);
    const doses = items.filter(e => e.medId !== 'temp' && e.medId !== 'weight' && e.medId !== 'cycle_start' && e.medId !== 'cycle_end' && !e.missed && !e.skipped).length;
    const temps = items.filter(e => e.medId === 'temp').length;
    const weights = items.filter(e => e.medId === 'weight').length;
    const wkday = new Date(k).toLocaleDateString([], { weekday: 'long' });
    const md = (new Date(k).getMonth() + 1) + '/' + new Date(k).getDate();
    const label = k === d0 ? ('Today - ' + wkday + ' ' + md) : (wkday + ', ' + md);
    // v52 (Designer D-4): on a day seeded purely because it has missed doses, `doses` is 0 and
    // "0 doses · 2 MISSED" put a zero directly beside a red count -- which reads for a half second as
    // "0 missed". Nobody says "I had zero doses yesterday"; they say nothing was logged.
    const nothingElseLogged = !doses && !temps && !weights && !tyDay;
    let summary = nothingElseLogged ? 'Nothing logged' : (doses + ' dose' + (doses === 1 ? '' : 's'));
    if (temps) summary += ' · ' + temps + ' temp' + (temps === 1 ? '' : 's');
    if (weights) summary += ' · ' + weights + ' wt';
    if (tyDay) summary += ' · ' + tyDay.toLocaleString() + ' mg APAP';
    const imoDay = items.filter(e => e.medId === 'imodium' && !e.missed).reduce((s, e) => s + (e.pills || 0), 0);
    if (imoDay) summary += ' · ' + imoDay + ' Imodium';
    if (missed.length) summary += ' · ' + missed.length + ' MISSED';
    return { key: k, label, summary, items, missedCount: missed.length };
  });

  // v70: "Missed Doses" / "Show all" toggle, driven by clicking a missed-dose banner elsewhere
  // (Today's banner or the pinned previous-days header card both set historyMissedOnly via
  // goToHistoryTop()) or by tapping the toggle directly here. Filtered mode keeps each day's
  // original summary line (for context -- "3 doses · 1 MISSED") but only lists the missed rows
  // underneath, and drops any day with zero misses entirely.
  const totalMissed = allHistoryDays.reduce((s, d) => s + d.missedCount, 0);
  const missedOnly = !!state.historyMissedOnly;
  const historyDays = missedOnly
    ? allHistoryDays.map(d => ({ ...d, items: d.items.filter(e => e.missed) })).filter(d => d.items.length > 0)
    : allHistoryDays;

  const toggleBar = h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', flexWrap: 'wrap' } },
    h('div', { style: { display: 'inline-flex', background: 'rgba(246,108,49,0.10)', borderRadius: '11px', padding: '3px', gap: '2px' } },
      h('button', { onClick: () => setState({ historyMissedOnly: true }), 'aria-pressed': String(missedOnly), style: { minHeight: '44px', padding: '0 13px', borderRadius: '9px', background: missedOnly ? '#C0453B' : 'transparent', color: missedOnly ? '#fff' : '#7A6E76', fontSize: '12.5px', fontWeight: '800' } }, 'Missed Doses' + (totalMissed ? ' (' + totalMissed + ')' : '')),
      h('button', { onClick: () => setState({ historyMissedOnly: false }), 'aria-pressed': String(!missedOnly), style: { minHeight: '44px', padding: '0 13px', borderRadius: '9px', background: !missedOnly ? '#BF4C1A' : 'transparent', color: !missedOnly ? '#fff' : '#7A6E76', fontSize: '12.5px', fontWeight: '800' } }, 'Show all')
    ),
    missedOnly && totalMissed ? h('button', { onClick: () => clearAllMissedInHistory(now), style: { minHeight: '44px', padding: '0 14px', borderRadius: '9px', background: 'rgba(192,69,59,0.14)', border: '1px solid rgba(192,69,59,0.4)', color: '#A13830', fontSize: '12.5px', fontWeight: '800' } }, 'Clear all') : null
  );

  if (historyDays.length === 0) {
    const emptyMsg = missedOnly ? 'No missed doses to review — you\'re all caught up!' : 'No history yet.';

    h('button', { onClick: () => openSymptomModal(null), 'aria-label': 'Log a symptom', style: { flexShrink: '0', minHeight: '44px', width: '44px', borderRadius: '13px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '22px', fontWeight: '700', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 6px 18px rgba(168,61,15,0.32)' } }, '+')
  );
  const list = entries.length ? h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
    ...entries.map(e => symptomRow(e))
  ) : h('div', { style: { background: 'rgba(255,255,255,0.4)', border: '1px dashed rgba(246,108,49,0.2)', borderRadius: '16px', padding: '30px', textAlign: 'center', color: '#7A6E76', fontSize: '14px', lineHeight: '1.5' } }, 'No symptoms or reactions logged yet.\nTap + to add one.');
  return [header, list];
}

    'Averaging ' + paraFmtLiters(avg) + ' L per procedure. These are recorded separately from weight — the Weight report still shows what the scale actually said, with a marker on each drain date.');

      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div', { style: { ...TYPE.bodyBold, fontSize: '14.5px', color: '#2A2127' } }, paraFmtLiters(p.liters) + ' L drained'),
        h('div', { style: { ...TYPE.caption, color: '#7A6E76', marginTop: '2px' } }, new Date(p.ts).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }) + ' · ' + fmtTime(p.ts))
      ),
      state.confirmRemovePara === p.paraId
        ? h('div', { style: { display: 'flex', gap: '6px', alignItems: 'center', flexShrink: '0' } },
            h('button', { onClick: () => removeParacentesis(p.paraId), style: { color: '#fff', background: '#B3261E', fontSize: '12.5px', fontWeight: '700', padding: '9px 12px', borderRadius: '10px' } }, 'Delete'),
            h('button', { onClick: () => setState({ confirmRemovePara: null }), style: { color: '#7A6E76', fontSize: '12.5px', padding: '9px 6px', fontWeight: '600' } }, 'Keep')
          )
        : h('button', { onClick: () => setState({ confirmRemovePara: p.paraId }), style: { flexShrink: '0', color: '#A83D0F', fontSize: '12.5px', fontWeight: '700', padding: '9px 10px', borderRadius: '10px', background: 'rgba(200,83,32,0.10)' } }, 'Remove')
    ))
