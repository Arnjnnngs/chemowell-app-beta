  { id: "rem-none-scheduled", cat: "reminders", q: "It says 'No reminders are currently due in the next 3 days'", a: "That means the app is working fine — there is genuinely nothing to remind you about in that window.", steps: ["This is normal if all your medications are *As needed*. Those never send reminders; they only track the hours between doses.", "It is also normal if your medications are set to specific days of the week, and none of those days fall in the next three days.", "It is also what you'll see if every medication is paused.", "If you expected a reminder, open the **Meds** tab, tap the medication, and check it is set to **Scheduled** with at least one time listed under *Schedule windows*."], keywords: ["no reminders", "none due", "empty", "zero"], related: ["rem-no-reminder-for-med"] },
  { id: "rem-paused-sim", cat: "reminders", q: "It says reminders are paused because of the beta date controls", a: "There is a testing box on Home that lets you pretend it is a different day. While that is on, reminders are switched off so your phone doesn't get alerts at the wrong real-world time.", steps: ["Go to **Home** and look near the top for a box labelled **Beta date controls**.", "Tap it to open it.", "Tap **Reset**.", "The date at the top of the screen goes back to today, and reminders start working again."], keywords: ["beta", "date controls", "simulated", "paused", "test date"], related: ["set-beta-date-controls"] },
  { id: "rem-blocked", cat: "reminders", q: "It says notifications are blocked for ChemoWell", a: "Your phone is refusing notifications for this app. It has to be turned back on in your phone's own settings.", steps: ["Menu → **Settings** → **Notifications** → tap **Try again**.", "If nothing happens, your phone has stopped asking. Open your phone's own Settings, tap Apps, find ChemoWell, tap Notifications, and turn them on there.", "Come back to ChemoWell and open Settings again. It should now say **✓ Notifications are on**."], keywords: ["blocked", "denied", "refused", "permission"], related: ["rem-none"] },
  { id: "rem-failed", cat: "reminders", q: "It says reminders couldn't be set on this device", a: "Something went wrong while arming the reminders. Your existing reminders are untouched — this only stops new ones being set.", steps: ["Menu → **Settings** → **Notifications** → tap **Try again**.", "If it fails again, close ChemoWell completely and open it again, then try once more.", "If it keeps failing, restart the phone and try again."], keywords: ["failed", "error", "couldn't set", "try again"], related: ["rem-none"] },
  { id: "rem-no-reminder-for-med", cat: "reminders", q: "One particular medication never reminds me", a: "Reminders only go out for medications set to **Scheduled** with real times on them. Several settings can also switch them off for that one medication.", steps: ["Open the **Meds** tab and tap that medication to open it.", "Check **Schedule type**. If it says *As needed*, it will never remind you — that mode only counts hours between doses. Change it to *Scheduled* if you want reminders.", "Check **Schedule windows**. There must be at least one time listed. Each row is one reminder.", "Check **Days taken**. If it's set to particular days of the week, or every few days, it only reminds on those days. If it's set to *As needed — don't flag missed doses*, it never reminds.", "Check whether the medication is **Paused**. A paused medication is not tracked and sends nothing. Open it and tap **Resume** if that's wrong.", "Check **Treatment-day availability**. If it's set to only appear near your treatment day, or to be excluded around it, that also controls when it reminds you."], keywords: ["one medication", "specific", "not reminding", "no alert"], related: ["med-asneeded-vs-scheduled", "med-days-taken", "med-pause-resume", "med-treatment-availability"] },
  { id: "rem-appointment", cat: "reminders", q: "My appointment reminder never came", a: "Appointment reminders use the same phone settings as dose reminders, plus one setting on the appointment itself.", steps: ["Menu → **Calendar**. Find the appointment and open it.", "Check the reminder setting. If it says **No reminder**, that's why. Change it to *At the scheduled time*, *1 hour before*, *The morning of (9 AM)*, *1 day before*, or a custom lead time.", "Save the appointment.", "If it's set correctly and still didn't arrive, work through *\"I'm not getting any reminders at all\"* — it's the same phone permissions."], keywords: ["appointment", "calendar", "doctor visit", "reminder"], related: ["rem-none", "appt-reminder-choose"] },
  { id: "rem-checkin-time", cat: "reminders", q: "I want the daily check-in reminder at a different time", a: "There's one shared reminder time for the daily check-in, and it can only be set between 8 AM and 10 PM.", steps: ["Menu → **Settings** → **Home screen**.", "Make sure at least one of *Weight in daily check-in*, *Bowel movement in daily check-in*, or *Appetite in daily check-in* is switched on. The time field only appears once one of them is.", "Underneath, tap **Daily check-in reminder time** and pick a time.", "It asks once a day, about that day — it will not keep nagging you about yesterday."], note: "The check-in reminder is deliberately limited to daytime hours. Dose reminders are not — those fire at any hour.", keywords: ["check-in", "daily", "time", "overnight", "8am", "10pm"], related: ["vit-checkin-modal"] },
  { id: "rem-silent", cat: "reminders", q: "The reminder appeared but made no sound", a: "Sound and vibration for notifications are controlled by your phone, not by ChemoWell.", steps: ["Check the phone isn't on silent, vibrate-only, Do Not Disturb, or a bedtime/sleep mode.", "Open your phone's own Settings, tap Apps, find ChemoWell, then Notifications.", "ChemoWell uses separate notification categories for dose reminders, appointment reminders, and the daily check-in. Open each one and check its sound and importance settings."], keywords: ["silent", "no sound", "vibrate", "quiet", "mute"], related: ["rem-none"] },
  { id: "rem-tap-notification", cat: "reminders", q: "I tapped the reminder and I'm not sure what it did", a: "Tapping a reminder brings ChemoWell to the front. It does not log the dose for you.", steps: ["After tapping the reminder, you land in the app.", "Go to **Home** and find the medication's card.", "Tap the dose button on that card to actually record it.", "Nothing is recorded until you tap that button — a reminder is only a nudge."], keywords: ["tap", "open", "notification", "does it log"], related: ["log-basic"] },
  { id: "med-add-first", cat: "meds", q: "How do I add a medication?", a: "Meds tab, then Add. The only thing you truly have to fill in is the name and how it's taken.", steps: ["Tap **Meds** at the bottom of the screen.", "Tap **Add**.", "Type the **Medication name**. This is what you'll see everywhere in the app, so use whatever you call it day to day.", "Choose **Schedule type**: *As needed* if it's taken whenever it's needed with a wait in between (like a painkiller every 4 hours), or *Scheduled* if it's taken at set times.", "Fill in the rest as far as you want — you can come back and change any of it later.", "Tap **Add medication** at the bottom."], note: "Enter exactly what the care team prescribed. ChemoWell only ever repeats back what you typed in — it never checks or suggests a dose.", keywords: ["add", "new", "create", "first medication"], related: ["med-asneeded-vs-scheduled", "med-dose-options", "med-save-blocked"], medical: true },
  { id: "med-asneeded-vs-scheduled", cat: "meds", q: "What's the difference between 'As needed' and 'Scheduled'?", a: "*As needed* counts hours since the last dose. *Scheduled* uses set times of day and can remind you.", steps: ["Pick **As needed** for something taken only when it's needed. You then set **Hours between doses**, and the card on Home locks until that many hours have passed.", "Pick **Scheduled** for something taken at set times. You then add one or more times under **Schedule windows**, and each one can send a reminder.", "A scheduled medication can also have a minimum gap on top of its times, if doses shouldn't land too close together.", "Only *Scheduled* medications can be flagged as missed. *As needed* ones never are — there's no set time for them to be late for."], keywords: ["as needed", "prn", "scheduled", "difference", "which one"], related: ["med-gap-hours", "med-windows"] },
  { id: "med-dose-options", cat: "meds", q: "What goes in 'Dosage options', and why are there commas?", a: "These become the buttons you tap to log a dose. A comma separates different strengths of the same medication.", steps: ["Type the amount the way you'd say it: `500 mg`.", "If the same medication comes in more than one strength, separate them with a comma: `500 mg, 1000 mg`. You get one button for each.", "Those strengths share one schedule and one daily limit — they're the same medication, just different amounts.", "It doesn't have to be milligrams. `1 patch, 2 patches`, `2 sprays`, `1 capsule` all work.", "You can leave this blank. You'll still get a plain Log button, just without a specific amount recorded."], keywords: ["dosage", "comma", "strengths", "mg", "buttons", "amount"], related: ["med-daily-limit-locked", "med-limit-unit"] },
  { id: "med-daily-limit-locked", cat: "meds", q: "The Daily limit box is greyed out and says 'Locked'", a: "Daily limit stays locked until Dosage options above it contains an amount in the same unit you picked for Limit unit. This is the single most-reported sticking point in this screen.", steps: ["Look at **Limit unit**, just above Dosage options. It's one of: *Total milligrams (mg)*, *Number of pills / doses*, or *Number of applications*.", "If Limit unit is **Total milligrams (mg)**, Dosage options must contain a number followed by the letters `mg` — for example `500 mg`. A bare `500` will not unlock it.", "If Limit unit is **Number of pills / doses** or **Number of applications**, any entry that starts with a number counts — `2 tabs`, `1 patch`, `2 sprays` all work.", "Fix Dosage options, and the Daily limit box unlocks straight away. You don't need to save first.", "The amber warning underneath Dosage options disappears at the same moment."], branches: [{ when: "I don't want a daily limit at all", steps: ["Leave Daily limit blank. The medication saves fine without one.", "The amber warning line is just explaining why the box is locked. It is not blocking the save."] }], note: "A daily limit only blocks logging once the number is reached. You can always log past it by tapping the button that appears and confirming — ChemoWell never refuses to record something that really happened.", keywords: ["locked", "greyed", "disabled", "daily limit", "warning", "banner", "can't type"], related: ["med-limit-unit", "med-dose-options", "log-anyway-override"], medical: true, safety: true },
  { id: "med-limit-unit", cat: "meds", q: "Which Limit unit should I pick?", a: "Pick the thing you'd actually count at the end of the day.", steps: ["Choose **Total milligrams (mg)** when the care team gave you a maximum in milligrams — for example \"no more than 3000 mg of paracetamol in 24 hours\".", "Choose **Number of pills / doses** when the limit is a number of tablets or capsules.", "Choose **Number of applications** for creams, patches, sprays, and drops.", "Whichever you choose, Dosage options above has to carry an amount in that same unit — see *\"The Daily limit box is greyed out\"*."], note: "The list is currently only those three. More units (mcg, mL, puffs, drops, and others) are planned.", keywords: ["limit unit", "mg", "pills", "applications", "which"], related: ["med-daily-limit-locked"] },
  { id: "med-gap-hours", cat: "meds", q: "What is 'Hours between doses' / minimum gap?", a: "It's the shortest time the app will wait before letting you log that medication again.", steps: ["For an **As needed** medication, this is required. Without it the card would never lock after a dose. Type the number of hours, like `4`.", "For a **Scheduled** medication it's optional, and it sits on top of the set times — it stops a dose being logged again too soon after the last one.", "While the gap is running, the card on Home shows *Waiting* and tells you when the next dose opens.", "You can still log early if there's a real reason — tap the button and confirm. It's recorded as an early dose."], keywords: ["gap", "hours between doses", "minimum", "waiting", "too soon"], related: ["log-button-locked", "log-anyway-override"] },
  { id: "med-save-blocked", cat: "meds", q: "It won't let me save the medication", a: "A message appears at the bottom of the screen saying exactly what's missing. Here's what each one means.", steps: ["*\"Enter a medication name before saving.\"* — the name field is empty.", "*\"Enter a minimum gap in hours…\"* — an *As needed* medication needs **Hours between doses** filled in, otherwise its card would never lock after a dose.", "*\"Add at least one schedule time…\"* — a *Scheduled* medication needs at least one row under Schedule windows. Tap **+ Add another time window**.", "*\"Pick at least one day of the week, or switch Days taken to Every day.\"* — Days taken is set to specific weekdays but none are selected.", "*\"Every-few-days schedules need a gap of at least 2 days.\"* — the *Every few days* option needs a number of 2 or more.", "Fix whichever one it named, then tap the save button again."], note: "A locked Daily limit box does **not** block saving. That one is explained in *\"The Daily limit box is greyed out\"*.", keywords: ["won't save", "error", "blocked", "toast", "message", "red"], related: ["med-daily-limit-locked"] },
  { id: "med-days-taken", cat: "meds", q: "This medication isn't taken every day", a: "The **Days taken** setting handles that.", steps: ["Open the **Meds** tab, tap the medication.", "Find **Days taken** and choose one:", "*Every day* — the normal case.", "*Specific days of the week* — then tap the day buttons for the days it's taken.", "*Every few days* — for every-other-day or similar. Set the number (2 or more) and the day it starts from.", "*As needed — don't flag missed doses* — available any day, and never flagged as missed.", "On a day it isn't scheduled, its card on Home says **Not scheduled today** with a button to log it anyway if you need to."], keywords: ["days", "weekly", "every other day", "not daily", "schedule days"], related: [] },
  { id: "med-windows", cat: "meds", q: "What does 'Reminds at' mean under Schedule windows?", a: "Each row is one reminder — a single time of day, not a stretch of time.", steps: ["Open the medication and look under **Schedule windows**.", "Each row shows one time, and you can give it a name like *Morning* or *With breakfast*.", "That time is when the reminder goes out.", "To add another daily dose, tap **+ Add another time window**.", "To remove one, tap the remove button on that row."], note: "How these times relate to missed doses is explained in *\"When does a dose count as missed?\"*.", keywords: ["reminds at", "windows", "times", "twice a day", "morning", "evening"], related: ["miss-what-counts"] },
  { id: "med-placement", cat: "meds", q: "Where does this medication show up on Home?", a: "The **Home screen placement** setting decides that.", steps: ["Open the medication and find **Home screen placement**.", "*Own Home card* — it gets its own card in the **Quick log** section.", "*Morning group* / *Afternoon group* / *Evening group* — it joins a shared card with the others in that group, which also has a **Take all** button.", "*No Home card* — it's tracked and kept in the Meds list, but doesn't appear on Home at all. Use this for something you want on record but don't log daily.", "Save, then go to Home to see it in its new place."], keywords: ["home", "placement", "card", "group", "morning", "evening", "hidden"], related: ["med-not-on-home", "log-group-take-all"] },
  { id: "med-treatment-availability", cat: "meds", q: "What is 'Treatment-day availability'?", a: "It lets a medication appear only around your treatment day, or be blocked around it.", steps: ["Open the medication and find **Treatment-day availability**.", "*Always available* — no restriction. This is the normal setting.", "*Only near treatment day* — it only appears on Home for a window of days around your treatment date, and is hidden the rest of the time.", "*Excluded near treatment day* — the opposite: it's greyed out and can't be logged for a window of days around your treatment date.", "For either of the last two, set **Days before** and **Days after** to define the window. The line underneath shows the window in plain words as you type.", "This only does anything once a treatment date is set on Home. Until then, the medication just shows every day with an amber **No date set** label."], note: "If your profile's treatment type is *Other*, this whole section isn't shown — an \"Other\" profile has no treatment day in the sense this feature means.", keywords: ["treatment day", "only near", "excluded", "window", "days before", "days after"], related: ["treat-set-date", "med-not-on-home"] },
  { id: "med-pause-resume", cat: "meds", q: "I want to stop a medication for a while without deleting it", a: "Pause it. Everything is kept, and it stops being tracked or reminding you until you resume.", steps: ["Open the **Meds** tab and tap the medication.", "Tap **Pause** at the bottom.", "On Home its card stays visible, marked **Paused**, with a **Resume** button.", "While it's paused it sends no reminders and is never flagged as missed.", "When it's time to start again, tap **Resume** — on the Home card or in the editor."], note: "The days it was paused are remembered, so old missed-dose counts don't change retroactively.", keywords: ["pause", "stop", "hold", "temporarily", "resume", "restart"], related: ["miss-false-missed"] },
  { id: "med-edit-delete", cat: "meds", q: "How do I change or delete a medication?", a: "Meds tab, tap the medication to edit it. Deleting is a two-tap confirm.", steps: ["Tap **Meds** at the bottom.", "Tap the medication you want to change.", "Change whatever you need, then tap **Save changes**.", "To delete it instead, use the delete option and confirm when it asks. It will tell you this can't be undone.", "Deleting a medication does not delete the doses you already logged — those stay in your history and in your exports."], keywords: ["edit", "change", "delete", "remove", "medication"], related: ["med-pause-resume"] },
  { id: "med-not-on-home", cat: "meds", q: "I added a medication but I can't find it on Home", a: "Work through these in order — one of them is almost always it.", steps: ["Is the **Quick log** heading collapsed? Look for a small arrow next to it. If it shows a number in brackets, tap it to open it back up.", "Is it in a group? Scroll further down Home for **Morning meds**, **Afternoon meds**, or **Evening meds**.", "Open the **Meds** tab and tap the medication. Check **Home screen placement** — if it's *No Home card*, that's why.", "Check whether it's **Paused**.", "Check **Days taken** — if today isn't one of its days, it shows as *Not scheduled today* rather than a normal card.", "Check **Treatment-day availability** — if it's *Only near treatment day* and today is outside that window, it's hidden on purpose.", "Are you looking at the right person? Tap the three lines in the top left — the name is shown at the top of the menu."], keywords: ["missing", "disappeared", "can't find", "not showing", "gone", "home"], related: ["med-placement", "treat-set-date", "pro-switch"] },
  { id: "med-generic-name", cat: "meds", q: "What's the Generic name field for?", a: "It's optional. It's there so a brand name and its generic name both make sense later.", steps: ["Put the name you use day to day in **Medication name** — that's what appears everywhere in the app.", "Put the other name in **Generic name** if it helps, for example the brand name when you've used the generic as the main name.", "It's purely for your own reference and for anyone reading your exported records."], keywords: ["generic", "brand", "other name", "alternative"], related: ["med-add-first"] },
  { id: "med-notes-field", cat: "meds", q: "Where do I put instructions like 'take with food'?", a: "The **Notes** field at the bottom of the medication editor. It shows on the medication's card on Home.", steps: ["Open the **Meds** tab and tap the medication.", "Scroll to **Notes** at the bottom.", "Type anything useful — *Take with food*, *From Dr. Kim*, *Crush if needed*.", "Save. It appears under the medication's name on Home so it's in front of you when you log."], keywords: ["notes", "instructions", "with food", "reminder text"], related: ["note-add"] },
  { id: "med-reorder", cat: "meds", q: "I want my medications in a different order on Home", a: "The Meds tab has up and down arrows for that.", steps: ["Tap **Meds** at the bottom.", "Find the section about Home screen order.", "Use the small ▲ and ▼ arrows next to each medication to move it.", "Go to Home to see the new order."], note: "Those arrow buttons are small. If you keep missing them, try tapping slightly lower and to the centre of the button.", keywords: ["order", "reorder", "sort", "move", "arrange"], related: ["med-placement"] },
  { id: "med-many-strengths", cat: "meds", q: "The same medication comes in two strengths", a: "That's one medication with two dose buttons, not two medications.", steps: ["Add it once.", "In **Dosage options**, list both with a comma: `500 mg, 1000 mg`.", "On Home you get a button for each strength.", "They share one schedule, one gap timer, and one daily limit — because they're the same medication."], keywords: ["two strengths", "half tablet", "different doses", "same medication"], related: ["med-dose-options"] },
  { id: "log-basic", cat: "logging", q: "How do I record that a dose was taken?", a: "Tap the dose button on that medication's card on Home.", steps: ["Go to **Home**.", "Find the medication under **Quick log**, or inside its Morning/Afternoon/Evening card.", "Tap the button showing the amount that was taken.", "If it asks you to confirm, tap Confirm.", "It appears immediately in **Today's journal** further down the Home screen."], keywords: ["log", "record", "taken", "dose", "tap"], related: ["log-wrong-time", "log-remove"] },
  { id: "log-button-locked", cat: "logging", q: "The Log button is greyed out or won't do anything", a: "The card tells you which rule is holding it, in the words on the card itself.", steps: ["**Waiting** — the minimum gap since the last dose hasn't passed. The card says when it opens.", "**Limit** — today's daily limit has been reached. It resets after midnight.", "**Not scheduled today** — today isn't one of this medication's days.", "**Outside its treatment-day window** — the medication is set to only appear near your treatment day, and today isn't in that window.", "**Paused** — tap **Resume**.", "In every one of these cases except Paused, there's a button to log it anyway. See *\"How do I log something the app is blocking?\"*."], keywords: ["greyed", "disabled", "locked", "won't log", "blocked", "waiting", "limit"], related: ["log-anyway-override", "ip-meds-restricted"], safety: true },
  { id: "log-anyway-override", cat: "logging", q: "How do I log something the app is blocking?", a: "Every lock in ChemoWell can be overridden. It records what happened rather than pretending it didn't.", steps: ["On the blocked card, tap the button that appears — the wording depends on the reason, for example *Daily limit of 3,000 mg reached. Log more anyway?*", "Read what it says. It names the rule you're about to go past.", "Tap the dose amount and confirm.", "The dose is recorded with a small label — **Early**, **Over limit**, or both — so it's clear later that it was outside the usual rule.", "That label shows up in History and in the records you export."], note: "ChemoWell's limits are only what you typed in when you set up the medication. They are not medical guidance. If you're unsure whether a dose is safe, that's a question for the care team or the pharmacist, not for the app.", keywords: ["override", "anyway", "force", "ignore", "past limit", "early"], related: ["med-daily-limit-locked", "med-gap-hours"], medical: true, safety: true },
  { id: "log-double-tap", cat: "logging", q: "I think I logged the same dose twice", a: "Check Today's journal — the app is built to ignore a double-tap, so there's often nothing wrong.", steps: ["Scroll down Home to **Today's journal**.", "Look at the time the dose was recorded. A genuine double-tap does not create two rows.", "If there really are two rows and one is wrong, tap **Remove** next to it and confirm.", "If Remove isn't there, the entry is more than 48 hours old — see *\"I logged something by mistake\"*."], keywords: ["twice", "duplicate", "double", "two entries", "accidental"], related: ["log-remove"] },
  { id: "log-wrong-time", cat: "logging", q: "I forgot to log a dose at the time — can I put in the right time?", a: "Yes. When the app asks for the time, change it before confirming.", steps: ["Log the dose the normal way.", "When the date and time screen appears, tap the time and set it to when it was actually taken.", "You can change the date too if it was a different day.", "Tap **Confirm**.", "If you set a time in the future, it warns you and asks you to press Confirm again — that's deliberate."], note: "Blood pressure is the one exception: it records immediately with no time screen, so it can't be backdated from Home.", keywords: ["wrong time", "backdate", "past", "earlier", "yesterday", "forgot"], related: ["log-forgot-yesterday", "vit-bp-log"] },
  { id: "log-remove", cat: "logging", q: "I logged something by mistake", a: "You can remove it from History, but medication doses lock after 48 hours.", steps: ["Tap **Reports** at the bottom, then **History**.", "Find the entry on its day.", "Tap **Remove** next to it, then tap **Delete** to confirm.", "If **Remove** isn't there, that entry is a medication dose older than 48 hours, and it's now permanent history. That's on purpose — a medication record shouldn't be quietly rewritable days later.", "Weight, blood pressure, bowel, appetite, symptoms, period markers and radiation sessions can be corrected at any time, however old."], note: "Temperature currently follows the medication rule, so a temperature older than 48 hours can't be removed. That's a known gap.", keywords: ["mistake", "delete", "remove", "undo", "wrong entry", "48 hours"], related: ["vit-temp-cant-remove"] },
  { id: "log-forgot-yesterday", cat: "logging", q: "I forgot to log yesterday's doses", a: "Log them now and set the time back, or resolve them from the missed-dose list.", steps: ["If the dose is showing as missed: tap **Reports** → **History**, switch to the missed-dose view, find it, and tap **Took later**.", "If it isn't showing as missed: log it from Home and change the date and time on the confirm screen to when it actually happened.", "Either way it lands on the right day in History and in your exports."], keywords: ["forgot", "yesterday", "catch up", "behind", "late"], related: ["miss-resolve", "log-wrong-time"] },
  { id: "log-group-take-all", cat: "logging", q: "What does 'Take all' do on the Morning/Evening card?", a: "It logs every medication in that group at once, for the ones that are currently due.", steps: ["On Home, find the **Morning meds**, **Afternoon meds** or **Evening meds** card.", "Check the list of names on it first.", "Tap **Take all** to log them together.", "Anything in that group that's locked, paused, or not scheduled today is skipped rather than logged.", "To log just one of them, tap that medication's own **Log** button on the same card instead."], keywords: ["take all", "group", "all at once", "morning meds"], related: ["med-placement"] },
  { id: "miss-what-counts", cat: "missed", q: "When does a dose count as missed?", a: "A reminder stays open, not missed, until the next reminder for that medication that day — or until midnight if it was the last one.", steps: ["Say a medication has reminders at 8 AM and 2 PM. The 8 AM one stays open until 2 PM.", "If a dose is logged at any point before 2 PM, the 8 AM reminder counts as covered, even though it was late.", "If nothing is logged by 2 PM, the 8 AM one is flagged missed.", "The last reminder of the day stays open until midnight.", "*As needed* medications are never flagged missed — there's no set time for them to be late for."], keywords: ["missed", "when", "rules", "grace", "late", "counts"], related: ["miss-resolve", "miss-false-missed"], safety: true },
  { id: "miss-resolve", cat: "missed", q: "How do I clear a missed dose?", a: "Every missed dose has three buttons — Took later, Skipped, and Clear. They mean different things.", steps: ["Tap the red missed-dose banner on Home, or go to **Reports** → **History** and switch to the missed-dose view.", "Find the row and choose one:", "**Took later** — the dose was given, just late. This records a real dose.", "**Skipped** — it was deliberately not given. This records that decision, permanently.", "**Clear** — just remove the flag. Nothing is recorded. Use this when it was logged another way, or it was never really due.", "The count on the banner goes down as you resolve each one."], keywords: ["clear", "resolve", "took later", "skipped", "missed dose", "banner"], related: ["miss-clear-all"] },
  { id: "miss-banner", cat: "missed", q: "There's a red 'missed doses' banner and I can't get rid of it", a: "Tap the banner itself — it takes you to the list where each one can be resolved.", steps: ["Tap the red banner on Home. It opens History filtered to missed doses only.", "Resolve each row with **Took later**, **Skipped** or **Clear**.", "For today's misses, the banner also has its own **Clear** button that dismisses just that banner without touching the underlying record.", "Once every miss is resolved, the banner goes away and stays away, including after closing and reopening the app."], keywords: ["red banner", "won't go away", "missed", "stuck", "alert"], related: ["miss-resolve", "miss-clear-all"] },
  { id: "miss-clear-all", cat: "missed", q: "I've got weeks of missed doses and I don't want to tap them one by one", a: "There's a Clear all button in the missed-dose view.", steps: ["Tap **Reports** → **History**.", "Switch to the missed-dose view.", "Tap **Clear all** at the top.", "This only clears the flags. It doesn't delete anything you actually logged."], note: "If you have many months of misses, this screen can get very slow to open and respond. If it feels stuck, give it several seconds before tapping again.", keywords: ["clear all", "backlog", "many", "weeks", "catch up"], related: ["rep-history-slow"] },
  { id: "miss-false-missed", cat: "missed", q: "It says I missed doses that I didn't", a: "A few situations cause that, and most of them have a setting behind them.", steps: ["Was the person in hospital those days? Log the stay on the **In-Patient** tab — days inside a hospital stay are never flagged as missed.", "Was the medication paused then? Pausing only stops flags from the moment you pause. It doesn't rewrite the past.", "Is the medication actually taken every day? Check **Days taken** in the medication editor — if it's only certain days, set that, and the other days stop being flagged.", "Was it logged, just at a different time? Check **Reports** → **History** for that day.", "If none of these fit, use **Clear** on each row to dismiss the flag without recording anything."], keywords: ["false", "wrong", "didn't miss", "incorrect", "hospital", "paused"], related: ["ip-start-end", "med-days-taken", "med-pause-resume"] },
  { id: "miss-real-missed", cat: "missed", q: "A dose was genuinely missed — what should I do?", a: "**Contact the care team.** Whether to take a missed dose late, skip it, or double up is a medical decision, and it depends on the specific medication. ChemoWell cannot answer that, and it will never suggest an answer.", steps: ["Call the care team, the on-call number, or the pharmacist. If it's a chemotherapy or other treatment medication, do that now rather than waiting for the next appointment.", "Once you know what they want you to do, come back to the app to record what actually happened.", "If the dose was given late: **Reports** → **History** → missed-dose view → **Took later**.", "If it was deliberately skipped: same place, tap **Skipped**.", "Add a note if there's anything worth remembering — menu → **Notes**."], note: "ChemoWell records what you tell it. It does not give dosing guidance of any kind.", keywords: ["missed", "what do i do", "skip", "double", "catch up", "chemo"], related: ["miss-resolve", "note-add"], medical: true, careLead: true },
  { id: "treat-set-date", cat: "treatment", q: "How do I set a treatment date?", a: "On Home, in the Treatment schedule card.", steps: ["Go to **Home** and find the card headed **Treatment schedule**.", "Tap the row underneath it that says **Pick a date**.", "A small calendar opens. Tap the day.", "Tap **Set date** (or **Update** if there was already one).", "The card now shows the date and a countdown."], note: "After you set it, the row underneath may still read \"Pick a date\". That's a known display quirk — the date at the top of the card is the one that counts.", keywords: ["treatment date", "chemo date", "set", "pick", "calendar"], related: ["treat-clear", "med-treatment-availability"] },
  { id: "treat-clear", cat: "treatment", q: "I need to change or remove the treatment date", a: "Setting a new date replaces the old one. There's a separate Clear for removing it entirely.", steps: ["On **Home**, find the **Treatment schedule** card.", "To change it: tap the date row, pick the new day, tap **Update**.", "To remove it: tap **Clear** in the top right of the card, then tap it again to confirm.", "Anything set to only appear near your treatment day goes back to showing every day, with an amber **No date set** label."], keywords: ["change", "clear", "remove", "wrong date", "reschedule"], related: ["treat-set-date"] },
  { id: "treat-no-card", cat: "treatment", q: "I can't find the Treatment schedule card", a: "It's a card you can switch off, and on radiation-only profiles it starts off.", steps: ["Tap the three lines in the top left, then **Settings**.", "Find **Home screen**.", "Switch on **Treatment schedule card**.", "Go back to **Home** — the card is there now."], keywords: ["missing", "no card", "treatment schedule", "radiation", "hidden"], related: ["set-card-missing"] },
  { id: "treat-other-profile", cat: "treatment", q: "I picked 'Other' as the treatment type and the wording is different", a: "That's deliberate. An \"Other\" profile talks about *your date* instead of *treatment day*, and the treatment-day availability setting isn't offered at all.", steps: ["You can still use the **Treatment schedule** card on Home for an appointment or any date worth counting down to.", "In the medication editor, there's no treatment-day availability section for an \"Other\" profile — that's on purpose, since there's no treatment day in the sense that setting means.", "If a medication you set up before shows leftover *Days before* / *Days after* boxes, they're being ignored. They're a leftover from an earlier version."], note: "There's currently no way to change a profile's treatment type after setup. If you picked the wrong one, the only route today is to create a new profile — which means starting that person's history again. That's a known gap.", keywords: ["other", "treatment type", "wording", "your date", "not chemo"], related: ["pro-wrong-treatment-type"] },
  { id: "treat-radiation", cat: "treatment", q: "How do I track radiation sessions?", a: "The Radiation sessions card on Home, with a one-tap log.", steps: ["Go to **Home** and find the **Radiation sessions** card. It only appears for profiles that include radiation.", "Tap the button to log today's session.", "To record how many sessions are planned in total, enter the planned total on that card (1 to 99). The counter then shows something like *3 / 20 sessions completed*.", "To add a session you forgot, tap the **+** on that card and set the date.", "The full list is under **Reports** → **Radiation**."], branches: [{ when: "The card isn't there", steps: ["Menu → **Settings** → **Home screen** → switch on **Radiation sessions card**."] }], keywords: ["radiation", "sessions", "counter", "planned", "total"], related: ["set-card-missing"] },
  { id: "vit-temp-log", cat: "vitals", q: "How do I record a temperature?", a: "The Temperature card on Home.", steps: ["Go to **Home** and find the **Temperature** card.", "Type the reading into the box.", "Tap **Log**.", "Set the date and time if it wasn't just now, then confirm.", "The last reading shows at the top right of that card."], keywords: ["temperature", "temp", "fever", "log", "record"], related: ["vit-temp-rejected", "vit-units"] },
  { id: "vit-temp-high", cat: "vitals", q: "The temperature is high — what should I do?", a: "**Contact the care team now.** For someone on chemotherapy, a fever can be an emergency, and it is not something to look up in an app. Call the number the care team gave you, or the on-call line, straight away.", steps: ["Call the care team, the on-call oncology number, or your local emergency number if the person is very unwell.", "Do not wait for a reminder, an appointment, or anything in this app.", "Once the person is being looked after, record the reading in ChemoWell so there's a record of when it happened.", "Add a note about anything else you noticed — menu → **Notes**."], note: "ChemoWell shows temperature readings in a different colour when they're high, but the colour is only a visual cue. It is not an assessment, and there is no threshold in this app that means \"it's fine\".", keywords: ["fever", "high temperature", "100.4", "38", "hot", "emergency"], related: ["vit-temp-log"], medical: true, careLead: true },
  { id: "vit-temp-rejected", cat: "vitals", q: "It won't accept the temperature I typed", a: "There's a sensible range, and it's checking which unit you're in.", steps: ["If you're in Fahrenheit, it accepts roughly 86 to 113.", "If you get an error, check whether the app is set to the unit you're reading — menu → **Settings** → **Units**.", "Check for a stray extra digit — 1014 instead of 101.4 is the usual culprit.", "Retype it and tap **Log** again."], keywords: ["invalid", "won't accept", "error", "range", "celsius", "fahrenheit"], related: ["vit-units"] },
  { id: "vit-temp-cant-remove", cat: "vitals", q: "I typed a temperature wrong and there's no Remove button", a: "Temperature entries lock after 48 hours, the same as medication doses.", steps: ["Go to **Reports** → **History** and find the entry.", "If it's less than 48 hours old, tap **Remove** and confirm.", "If it's older, it can't be removed today. Log the correct reading with the right date and time so the true reading is on record alongside it.", "Add a note explaining the wrong one — menu → **Notes**."], note: "This is a known gap. Weight and blood pressure can be corrected at any age; temperature currently can't.", keywords: ["wrong temperature", "can't remove", "typo", "48 hours", "locked"], related: ["log-remove"] },
  { id: "vit-weight-log", cat: "vitals", q: "How do I record a weight, and why does it ask for a reason?", a: "The Weight card on Home. The reason is optional, and it exists because weight can move fast for reasons that aren't about eating.", steps: ["Go to **Home** and find the **Weight** card.", "Type the weight and tap **Log**.", "A **Reason for change** list appears. It's optional — skip it if nothing applies.", "Choose from things like fluid retention, poor appetite, nausea, steroid medication, illness, or eating more.", "There's a free-text note too. All of it shows up in the Weight report."], keywords: ["weight", "reason", "fluid", "appetite", "steroid"], related: ["vit-weight-change", "rep-weight", "proc-para"] },
  { id: "proc-para", cat: "vitals", q: "How do I record a paracentesis (fluid drained)?", a: "It has its own card and its own report, kept separate from weight on purpose.", steps: ["Menu → **Settings** → **Procedures** → switch on **Paracentesis tracking**.", "A **Paracentesis** card appears on **Home**. Type how many liters were drained and tap **Log**.", "The full list, the total drained and the number of procedures live under **Reports** → **Paracentesis**.", "The **Weight** report marks each drain on the chart and adds up the liters for whatever range you're viewing."], note: "It used to be an option inside the weight card's reason list. It was moved out because a drain is a procedure, not a reason a number moved — and tying it to a weigh-in meant a drain on a day nobody weighed in couldn't be recorded at all. Anything logged the old way was moved across automatically; nothing was lost. Weight readings are still shown exactly as the scale reported them and are never adjusted for drainage.", keywords: ["paracentesis", "para", "fluid", "drained", "liters", "litres", "ascites", "tap"], related: ["vit-weight-log", "rep-weight"] },
  { id: "vit-weight-change", cat: "vitals", q: "The weight has changed a lot in a few days", a: "**Tell the care team.** A fast weight change during treatment is something they want to know about, and what it means depends entirely on the person's situation.", steps: ["Contact the care team and tell them what you're seeing.", "In the app, record the reading and, if you know it, pick the **Reason for change** — that gives the trend chart context so a drop after fluid was drained doesn't look like the same thing as a drop from not eating.", "Look at **Reports** → **Weight** for the trend and the list of readings with their reasons.", "Take that report with you to the next appointment, or export it — menu → **Settings** → **Download CSV**."], note: "ChemoWell does not interpret weight changes and has no \"concerning\" threshold.", keywords: ["weight loss", "dropping", "gaining", "fast", "worried"], related: ["vit-weight-log", "exp-csv"], medical: true, careLead: true },
  { id: "vit-bp-log", cat: "vitals", q: "How do I record blood pressure?", a: "The Blood pressure card on Home. It records straight away with no time screen.", steps: ["Go to **Home** and find the **Blood pressure** card. If it isn't there, switch it on: menu → **Settings** → **Home screen** → **Blood pressure card**.", "Type the top number, then the bottom number.", "Tap **Log**.", "It records immediately, at the current time.", "See all readings under **Reports** → **Blood Pressure**."], note: "Unlike temperature and weight, blood pressure can't be backdated from Home — it always records as now. If you need a reading on an earlier day, log it and then remove and re-add it isn't possible either; note the real time in **Notes** instead.", keywords: ["blood pressure", "bp", "systolic", "diastolic", "120 over 80"], related: [] },
  { id: "vit-checkin-modal", cat: "vitals", q: "What is the Daily check-in?", a: "One short screen that asks about today, once a day.", steps: ["On **Home**, tap the **Daily check-in** card when it appears.", "Answer whichever of appetite, bowel movement, and weight are switched on. Skip anything that doesn't apply.", "There's a free-text box at the bottom — anything you write there goes into today's **Notes**.", "Tap **Save**.", "Once saved, the card stops appearing for the rest of the day."], keywords: ["check-in", "daily", "appetite", "bowel", "questions"], related: ["vit-checkin-missing", "rem-checkin-time"] },
  { id: "vit-checkin-missing", cat: "vitals", q: "The Daily check-in card isn't showing / it's asking the wrong things", a: "Each question is a separate switch, and the card only appears if at least one is on.", steps: ["Menu → **Settings** → **Home screen**.", "Scroll to the **Daily check-in** part.", "Switch on or off: *Weight in daily check-in*, *Bowel movement in daily check-in*, *Appetite in daily check-in*.", "If you switch all three off, the card stops appearing entirely.", "If you've already done today's check-in, the card won't show again until tomorrow."], keywords: ["check-in missing", "not showing", "questions", "turn off"], related: ["vit-checkin-modal"] },
  { id: "vit-units", cat: "vitals", q: "I want pounds instead of kilograms, or Celsius instead of Fahrenheit", a: "Menu → Settings → Units.", steps: ["Tap the three lines in the top left, then **Settings**.", "Find **Units**.", "Choose °F or °C for temperature, and pounds or kilograms for weight.", "Every reading you've already logged is shown in the new unit straight away.", "Nothing you logged is changed — only how it's displayed."], keywords: ["units", "kg", "lbs", "celsius", "fahrenheit", "metric"], related: ["vit-temp-rejected"] },
  { id: "vit-period", cat: "vitals", q: "How do I track periods?", a: "It's an optional setting, and it's off unless you turn it on.", steps: ["Menu → **Settings** → **Home screen** → switch on **Menstrual cycle tracking**.", "A banner appears on **Home** to log a period start.", "When it ends, tap **Log Period End** on the same banner.", "The full record is under **Reports** → **Cycle**."], note: "This option is only offered on profiles where it applies, based on the answer given during setup.", keywords: ["period", "menstrual", "cycle", "tracking"], related: ["rep-cycle-missing"] },
  { id: "sym-log", cat: "symptoms", q: "How do I record a symptom?", a: "The Symptoms tab at the bottom, then the + button.", steps: ["Tap **Symptoms** at the bottom of the screen.", "Tap the **+** in the top right.", "Choose the symptom from the list — nausea, vomiting, fatigue, mouth sores, numbness or tingling, headache, dizziness, a skin reaction or rash, diarrhoea, constipation, or Other.", "Set the date and time if it wasn't just now.", "Add a note if there's anything worth remembering.", "Tap **Confirm**."], keywords: ["symptom", "side effect", "reaction", "nausea", "log"], related: ["sym-severity", "sym-severe"] },
  { id: "sym-severity", cat: "symptoms", q: "Can I record how bad it was, or where on the body?", a: "Yes, for some symptoms — and it's optional.", steps: ["Log the symptom as normal.", "For a skin reaction or rash you also get **How bad is it?** (mild, moderate, severe) and **Where on the body?**.", "For pain-type symptoms you get a 1 to 10 scale.", "All of these are optional — a quick record is better than one you gave up on.", "Everything you fill in shows in History and in the exported records."], keywords: ["severity", "mild", "moderate", "severe", "where", "body", "pain scale"], related: ["sym-log"] },
  { id: "sym-edit-delete", cat: "symptoms", q: "I need to fix or delete a symptom I logged", a: "Symptoms can be edited or removed at any time, however old.", steps: ["Tap **Symptoms** at the bottom.", "Tap the entry you want to change.", "Change the time, note, severity or site, then confirm.", "To delete it, use the remove option on that entry and confirm."], keywords: ["edit symptom", "delete", "fix", "wrong"], related: ["log-remove"] },
  { id: "sym-severe", cat: "symptoms", q: "The symptom is severe, or something new and frightening is happening", a: "**Contact the care team, or emergency services if it's urgent.** Do that first. Logging it in the app can wait — this app has no way to judge how serious something is, and it will never try to.", steps: ["If the person is very unwell, struggling to breathe, confused, or you're frightened, call your local emergency number.", "Otherwise call the care team or the on-call number they gave you.", "Once they've been contacted, come back and log the symptom with the time it started, so there's an accurate record.", "Use the note field to write down exactly what you saw, in your own words. That's genuinely useful to the care team later."], note: "ChemoWell is a record-keeping tool, not medical advice. Never delay care because of anything shown in this app.", keywords: ["severe", "bad", "worse", "emergency", "frightened", "help"], related: ["sym-log", "vit-temp-high"], medical: true, careLead: true },
  { id: "sym-medical-question", cat: "symptoms", q: "Side effects — hair loss, sickness, tiredness: is this normal?", a: "**This is a question for the care team, and ChemoWell will not try to answer it.** The app keeps a record of what happened and when. It holds no information about any drug, has no idea what is normal for this person's treatment, and would be guessing if it said otherwise.", steps: ["Write the question down, along with what you have actually seen and when it started.", "Ask the care team, or the pharmacist who dispensed the medication \u2014 they have the person's actual treatment plan in front of them.", "Anything sudden, severe, or frightening is a phone call now, not a question for later.", "Log the symptom here with a note in your own words. Turning up to an appointment with dates and times is worth far more than trying to remember."], note: "ChemoWell is a record-keeping tool, not a source of medical information. Never delay care because of anything shown in this app.", keywords: ["side effect", "side effects", "hair", "hair loss", "sickness", "tiredness", "fatigue", "normal", "expect", "is that normal", "should i worry", "worried", "dangerous", "interact", "interaction", "safe to take", "what does it do"], related: ["sym-severe", "sym-log", "vit-temp-high"], medical: true, careLead: true, careTone: "calm" },
  { id: "sym-bowel-confusion", cat: "symptoms", q: "Should diarrhoea go in Symptoms or the bowel tracker?", a: "Either works, and they're for different things.", steps: ["Use the **Daily check-in** bowel question for the day's overall pattern — normal, very little, none, or diarrhoea.", "Use the **Symptoms** tab for a specific episode with a time and a note.", "The Symptoms list does include diarrhoea and constipation for exactly that reason.", "Both show up in your exported records."], keywords: ["diarrhea", "diarrhoea", "constipation", "bowel", "where"], related: ["vit-checkin-modal", "sym-log"] },
  { id: "ip-start-end", cat: "inpatient", q: "How do I record a hospital stay?", a: "The In-Patient tab at the bottom, with a start and an end.", steps: ["Tap **In-Patient** at the bottom of the screen.", "When the stay begins, tap **Log In-Patient Start**.", "A banner appears on Home showing which day of the stay you're on.", "When the person is discharged, tap **Log In-Patient End** — on that banner or on the In-Patient tab.", "Every past stay is kept in the **In-Patient History** list below."], keywords: ["hospital", "admitted", "in-patient", "stay", "discharged"], related: ["ip-meds-restricted", "ip-forgot-end"] },
  { id: "ip-meds-restricted", cat: "inpatient", q: "Can I still log medications during a hospital stay?", a: "Yes. Everything stays loggable the whole time a stay is active.", steps: ["Log doses exactly as you normally would — nothing is locked.", "Doses the hospital gave are not counted as missed: any dose window that opened while the stay was running is treated as theirs.", "If she comes home part-way through a day, the windows after that point are yours again and are tracked normally. You do NOT need to end the stay early to log them.", "End the stay when it actually ends, on the **In-Patient** tab."], note: "This used to work the other way round. Medications showed as 'Restricted' and could not be logged at all while a stay was active, and this page told you to end the stay early to unlock them — which meant falsifying when she came home in order to record a dose she really took. Fixed 2026-08-26 after Aaron hit exactly that on a half-day stay.", keywords: ["restricted", "can't log", "hospital", "paused", "greyed", "half day", "discharged"], related: ["ip-start-end", "log-button-locked"], medical: true },
  { id: "ip-forgot-end", cat: "inpatient", q: "I forgot to end a hospital stay and it still says Active", a: "End it now — the stay keeps its real start date.", steps: ["Tap **In-Patient** at the bottom.", "Tap **Log In-Patient End**.", "The stay closes and moves into In-Patient History with its length.", "The end time is recorded as now. If the real discharge was earlier, add a note — menu → **Notes** — so the record is accurate."], keywords: ["still active", "forgot", "end", "discharge", "ongoing"], related: ["ip-start-end"] },
  { id: "ip-past-stay", cat: "inpatient", q: "I want to add a hospital stay that already happened", a: "There's a separate control for logging a past stay with both dates.", steps: ["Tap **In-Patient** at the bottom.", "Find the option to log a past stay (Start + End).", "Set the start date and time, then the end date and time.", "Confirm. It appears in In-Patient History."], keywords: ["past stay", "backdate", "previous", "add old"], related: ["ip-start-end"] },
  { id: "ip-undo", cat: "inpatient", q: "I tapped In-Patient Start by mistake", a: "There's an Undo, and it asks twice on purpose.", steps: ["On the **In-Patient** tab, tap the undo option on the active stay.", "It asks you to tap again to confirm.", "Tap it again within a few seconds.", "The entry is removed and home medication logging goes back to normal."], keywords: ["undo", "mistake", "accidental", "remove stay"], related: ["ip-start-end"] },
  { id: "rep-where", cat: "reports", q: "Where do I see everything that's been logged?", a: "Reports at the bottom, then History.", steps: ["Tap **Reports** at the bottom of the screen.", "Tap **History** for the full day-by-day record.", "The other reports on that screen each focus on one thing — Weight, Blood Pressure, Radiation, Cycle, Bowel Movement, Appetite.", "Today's entries also appear on Home under **Today's journal**."], keywords: ["history", "everything", "records", "past", "where"], related: ["rep-history-read"] },
  { id: "rep-history-read", cat: "reports", q: "How do I read the History screen?", a: "One section per day, newest first, with a summary line under each date.", steps: ["Each day has a heading with the date and a short summary — for example *3 doses · 1 temp · 1 wt*.", "Under it, every entry for that day in time order.", "Missed doses appear as red rows with **Took later**, **Skipped** and **Clear** buttons.", "Doses logged outside the usual rules carry a small **Early** or **Over limit** label.", "There's a filter at the top to show only missed doses."], keywords: ["read", "history", "summary", "day", "understand"], related: ["miss-resolve"] },
  { id: "rep-entry-missing", cat: "reports", q: "Something I logged isn't in History", a: "Check the day it landed on, and which profile you're looking at.", steps: ["If you changed the date on the confirm screen when logging, it's filed under that date, not today.", "Tap the three lines in the top left — the name shown at the top of the menu is the profile you're viewing, and each one has its own separate history.", "Period starts and ends, and hospital stays, don't appear in Today's journal on Home. They're in their own reports and in the exported records.", "If it's genuinely not anywhere, log it again with the right date and time."], keywords: ["missing entry", "not there", "disappeared", "can't find"], related: ["pro-switch"] },
  { id: "rep-weight", cat: "reports", q: "How do I see the weight trend?", a: "Reports → Weight.", steps: ["Tap **Reports**, then **Weight**.", "The top shows the current weight, the average, and the overall change.", "The chart shows the trend. Use the range control to change the period shown.", "Underneath, every reading is listed with its date and, if you gave one, the reason for the change."], keywords: ["weight", "trend", "chart", "graph", "average"], related: ["vit-weight-log"] },
  { id: "rep-cycle-missing", cat: "reports", q: "The Cycle report isn't in the list", a: "It only appears when cycle tracking is switched on, and only on profiles where it applies.", steps: ["Menu → **Settings** → **Home screen**.", "Switch on **Menstrual cycle tracking**.", "Go back to **Reports** — the Cycle report is there now."], keywords: ["cycle", "period report", "missing", "not listed"], related: ["vit-period"] },
  { id: "rep-history-slow", cat: "reports", q: "History is slow or won't respond when I tap", a: "This happens when there's a very large backlog of missed doses to draw.", steps: ["Give it a few seconds — on a long backlog the screen genuinely takes a while to build.", "Don't tap repeatedly; wait, then tap once.", "Use **Clear all** in the missed-dose view to clear the backlog, which makes the screen light again.", "Logging regularly, even just clearing misses each week, keeps this from building up."], note: "This is a known issue with very long backlogs (many months of unlogged days).", keywords: ["slow", "frozen", "laggy", "won't respond", "stuck"], related: ["miss-clear-all"] },
  { id: "note-add", cat: "notes", q: "How do I write a note?", a: "Menu → Notes.", steps: ["Tap the three lines in the top left, then **Notes**.", "Tap to add a new note.", "Pick the date it belongs to, then type.", "Save.", "Notes are always editable, and a note logged late lands on the date it happened."], keywords: ["note", "journal", "write", "diary", "record"], related: ["note-vs-checkin"] },
  { id: "note-vs-checkin", cat: "notes", q: "What's the difference between Notes and the check-in's 'Anything else?' box?", a: "There isn't one, in the end — the check-in box writes into that day's note.", steps: ["Anything you type in the check-in's *Anything else?* box goes into today's note.", "You can open it later from menu → **Notes** and change it.", "Use Notes directly for anything that isn't part of a daily check-in — a question for the doctor, something that happened, how the day went."], keywords: ["notes", "check-in", "anything else", "difference"], related: ["vit-checkin-modal"] },
  { id: "note-edit-delete", cat: "notes", q: "How do I change or delete a note?", a: "Menu → Notes, then tap the note.", steps: ["Tap the three lines in the top left, then **Notes**.", "Tap the note you want to change and edit the text.", "Save.", "To delete it, tap the delete option, then tap again to confirm. It warns you this can't be undone."], note: "If you tap delete and then leave the screen without confirming, it may still be showing \"Delete?\" when you come back. Tap elsewhere or leave and return again to clear it.", keywords: ["edit note", "delete", "change", "remove"], related: ["note-add"] },
  { id: "appt-add", cat: "notes", q: "How do I add an appointment?", a: "Menu → Calendar, then Add.", steps: ["Tap the three lines in the top left, then **Calendar**.", "Tap **Add**.", "Type a title, pick the date and the time.", "Choose when you want to be reminded.", "Pick a colour if you want it to stand out on the month view.", "Save."], keywords: ["appointment", "calendar", "add", "doctor", "visit"], related: ["appt-reminder-choose"] },
  { id: "appt-reminder-choose", cat: "notes", q: "What are the reminder choices for an appointment?", a: "Five preset options plus a custom one.", steps: ["When adding or editing an appointment, open the reminder list.", "**No reminder** — nothing is sent.", "**At the scheduled time** — right when it starts.", "**1 hour before**.", "**The morning of (9 AM)**.", "**1 day before**.", "**Custom** — you set your own lead time, in minutes, hours or days."], keywords: ["reminder", "before", "lead time", "custom", "appointment"], related: ["rem-appointment"] },
  { id: "appt-month-view", cat: "notes", q: "How do I see my appointments on a calendar?", a: "Menu → Calendar shows a month grid.", steps: ["Tap the three lines in the top left, then **Calendar**.", "Days with an appointment show a coloured dot.", "Tap a day to see everything on it — the title, the time, the reminder setting and any note.", "Use the arrows at the top to move between months."], keywords: ["calendar", "month", "view", "dots", "colours"], related: ["appt-add"] },
  { id: "appt-year", cat: "notes", q: "I can't tell what year an appointment or note is from", a: "Dates on notes and calendar labels show only the month and day today.", steps: ["Open the appointment or note itself — the full date is inside it.", "For notes, the list badge shows only month and day, so a note from last year can look like a recent one.", "If two entries look identical, open each one to check."], note: "Adding the year to those labels is a known improvement that hasn't shipped yet.", keywords: ["year", "date", "confusing", "old", "which year"], related: ["note-add"] },
  { id: "exp-csv", cat: "export", q: "How do I get everything out of the app?", a: "Download CSV. It's free, on every plan.", steps: ["Tap the three lines in the top left, then **Settings** (or **Account** — the export section is on both).", "Find **Export**.", "Tap **Download CSV**.", "Your phone's own share screen opens. Pick where the file should go — email, Drive, Files, a messaging app, whatever's there.", "The file is named with the patient's name and today's date, so it's easy to find later."], keywords: ["export", "csv", "download", "spreadsheet", "excel", "get data out"], related: ["exp-where-file", "exp-printable"] },
  { id: "exp-where-file", cat: "export", q: "Where did the exported file go? I can't find a 'save to this phone' option", a: "The file is handed to your phone's share screen, and a plain \"save to this phone\" option doesn't always appear there.", steps: ["When the share screen opens, look for Drive, Files, or your email app — those all work.", "Emailing it to yourself is the most reliable way to keep a copy you can find later.", "If you picked something and nothing seems to have happened, check that app (your Drive, your sent mail) rather than your Downloads folder.", "In the browser version, the file goes to your Downloads folder instead."], note: "The missing \"save straight to this phone\" option is a known gap that's being worked on.", keywords: ["where", "saved", "downloads", "file", "missing", "share sheet"], related: ["exp-csv"] },
  { id: "exp-printable", cat: "export", q: "How do I get a report to hand to the doctor?", a: "The Printable report. It's part of the Plus plan; CSV is free for everyone.", steps: ["Menu → **Settings** (or **Account**) → **Export**.", "Tap **Printable report**.", "It's laid out by day, newest first, ready to print or save as a PDF.", "On the installed app, your phone's share screen opens — pick a printer app, Drive, or email.", "In a browser, your print dialog opens, and \"Save as PDF\" is one of the destinations."], keywords: ["printable", "pdf", "doctor", "report", "print", "plus"], related: ["exp-csv", "pro-plans"] },
  { id: "exp-nothing", cat: "export", q: "It says there's nothing to export", a: "Nothing has been logged on this profile yet.", steps: ["Check which profile you're on — tap the three lines in the top left; the name is shown at the top of the menu.", "If it's the wrong one, switch, then try again.", "If it's the right one, log something first — a dose, a temperature, anything — then export."], keywords: ["nothing to export", "empty", "no data"], related: ["pro-switch"] },
  { id: "exp-csv-columns", cat: "export", q: "What am I looking at in the CSV?", a: "One row per thing logged, with the date, the time, what it was, and the details.", steps: ["Open it in any spreadsheet app — Excel, Google Sheets, Numbers.", "Each row is one logged entry: a dose, a temperature, a weight, a blood pressure, a symptom, a period marker, a hospital start or end.", "The details column holds the amount, any note, and labels like *Early* or *Over limit*.", "If a row's details look odd or use an unfamiliar short code, that's a known formatting gap and not something you did wrong."], keywords: ["csv", "columns", "spreadsheet", "understand", "reading"], related: ["exp-csv"] },
  { id: "exp-print-blocked", cat: "export", q: "The printable report says pop-ups are blocked", a: "That's the browser version. Your browser is stopping the report window from opening.", steps: ["Look for a small blocked-pop-up icon in your browser's address bar.", "Tap it and choose to allow pop-ups for this site.", "Tap **Printable report** again.", "If you can't get it to work, use **Download CSV** instead — it carries the same information."], keywords: ["pop-up blocked", "print", "won't open", "browser"], related: ["exp-printable"] },
  { id: "pro-add", cat: "profiles", q: "I'm caring for more than one person", a: "Give each person their own profile. Their medications and history stay completely separate.", steps: ["Tap the three lines in the top left, then **Settings**.", "Find **Profiles**.", "Tap the button to add a profile.", "Type that person's name and tap **Create**.", "The new profile starts empty, with its own medications, history and settings."], note: "The Free plan includes 1 profile. Plus allows up to 3. Pro is unlimited.", keywords: ["profiles", "two people", "multiple", "another person", "family"], related: ["pro-switch", "pro-limit"] },
  { id: "pro-switch", cat: "profiles", q: "How do I switch between people?", a: "Menu → Account, or Settings → Profiles.", steps: ["Tap the three lines in the top left.", "Tap **Account**, or tap **Settings** then **Profiles**.", "Tap **Switch** next to the person you want.", "The whole app changes to that person — Home, medications, history, everything.", "The name shown at the top of the menu always tells you who you're currently looking at."], keywords: ["switch", "change person", "wrong person", "profile"], related: ["pro-add"] },
  { id: "pro-limit", cat: "profiles", q: "It won't let me add another profile", a: "You've reached your plan's limit.", steps: ["Free includes 1 profile, Plus includes up to 3, Pro is unlimited.", "When you tap add and you're at the limit, the plans screen opens instead.", "You can also delete a profile you no longer need to free a slot — but that erases that person's data permanently."], keywords: ["limit", "can't add", "plan", "upgrade", "one profile"], related: ["pro-plans", "pro-delete"] },
  { id: "pro-delete", cat: "profiles", q: "How do I delete a profile?", a: "Settings → Profiles → Delete, with a confirm. It cannot be undone.", steps: ["Menu → **Settings** → **Profiles**.", "Tap **Delete** next to that person.", "It asks *Delete forever? Can't be undone.* Tap **Delete** to confirm, or **Keep** to back out.", "Everything for that person — medications, history, notes, appointments — is gone from this device.", "If you might want any of it later, export it first: **Download CSV**."], keywords: ["delete profile", "remove person", "erase"], related: ["exp-csv", "priv-delete"] },
  { id: "pro-wrong-treatment-type", cat: "profiles", q: "I picked the wrong treatment type during setup", a: "There's currently no way to change it afterwards. This is a real limitation, not something you're missing.", steps: ["The treatment type — Chemo, Radiation, Both, or Other — is asked once during setup.", "Today there's no screen to change it later.", "The only way to change it is to create a new profile and set it up again, which means starting that person's history over.", "Before you do that, export the existing records so you keep them: menu → **Settings** → **Download CSV**."], note: "Being able to change treatment type later is a known gap and is on the list.", keywords: ["wrong type", "chemo", "radiation", "change", "setup", "mistake"], related: ["treat-other-profile", "exp-csv"] },
  { id: "pro-plans", cat: "profiles", q: "What do Plus and Pro actually add?", a: "They're one-time purchases, not subscriptions. The free tracker is complete and stays free.", steps: ["Menu → **Settings** → **Profiles** → **View plans**.", "**Free** — the full tracker, 1 profile, and CSV export of all your own data.", "**Plus** — up to 3 profiles, and the printable doctor's report.", "**Pro** — unlimited profiles, plus features still being built.", "Anything marked *coming soon* is not built yet, and the plans screen says so."], keywords: ["plans", "plus", "pro", "upgrade", "price", "cost", "free"], related: ["pro-purchases-beta"] },
  { id: "pro-purchases-beta", cat: "profiles", q: "I upgraded but I wasn't charged", a: "This is a beta build. Purchases are simulated so the upgrade flow can be tested.", steps: ["The plans screen says so at the bottom: purchases in this build are simulated.", "Nothing has been charged, and no payment details are involved.", "The finished version in the app stores will use real App Store and Google Play purchases.", "If you want to go back to the free tier for testing, there's a reset option on the plans screen."], keywords: ["purchase", "charged", "payment", "beta", "simulated", "free upgrade"], related: ["pro-plans"] },
  { id: "set-card-missing", cat: "settings", q: "A card I want isn't on my Home screen", a: "Almost every Home card can be switched on and off.", steps: ["Menu → **Settings** → **Home screen**.", "Switch on whichever you want: Temperature card, Weight card, Blood pressure card, Treatment schedule card, Radiation sessions card, Menstrual cycle tracking.", "Go back to **Home** — it's there now.", "Some cards only appear for profiles they apply to. Radiation sessions only shows for a profile that includes radiation."], keywords: ["card missing", "home screen", "hidden", "turn on", "settings"], related: ["treat-no-card"] },
  { id: "set-quicklog-collapsed", cat: "settings", q: "All my medications vanished from Home", a: "The Quick log section is probably just folded shut.", steps: ["On **Home**, look for the heading **Quick log**.", "If it has a number in brackets next to it, like *Quick log (4)*, it's collapsed.", "Tap the heading to open it again.", "Medications in a Morning, Afternoon or Evening group are in their own cards further down, not in Quick log."], keywords: ["vanished", "all gone", "quick log", "collapsed", "empty home"], related: ["med-not-on-home"] },
  { id: "set-beta-date-controls", cat: "settings", q: "There's a 'Beta date controls' box on my screen", a: "It's a testing tool for the beta. It lets you pretend it's a different day.", steps: ["Tap it to open it. There's a date picker and −1 Day / +1 Day buttons.", "While it's set to anything other than today, reminders are switched off on purpose, so your phone doesn't alert at the wrong real time.", "Tap **Reset** to go back to today and switch reminders back on.", "If you never want to use it, just leave it closed — it does nothing on its own."], note: "This box won't be in the finished app.", keywords: ["beta", "date controls", "test", "simulate", "what is this"], related: ["rem-paused-sim"] },
  { id: "set-erase-all", cat: "settings", q: "How do I erase everything and start over?", a: "Menu → Account → Start over. It's permanent, and there's no way to get anything back.", steps: ["Tap the three lines in the top left, then tap **Account**.", "Scroll all the way down to **Start over**.", "Tap the erase button.", "A larger warning appears explaining that this permanently deletes everything and can't be undone.", "Confirm only if you're certain. The app returns to the welcome screen.", "**Export first if there's any chance you'll want the records** — **Download CSV** in the same screen."], note: "ChemoWell has no cloud backup. Once this is done, the data is genuinely gone.", keywords: ["erase", "start over", "reset", "delete everything", "wipe", "factory"], related: ["exp-csv", "priv-delete"] },
  { id: "set-something-flickering", cat: "settings", q: "The screen keeps refreshing or flickering", a: "Older versions did this while a confirmation box was open. If you're seeing it now, you're probably on an old cached copy.", steps: ["Close ChemoWell completely — swipe it away from your recent apps.", "Open it again.", "Check the version: menu → **Settings**, scroll to **About & legal**. The version is on the first line.", "If it still flickers on the current version, note exactly which screen and what was open at the time — that's the detail that makes it fixable."], keywords: ["flicker", "refresh", "blinking", "jumping", "screen"], related: ["app-old-version"] },
  { id: "tour-replay", cat: "tour", q: "Can I go through the guided walkthrough again?", a: "Yes, any time.", steps: ["Tap the three lines in the top left, then **Settings**.", "Find **How-to guide**.", "Tap **Replay the walkthrough**.", "It starts again from the first step.", "Nothing you've already set up is changed by replaying it."], keywords: ["tour", "guide", "walkthrough", "again", "replay", "help"], related: ["tour-stuck"] },
  { id: "tour-stuck", cat: "tour", q: "The guide is waiting for me to do something and I'm stuck", a: "Some steps wait for a real tap. The banner tells you which one.", steps: ["Read the small line at the bottom of the guide banner — it says exactly what to tap, for example *Tap Add to continue*.", "Tap **More** on the banner to see the full explanation of that step.", "If you'd rather move on, tap **Skip this step**.", "To leave the guide entirely, tap **Skip guide**.", "You can restart it later from Settings."], keywords: ["stuck", "tour", "waiting", "can't continue", "guide"], related: ["tour-replay"] },
  { id: "tour-blocking", cat: "tour", q: "The guide banner is covering the top of the screen", a: "The banner sits at the very top while the guide is running.", steps: ["Tap **Skip guide** on the banner to close it, and restart it later from Settings if you want.", "The page underneath is fully usable while the guide is up — you can scroll and tap normally.", "On the last few steps the guide takes you to each tab automatically, so you don't have to find them."], keywords: ["covering", "banner", "blocking", "top", "menu", "hidden"], related: ["tour-replay"] },
  { id: "priv-server", cat: "privacy", q: "Is my information stored on a server somewhere?", a: "No. Everything you enter stays on this device. There's no account, no cloud, and nothing is sent anywhere.", steps: ["There's no sign-up and no login — you may have noticed you were never asked for an email address.", "Your medication list, your history, your notes and your appointments are stored on this phone only.", "ChemoWell does not send your information to us or to anyone else. There's no tracking and no analytics.", "It works with no internet connection at all, which is the plainest proof of the above.", "The trade-off is real, and worth knowing: because nothing is on a server, nobody can restore it for you. See *\"What happens if I lose my phone?\"*."], keywords: ["server", "cloud", "privacy", "data", "account", "tracking", "safe"], related: ["priv-lost-phone", "priv-who-sees"] },
  { id: "priv-who-sees", cat: "privacy", q: "Who can see what I put in?", a: "Only whoever can unlock this phone.", steps: ["There's no shared account and no other copy of your data.", "Nothing is visible to us, to a doctor, or to anyone else unless you export it and send it yourself.", "If other people use this phone, its own lock screen is what protects the app.", "When you export a report, that file is yours — where it goes is entirely your choice."], keywords: ["who can see", "private", "shared", "doctor", "family"], related: ["priv-server", "exp-csv"] },
  { id: "priv-lost-phone", cat: "privacy", q: "What happens if I lose my phone or the app is uninstalled?", a: "The data goes with it. There's no cloud copy and no way to restore it.", steps: ["Because nothing is stored on a server, there's no backup to pull down onto a new phone.", "Keep your phone backed up the way you normally would.", "Export a copy every so often — menu → **Settings** → **Download CSV** — and email it to yourself or save it to your own cloud storage. That's your record.", "Do that before erasing anything, changing phones, or deleting a profile."], note: "A proper backup-and-move-to-a-new-phone feature is planned but not built yet. Exporting is the reliable way to keep a copy today.", keywords: ["lost phone", "new phone", "backup", "restore", "uninstall", "gone"], related: ["exp-csv", "pro-plans"] },
  { id: "priv-delete", cat: "privacy", q: "How do I make sure my data is really gone?", a: "Menu → Account → Start over erases everything on this device.", steps: ["Export anything you want to keep first — **Download CSV**.", "Menu → **Account** → scroll to **Start over**.", "Erase, and confirm on the larger warning.", "That clears the patient name, medications, and all logged history from this device.", "To remove just one person, use Settings → Profiles → Delete instead."], keywords: ["delete", "erase", "gone", "remove data", "permanently"], related: ["set-erase-all", "pro-delete"] },
  { id: "app-old-version", cat: "app", q: "I was told something was fixed, but I still see the old version", a: "Close the app completely and open it again. That's usually all it takes.", steps: ["Swipe ChemoWell away from your recent apps so it's fully closed — not just minimised.", "Open it again.", "Check the version: menu → **Settings** → scroll to **About & legal**. The version number is on the first line.", "If it hasn't changed, make sure you have an internet connection, then close and open it once more.", "If it still hasn't changed after that, the fix may need a new install of the app rather than just a reopen — that's the case for anything involving notifications or file sharing."], note: "The app keeps a copy of itself on the phone so it works offline. That copy is refreshed when you open it with a connection.", keywords: ["old version", "not updated", "still broken", "cache", "refresh", "update"], related: ["app-version"] },
  { id: "app-version", cat: "app", q: "How do I check which version I'm on?", a: "Settings → About & legal.", steps: ["Tap the three lines in the top left, then **Settings**.", "Scroll to the bottom, to **About & legal**.", "The first line shows the version, for example *ChemoWell app-v52 (beta)*.", "The version is also at the bottom of the menu panel itself."], keywords: ["version", "which", "number", "about", "build"], related: ["app-old-version"] },
  { id: "app-offline", cat: "app", q: "Does it work without internet?", a: "Yes. Everything works offline.", steps: ["Logging, history, reports, notes and appointments all work with no connection.", "Reminders that were already set still arrive.", "Connect occasionally so the app can pick up updates, and so new reminders keep being set up ahead of time."], keywords: ["offline", "no internet", "aeroplane", "wifi", "data"], related: ["app-old-version"] },
  { id: "app-blank", cat: "app", q: "The screen is blank or the app won't load", a: "Close it fully and open it again first.", steps: ["Swipe ChemoWell away from your recent apps, then open it again.", "If it's still blank, restart the phone and open it again.", "If you're in a browser, pull down to refresh the page.", "Your data isn't lost by any of this — it's stored on the device separately from the app screen."], keywords: ["blank", "white screen", "won't load", "crash", "stuck"], related: ["app-old-version"] },
  { id: "app-back-button", cat: "app", q: "The back button closes the whole app", a: "That's a known problem. Use the tabs at the bottom instead.", steps: ["To move between screens, use the bar at the bottom — Home, Meds, Reports, In-Patient, Symptoms.", "For Calendar, Notes, FAQ and Settings, use the three lines in the top left.", "Avoid the phone's back button while you're inside the app.", "If it does close the app, nothing is lost — open it again and everything is where you left it."], note: "Making the back button go up one screen instead of leaving the app is a known fix that hasn't shipped yet.", keywords: ["back button", "closes", "exits", "quits", "navigation"], related: ["app-blank"] },

function h(tag, attrs, ...children) {
