<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDDCCE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ChemoWell</title>
<!-- Capacitor bridge (native APK build only). On the web/PWA build these load a no-op JS-only
     fallback (Capacitor.isNativePlatform() === false) so nothing here changes web behavior at all
     — see isNativeApp() below. If blocked or offline, window.Capacitor stays undefined and every
     call site already guards for that, so the app degrades to normal web behavior either way. -->
<script src="https://cdn.jsdelivr.net/npm/@capacitor/core@8.4.2/dist/capacitor.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@capacitor/local-notifications@8.2.1/dist/plugin.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--safe-top:env(safe-area-inset-top,0px);}
html,body{height:100%;overscroll-behavior-y:none;}
body{-webkit-font-smoothing:antialiased;background:#FAF7F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;color:#2A2127;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none;}
button:active{transform:translateY(1px);}
input{-webkit-tap-highlight-color:transparent;font-family:inherit;}
input:focus{outline:2px solid #BF4C1A;outline-offset:0;border-color:#BF4C1A;}
/* v23 (Aaron-requested): native <select> elements weren't covered by the same font-family:inherit
   reset button/input already get, so every dropdown box silently fell back to the OS's default UI
   font instead of the app's own -- this one rule fixes that everywhere in one place. The rounded
   corners / light background / custom arrow (replacing the dark, square native one) are applied
   per-select via SELECT_ARROW_STYLE (see selectStyleFix helper) since those also need per-instance
   sizing, but the font fix belongs globally so no dropdown can be missed. */
select{font-family:inherit;-webkit-tap-highlight-color:transparent;}
select:focus{outline:2px solid #BF4C1A;outline-offset:0;border-color:#BF4C1A;}
button:focus-visible, [role="button"]:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #BF4C1A; outline-offset: 2px; }
::placeholder{color:#7A6E76 !important;opacity:1;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#root{min-height:100vh;}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes tourPulse{0%{outline-color:rgba(46,125,79,1)}50%{outline-color:rgba(46,125,79,0.75)}100%{outline-color:rgba(46,125,79,1)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">

// ---------- On-device storage — no cloud, no accounts ----------
// All data lives in this device's localStorage. Nothing is ever sent to a server.
const TEST_MODE = true; // APP BETA — enables the date-override controls + simulated purchases

// ---- Optional "leave a tip" prompt (Owner-requested, app-v32) ----
// A quiet, dismissible card offering an optional one-time gift to the developer, shown at most once
// every 20 logged entries, never as a blocking modal, never repeated once someone opts out. See
// supportPromptDue()/renderToday() near the bottom of the Today section.
// v29 first shipped this framed as "help keep the app free and ad-free" — the Owner correctly
// flagged that as false and contradictory (ChemoWell already has paid Free/Plus/Pro tiers). This
// version keeps the same non-intrusive mechanics but drops every claim about "free," ads, or
// necessity — it's simply an optional way to say thanks, unrelated to the tiers and unrelated to
// whether the app keeps working either way.
// TODO(Aaron): replace with your real donation page link (Ko-fi, Stripe Payment Link, etc.).
// SUPPORT_LINK_READY derives off the URL itself (true once it no longer contains "REPLACE") rather
// than a second hand-maintained flag, so there's no way for the two to drift out of sync — the
// banner is safely disabled (never rendered, checked in supportPromptDue()) until this one line is
// swapped for a real link, then it turns on automatically with no other code change needed.
const SUPPORT_LINK = 'https://ko-fi.com/REPLACE_WITH_REAL_LINK';
const SUPPORT_LINK_READY = SUPPORT_LINK.indexOf('REPLACE') === -1;

// ---- Safe-area top (v15) ----
// Android WebViews (incl. the Capacitor shell on edge-to-edge devices) draw under the status bar
// but report env(safe-area-inset-top)=0. Probe env(); only when it measures 0 inside a WebView do
// we substitute a 28px literal. setProperty REPLACES the var — env and fallback never stack.
(function initSafeTop() {
  try {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;';
    document.documentElement.appendChild(probe);
    const measured = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    probe.remove();
    const isWebView = /; wv\)/.test(navigator.userAgent) || (typeof isNativeApp === 'function' && isNativeApp());
    if (isWebView && measured === 0) document.documentElement.style.setProperty('--safe-top', '28px');
  } catch (e) {}
})();
function safeTopPx() {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'));
  return isNaN(v) ? 0 : v;
}

// True only inside the Capacitor native shell (android/), never in the installed PWA or a plain
// browser tab. Gates every native-only code path (real local notifications) so the web build's
// behavior is byte-for-byte unchanged. Wrapped in try/catch: if the CDN bridge script above is
// blocked or hasn't loaded yet, this safely reports "not native" rather than throwing (v14).
function isNativeApp() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
  catch (e) { return false; }
}

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ---- Plans & licensing (Free / Plus / Pro) — device-wide, not per profile ----
const LICENSE_KEY = 'chemowell-app-license-v1';
function getLicense() { return loadJSON(LICENSE_KEY, { tier: 'free' }); }
function setLicense(patch) { saveJSON(LICENSE_KEY, { ...getLicense(), ...patch }); }
function tierLimit(tier) { return tier === 'pro' ? Infinity : tier === 'plus' ? 3 : 1; }
function tierLabel(tier) { return tier === 'pro' ? 'Pro' : tier === 'plus' ? 'Plus' : 'Free'; }

// ---- Profiles: each patient gets fully separate on-device storage ----
const PROFILES_KEY = 'chemowell-app-profiles-v1';
(function initProfiles() {
  if (loadJSON(PROFILES_KEY, null)) return;
  const ps = { list: [{ id: 'p1', name: '', createdAt: Date.now() }], activeId: 'p1' };
  // One-time migration of pre-profile (app-v1..v4) single-profile data into profile p1.
  const legacy = [
    ['chemowell-app-entries-v1', 'chemowell-app-p-p1-entries-v1'],
    ['chemowell-app-prefs-v1', 'chemowell-app-p-p1-prefs-v1'],
    ['chemowell-app-medication-config-v1', 'chemowell-app-p-p1-med-v1']
  ];
  for (const [oldKey, newKey] of legacy) {
    const v = localStorage.getItem(oldKey);
    if (v != null) { localStorage.setItem(newKey, v); localStorage.removeItem(oldKey); }
  }
  const migratedPrefs = loadJSON('chemowell-app-p-p1-prefs-v1', {});
  if (migratedPrefs.patientName) ps.list[0].name = migratedPrefs.patientName;
  saveJSON(PROFILES_KEY, ps);
})();
function profilesState() { return loadJSON(PROFILES_KEY, { list: [{ id: 'p1', name: '', createdAt: 0 }], activeId: 'p1' }); }
const ACTIVE_PROFILE_ID = (function () { const ps = profilesState(); return ps.list.some(p => p.id === ps.activeId) ? ps.activeId : ps.list[0].id; })();
let newProfileNameDraft = '';
function createProfile(name) {
  const ps = profilesState();
  if (ps.list.length >= tierLimit(getLicense().tier)) return false;
  const id = 'p' + Date.now().toString(36);
  ps.list.push({ id: id, name: name, createdAt: Date.now() });
  ps.activeId = id;
  // v33: new profiles now go through the (3-question) setup screen instead of skipping it —
  // sex and treatment type gate real UI (cycle tracking, radiation card), so a profile created
  // without them would land in the ambiguous legacy state on purpose, which defeats the point.
  // The typed name rides along as pendingName and prefills the setup form; tourDone stays true
  // so an experienced multi-profile caregiver isn't forced back through the guided tour.
  saveJSON('chemowell-app-p-' + id + '-prefs-v1', { pendingName: name, installedAt: Date.now(), tourDone: true });
  saveJSON(PROFILES_KEY, ps);
  location.reload();
  return true;
}
function deleteProfile(id) {
  const ps = profilesState();
  if (id === ps.activeId || ps.list.length <= 1) return; // never delete the active profile
  ps.list = ps.list.filter(p => p.id !== id);
  saveJSON(PROFILES_KEY, ps);
  // v36: added '-notes-v1' for the new Notes feature, and also closed a pre-existing gap here --
  // '-appts-v1' (app-v22) was never included in this cleanup list, so deleting a profile left its
  // calendar/appointment data orphaned in localStorage forever. Both are 1-line additions to an
  // existing list with no behavior change to entries/prefs/med, so folding the appts fix in here
  // rather than opening a separate change for it.
  ['-entries-v1', '-prefs-v1', '-med-v1', '-appts-v1', '-notes-v1'].forEach(sfx => { try { localStorage.removeItem('chemowell-app-p-' + id + sfx); } catch (e) {} });
  setState({ confirmDeleteProfile: null });
  setToast('Profile deleted');
}
function switchProfile(id) {
  const ps = profilesState();
  if (!ps.list.some(p => p.id === id) || id === ps.activeId) return;
  ps.activeId = id;
  saveJSON(PROFILES_KEY, ps);
  location.reload();
}

const ENTRIES_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-entries-v1';
const PREFS_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-prefs-v1';

let entriesListener = null;
let prefsListener = null;

function allEntriesRaw() { return loadJSON(ENTRIES_KEY, []); }

function notifyEntries() {
  if (!entriesListener) return;
  const all = allEntriesRaw().slice().sort((a, b) => a.ts - b.ts);
  state.chemoDates = all.filter(e => e.medId === 'chemo_date');
  entriesListener(all.filter(e => e.medId !== 'chemo_date'));
}

function subscribeEntries(callback) {
  entriesListener = callback;
  notifyEntries();
  return () => { entriesListener = null; };
}

async function addEntryDB(entry) {
  const all = allEntriesRaw();
  const id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  all.push({ id: id, ...entry });
  saveJSON(ENTRIES_KEY, all);
  notifyEntries();
  // v35: logging a dose is the highest-frequency event in the app and the one with the tightest
  // feedback expectation on native -- the reminder for that exact window should stop existing the
  // instant the dose is confirmed. A full rebuild would do it but would also cancel-and-reschedule
  // every other armed alarm on every tap; cancelReminderForEntry() below is the surgical path.
  // chemo_date entries aren't a dose window at all (they can shift every med's schedule), so they
  // get the full rebuild via markNotifDirty() instead.
  if (entry && entry.medId === 'chemo_date') markNotifDirty(); else cancelReminderForEntry({ id: id, ...entry });
}

async function removeEntryDB(id) {
  saveJSON(ENTRIES_KEY, allEntriesRaw().filter(e => e.id !== id));
  notifyEntries();
}

function getPrefsDB() { return loadJSON(PREFS_KEY, {}); }
function subscribePrefs(callback) {
  prefsListener = callback;
  callback(getPrefsDB());
  return () => { prefsListener = null; };
}
async function setPrefsDB(patch) {
  const next = { ...getPrefsDB(), ...patch };
  saveJSON(PREFS_KEY, next);
  if (prefsListener) prefsListener(next);
}

// ---- Calendar / appointments (app-v22) — future appointments and other important dates the
// patient or caregiver wants a reminder for. Mirrors the entries/prefs storage pattern above:
// profile-scoped localStorage, held in state.appts, mutated through these functions + setState.
// Kept fully separate from the medication/dose "entries" store since appointments aren't doses.
const APPTS_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-appts-v1';
// v40: appointment colors, for the month-grid Calendar view (Owner-requested — pick a color when
// adding an appointment, see it as a colored marker on that day in the grid). Deliberately spaced
// away from the app's semantic hues (danger red ~5°, warning amber ~34-38°, active/success green
// ~145-165°) so a color choice here is never mistaken for one of those meanings elsewhere in the
// app — every option here sits in the 0-20 (brand coral) or 175-330 (teal through pink) range.
const APPT_COLORS = [
  { id: 'coral', label: 'Coral', hex: '#E46F3C' },
  { id: 'teal', label: 'Teal', hex: '#12938A' },
  { id: 'blue', label: 'Blue', hex: '#2F6FE0' },
  { id: 'indigo', label: 'Indigo', hex: '#5B4FCF' },
  { id: 'purple', label: 'Purple', hex: '#9247D6' },
  { id: 'pink', label: 'Pink', hex: '#D6478F' }
];
const DEFAULT_APPT_COLOR = 'coral';
function apptColorHex(id) { const c = APPT_COLORS.find(c => c.id === id); return c ? c.hex : APPT_COLORS[0].hex; }
function loadAppointments() { return loadJSON(APPTS_KEY, []); }
function persistAppointments(list) { saveJSON(APPTS_KEY, list); }
function addAppointment(appt) {
  const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const list = loadAppointments();
  list.push({ id, reminded: false, ...appt });
  persistAppointments(list);
  setState({ appts: list });
  setToast('Appointment saved');
  markNotifDirty(); // v35: a new appointment may need a reminder armed inside the 72h horizon
}
function updateAppointment(id, patch) {
  const list = loadAppointments().map(a => a.id === id ? { ...a, ...patch } : a);
  persistAppointments(list);
  setState({ appts: list });
  markNotifDirty(); // v35: moving an appointment or changing its lead time moves its reminder
}
function removeAppointment(id) {
  const list = loadAppointments().filter(a => a.id !== id);
  persistAppointments(list);
  setState({ appts: list, confirmDeleteAppt: null });
  setToast('Appointment removed');
  markNotifDirty(); // v35: a deleted appointment must not still ring
}

// ---- Notes (app-v36) — a free-text journal, one entry per calendar day. Mirrors the
// appointments storage pattern above (profile-scoped localStorage, held in state.notes, mutated
// through these functions + setState) but deliberately simpler: no reminders, no title, just a
// date and a body of text. Aaron's spec: "editable at all times... it should all roll together in
// one date it was intended for" -- so unlike appointments (many rows per day are normal), notes
// are keyed uniquely by dateStr. saveNote() below enforces the one-note-per-day rule itself:
// saving into a date that already has a note edits that existing entry (by date, not by whatever
// id happened to be open), so there's no code path that can leave two notes on the same day.
const NOTES_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-notes-v1';
function loadNotes() { return loadJSON(NOTES_KEY, []); }
function persistNotes(list) { saveJSON(NOTES_KEY, list); }
// dateStr: 'YYYY-MM-DD', the date the note is FOR (not necessarily when it was typed -- this is
// what makes backdating work: logging today about something from yesterday just targets yesterday's
// dateStr, and it lands in the same place a note made yesterday would have).
function saveNote(dateStr, text) {
  const trimmed = (text || '').trim();
  const list = loadNotes();
  const existing = list.find(n => n.date === dateStr);
  if (!trimmed) {
    // Saving an empty note deletes it outright rather than leaving a blank entry cluttering the
    // list -- matches how every other optional-text field in this app treats an emptied value.
    if (existing) return removeNote(existing.id);
    return;
  }
  if (existing) {
    existing.text = trimmed;
    existing.updatedAt = Date.now();
  } else {
    list.push({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), date: dateStr, text: trimmed, createdAt: Date.now(), updatedAt: Date.now() });
  }
  persistNotes(list);
  setState({ notes: list });
  setToast('Note saved');
}
function removeNote(id) {
  const list = loadNotes().filter(n => n.id !== id);
  persistNotes(list);
  setState({ notes: list, confirmDeleteNote: null });
  setToast('Note deleted');
}

// Keep two open tabs on the same device in sync.
window.addEventListener('storage', (ev) => {
  if (ev.key === ENTRIES_KEY) notifyEntries();
  if (ev.key === PREFS_KEY && prefsListener) prefsListener(getPrefsDB());
  // If another tab switched profiles, this tab must never keep writing into the old one (audit 6.9)
  if (ev.key === PROFILES_KEY && profilesState().activeId !== ACTIVE_PROFILE_ID) location.reload();
});

// Requests notification permission (native prompt in the Capacitor build, browser prompt on the
// web/PWA build once TEST_MODE is off for a real user). Safe to call every load — both permission
// paths no-op once already granted or denied. Named subscribePush for historical reasons; there is
// no server push involved, only local/on-device scheduling (v14).
async function subscribePush() { requestNotifPermission(); }

function missKey(e) { return e.medId + '|' + e.ts; }

// Per-row alternative to the banner's bulk "Clear": dismiss just this one missed window without
// logging a dose or creating any record. Stored as a list of "medId|ts" keys in prefs.
async function dismissMissedDose(e) {
  try {
    const next = (state.dismissedMisses || []).concat([missKey(e)]);
    await setPrefsDB({ dismissedMisses: next });
    setToast('Dismissed');
  } catch (err) {
    setToast('Could not save');
  }
}

// Per-row "Skipped": writes a real (permanent) entry marking this window as intentionally not
// given, rather than just hiding it. missedDosesFor() treats a skipped:true entry the same as a
// real dose for coverage purposes.
async function skipMissedDose(e) {
  await addEntryDB({ medId: e.medId, dose: null, mg: 0, ts: e.ts, skipped: true });
  setToast(nameOf(e.medId) + ' marked as skipped for ' + e.windowName + ' window');
}

async function clearMissedDoses() {
  const ts = state.now;
  try {
    await setPrefsDB({ missedClearedAt: ts });
    setToast('Missed doses cleared');
  } catch (e) {
    setToast('Could not save');
  }
}

// "Leave a tip" prompt (app-v32) — see SUPPORT_LINK near the top of the file. Due once
// state.entries.length has grown 20 past the count it was last acknowledged at, so it naturally
// re-appears every ~20 logs without needing its own separate counter. Tapping the tip button,
// "Maybe later", or the × all count as "acknowledged" and push the next appearance out another 20
// logs — the only thing that silences it for good is "Don't ask again".
function supportPromptDue() {
  return SUPPORT_LINK_READY && !state.supportOptOut && state.entries.length > 0 && (state.entries.length - (state.supportPromptAt || 0)) >= 20;
}
async function acknowledgeSupportPrompt() {
  const at = state.entries.length;
  try { await setPrefsDB({ supportPromptAt: at }); }
  catch (e) { setState({ supportPromptAt: at }); }
}
async function optOutSupportPrompt() {
  const at = state.entries.length;
  try { await setPrefsDB({ supportOptOut: true, supportPromptAt: at }); }
  catch (e) { setState({ supportOptOut: true, supportPromptAt: at }); }
  setToast('Got it — you won’t see this again');
}
function openSupportLink() {
  acknowledgeSupportPrompt();
  try { window.open(SUPPORT_LINK, '_blank', 'noopener'); } catch (e) {}
}

// Full local wipe: profile, medication list, and every logged entry. Since everything lives on
// this device only, this is the app's "start completely over" — after the reload the first-run
// welcome + guide appear again, exactly like a brand-new install.
function eraseAllAppData() {
  try {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('chemowell-app-') === 0 && k !== LICENSE_KEY) doomed.push(k); // purchases survive a data wipe
    }
    doomed.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  // Factory reset must boot exactly like a brand-new install — including landing on Home, not on
  // the Settings tab the erase button lives in (v11). UI_VIEW_KEY is declared later in the file,
  // but that's safe: this function only runs on user action, long after module evaluation (P3-3).
  try { sessionStorage.removeItem(UI_VIEW_KEY); } catch (e) {}
  location.reload();
}

// ---------- React via htm + preact-like approach using vanilla ----------
// Using a minimal reactive approach with vanilla JS for zero build step

// Legacy regimen data removed (audit 1.3) — fresh installs build their own med list.
const DEFAULT_MEDS = [];

// Medication configuration is intentionally browser-local for the testing app.
// Dose-entry history remains in on-device storage; configuration changes do not touch it.
const MED_CONFIG_STORAGE_KEY = 'chemowell-app-p-' + ACTIVE_PROFILE_ID + '-med-v1';
const DEFAULT_QUICK_LOG_IDS = [];
const DEFAULT_EVENING_IDS = [];
const DEFAULT_MORNING_IDS = [];

function deepCopyMeds(meds) {
  return meds.map(med => ({
    ...med,
    doses: Array.isArray(med.doses) ? med.doses.map(dose => ({ ...dose })) : undefined,
    windows: Array.isArray(med.windows) ? med.windows.map(window => ({ ...window })) : undefined
  }));
}

function safeMedicationId(value, fallback) {
  const cleaned = String(value || fallback || 'medication').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return cleaned || 'medication';
}

// v20 restart (audit P1-1): shared validator so a medication's live pausePeriods (normalizeMedication)
// and an archived medication's carried-forward pausePeriods (normalizeArchivedMeds, deleteMedicationConfig's
// restore path) can never drift into two different notions of "what's a valid period" -- both call sites
// use this instead of duplicating the same filter/map inline.
function normalizePausePeriods(raw) {
  return Array.isArray(raw) ? raw.filter(p => p && Number.isFinite(p.start)).map(p => ({ start: p.start, end: Number.isFinite(p.end) ? p.end : null })) : [];
}

function normalizeMedication(raw, index) {
  const original = raw || {};
  const id = safeMedicationId(original.id, original.name || ('medication-' + (index + 1)));
  const type = original.type === 'win' ? 'win' : 'gap';
  const doses = Array.isArray(original.doses) ? original.doses.filter(dose => dose && dose.label).map(dose => ({
    label: String(dose.label),
    mg: Number(dose.mg) || 0,
    ...(Number(dose.pills) ? { pills: Number(dose.pills) } : {})
  })) : undefined;
  // v20: start's ceiling was hard-clamped to 23 (silently truncating a legitimate 11:45 PM/23.75
  // start to 11:00 PM the moment 15-minute-granular windows exist) -- raised to 23.75, the highest
  // valid quarter-hour start. end's own ceiling (24, "through midnight") is unaffected.
  const windows = Array.isArray(original.windows) ? original.windows.map((window, windowIndex) => ({
    start: Math.max(0, Math.min(23.75, Number(window.start) || 0)),
    end: Math.max(1, Math.min(24, Number(window.end) || 24)),
    name: String(window.name || ('Window ' + (windowIndex + 1)))
  })).filter(window => window.end > window.start).sort((a, b) => a.start - b.start) : [];
  // v20 restart (audit P2-1): resolved once, as a local, so treatmentOnly can be derived from it below
  // instead of read independently from `original` (see the comment at the treatmentOnly/treatmentMode
  // fields for why the independent-read version was a real, if not currently reachable, bug).
  const treatmentMode = ['only', 'excluded'].includes(original.treatmentMode) ? original.treatmentMode
    : (typeof original.treatmentOnly === 'boolean' ? (original.treatmentOnly ? 'only' : 'none') : (original.chemoOnly ? 'only' : 'none'));
  const medication = {
    ...original,
    id,
    name: String(original.name || 'Untitled medication').trim(),
    sub: String(original.sub || '').trim(),
    type,
    // v23: gapH now survives normalize for scheduled ('win') meds too, so a scheduled medication can
    // optionally carry its own minimum-gap lockout on top of its time windows (Aaron-requested).
    gapH: Math.max(0, Number(original.gapH) || 0),

  if (!sd) return 'Every day';
  if (sd.mode === 'asneeded') return 'As needed';
  if (sd.mode === 'weekly') { const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; return (sd.days || []).map(d => names[d]).join(', ') || 'Every day'; }
  if (sd.mode === 'interval') return sd.n === 2 ? 'Every other day' : 'Every ' + sd.n + ' days';
  return 'Every day';
}

// DST-safe helpers: calendar arithmetic instead of fixed 86400000 hops (audit 6.3)
// v20: hour may now be a quarter-hour decimal (8.25 = 8:15) from the structured time-window picker.
// setHours(hour, ...) truncates a fractional first argument to the integer hour (verified), which
// would silently round every 15/30/45-minute window down to the top of the hour -- split into whole
// hour + minute explicitly instead, keeping the same DST-safe setHours-based approach (not raw
// millisecond arithmetic, which would reintroduce the DST bug this helper was written to avoid).
function hourTs(d0, hour) { const d = new Date(d0); d.setHours(Math.trunc(hour), Math.round((hour % 1) * 60), 0, 0); return d.getTime(); }
function nextDay(dayTs) { const d = new Date(dayStart(dayTs)); d.setDate(d.getDate() + 1); return d.getTime(); }

function missedDosesFor(dayTs, now) {
  const d0 = dayStart(dayTs);
  if (d0 < dayStart(MISSED_TRACK_SINCE)) return [];
  if (isInpatientDay(d0)) return []; // meds given by hospital staff that day — not tracked here
  const out = [];
  state.meds.filter(m => m.alerts && m.windows).forEach(med => {
    if (isPausedOn(med, d0)) return; // v20: skip exactly the days this medication was actually paused
    if (med.treatmentOnly && !treatmentActiveOn(med, d0)) return;
    if (treatmentExcludedNow(med, d0)) return; // v20: excluded near treatment day
    if (!medScheduledOn(med, d0)) return; // not taken on this calendar day — nothing to miss
    const windows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0)) : med.windows;
    const dayEntries = entriesFor(med.id).filter(e => e.ts >= d0 && e.ts < d0 + 86400000).sort((a, b) => a.ts - b.ts);
    const used = new Set();
    const wins = windows.map((w, i) => ({ w,
      ws: hourTs(d0, w.start), we: hourTs(d0, w.end),
      nextStart: i + 1 < windows.length ? hourTs(d0, windows[i + 1].start) : nextDay(d0),
      covered: false }));
    // Single pass, processed in window order: each window gets first claim (before later windows
    // are considered) over any unused same-day dose logged before this window's cutoff (i.e. any
    // time up to just before the next window opens) -- covering doses given early, on time, or
    // late. Processing strictly in window order prevents a later window from "stealing" a dose that
    // legitimately belongs to an earlier window's late-catch-up range: e.g. a single Dexamethasone
    // dose given at 1pm, between the 8am and 2pm windows, must credit the 8am window it was late
    // for, not get grabbed by the 2pm window just because 1pm also happens to be before 2pm's close.
    // (Fixed in v68 -- found via Aaron's report that a late-logged dose could still show as missed.)
    wins.forEach(win => {
      const hit = dayEntries.find(e => !used.has(e) && e.ts < win.nextStart);
      if (hit) { used.add(hit); win.covered = true; }
    });
    wins.forEach(win => {
      if (win.covered || now < win.we) return;
      // v23 bugfix (Aaron report): adding a brand-new medication mid-day immediately flagged every
      // already-passed window that day as "missed" -- the medication never had a chance to take
      // those doses because it didn't exist yet. A window that closed before the medication's own
      // createdAt never counts as missed. Medications saved before this fix have no createdAt and
      // keep behaving exactly as before (falls back to the app-wide MISSED_TRACK_SINCE floor above).
      if (med.createdAt && win.we <= med.createdAt) return;
      out.push({ missed: true, medId: med.id, ts: win.ws, windowName: win.w.name });
    });
  });
  // Per-row "Clear" (dismissMissedDose) hides a specific window without logging anything -- filtered
  // out here so it disappears everywhere missedDosesFor is used (banner, History, Today's Journal).
  const dismissed = state.dismissedMisses || [];
  return out.filter(m => !dismissed.includes(m.medId + '|' + m.ts)).sort((a, b) => a.ts - b.ts);
}
// Dose-progress ring data (design batch 3, item 11) — read-only over existing state, no storage
// changes. Same population missedDosesFor iterates minus the `alerts` filter: window-scheduled
// meds only (gap/as-needed meds have no "scheduled today" denominator). Skipped entries count as
// handled; taken is capped at the number of windows so extra logs never overflow the ring.
function doseProgressToday(now) {
  const d0 = dayStart(now);
  let scheduled = 0, taken = 0;
  state.meds.filter(m => m.windows && m.windows.length && medScheduledOn(m, now))
    .forEach(med => {
      if (med.paused) return; // v20: don't count a paused medication as an incomplete dose today
      if (med.treatmentOnly && !treatmentActiveOn(med, now)) return;
      if (treatmentExcludedNow(med, now)) return;
      const windows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0)) : med.windows;
      scheduled += windows.length;
      const logs = entriesFor(med.id).filter(e => e.ts >= d0 && e.ts < nextDay(d0)).length; // skipped entries count as handled
      taken += Math.min(windows.length, logs);
    });
  return { scheduled, taken };
}
// Count of unresolved missed doses from days strictly BEFORE today (v69). Used to power the
// pinned "previous days" card in the header -- kept separate from today's missedClearedAt-gated
// Clear button, since resolving a past-day miss now happens per-row in History (Took Later /
// Skipped / Clear), not via the old blanket Clear action.
function pastMissedCount(now) {
  const d0 = dayStart(now);
  let count = 0;
  for (let d = dayStart(MISSED_TRACK_SINCE); d < d0; d = nextDay(d)) {
    count += missedDosesFor(d, now).length;
  }
  return count;
}
function timeBucket(ts) { const hr = new Date(ts).getHours(); if (hr < 6) return 'Overnight'; if (hr < 12) return 'Morning'; if (hr < 17) return 'Afternoon'; return 'Evening'; }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtCountdown(ms) {
  if (ms <= 0) return '0m';
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m >= 1) { if (m < 5) { const s = Math.floor((ms % 60000) / 1000); return m + 'm ' + s + 's'; } return m + 'm'; }
  return Math.max(1, Math.floor(ms / 1000)) + 's';
}
function nameOf(id) { if (id === 'temp') return 'Temperature'; if (id === 'blood_pressure') return 'Blood Pressure'; if (id === 'weight') return 'Weight'; if (id === 'radiation_session') return 'Radiation Session'; if (id === 'cycle_start') return 'Period Start'; if (id === 'cycle_end') return 'Period End'; if (id === 'inpatient') return 'In-Patient Day'; if (id === 'inpatient_start') return 'In-Patient Start'; if (id === 'inpatient_end') return 'In-Patient End'; if (id === 'bowel_movement') return 'Bowel Movement'; if (id === 'appetite') return 'Appetite'; if (id && id.indexOf('symptom_') === 0) return SYMPTOM_TYPES[id.slice(8)] || id.slice(8); const m = state.meds.find(x => x.id === id); const archived = state.archivedMeds && state.archivedMeds[id]; return m ? m.name : (archived ? archived.name : id); }
function nowLocalISO() { return toLocalISO(simNow()); }
function toLocalISO(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// v23 (Aaron-requested copy simplification): the old "Today - Monday 7/28 at 5:12 AM" doubled up
// "Today" and the weekday, and repeated a time that already shows on its own "Next dose at ..."
// line right next to it -- cramped onto one line, it's what was forcing the ellipsis-clipping fix
// below. Just weekday + date reads cleanly and never needs the "Today -" special case.
function fmtDateLabel(ts) {
  const weekday = new Date(ts).toLocaleDateString([], { weekday: 'long' });
  const md = (new Date(ts).getMonth() + 1) + '/' + new Date(ts).getDate();
  return weekday + ' ' + md;
}

// Protonix's evening (PM) dose log time for the given day, if logged yet — the second dose,
// after its own Morning window (8am-12pm) has closed.
function protonixEveningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 + 12 * 3600000 && e.ts < d0 + 86400000);
  return entry ? entry.ts : null;
}

// Iron (and Compazine's own routine, unlinked) open at 10 PM by default, but if Protonix's evening
// dose was logged, Iron instead opens 2 hours after that actual log time (so the two are spaced out).
function eveningWindowsFor(med, d0) {
  const pTs = protonixEveningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Night' }];
  }
  return med.windows; // default: 10 PM
}

// Protonix's morning (AM) dose log time for the given day, if logged yet — any entry logged
// before its own Evening window opens (noon).
function protonixMorningLogTs(d0) {
  const es = entriesFor('protonix');
  const entry = es.find(e => e.ts >= d0 && e.ts < d0 + 12 * 3600000);
  return entry ? entry.ts : null;
}

// Buspirone/Paroxetine open at 10 AM by default (2h after Protonix's own default 8 AM dose time),
// but if Protonix's actual morning dose was logged, they instead open 2 hours after that real log
// time and stay open through end of day (mirrors eveningWindowsFor's pattern for Iron exactly:
// Iron defaults to 10 PM, 2h after Protonix's default 8 PM evening time, then shifts the same way).
function morningWindowsFor(med, d0) {
  const pTs = protonixMorningLogTs(d0);
  if (pTs) {
    const startH = (pTs + 2 * 3600000 - d0) / 3600000;
    if (startH < 24) return [{ start: Math.max(0, startH), end: 24, name: 'Morning' }];
  }
  return med.windows; // default: 10 AM–midnight
}

function status(med) {
  const now = state.now;
  // v20: defense-in-depth -- the Home card bypasses status() entirely for a paused medication (see
  // medCards/renderGroupedMedsCard), but logMed()/other direct callers of status() are reachable
  // independent of the card UI, so this closes that gap too.
  if (med.paused) return { locked: true, paused: true };
  if (med.id === 'zofran' && zofranBlockedOn(now)) {
    // 3-day block (chemo day + 2 following days, see zofranBlockedOn) — opens on day+3 at 8am.
    return { locked: true, chemoBlock: true, availableAt: dayStart(nextChemoTs()) + 3 * 86400000 + 8 * 3600000 };
  }
  const es = entriesFor(med.id).slice().sort((a, b) => a.ts - b.ts);
  if (med.type === 'gap') {
    // Check daily ceiling first (Tylenol mg or Imodium pills)
    if (med.ceiling) {
      const dc = dailyCeiling(med);
      if (dc && dc.used >= dc.max) {
        if (med.rollingCeilingH) {
          // Rolling-window ceiling (e.g. Morphine's 15 mg / 4h): the lockout self-resolves as old
          // doses age out of the window, not at midnight — compute the actual next-available time.
          return { locked: true, ceilingHit: true, rollingCeiling: true, ceilingLabel: dc.label, availableAt: rollingCeilingAvailableAt(med) };
        }
        return { locked: true, ceilingHit: true, ceilingLabel: dc.label };
      }
    }
    // Form-specific volume cap (e.g. Tylenol Liquid's 90 mL/24h) — independent of the mg ceiling
    if (med.volumeCeilingMl) {
      const vc = dailyVolumeCeiling(med);
      if (vc && vc.used >= vc.max) {
        return { locked: true, ceilingHit: true, ceilingLabel: vc.label };
      }
    }
    // Rolling-ceiling meds (Morphine) are gated solely by the mg ceiling above — a half dose must
    // NOT trigger a flat gapH lockout the way a full dose does, since there's still 7.5 mg of room
    // left in the 4-hour window. Per-dose-button blocking (doseBlocked, in the render loop) still
    // prevents logging a dose that would push the rolling total over the ceiling.
    if (med.rollingCeilingH) return { locked: false };
    const last = es[es.length - 1];
    if (!last) return { locked: false };
    const at = last.ts + med.gapH * 3600000;
    return { locked: now < at, availableAt: at };
  }
  const d0 = dayStart(now), atH = (h) => d0 + h * 3600000;
  const windows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0)) : med.eveningLinkedToProtonix ? eveningWindowsFor(med, d0) : med.morningLinkedToProtonix ? morningWindowsFor(med, d0) : med.windows;
  // v23: scheduled meds can now optionally carry a gapH minimum-gap lockout on top of their time
  // windows (Aaron-requested — "scheduled meds still could have gap timers"). This ORs in with the
  // window logic below: a window being open no longer guarantees "available" if the last dose was
  // logged too recently. The existing "Log early" override UI already keys off locked/availableAt
  // generically, so it picks this up with no changes of its own.
  const lastForGap = es[es.length - 1];
  const gapAvailableAt = (med.gapH && lastForGap) ? lastForGap.ts + med.gapH * 3600000 : null;
  for (const w of windows) {
    const ws = atH(w.start), we = atH(w.end);
    const used = es.some(e => e.ts >= ws && e.ts < we);
    if (used) continue;
    if (now < ws) return { locked: true, availableAt: gapAvailableAt ? Math.max(ws, gapAvailableAt) : ws, windowName: w.name };
    if (now >= ws && now < we) {
      if (gapAvailableAt && now < gapAvailableAt) return { locked: true, availableAt: gapAvailableAt, windowName: w.name };
      return { locked: false, windowName: w.name };
    }
  }
  const chemoOver = med.treatmentOnly && !treatmentActiveOn(med, d0 + 86400000);
  if (chemoOver) {
    return { locked: true, courseComplete: true };
  }
  const tomorrowWindows = med.id === 'dexamethasone' ? dexWindowsForOffset(chemoOffsetFor(d0 + 86400000)) : windows;
  const first = tomorrowWindows[0];
  return { locked: true, availableAt: d0 + 86400000 + first.start * 3600000, windowName: first.name };
}

function setToast(msg) {
  setState({ toast: msg });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setState({ toast: null }), 4500);
}

function afterLog(entry) {
  const twoH = 2 * 3600000;
  if (entry.medId === 'iron' || entry.medId === 'protonix') {
    const other = entry.medId === 'iron' ? 'protonix' : 'iron';
    const near = state.entries.find(e => e.medId === other && e.id !== entry.id && Math.abs(e.ts - entry.ts) <= twoH);
    if (near) { setState({ warn: { tone: 'amber', title: 'Iron + Protonix timing', body: 'Iron and Protonix were logged within 2 hours of each other. Protonix (a PPI) lowers stomach acid, which can markedly reduce iron absorption. Aim to separate the two by at least 2 hours.' } }); return; }
  }
  if (entry.medId === 'tylenol' || entry.medId === 'tylenol-liquid') {
    const mg = tylenolMg();
    const tylenol = state.meds.find(med => med.id === 'tylenol');
    const limit = medicationCeilingMax(tylenol) || 0;
    const mgOver = limit > 0 && mg > limit;
    let volOver = false, vol = 0, liquidMed = null;
    if (entry.medId === 'tylenol-liquid') {
      liquidMed = state.meds.find(med => med.id === 'tylenol-liquid');
      vol = dailyVolumeMl('tylenol-liquid');
      volOver = !!(liquidMed && liquidMed.volumeCeilingMl && vol > liquidMed.volumeCeilingMl);
    }
    if (mgOver && volOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg (above the " + limit.toLocaleString() + " mg daily limit) and Tylenol Liquid volume is " + vol + " mL (above the " + liquidMed.volumeCeilingMl + " mL daily limit). Do not give more without contacting the care team." } });
    } else if (mgOver) {
      setState({ warn: { tone: 'red', title: 'Acetaminophen ceiling exceeded', body: "Today's Tylenol total is " + mg.toLocaleString() + " mg, above the " + limit.toLocaleString() + " mg daily limit. Do not give more without contacting the care team." } });
    } else if (volOver) {
      setState({ warn: { tone: 'red', title: 'Tylenol Liquid volume ceiling exceeded', body: "Today's Tylenol Liquid total is " + vol + " mL, above the " + liquidMed.volumeCeilingMl + " mL daily limit. Do not give more without contacting the care team." } });
    }
  } else {
    const configuredMedication = state.meds.find(med => med.id === entry.medId);
    const configuredLimit = dailyCeiling(configuredMedication);
    if (configuredLimit && configuredLimit.used > configuredLimit.max) {
      setState({ warn: { tone: 'red', title: configuredMedication.name + ' daily limit exceeded', body: "Today's " + configuredMedication.name + ' total is ' + configuredLimit.used + ' ' + configuredLimit.unit + ', above the ' + configuredLimit.label + ' daily limit. Do not give more without contacting the care team.' } });
    }
  }
}

async function logMed(medId, dose, opts) {
  opts = opts || {};
  const med = state.meds.find(m => m.id === medId);
  const st = status(med);
  // v26 (Aaron-requested): a medication restricted to specific days used to be a dead-end on an
  // off day -- no log option at all. It now gets the same arm-then-confirm override as any other
  // locked state (daily limit, gap timer, closed window); offDay rides along on state.override so
  // the card renderers' own offDay gating (medCards, renderGroupedMedsCard) — matches the file's own
  // scheduleDays/medScheduledOn logic used everywhere else a medication's "is it scheduled today"
  // question gets asked.
  const offDay = !medScheduledOn(med, state.now);
  if ((st.locked || offDay) && !opts.force) { setState({ override: { medId, offDay } }); return; }
  setState({ override: null, timeModal: { type: 'med', medId, dose, opts, timeValue: nowLocalISO() } });
}

// Backfill a missed dose from History — opens the same log flow, pre-filled to the missed
// window's scheduled time (editable), bypassing the lock check since this IS the catch-up path.
function logMissedDose(e) {
  const med = state.meds.find(m => m.id === e.medId);
  if (!med) return;
  const dose = med.doses ? med.doses[0] : null;
  const d = new Date(e.ts);
  const pad = n => String(n).padStart(2, '0');
  const iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  setState({ override: null, timeModal: { type: 'med', medId: e.medId, dose, opts: { force: true }, timeValue: iso } });
}

function tempDefault() { return CONFIG.tempUnit === 'Celsius' ? '36.9' : '98.5'; }
async function logTemp() {
  const raw = (state.tempInput || '').trim();
  const v = parseFloat(raw);
  const tempOk = CONFIG.tempUnit === 'Celsius' ? (v >= 30 && v <= 45) : (v >= 86 && v <= 113);
  if (!raw || isNaN(v) || !tempOk) { setToast(CONFIG.tempUnit === 'Celsius' ? 'Enter a valid temperature in °C (30–45)' : 'Enter a valid temperature in °F (86–113)'); return; }
  setState({ timeModal: { type: 'temp', tempValue: v, timeValue: nowLocalISO() } });
}

async function setChemoDate() {
  const raw = (state.chemoInput || '').trim();
  if (!raw) { setToast('Pick a date first'); return; }
  const p = raw.split('-').map(Number);
  const ts = new Date(p[0], p[1] - 1, p[2]).getTime();
  if (isNaN(ts)) { setToast('Invalid date'); return; }
  await addEntryDB({ medId: 'chemo_date', dose: 'Treatment scheduled', mg: 0, ts, loggedAt: Date.now() });
  setState({ chemoInput: '' });
  setToast('Treatment date set — ' + new Date(ts).toLocaleDateString());
}

async function logBloodPressure() {

async function logWeight() {

  const v = parseFloat(raw);
  if (!raw || isNaN(v) || v <= 0 || v > 999) { setToast('Enter a valid weight'); return; }
  setState({ timeModal: { type: 'weight', weightValue: v, timeValue: nowLocalISO() } });

async function confirmTimeAndLog() {
  const m = state.timeModal;
  if (!m) return;
  // 'period' logs its own Start/End pair below with its own validation -- it has no single
  // m.timeValue, so it's excluded from this shared single-timestamp check.
  let ts;
  if (m.type !== 'period') {
    ts = new Date(m.timeValue).getTime();
    if (isNaN(ts)) { setToast('Invalid time'); return; }
    if (ts > simNow() + 60000 && !m.futureOk) { state.timeModal.futureOk = true; setState({ timeModal: state.timeModal }); return; }
  }

  if (m.type === 'med') {
    const med = state.meds.find(x => x.id === m.medId);
    if (med.painScale && !m.painLevel) { setToast('Select a pain level before logging ' + med.name); return; }
    const entry = { medId: m.medId, dose: m.dose ? m.dose.label : null, mg: m.dose ? (m.dose.mg || 0) : 0, ts };
    if (m.dose && m.dose.pills) entry.pills = m.dose.pills;
    if (med.volumePerDoseMl) entry.volumeMl = med.volumePerDoseMl;
    if (med.painScale && m.painLevel) entry.painLevel = m.painLevel;
    const early = !!(m.opts && m.opts.force) && isEarlyAt(med, ts);
    // v23 (Aaron-requested): confirm on-screen when a dose was force-logged over today's daily
    // limit, the same way an early gap-timer override already gets "(early)" appended below.
    const overLimit = !!(m.opts && m.opts.force) && !!med.ceiling && (() => {
      const dc = dailyCeiling(med);
      if (!dc) return false;
      const amt = med.ceilingUnit ? (entry.pills || 0) : (entry.mg || 0);
      return amt > 0 && amt > (dc.max - dc.used);
    })();
    // v26 auditor fix: the off-day override (Aaron-requested — every medication can now be logged
    // on a day it isn't scheduled for) went through the exact same force-logMed path as early/
    // over-limit overrides but was never checked here, so the resulting entry carried no override
    // flag at all and was indistinguishable from a normal on-schedule dose in Journal/History --
    // silently losing the "this was a caregiver exception" audit trail for the release's headline
    // feature. Checked against the logged date (dayStart(ts)), not state.now, so a caregiver
    // backdating/adjusting the time in the modal is still evaluated against the day they actually
    // logged for.
    const offDay = !!(m.opts && m.opts.force) && !medScheduledOn(med, dayStart(ts));
    // v23 auditor fix: both "early" and "over-limit" overrides set the same entry.override flag,
    // so an over-limit log showed a factually wrong "EARLY" badge in the Journal/History even
    // though it wasn't early at all -- overrideReason lets the badge say which one actually
    // happened. Entries logged before this fix have override:true with no overrideReason; the
    // badge below defaults those to "Early" since that was the only override reason that existed
    // at the time they were saved. v26: offDay folds into the same scheme rather than a parallel
    // one -- reasonParts lists every reason actually true, so a dose that's simultaneously off-day
    // and over the daily limit (e.g. a caregiver already force-logged once today) still records
    // both facts instead of one silently overwriting the other.
    if (early || overLimit || offDay) {
      entry.override = true;
      const reasonParts = [];
      if (offDay) reasonParts.push('offDay');
      if (early) reasonParts.push('early');
      if (overLimit) reasonParts.push('overLimit');
      entry.overrideReason = reasonParts.length > 1 ? reasonParts.join('+') : reasonParts[0];
    }
    setState({ timeModal: null });
    await addEntryDB(entry);
    setToast(med.name + ' logged' + (m.dose ? (' · ' + m.dose.label) : '') + (entry.painLevel ? (' · Pain ' + entry.painLevel + '/10') : '') + (offDay ? ' (not scheduled today)' : '') + (early ? ' (early)' : '') + (overLimit ? ' (over today’s limit)' : '') + ' at ' + fmtTime(ts));
    setTimeout(() => afterLog({ ...entry, id: 'pending' }), 500);

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  let deferredValue; // <select> needs value applied AFTER its options exist; attribute alone never selects an option
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') {
        Object.assign(el.style, v);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'innerHTML') {
        el.innerHTML = v;
      } else if (k === 'className') {
        el.className = v;
      } else if (k === 'value') {
        el.setAttribute('value', v);
        deferredValue = v;
      } else {
        el.setAttribute(k, v);
      }
    }
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }
  if (deferredValue !== undefined) { try { el.value = deferredValue; } catch (e) {} }
  return el;
}

// v27 (Aaron-reported): scrollTo(0,0) called synchronously right after a tap can get quietly undone
// on mobile Safari, which resizes the viewport (collapsing/expanding the URL bar) a frame or two
// AFTER the tap -- the page looks like it "jumps down too far" once that resize settles, landing
// below the field the user is meant to type into. A second scrollTo on the next animation frame,
// after that settle has happened, fixes it without changing behavior on browsers that don't have
// this quirk (the second call is a no-op there since the first already landed at 0,0).
// v28 (Aaron-reported regression from the above): navigateTo('home') calls this, and the SAME call
// can also synchronously trigger the guided tour's own positionTour(), which -- for a step whose
// target sits further down the page (e.g. "quick-log", pointing at the newly-added medication card)
// -- deliberately scrolls somewhere other than 0. That legitimate scroll was getting silently undone
// a frame later by this function's own deferred safety net, which doesn't know anything scrolled on
// purpose in between and just resets back to 0 -- Aaron saw this as the tour's popup card sitting up
// top while the medication it was pointing at stayed off-screen at the bottom. scrollAdjustToken lets
// any later, more-authoritative scroll action (positionTour bumps it before its own scrollIntoView)
// cancel a still-pending deferred reset from an earlier scrollToTop() call.
let scrollAdjustToken = 0;
function scrollToTop() {
  const token = ++scrollAdjustToken;
  window.scrollTo(0, 0);
  requestAnimationFrame(() => { if (token === scrollAdjustToken) window.scrollTo(0, 0); });
}
function navigateTo(view) {
  const editorClosing = !!state.medEditor && view !== 'meds'; // audit v12 P3-1: nav-away also closes the editor
  const next = { view, reportsView: view === 'reports' ? null : state.reportsView, medEditor: view === 'meds' ? state.medEditor : null, confirmDeleteMed: null };
  setState(next);
  persistView(view);
  scrollToTop();
  if (editorClosing) tourEvent('medEditor:closed'); // step the tour back BEFORE the view event so it re-points at Add
  tourEvent('view:' + view);
}

// ---- Left-side nav drawer (app-v22) — houses Profile/Calendar/Settings per Owner request. Kept
// as its own small state machine (not just a boolean) so open/close can manage focus properly:
// the trigger button ref is remembered so focus returns to it on close, matching standard
// dialog/drawer accessibility behavior (Designer research: M3 navigation drawer guidelines).
let drawerTriggerEl = null;
function openDrawer() {
  // Audit nice-to-have: the drawer (z90) renders above the first-run tour card (z80), so opening it
  // mid-tour buries the tour with no way back short of closing the drawer first. The hamburger has
  // no reason to be tapped mid-tour (the tour's own Skip/Back/Next controls are always available),
  // so simplest fix is just not opening the drawer while a tour is in progress.
  if (state.tourStep != null) return;
  drawerTriggerEl = document.querySelector('[data-tour="menu-btn"]');
  setState({ drawerOpen: true });
  setTimeout(() => { const el = document.getElementById('drawer-close-btn'); if (el) el.focus(); }, 50);
}
function closeDrawer() {
  setState({ drawerOpen: false });
  if (drawerTriggerEl) { try { drawerTriggerEl.focus(); } catch (e) {} }
}
function drawerGo(view) {
  closeDrawer();
  navigateTo(view);
}
// Escape closes the drawer from anywhere; Tab is trapped inside it while open so keyboard focus
// can't silently leave into the (visually obscured, scrim-covered) app behind it. Registered once
// at module scope, not per-render, so it never double-attaches.
document.addEventListener('keydown', (ev) => {
  if (!state.drawerOpen) return;
  if (ev.key === 'Escape') { ev.preventDefault(); closeDrawer(); return; }
  if (ev.key === 'Tab') {
    const panel = document.getElementById('app-drawer');
    if (!panel) return;
    const focusables = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});

// v28 (Aaron-reported): tapping into a text field (most noticeably Medication name, right after
// onboarding) opens the on-screen keyboard, which resizes the visible viewport -- on some mobile
// browsers the page settles scrolled to a spot that leaves the just-focused field above the fold,
// so the user has to manually scroll back up to see what they're typing. A short delay lets the
// keyboard's own open animation finish resizing the viewport first, then nudges the focused field
// into view -- registered once at module scope (like the drawer's Tab-trap above) so it never
// double-attaches on re-render.
document.addEventListener('focusin', (ev) => {
  const el = ev.target;
  if (!el || typeof el.matches !== 'function' || !el.matches('input, select, textarea')) return;
  setTimeout(() => { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 320);
});

}

// Bulk-dismisses every missed dose currently visible in History's missed-only view (respecting
// whatever's already been resolved/dismissed) in one write, then confirms with a toast -- the
// "Clear all" companion to the per-row Clear button, for clearing a backlog in one tap instead of
// one row at a time. Uses the same dismissedMisses prefs field as the per-row Clear (v68), so it's
// stored in the same on-device prefs as that field.
async function clearAllMissedInHistory(now) {
  const all = [];
  for (let d = dayStart(MISSED_TRACK_SINCE); d <= dayStart(now); d = nextDay(d)) {
    missedDosesFor(d, now).forEach(m => all.push(missKey(m)));
  }
  if (!all.length) return;
  try {
    const next = (state.dismissedMisses || []).concat(all);
    await setPrefsDB({ dismissedMisses: next });
    setToast(all.length + ' missed dose' + (all.length > 1 ? 's' : '') + ' cleared');
  } catch (err) {
    setToast('Could not save — please try again');
  }
}

// Dose-progress ring (item 11): 44px SVG built as an innerHTML string, matching the existing
// lockSVG / weight-chart string pattern. Hidden entirely when nothing is scheduled today.
function doseRing(now) {
  const { scheduled, taken } = doseProgressToday(now);
  if (scheduled === 0) return null;
  const complete = taken >= scheduled && scheduled > 0;
  const C = 113.1; // 2π·18
  const offset = C * (1 - taken / scheduled);
  let svg = '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">';
  svg += '<circle cx="22" cy="22" r="18" stroke="#F3C7B4" stroke-width="4" fill="none"></circle>';
  svg += '<circle cx="22" cy="22" r="18" stroke="' + (complete ? '#0F9D6B' : '#BF4C1A') + '" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 22 22)" style="transition: stroke-dashoffset .5s ease"></circle>';
  svg += complete
    ? '<text x="22" y="27" text-anchor="middle" font-size="16" font-weight="800" fill="#0C7F57">✓</text>'
    : '<text x="22" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#2A2127" font-family="ui-monospace,Menlo,monospace">' + taken + '/' + scheduled + '</text>';
  svg += '</svg>';
  return h('div', { innerHTML: svg, role: 'img', 'aria-label': taken + ' of ' + scheduled + ' scheduled doses logged today', style: { display: 'inline-flex', marginTop: '4px' } });
}

// Shared renderer for a "grouped" meds card (Evening meds, Morning meds) — a set of `type:'win'`
// meds presented together in one card with a "Take all" button when 2+ are currently open, instead
// of scattering them across the individual Quick Log cards. Used for the Protonix-linked meds
// (Buspirone/Paroxetine in the morning, Iron/Compazine in the evening).
function renderGroupedMedsCard(title, meds, now) {
  const inpatientNow = isInpatientActiveNow();
  // v20: paused and treatment-window-hidden meds are excluded from "due"/"Take all" the same way
  // medCards' upstream filter already excludes them for standalone Quick Log cards.
  const dueMeds = meds.filter(m => { if (m.paused) return false; if (m.treatmentOnly && !treatmentActiveOn(m, now)) return false; if (treatmentExcludedNow(m, now)) return false; if (!medScheduledOn(m, now)) return false; const s = status(m); return !s.locked; });
  return h('section', null,
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' } },
      h('div', { style: { ...TYPE.label, color: '#915E48' } }, title),
      (dueMeds.length >= 2 && !inpatientNow) ? h('button', { onClick: () => setState({ timeModal: { type: 'multi', medIds: dueMeds.map(m => m.id), timeValue: nowLocalISO() } }), style: { minHeight: '44px', padding: '0 16px', borderRadius: '11px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '13.5px', fontWeight: '700', boxShadow: '0 6px 18px rgba(168,61,15,0.32)' } }, 'Take all (' + dueMeds.length + ')') : null
    ),
    h('div', { style: { background: '#FFFFFF', border: '1px solid #E9D8D1', borderRadius: '18px', overflow: 'hidden', marginTop: '11px', boxShadow: '0 4px 24px rgba(203,122,87,0.10), 0 1px 2px rgba(203,122,87,0.06)' } },
      ...meds.map((med, i) => {
        if (med.paused) {
          // v20: pause wins over every other row state, matching medCards' standalone card ordering.
          // Designer review (v20): apply the same opacity:0.65 muting as the treatment-excluded row
          // just below, so this card has one consistent "row is inert" visual language instead of a
          // third, weaker one of its own; copy also aligned with the standalone Home card's wording.
          return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none', opacity: '0.65' } },
            h('div', { style: { flex: '1', minWidth: '0' } },
              h('div', { style: { ...TYPE.title, color: '#554A52' } }, med.name + ' \u2014 Paused'),
              h('div', { style: { ...TYPE.caption, color: '#7A6E76', marginTop: '2px' } }, 'Not tracked while paused. Resume anytime.')
            ),
            h('button', { onClick: () => setMedicationPaused(med.id, false), style: { flexShrink: '0', minHeight: '44px', padding: '0 16px', borderRadius: '999px', background: '#FFFFFF', border: '1px solid #D7B8AA', color: '#6D5247', fontSize: '13px', fontWeight: '700' } }, 'Resume')
          );
        }
        if ((med.treatmentOnly && !treatmentActiveOn(med, now)) || treatmentExcludedNow(med, now)) {
          // v20: this grouped-card path never gated treatmentOnly/excluded at all before this
          // release (a pre-existing gap noted in the schedule-window brief's blast-radius review) --
          // closing it now for both directions rather than leaving grouped placement inconsistent
          // with standalone Quick Log cards, which have always hidden the card outright here.
          return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none', opacity: '0.65' } },
            h('div', { style: { flex: '1', minWidth: '0' } },
              h('div', { style: { ...TYPE.title, color: '#554A52' } }, med.name),
              h('div', { style: { ...TYPE.caption, color: '#7A6E76', marginTop: '2px' } }, med.treatmentOnly ? (isOtherTreatmentType() ? 'Outside its date window' : 'Outside its treatment-day window') : (isOtherTreatmentType() ? 'Excluded near your date' : 'Excluded near treatment day'))
            )
          );
        }
        // v26 (Aaron-requested): matches medCards' equivalent fix -- a day-restricted medication now
        // falls through to the normal override-capable row instead of a dead-end inert row, so every
        // medication has the same "log it anyway" option regardless of why it's not the default
        // available state. inpatientNow still wins outright (hospital-administered, not overridable).
        const offDay = !inpatientNow && !medScheduledOn(med, now);
        if (inpatientNow) {
          return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none' } },
            h('div', { style: { flex: '1', minWidth: '0' } },
              h('div', { style: { ...TYPE.title, color: '#9A6419' } }, med.name + ' - In-Patient (Restricted)'),
              h('div', { style: { fontSize: '12px', color: '#7A5313' } }, 'Given by hospital staff')
            )
          );
        }
        const st = status(med);
        const locked = !!st.locked || offDay;
        const todayLogs = entriesFor(med.id).filter(e => e.ts >= dayStart(now));
        const lastToday = todayLogs[todayLogs.length - 1];
        const isOv = !!(state.override && state.override.medId === med.id);
        // v23 bugfix: this card's ceiling handling was silently broken -- a medication that hit its
        // daily limit (st.ceilingHit, no rollingCeilingH) has no st.availableAt at all, so the old
        // "Opens " + fmtTime(undefined) button rendered as "Opens Invalid Date", and the override
        // button unconditionally said "Log early" even when the real reason was the daily limit, not
        // a gap timer. Also brings the override capability here in line with the standalone Quick Log
        // card (Aaron: "there isn't a way to override taking a med if over the limit"). Auditor v23
        // re-review caught a second reachable case (st.courseComplete -- a treatment-only medication
        // whose window has ended) that still hit the same "Invalid Date" bug; handled alongside
        // ceilingHit here rather than leaving one case fixed and the other not. Designer v23 re-review
        // caught the override buttons had no explanatory copy (unlike the standalone card's red
        // banner) and sat at 42px, under the app's 44px touch-target floor -- both fixed below.
        const overrideReasonLabel = st.courseComplete ? 'Course complete' : st.ceilingHit ? 'Log over limit' : offDay ? 'Log anyway' : 'Log early';
        const overrideExplain = st.courseComplete
          ? 'This medication’s treatment window has ended. Log it anyway?'
          : st.ceilingHit
            ? 'This would go over today’s limit. Log it anyway?'
            : offDay
              ? ('Not scheduled today (' + scheduleDaysLabel(med) + '). Log it anyway?')
              : ('Closed — opens ' + (st.availableAt ? fmtTime(st.availableAt) : 'later') + '. Log it early anyway?');
        let right;
        if (isOv) {
          right = h('div', { style: { display: 'flex', gap: '7px', flexShrink: '0' } },
            h('button', { onClick: () => logMed(med.id, med.doses ? med.doses[0] : null, { force: true }), style: { minHeight: '44px', padding: '0 13px', borderRadius: '11px', background: '#C0453B', color: '#fff', fontSize: '13px', fontWeight: '700' } }, overrideReasonLabel),
            h('button', { onClick: () => setState({ override: null }), style: { minHeight: '44px', padding: '0 11px', borderRadius: '11px', background: 'rgba(255,255,255,0.5)', border: '1px solid rgba(246,108,49,0.15)', color: '#7A6E76', fontSize: '13px', fontWeight: '600' } }, 'Cancel')
          );
        } else if (!locked) {
          right = h('button', { onClick: () => logMed(med.id, med.doses ? med.doses[0] : null), style: { minHeight: '44px', padding: '0 20px', borderRadius: '12px', background: 'linear-gradient(135deg, #E46F3C 0%, #BF4C1A 100%)', color: '#fff', fontSize: '14px', fontWeight: '700', boxShadow: '0 6px 18px rgba(168,61,15,0.32)', flexShrink: '0' } }, 'Log');
        } else {
          right = h('button', { onClick: () => setState({ override: { medId: med.id } }), className: 'mono', style: { minHeight: '44px', padding: '0 12px', borderRadius: '99px', background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(246,108,49,0.15)', color: '#5C6662', fontSize: '12.5px', fontWeight: '600', flexShrink: '0' } }, st.courseComplete ? 'Course complete' : st.ceilingHit ? 'Limit reached' : offDay ? 'Not scheduled' : (st.availableAt ? ('Opens ' + fmtTime(st.availableAt)) : 'Closed'));
        }
        return h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 15px', borderTop: i > 0 ? '1px solid rgba(246,108,49,0.08)' : 'none' } },
          h('div', { style: { flex: '1', minWidth: '0' } },
            h('div', { style: { ...TYPE.title, color: '#2A2127' } }, med.name),
            h('div', { style: { ...TYPE.caption, color: '#7A6E76' } }, med.sub + (med.note ? (' · ' + med.note) : '')),
            lastToday ? h('div', { style: { fontSize: '12.5px', color: '#0C7F57', fontWeight: '700', marginTop: '2px' } }, '✓ Logged ' + fmtTime(lastToday.ts)) : null,
            isOv ? h('div', { style: { fontSize: '12px', color: '#A15B56', fontWeight: '600', marginTop: '3px', lineHeight: '1.35' } }, overrideExplain) : null
          ),
          right
        );
      })
    )
  );
}

function renderContent(now, mg, pct, tyColor, ceiling) {
  if (state.view === 'meds') return renderMedicationManager(now);
  if (state.view === 'settings') return renderSettings(now);
  if (state.view === 'account') return renderAccount(now);
  if (state.view === 'reports') return state.reportsView ? renderReportDetail(state.reportsView, now) : renderReportsMenu(now);
  if (state.view === 'inpatient') return renderInPatient(now);
  if (state.view === 'symptoms') return renderSymptoms(now);
  if (state.view === 'calendar') return renderCalendarView(now);
  if (state.view === 'faq') return renderFaqView(now);
  if (state.view === 'notes') return renderNotesView(now);
  return [...renderToday(now, mg, pct, tyColor, ceiling)];
}

// ---------- First-run setup (app-v33: short profile buildup \u2014 name, sex, treatment) ----------
// Owner-specified: a full profile buildup but with FEW questions, since most of this is never

// regression surface without adding information. Sex gates menstrual-cycle tracking (Female
// only); treatment type gates the radiation-session card vs the chemo plan banner. All drafts

// original name field used.
let setupNameDraft = '';

function completeSetup() {
  const name = setupNameDraft.trim();
  if (!name) { setToast('Enter the patient\u2019s name to get started'); return; }
  if (!setupSexDraft) { setToast('Select Male or Female to continue'); return; }
  if (!setupTreatmentDraft) { setToast('Select the treatment type to continue'); return; }
  // One prefs write for all three (+ clearing any pendingName handoff from "Add profile") \u2014 the
  // render gate watches patientName alone, so a multi-write here could paint the app shell with
  // sex/treatment still unset for one frame.
  setPrefsDB({ patientName: name, sex: setupSexDraft, treatmentType: setupTreatmentDraft, pendingName: null });
  const ps = profilesState();
  const ap = ps.list.find(p => p.id === ps.activeId);
  if (ap) { ap.name = name; saveJSON(PROFILES_KEY, ps); }
  setToast('Welcome to ChemoWell');
  if (!getPrefsDB().tourDone) setState({ tourStep: 0 });
}

  // inputs/selects with a stable id opt in -- elements without one are left alone, unchanged from

  const prevSelEnd = (prevActive && typeof prevActive.selectionEnd === 'number') ? prevActive.selectionEnd : null;
  root.innerHTML = '';
  root.appendChild(page);
  if (sheetScroll > 0) { const freshSheet = document.getElementById('plans-sheet'); if (freshSheet) freshSheet.scrollTop = sheetScroll; }
  if (prevActiveId) {
    const freshActive = document.getElementById(prevActiveId);
    if (freshActive) {
      freshActive.focus();

      }
    }
  }
  positionTour();
}

// Short "Mon, Jul 20" label for a collapsed date-picker pill button (v70).
function calPillLabel(dateStr) {
  if (!dateStr) return 'Pick a date';
  const [y, mo, d] = dateStr.split('-').map(Number);
  return new Date(y, mo - 1, d).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function calShift(cursorStr, delta) {
  const [y, mo] = cursorStr.split('-').map(Number);
  const nd = new Date(y, mo - 1 + delta, 1);
  return nd.getFullYear() + '-' + String(nd.getMonth() + 1).padStart(2, '0');
}

// Compact month-grid date picker, replacing native date/datetime-local inputs (v68) — native
// pickers render as a scrolling wheel on mobile, which Aaron asked to replace with a tappable
// calendar everywhere a date is chosen. dateStr is 'YYYY-MM-DD' (or '' for none selected);
// cursorStr is the 'YYYY-MM' month currently displayed (independent of the selected date, so
// navigating months doesn't require a selection). onPick(dateStr) fires when a day is tapped;
// onNav(delta) fires -1/+1 to move the displayed month.
function renderCalendar(dateStr, cursorStr, onPick, onNav) {
  const [cy, cm] = cursorStr.split('-').map(Number);
  const first = new Date(cy, cm - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(cy, cm, 0).getDate();
  const todayStr = toLocalISO(simNow()).slice(0, 10);
  const monthLabel = first.toLocaleDateString([], { month: 'long', year: 'numeric' });
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const dstr = (d) => cy + '-' + String(cm).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  return h('div', { style: { background: 'rgba(255,255,255,0.5)', border: '1px solid #E9D8D1', borderRadius: '13px', padding: '10px 10px 6px' } },
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' } },
      h('button', { onClick: () => onNav(-1), 'aria-label': 'Previous month', style: { minHeight: '44px', minWidth: '44px', borderRadius: '8px', background: 'rgba(246,108,49,0.1)', color: '#BF4C1A', fontSize: '16px', fontWeight: '700' } }, '\u2039'),
      h('div', { style: { fontSize: '13.5px', fontWeight: '800', color: '#2A2127' } }, monthLabel),
      h('button', { onClick: () => onNav(1), 'aria-label': 'Next month', style: { minHeight: '44px', minWidth: '44px', borderRadius: '8px', background: 'rgba(246,108,49,0.1)', color: '#BF4C1A', fontSize: '16px', fontWeight: '700' } }, '\u203a')
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', marginBottom: '2px' } },
      ...['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(l => h('div', { style: { textAlign: 'center', fontSize: '12px', fontWeight: '700', color: '#915E48', padding: '2px 0' } }, l))
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', paddingBottom: '4px' } },
      ...cells.map(d => {
        if (d === null) return h('div', null);
        const ds = dstr(d);
        const isSel = ds === dateStr;
        const isToday = ds === todayStr;
        // 40px day cells: 44px is not achievable in a 7-col grid inside the 320px modal; 40px + 2px
        // gap is the documented acceptable floor (design batch 3, item 14 known deviation).
        return h('button', { onClick: () => onPick(ds), style: { minHeight: '40px', borderRadius: '9px', fontSize: '13px', fontWeight: isSel ? '800' : '600', background: isSel ? '#BF4C1A' : (isToday ? 'rgba(246,108,49,0.14)' : 'transparent'), color: isSel ? '#fff' : '#2A2127', border: isToday && !isSel ? '1px solid rgba(246,108,49,0.45)' : '1px solid transparent' } }, String(d));
      })
    )
  );
}
