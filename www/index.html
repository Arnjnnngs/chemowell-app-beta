<!DOCTYPE html>
<html>
<head>

  <title>ChemoWell</title>
  <style>
    html,body{margin:0;height:100%;background:#EEF1F0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
    .wrap{text-align:center;color:#2A2127;}
    .mark{width:64px;height:64px;border-radius:16px;margin:0 auto 14px;background:#0F9D6B;display:flex;align-items:center;justify-content:center;}

<body>
  <!-- Momentary first-paint shown before the native shell hands off to the live app (server.url in
       capacitor.config.ts). Self-contained on purpose — no external asset dependency to keep this
       file the only thing that needs to exist under www/ for `cap add android` to succeed. -->
  <div class="wrap">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg></div>
    <p>Loading ChemoWell&hellip;</p>
  </div>
