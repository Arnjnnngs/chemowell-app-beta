# Refresh the medication description table from MedlinePlus.
#
# THE POINT OF RUNNING IT HERE: the app must never fetch anything from a patient's phone -- it tells
# its users it does not. So the fetching happens on GitHub's machines, the result is baked into the
# app, and the phone downloads something that already knows the answers.
#
# IT NEVER WRITES TO main. Every line it produces is a medical claim that will appear on a screen
# next to a patient's medication, so the result lands on `chore/refresh-med-table` and a person reads
# it before anything is baked into the app. tools/last-run/report.md travels with it and is the
# interesting half: what MedlinePlus said that the guards would not allow through, and why.
name: Refresh medication table

# ON DEMAND ONLY, until Aaron has seen one run and said otherwise. Nothing about this should
# start happening on its own before a person has watched it happen once -- the fetching half has
# never been executed anywhere, and the first run is where we learn whether it works at all.
# The monthly schedule is written below and commented out, ready to switch on in one edit.
on:
  # TWO WAYS IN, and the second exists because of a real limit rather than a preference.
  #  * workflow_dispatch -- the Run workflow button in the Actions tab, for a person.
  #  * a push to `run/refresh-meds` -- because the assistant that maintains this repo can push
  #    branches but CANNOT start a workflow: dispatching one needs an Actions:write permission its
  #    GitHub App does not have (403 Resource not accessible by integration). Aaron does not use
  #    GitHub, so "press the button yourself" was never an acceptable answer. Pushing an empty commit
  #    to that branch runs this job and is a thing the assistant can actually do.
  workflow_dispatch: {}
  push:
    branches: [ 'run/refresh-meds' ]
  # schedule:
  #   - cron: '0 6 1 * *'   # the 1st of each month; drug pages change slowly

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Fetch the pages from MedlinePlus
        # The console output is buried in a log that is expensive to read from outside. Everything
        # worth knowing goes into files that get committed with the table instead, so the result can
        # be read with `git show` rather than by pulling a megabyte of runner noise.
        run: |
          mkdir -p tools/last-run
          node tools/fetch-medlineplus.mjs --list tools/med-list.json --out tools/last-run/pages.json 2>&1 | tee tools/last-run/fetch.log
          echo "pages fetched: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("tools/last-run/pages.json","utf8")).length)')" >> tools/last-run/fetch.log

      - name: Build the table, applying every guard
        run: node tools/build-med-table.mjs --in tools/last-run/pages.json --out tools/med-source-table.json --report tools/last-run/report.md

      - name: The guards must still hold
        # If this fails the table is NOT committed. A generator that starts letting doses through is
        # a worse outcome than a table that is a month out of date.
        run: node test/v75-table-builder.mjs

      - name: Put the result on a branch for review
        # A PLAIN PUSH, not a pull request. This step used to be peter-evans/create-pull-request,
        # which pushed the branch correctly and then failed the job on the PR call -- GitHub refuses
        # it here ("GitHub Actions is not permitted to create or approve pull requests", a repository
        # setting). So every run finished RED while having done its whole job, and a red run that is
        # known to be fine is how a real failure goes unnoticed. The push is the part that matters;
        # whoever reviews it opens the PR, or reads the branch directly with `git show`.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # THE GENERATED FILES ARE MOVED ASIDE FIRST. `git checkout -B` refuses to switch branches
          # over a dirty working tree, and the two paths this job exists to produce are exactly what
          # is dirty -- so the job did all its work, passed every guard, and then died on its own
          # last line without publishing anything. Copy out, switch with -f, copy back.
          mkdir -p /tmp/out
          cp tools/med-source-table.json /tmp/out/
          cp -r tools/last-run /tmp/out/
          git fetch origin main
          git checkout -f -B chore/refresh-med-table origin/main
          mkdir -p tools
          cp /tmp/out/med-source-table.json tools/
          rm -rf tools/last-run && cp -r /tmp/out/last-run tools/
          git add tools/med-source-table.json tools/last-run
          if git diff --cached --quiet; then
            echo "the table and the run notes are identical to main -- nothing to push"
            exit 0
          fi
          git commit -m "refresh the medication table from MedlinePlus" -m \
            "Generated by .github/workflows/refresh-med-table.yml. Every line here is a medical claim that will appear beside a patient's medication, so nothing here reaches the app without a person reading it first. tools/last-run/ carries what the fetch saw and what the guards rejected."
          git push -f origin chore/refresh-med-table
