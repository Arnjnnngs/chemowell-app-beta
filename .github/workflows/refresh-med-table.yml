# Refresh the medication description table from MedlinePlus.
#
# THE POINT OF RUNNING IT HERE: the app must never fetch anything from a patient's phone -- it tells
# its users it does not. So the fetching happens on GitHub's machines, the result is baked into the
# app, and the phone downloads something that already knows the answers.
#
# It opens a PULL REQUEST rather than committing. Every line it produces is a medical claim that will
# appear on a screen next to a patient's medication, so a person looks at it first. The PR body
# carries the rejection report, which is the interesting half: what MedlinePlus said that the guards
# would not allow through, and why.
name: Refresh medication table

# ON DEMAND ONLY, until Aaron has seen one run and said otherwise. Nothing about this should
# start happening on its own before a person has watched it happen once -- the fetching half has
# never been executed anywhere, and the first run is where we learn whether it works at all.
# The monthly schedule is written below and commented out, ready to switch on in one edit.
on:
  # TWO WAYS IN, and the second exists because of a real limit rather than a preference.
  #  * workflow_dispatch -- the Run workflow button in the Actions tab, for a person.
  #  * a push to `run/refresh-meds` -- because the assistant that maintains this repo can push
  #    branches but CANNOT start a workflow: dispatching one needs an Actions:write permission its
  #    GitHub App does not have (403 Resource not accessible by integration). Aaron does not use
  #    GitHub, so "press the button yourself" was never an acceptable answer. Pushing an empty commit
  #    to that branch runs this job and is a thing the assistant can actually do.
  workflow_dispatch: {}
  push:
    branches: [ 'run/refresh-meds' ]
  # schedule:
  #   - cron: '0 6 1 * *'   # the 1st of each month; drug pages change slowly

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Fetch the pages from MedlinePlus
        # The console output is buried in a log that is expensive to read from outside. Everything
        # worth knowing goes into files that get committed with the table instead, so the result can
        # be read with `git show` rather than by pulling a megabyte of runner noise.
        run: |
          mkdir -p tools/last-run
          node tools/fetch-medlineplus.mjs --list tools/med-list.json --out tools/last-run/pages.json 2>&1 | tee tools/last-run/fetch.log
          echo "pages fetched: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("tools/last-run/pages.json","utf8")).length)')" >> tools/last-run/fetch.log

      - name: Build the table, applying every guard
        run: node tools/build-med-table.mjs --in tools/last-run/pages.json --out tools/med-source-table.json --report tools/last-run/report.md

      - name: The guards must still hold
        # If this fails the table is NOT committed. A generator that starts letting doses through is
        # a worse outcome than a table that is a month out of date.
        run: node test/v75-table-builder.mjs

      - name: Put the result on a branch for review
        # NOT a pull request. GitHub refuses to let Actions open one -- "GitHub Actions is not
        # permitted to create or approve pull requests", a repository setting -- so the job pushes
        # the branch and the pull request is opened by whoever reviews it. Pushing is the part that
        # matters; the PR is a wrapper around it.
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-med-table
          title: 'Refresh medication descriptions from MedlinePlus'
          body-path: tools/last-run/report.md
          commit-message: |
            refresh the medication table from MedlinePlus

            Generated by .github/workflows/refresh-med-table.yml. Every line here is a
            medical claim that will appear beside a patient's medication, so nothing here
            reaches the app without a person reading it first. tools/last-run/ carries what
            the fetch saw and what the guards rejected.
          add-paths: |
            tools/med-source-table.json
            tools/last-run/
