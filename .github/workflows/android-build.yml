name: Build Android debug APK

# Builds the ChemoWell native shell into a sideloadable debug APK. Runs on GitHub's runners because
# the cloud sandbox this project is otherwise developed in has no route to Google's Maven/Gradle
# Plugin Portal — this workflow IS the build environment for anything native, not a convenience.
#
# The android/ native project is NOT committed to this repo — it's regenerated fresh here on every
# run via `npx cap add android`, deterministic from the pinned Capacitor versions in package.json.
# That keeps the repo's source of truth small (this file, capacitor.config.ts, www/, app-icons/)
# instead of a huge generated/binary tree that would drift from whatever Capacitor version is
# pinned. Our real (non-default) app icon and notification icon live in app-icons/ as flat,
# uniquely-named files and get copied into their correct nested Android resource paths below.
on:
  push:
    branches: [main]
    paths:
      - 'app-icons/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx cap add android

      - name: Install our real app icon + notification icon (replaces Capacitor's default)
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            # drawable-<density> (as opposed to plain drawable/) only exists once something is
            # placed in it — a fresh `cap add android` project doesn't create these, so make sure
            # they exist before copying the notification icon in (caught by a local dry run before
            # this ever hit CI: the first version of this step failed here).
            mkdir -p "$RES/drawable-${d}"
            cp "app-icons/launcher-${d}.png"       "$RES/mipmap-${d}/ic_launcher.png"
            cp "app-icons/launcher-round-${d}.png"  "$RES/mipmap-${d}/ic_launcher_round.png"
            cp "app-icons/launcher-fg-${d}.png"     "$RES/mipmap-${d}/ic_launcher_foreground.png"
            cp "app-icons/notif-${d}.png"           "$RES/drawable-${d}/ic_stat_chemowell.png"
          done
          # Adaptive-icon background: brand background color instead of Capacitor's default white.
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#EEF1F0</color>
          </resources>
          XML

      - name: Sync Capacitor config + plugins into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK (workflow artifact, requires GitHub login to fetch)
        uses: actions/upload-artifact@v4
        with:
          name: chemowell-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Actions artifacts require an authenticated GitHub session to download — fine for browsing
      # github.com, but not fetchable with a plain curl from the sandbox this project is otherwise
      # developed in (or from Aaron's phone). A Release asset on a public repo has a stable,
      # unauthenticated URL instead, so this is the actual hand-off point to get the APK off GitHub
      # entirely. Same moving tag every run — this always reflects the latest main, not a numbered
      # release history (that's what README.md's version table is for).
      - name: Publish debug APK as a GitHub Release asset (stable public download URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v14-native-test
          name: "ChemoWell native test build (app-v14)"
          body: "Debug APK for on-device testing (real notifications + native look/feel) before store submission. Sideload only — not for distribution. Rebuilt on every relevant push to main; this release always reflects the current app-icons/, capacitor.config.ts, index.html, and www/."
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

  # Real on-device verification, automated. This sandbox's development environment has no route to
  # Google's Maven/Gradle Plugin Portal AND no /dev/kvm (confirmed: no hardware-virtualization
  # support at all), so a local Android emulator was never an option there. GitHub's Linux runners
  # DO support hardware-accelerated (KVM) emulation for free on public repos — this job boots a
  # real Android system image, installs the exact APK the `build` job above just produced, launches
  # the real native app (not the website), confirms it doesn't crash, and captures screenshots +
  # the full device log. This closes the gap AUDIT_v24.md flagged explicitly: "I could not exercise
  # the actual native/Capacitor branch in this sandbox — flagging as untested rather than silently
  # skipping." It's still a smoke test, not the full 45-case suite the web build gets — expand
  # `.github/scripts/android_smoke_test.sh` over time the same way the Playwright suites grew.
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the debug APK this run just built
        uses: actions/download-artifact@v4
        with:
          name: chemowell-app-debug-apk
          path: artifacts

      - name: Enable KVM group perms (required for hardware-accelerated emulation on Linux runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install + launch the real app, capture screenshots + logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/android_smoke_test.sh

      - name: Upload screenshots + device log (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemowell-app-emulator-smoke
          path: screenshots/
          retention-days: 30

      # Same reasoning as the APK's own Release asset above: workflow artifacts need an
      # authenticated GitHub session to fetch, which Aaron's phone doesn't have. Publishing the
      # screenshots as Release assets too gives a stable, unauthenticated, viewable-in-browser URL.
      # Deliberately omits `body`/`name` — per action-gh-release's own documented behavior, omitted
      # fields leave the existing release description (written by the `build` job above) untouched;
      # only the file list is added/replaced.
      - name: Publish screenshots as GitHub Release assets (stable public URLs)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v14-native-test
          prerelease: true
          files: screenshots/*
