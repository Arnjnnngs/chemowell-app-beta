# Confirm what is ACTUALLY live, from a machine that can reach it.
#
# WHY THIS EXISTS. The deploy checklist says "verify on the live site", and this sandbox has no
# outbound network -- ten attempts to read the deployed APP_VERSION after shipping app-v75 all came
# back unreachable. So "verified live" has been resting on either Aaron opening it on his phone or
# on nobody checking. GitHub's runners can reach it; use them, the same way the medication table's
# fetch does.
#
# The failure this guards is specific and has happened here: app-v40 shipped repeatedly with index.html
# changed and sw.js's CACHE constant unchanged, so every installed copy kept serving the old shell --
# no error, no warning, just an owner seeing no updates all day. release_check.sh blocks that case
# before a push; this catches the other half, where the push happened and the deploy did not.
name: Verify what is live and that the chain ran

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, NOT A SHALLOW CLONE. PUBLISHED.json records the commit the last release went
      # live at, and release_check.sh measures the service-worker cache bump against it. On the
      # default depth-1 checkout that commit does not exist on the runner, so the gate printed
      # "no usable PUBLISHED.json record, falling back to origin/main" and measured against the
      # wrong baseline -- which is the exact fallback PUBLISHED.json exists to replace.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # A BROWSER, BECAUSE THE GATE RUNS A BROWSER SUITE. release_check.sh runs
      # test/v76-empty-window-render.mjs, which imports Playwright -- and the runner had Node and
      # no browser, so that import threw and the whole gate exited 1 on EVERY push since it was
      # added. A gate that is always red says nothing: the release that skipped the chain and the
      # release that passed it look identical from outside. Pinned to the same version the suites
      # are written against, and installed with --no-save so the app's own package.json does not
      # grow a test dependency the Android build would then have to install.
      - name: Install the browser the release gate's suites need
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # ---- THE QUALITY CHAIN, CHECKED FROM OUTSIDE THE PERSON IT CONSTRAINS -----------------------
      # Added 2026-09-13, immediately after I broke it. CLAUDE.md rule 6 says the order is
      # build -> self-verify -> independent Auditor -> PM sign-off -> push, and records that
      # conflating push permission with the quality gate shipped app-v67 straight to main with every
      # suite green and no review. I pushed app-v76 phase 1 to main without running
      # release_check.sh, which would have refused it for exactly the missing reports. The live
      # site served it before any auditor had looked at it.
      #
      # release_check.sh is mechanical but it only helps if it is RUN. A runner runs it whether or
      # not anyone remembered, and it reports on the commit that is already public -- so a release
      # that skipped the chain is visible within a minute instead of whenever someone next looks.
      - name: The quality chain must have run for what is on main
        run: |
          set -uo pipefail
          chmod +x ./release_check.sh || true
          if ./release_check.sh; then
            echo "chain artifacts present and current"
          else
            echo "::error::This commit is on main and release_check.sh refuses it."
            echo "Usually: outputs/AUDIT*<version>*.md or outputs/PM*<version>*.md is missing,"
            echo "or a PM report says DO NOT SHIP. The push has already happened, so this is a"
            echo "report rather than a block -- fix forward: run the chain and push the reports,"
            echo "or revert. Do not add a report beside a refusal to clear it."
            exit 1
          fi

      - name: Read the versions this commit expects
        id: expect
        run: |
          set -euo pipefail
          APP=$(grep -o "const APP_VERSION = '[^']*'" index.html | head -1 | sed "s/.*'\(.*\)'/\1/")
          CACHE=$(grep -o "const CACHE = '[^']*'" sw.js | head -1 | sed "s/.*'\(.*\)'/\1/")
          echo "app=$APP"   >> "$GITHUB_OUTPUT"
          echo "cache=$CACHE" >> "$GITHUB_OUTPUT"
          echo "This commit expects APP_VERSION=$APP and CACHE=$CACHE"

      - name: Wait for Pages, then read the live files
        run: |
          set -uo pipefail
          BASE="https://arnjnnngs.github.io/chemowell-app-beta"
          WANT_APP='${{ steps.expect.outputs.app }}'
          WANT_CACHE='${{ steps.expect.outputs.cache }}'
          # Pages lags the commit. Checking too early reads the old build and looks like a failure,
          # which is exactly how a real failure gets dismissed as "just the lag". Poll instead.
          for i in $(seq 1 20); do
            LIVE_APP=$(curl -fsSL --max-time 25 "$BASE/index.html?cb=$RANDOM$i" 2>/dev/null | grep -o "const APP_VERSION = '[^']*'" | head -1 | sed "s/.*'\(.*\)'/\1/" || true)
            LIVE_CACHE=$(curl -fsSL --max-time 25 "$BASE/sw.js?cb=$RANDOM$i" 2>/dev/null | grep -o "const CACHE = '[^']*'" | head -1 | sed "s/.*'\(.*\)'/\1/" || true)
            echo "attempt $i: live APP_VERSION=${LIVE_APP:-unreachable} CACHE=${LIVE_CACHE:-unreachable}"
            if [ "$LIVE_APP" = "$WANT_APP" ] && [ "$LIVE_CACHE" = "$WANT_CACHE" ]; then
              echo "LIVE AND CORRECT: $LIVE_APP / $LIVE_CACHE"
              exit 0
            fi
            sleep 30
          done
          echo ""
          echo "::error::After 10 minutes the live site does not match this commit."
          echo "Expected APP_VERSION=$WANT_APP CACHE=$WANT_CACHE"
          echo "Got      APP_VERSION=${LIVE_APP:-unreachable} CACHE=${LIVE_CACHE:-unreachable}"
          echo ""
          echo "If APP_VERSION matches but CACHE does not, every ALREADY-INSTALLED copy of the app"
          echo "will keep serving the old shell indefinitely -- the app-v40 failure, which cost a"
          echo "full day of the owner seeing no updates at all despite several successful pushes."
          exit 1
